:"r155","category":"sim","sub":"URDF取り込みとグリッパー","type":"point","front":"Unity の爪先 Brep はグリッパ指の子なので開閉に連動して動き、爪先中点は開閉で約14mm移動する。FK スキャン時と実機 PICK 時の開閉状態がずれると、それ自体が誤差になる。","back":"","detail":"","key":false,"src":"DAY168"},{"id":"r156","category":"sim","sub":"URDF取り込みとグリッパー","type":"qa","front":"Unity のシミュレーションで「掴む」動作はどう作った？","back":"摩擦は使わずコードで代用した。閉じたらブロックを EndEffector の子にし（Rigidbody はキネマティック＝物理演算の影響を受けない状態）、アームと一緒に動かす。開いたら子から外して重力を有効にし、ブロックを箱へ自然に落とす。","detail":"","key":false,"src":"DAY137"},{"id":"r157","category":"sim","sub":"URDF取り込みとグリッパー","type":"point","front":"Rigidbody（剛体の物理部品）だけではブロックは床を突き抜ける。床・ブロック・箱の壁5枚それぞれに BoxCollider（衝突判定）が要る。","back":"","detail":"","key":false,"src":"DAY137"},{"id":"r158","category":"sim","sub":"実機とツインの往復","type":"point","front":"Unity と実機をつなぐ橋は関節角6軸だけ。Unity には配置誤差・関節遅れ・指先の3D座標があり、実機には把持状態・カメラ判定・摩擦や個体差がある。両者の「成功」の定義は別物で、翻訳が要る。","back":"","detail":"","key":false,"src":"DAY131"},{"id":"r159","category":"sim","sub":"実機とツインの往復","type":"point","front":"実機の関節角 CSV を Unity で再生すると、同じ Pick&Place がツイン上で再現できた。Unity→実機と実機→Unity の両方向がつながった。","back":"","detail":"","key":false,"src":"DAY132・DAY137"},{"id":"r160","category":"sim","sub":"実機とツインの往復","type":"qa","front":"実機ログを実機と同じ時間で Unity 上に再生するには？","back":"固定間隔（1.5秒）だとポーズ間が瞬間移動して速すぎた。CSV のタイムスタンプの差をその区間の所要時間とし、線形補間で角度を移す。実機で49秒の動作が Unity でも49秒で再生された。","detail":"","key":false,"src":"DAY133"},{"id":"r161","category":"sim","sub":"実機とツインの往復","type":"qa","front":"モーションの補間を、なぜ Unity 側ではなく Mac 側で CSV に展開したのか？","back":"Unity の中で補間しても実機には反映されない。8点の実機記録を Mac で81点の CSV に補間し、Unity と実機（send_angles）の両方に同じデータを渡せば、シミュで確認した動きがそのまま実機に乗る。","detail":"","key":false,"src":"DAY152"},{"id":"r162","category":"sim","sub":"FKテーブルはツインで作る","type":"qa","front":"なぜ FK テーブルを ikpy などの一般的な運動学ライブラリで作れないのか？","back":"テーブルの爪先座標は、Unity ツイン内でグリッパー先端の形状（Brep）が実際に来た位置だから。ライブラリはグリッパー形状もツインの物理も持たず、同じ関節角でも300mm以上ずれた。点を足すには Unity の FKScanner を再実行するしかない。","detail":"","key":true,"src":"DAY222・DAY252・DAY281・arm_kinematics"},{"id":"r163","category":"sim","sub":"FKテーブルはツインで作る","type":"qa","front":"白箱まで76mm届かないスキャン結果を「リーチ限界」と判断しなかったのはなぜ？","back":"グリッパー分を含めればもっと遠くに届くから。原因はスキャンで試した姿勢の範囲が狭いことだった。Play モードで関節角を手入力し、j0=55°・j5=0°でグリッパーが白箱の真上に水平に来ることを確かめ、そこをスキャンの起点にした。","detail":"","key":false,"src":"DAY156"},{"id":"r164","category":"sim","sub":"FKテーブルはツインで作る","type":"qa","front":"FKScanner で22点をスキャンすると、出力が保存されなかったのはなぜ？","back":"保存は20体のロボット全員の完了で走る作り。22点を20体に配ると1体2点で11体しか起動せず、完了数が20に届かない。点数を20の倍数にして解決した。闇雲な再実行では分からず、コードを読んで見えた。","detail":"","key":false,"src":"DAY254"},{"id":"r165","category":"sim","sub":"ツインと実機のずれ","type":"qa","front":"固定角度では表に出なかった Unity FK と実機のずれが、動的 lookup で初めて露呈したのはなぜ？","back":"固定角度は実機で手調整した値を直接送るので、Unity FK の精度に依存しない。動的 lookup にした瞬間「Unity FK を信じる」段階に入る。目標高さを-40mm下げても実機の爪は下がらなかった。原因候補は URDF のリンク長と実寸の差、関節軸の向き、原点のオフセット。","detail":"","key":false,"src":"DAY177"},{"id":"r166","category":"sim","sub":"ツインと実機のずれ","type":"qa","front":"FK テーブルから引いた姿勢が、実機で送れないことがあるのはなぜ？","back":"テーブルはツイン上で成立する姿勢の集合で、実機コントローラが受理するかは考慮していない。肩関節が110°や118°の姿勢も出てくる。テーブル上の成立と実機での送信可否は別の層。","detail":"","key":false,"src":"DAY232"},{"id":"r167","category":"sim","sub":"ツインと実機のずれ","type":"qa","front":"j0 を+1°動かしたときの爪先 x の変化を、実機とツインで比べると？","back":"実機は-6.63mm/°、FK テーブルからは約-4.2mm/°で、符号は一致し大きさは約36%違った。校正した姿勢が違い、ヤコビアン（関節角の変化と先端位置の変化の比）が違うため。ツインは向きは合うが値は一致しない物差し。","detail":"","key":false,"src":"DAY250"},{"id":"r168","category":"sim","sub":"ツインと実機のずれ","type":"point","front":"ツインは指令どおり誤差なく動くので差分が出ない。実機はたわみ・ガタ・校正のずれで先端がずれ、そのずれこそ現実で動かすのに要る情報。実機データの収集が重視される理由もここにある。","back":"","detail":"","key":false,"src":"DAY250"},{"id":"r169","category":"sim","sub":"ツインと実機のずれ","type":"qa","front":"Sim-to-Real ギャップと Sim-to-Human ギャップはどう関係する？","back":"前者はシミュと実機の動きの差、後者は実機の動きとそれを見た人が受け取る感覚の差。後者は前者に依存する。シミュで「丁寧な接近」を設計しても実機では重力で軌道が数cm崩れ、その数cmが印象を変える。","detail":"","key":false,"src":"DAY212"},{"id":"r170","category":"sim","sub":"ROS2とMoveIt","type":"qa","front":"ROS2 はいつ必要になるか？","back":"ROS2 の実態は「複数のプロセスをつなぐ通信基盤」で、制御ソフトそのものではない。順番に処理する設計なら不要。動く物を追いながら掴む・力を感じて止まる・複数ロボットや既製センサーを統合する・業界の人と共同実装するときに要る。双腕では衝突回避と協調制御のため MoveIt2 がほぼ必須。","detail":"","key":false,"src":"DAY131・DAY205"},{"id":"r171","category":"sim","sub":"ROS2とMoveIt","type":"term","front":"MoveIt","back":"ROS2 上のアーム制御の標準部品。IK・軌道計画・衝突回避・実行制御を自動で行う。手作りしてきた FK テーブル探索・j0 ロック・j4 安全範囲・姿勢選択は、MoveIt では完成部品として存在する領域にあたる。","detail":"","key":false,"src":"DAY284"},{"id":"r172","category":"sim","sub":"ツインの別の使い方","type":"qa","front":"R2R2R（実演動画1本から学習データを作る手法）はなぜ物理演算を使わない？その代償は？","back":"物体は掴まれている間は手先にぴったり付いて動くものとし、摩擦や衝突は計算しない。シミュレーターは画像を描く道具として使うだけ。そのため押す・倒す・滑らせる操作や柔らかい物は扱えず、生成した動きは障害物も避けない。","detail":"","key":false,"src":"研究メモ:R2R2R（実演動画1本から学習データ生成）"},{"id":"r173","category":"sim","sub":"ツインの別の使い方","type":"point","front":"R2R2R はデジタルツインを「学習用の画像と関節角のペアを大量に作る工場」として使う。Pixels to Motors の Unity ツインは今のところ FK テーブルを作る用途。","back":"","detail":"","key":false,"src":"研究メモ:R2R2R（実演動画1本から学習データ生成）"},{"id":"r174","category":"sim","sub":"ツインの別の使い方","type":"qa","front":"病院オペレーションのデジタルツインは何をシミュレーションするか？","back":"機体の物理ではなく、病院を「タスクが発生し、人という資源がそれを消費する系」として扱う。ロボットをもう一種の資源として入れ、肩代わりした搬送の差分を時間・距離・コストに変換して見せる。実データが取れないので、前提をユーザーが置く探索ツールにした。","detail":"","key":false,"src":"DAY267"},{"id":"r175","category":"vision","sub":"カメラの取り込み","type":"point","front":"カメラは接続順で変わる番号ではなく固有名で同定する。macOSのOpenCVの番号は起動順・接続台数・iPhoneのスリープ復帰で入れ替わる。","back":"当初は爪の色シールの映り方で判定したが、DAY217で表示名から番号を引く共通モジュールに一本化（iPhone=上、Iriun=横、FaceTimeは除外）。Raspberry Piでは /dev/v4l/by-id で引き、挿す前後のデバイス一覧の差分で確定する。","detail":"","key":true,"src":"DAY196・DAY209・DAY217・DAY295"},{"id":"r176","category":"vision","sub":"カメラの取り込み","type":"qa","front":"iPhoneをOpenCVのカメラにするとき、Iriun WebcamとContinuity Cameraをどう使い分けた？","back":"macOS SonomaではOpenCVからContinuity Cameraを開くと非推奨警告が出て解決しない環境があり、仮想カメラとして見えるIriunを使った。ただしIriun単体では2台のiPhoneを独立に出せないため、2カメラ構成ではContinuity Cameraを併用した。","detail":"","key":false,"src":"DAY125・DAY192"},{"id":"r177","category":"vision","sub":"カメラの取り込み","type":"point","front":"Iriunは開き直すたびにiPhoneの自動露出が初期化され、暗いフレームのままHSVの明度下限を割って検出に失敗した。暖機を30→120フレームにし、release後0.5秒待つと安定した。","back":"","detail":"","key":false,"src":"DAY196・DAY197"},{"id":"r178","category":"vision","sub":"カメラの取り込み","type":"point","front":"Iriun経由のiPhoneは指定fpsを無視し、実効fpsはread()の返る速さで決まる（720p/avc1で約27fps）。mp4に書くfpsは当てにならず、フレームごとの取得時刻が正。","back":"p95で約94msの抜けがあるため、学習用のリサンプルは10Hzが安全。","detail":"","key":false,"src":"DAY287"},{"id":"r179","category":"vision","sub":"色で見分ける","type":"qa","front":"ブロックの有無判定を、輝度ではなく赤色検出にしたのはなぜ？","back":"黒いマットの上ではブロックの有無で輝度差がほぼゼロだった。HSV（色相・彩度・明度）で、ROI（処理対象の領域）内の赤画素の割合を測り、5%以上を「あり」とした。なしは0.0%、ありは17.2%で明確に分かれた。","detail":"","key":false,"src":"DAY129"},{"id":"r180","category":"vision","sub":"色で見分ける","type":"point","front":"mechArmの赤ブロックはHSVの2範囲 [0,100,100]-[10,255,255] と [160,100,100]-[180,255,255] で検出する。赤は色相の0度をまたぐので2範囲に分ける。","back":"検出ノイズは全項目で標準偏差0.2mm未満（DAY184の実測）。","detail":"","key":false,"src":"arm_kinematics・DAY184"},{"id":"r181","category":"vision","sub":"色で見分ける","type":"point","front":"HSVが守るのは明るさの変化だけ。照明を明暗させても色相は0.1〜3.5度しか動かないが、光の色（色温度）を変えると赤は4〜6度、青は26度、暗い青の面は155度動いた。","back":"","detail":"","key":true,"src":"DAY300"},{"id":"r182","category":"vision","sub":"色で見分ける","type":"qa","front":"色相の平均を取るとき、単純平均ではなく円平均を使うのはなぜ？","back":"色相は角度なので、0度と359度を単純平均すると180度（真逆の色）になる。赤は0度付近で画素が両側に散るため単純平均は必ず壊れる。各画素を単位ベクトルにして平均し、角度に戻す。","detail":"","key":false,"src":"DAY300"},{"id":"r183","category":"vision","sub":"色で見分ける","type":"qa","front":"白色光の基準写真でも、彩度と明度では赤と赤以外を分けられなかったのはなぜ？","back":"同じブロックでも光を強く受ける上面は白っぽく浅い赤、側面は濃い赤で、彩度・明度の幅が大きい。青の上面も明るく彩度が落ちるので両者が重なる。色相だけは赤3.7度・青206度付近できれいに離れていた。","detail":"","key":false,"src":"DAY301"},{"id":"r184","category":"vision","sub":"色で見分ける","type":"qa","front":"オレンジ寄りの光で青ブロックの色が壊れたとき、早く効く直し方は？","back":"色相の幅を広げるより、彩度に下限を置く。青の面は色相が意味を失う前に彩度が0.512→0.285へ落ちていた。青に耐えるまで色相幅を広げると色相環の大半を飲み込み、見分ける道具として機能しなくなる。","detail":"","key":false,"src":"DAY300"},{"id":"r185","category":"vision","sub":"色で見分ける","type":"qa","front":"RGBの閾値とHSVの閾値は、光の変化に対してどう違う壊れ方をする？","back":"逆の壊れ方をする。明るさが変わると、HSVの赤検出が色抜けした青の上面をほぼ全画素「赤」と判定した。光がオレンジになると、RGBの赤検出は画面の96.3%を赤とし、HSVは0.8%で耐えた。どちらかを選べば安全という話ではない。","detail":"","key":false,"src":"DAY301"},{"id":"r186","category":"vision","sub":"色で見分ける","type":"qa","front":"閾値を決めるとき、本番と同じ取得経路のフレームを使うのはなぜ？","back":"経路で画像処理が変わるから。iPhoneのカメラアプリのJPEGでは赤の彩度が落ちて同じ設定で塊が3つに割れたが、OpenCVで読んだフレームでは割れなかった。Continuity Cameraの自動ホワイトバランスは、オレンジ光への切り替えを約1.6秒で89%打ち消していた。","detail":"","key":true,"src":"DAY302"},{"id":"r187","category":"vision","sub":"色で見分ける","type":"point","front":"人の肌とクリーム色の壁は色相がほぼ重なる（10〜15と16〜20）が、彩度は肌84〜110・壁24〜42と2〜4倍違う。手は色相ではなく彩度で切り分ける。","back":"背景差分は人の影と手が1つの塊になるため単独では使わない。","detail":"","key":false,"src":"DAY297"},{"id":"r188","category":"vision","sub":"色で見分ける","type":"term","front":"ドメインシフト（分布シフト）","back":"学習時と使用時で画像の性質（照明・カメラ・背景・季節）が違うこと。光の色を変えただけで青の色相が155度動いた現象や、白色光で合わせた赤検出がオレンジ光で画面の96%を拾った現象が実例。学習ベースでも消えず、壊れた理由が見えにくくなる。","detail":"","key":false,"src":"DAY313"},{"id":"r189","category":"vision","sub":"形と輪郭","type":"term","front":"モルフォロジー処理（open→close）","back":"open（収縮→膨張）で小さなノイズを消し、close（膨張→収縮）で穴を埋める。逆順だとノイズを膨らませてから穴埋めし、誤検出が増える。open後に残るのはカーネル（型紙）がすっぽり収まる場所だけで、結果は近似でなく厳密に予測できる。","detail":"","key":false,"src":"DAY196・DAY302"},{"id":"r190","category":"vision","sub":"形と輪郭","type":"qa","front":"モルフォロジー演算のカーネルサイズは何を決めている？","back":"精度ではなく距離で、「どれだけ離れた破片まで本体とみなすか」を決める（9画素では届かず11画素で届いた）。だから解像度が変わると同じ数字が別の意味になる。4032幅で決めた値は、画像幅に比例させて引き直す。","detail":"","key":false,"src":"DAY302"},{"id":"r191","category":"vision","sub":"形と輪郭","type":"qa","front":"閾値処理の失敗はモルフォロジー演算で直せる？","back":"直せない。拾いすぎた領域（雑な閾値で画面の96%が白）も、拾えなかった領域（オレンジ光での青の側面）も、粒や穴ではないので対象外。31×31のカーネルでも0.04ポイントしか動かなかった（オレンジ光のRGB式では0.01ポイント）。直せるのは縁のギザギザ・小さい粒・小さい穴だけ。","detail":"","key":false,"src":"DAY302"},{"id":"r192","category":"vision","sub":"形と輪郭","type":"qa","front":"マット4隅の検出が0/10から10/10になった変更は？","back":"黒っぽいアームが二値化でマットとつながり、輪郭が内側にえぐれて4頂点に近似できなかった。最大輪郭にconvexHull（凸包）をかけてからapproxPolyDPで近似すると、えぐれが消えてマットの長方形が残った。","detail":"","key":false,"src":"DAY164"},{"id":"r193","category":"vision","sub":"形と輪郭","type":"qa","front":"青シール3点をY座標の順で手首と爪先に割り当てると何が起きた？","back":"姿勢によって2点のY座標が拮抗し、フレームごとに順序が入れ替わって取り違えた。爪先2点は姿勢に関係なく物理的に近いので、3点のうち最短辺の両端を爪先とする幾何学的な割り当てに変えると、TIP（爪先中点）のばらつきは19.42mm→0.08mmになった。","detail":"","key":false,"src":"DAY168・DAY184"},{"id":"r194","category":"vision","sub":"形と輪郭","type":"qa","front":"横カメラのTIP（爪先の基準点）を「緑シール2点の中点」に定義し直したのはなぜ？","back":"青（爪上面）と緑の中点では爪の上下中央になり、実際に掴む高さと約30px（Z換算で約5〜8mm）ずれた。緑シールは掴み高さに貼ってある。検出が正しくても、基準点の定義が物理的な掴み位置とずれていれば誤差になる。","detail":"","key":false,"src":"DAY196"},{"id":"r195","category":"vision","sub":"形と輪郭","type":"term","front":"minAreaRect","back":"回転を許す最小外接矩形（OpenCV）。軸に平行なboundingRectは紙を43度回すと面積が1.75倍（細長い長方形で2.27倍）に膨らむが、minAreaRectは0.3%しか動かない。縦横比を max(w,h)/min(w,h) で取れば、斜めの正方形も1前後で安定する。","detail":"","key":false,"src":"DAY280・DAY304"},{"id":"r196","category":"vision","sub":"形と輪郭","type":"qa","front":"画素画像で完全な円を測っても円形度が約0.898で頭打ちになるのはなぜ？","back":"周囲長を縦横1・斜め√2の階段で足すため、曲線では約5.5%長く出て、2乗で割る円形度は0.8988に落ち着く。解像度を13倍にしても1.0に近づかない原理的な上限で、円形度は「輪郭が画素の格子に沿っているか」を測っている。","detail":"","key":false,"src":"DAY304"},{"id":"r197","category":"vision","sub":"形と輪郭","type":"qa","front":"小さい対象で面積が足りなくなる原因は画素の粗さ？","back":"カメラのボケ。生成画像では最小の5.5mm円でも面積が99.6%残ったが、カメラ画像では60.7%だった。レンズのボケが縁を閾値の下へ押し下げる。解像度を上げても直らず、対象を大きく写せば直る。","detail":"","key":false,"src":"DAY304"},{"id":"r198","category":"vision","sub":"ピクセルからmmへ","type":"term","front":"ホモグラフィ（射影変換）","back":"平面と平面の対応を表す3×3の行列。4組の対応点で決まり（cv2.findHomography）、カメラ画像のピクセルをマット上のmmへ写す。傾いた平面では手前と奥で1mmあたりの画素数が変わるため、単一の換算率（px/mm）では足りない。","detail":"","key":false,"src":"DAY139・DAY178・DAY310"},{"id":"r199","category":"vision","sub":"ピクセルからmmへ","type":"qa","front":"斜めから撮った台形の紙を長方形に戻すのに、アフィン変換ではなく射影変換が要るのはなぜ？","back":"アフィン変換（2×3行列・対応点3点）は平行線を平行に保つので、遠近で上辺と下辺の長さが違う台形を戻せない。実測では射影変換が全傾きで20/20図形を正しく置いたのに対し、アフィンは20→20→15→5と崩れ、最大傾きで面積誤差42.71%だった。","detail":"","key":false,"src":"DAY310"},{"id":"r200","category":"vision","sub":"ピクセルからmmへ","type":"qa","front":"ホモグラフィ校正で、カメラを真上に固定したのはなぜ？","back":"ホモグラフィは平面→平面の変換が前提。斜めだと遠近の歪みで奥と手前の誤差の大きさが変わる。真上ならほぼ歪みがなく、全域で誤差が均一になる。","detail":"","key":false,"src":"DAY139"},{"id":"r201","category":"vision","sub":"ピクセルからmmへ","type":"point","front":"校正の基準点の条件は「実世界座標が既知・等間隔・見やすい」。マットの5mm格子が3つとも満たした。座標の原点はロボットベースに置く（マット左上原点では作業位置が範囲外になった）。","back":"","detail":"","key":false,"src":"DAY139"},{"id":"r202","category":"vision","sub":"ピクセルからmmへ","type":"qa","front":"マット4隅を毎フレーム検出してホモグラフィを作り直す方式が「半歩の解決」だったのはなぜ？","back":"カメラのぶれには効き、固定行列よりマット目盛りとよく一致した。だが4隅に対応するロボット座標はハードコードのままなので、マットとロボットの位置関係がずれる問題には効かない。ロボットを触ればマットは動く。","detail":"","key":false,"src":"DAY160・DAY178"},{"id":"r203","category":"vision","sub":"ピクセルからmmへ","type":"qa","front":"座標変換を、検出と表示・爪先とブロックで同じ行列（同じ関数）にそろえるのはなぜ？","back":"別々のホモグラフィを混ぜると、ずれは検出ではなく変換の違いが生む人工物になる。表示マーカーが実物の青シールからずれた件は、2つの行列を合成して入力→出力を1本にすると一致した。爪先とブロックも同じpixel_to_unityで変換すれば、変換誤差が差分の中で相殺される。","detail":"","key":false,"src":"DAY178・DAY179・DAY243"},{"id":"r204","category":"vision","sub":"ピクセルからmmへ","type":"qa","front":"特徴点マッチングの比率テスト通過数や、RANSAC（外れ値に強い変換推定）のinlier率は、正しさを示す？","back":"示さない。本を退けてマットだけを撮った写真（同じ物が写っていない）とも934件が比率テストを通り、うち92.8%がinlierで、全14組で最高値だった。正しさは手動で打った四隅など、マッチングと無関係の経路で作った正解で測る。","detail":"","key":true,"src":"DAY309"},{"id":"r205","category":"vision","sub":"ピクセルからmmへ","type":"qa","front":"本を45度傾けたとき、RANSACがほぼ恒等変換を返して破綻したのはなぜ？","back":"画像に、動いていないマット面と動いた表紙面の2つの平面が写っていたから。RANSACは「本らしい方」ではなく合意が最大のモデルを選ぶので、表紙側の対応が減るとマット側の恒等変換が採用された。兆候は推定行列が恒等に近いことに出る。","detail":"","key":false,"src":"DAY309"},{"id":"r206","category":"vision","sub":"ピクセルからmmへ","type":"qa","front":"傾きを大きくしても面積誤差率が13〜15%で横ばいだったのはなぜ？","back":"主因が傾きではなく測り方にあったから。色で切り分けると印刷の赤の薄い縁が落ち、輪郭が大きさによらず0.41〜0.48mmの一定幅で内側に削れていた。傾きの影響は平均ではなく、削れ幅のばらつき（標準偏差0.169→0.310）として出た。","detail":"","key":false,"src":"DAY310"},{"id":"r207","category":"vision","sub":"視差・奥行き・カメラ配置","type":"qa","front":"床面基準のホモグラフィで、床から浮いた爪先の位置を測ると何が起きる？","back":"視差で、見かけの位置がカメラから遠い側（外側）にずれる（高度111mmでマット端+0.310mを超える+0.346mと出た）。追従ループはこの値を現在位置として動くので、上カメラだけでは嘘の差分へ向かう。ずれは系統的で工程内では一貫するが、高さの違う工程をまたいで位置を混ぜると事故になる。","detail":"","key":true,"src":"DAY196・DAY230"},{"id":"r208","category":"vision","sub":"視差・奥行き・カメラ配置","type":"qa","front":"降下後にTIPのXが61.4mmずれて見えたのはなぜ？","back":"上カメラが真上ではなく少し斜めから撮っているため、アームの高さが変わると画面上の位置が視差でずれる。送/着の関節角ずれは1°前後で、アームは命令通り動いていた。当初は運動学のずれと見たが、撮影系の幾何（視差）でずれて見えただけの可能性が高いと見直し、横カメラ導入へ進んだ。","detail":"","key":false,"src":"DAY190・DAY191"},{"id":"r209","category":"vision","sub":"視差・奥行き・カメラ配置","type":"point","front":"2カメラの分担：上カメラはX（左右）とZ（奥行き）、横カメラはY（高さ）とZ。上カメラには爪がブロック上面に乗る高さのずれが見えない。Zは両方で取り、大きく食い違えばどちらかの校正異常と分かる。","back":"","detail":"","key":false,"src":"DAY192・DAY266"},{"id":"r210","category":"vision","sub":"視差・奥行き・カメラ配置","type":"qa","front":"横カメラはどこに、どう置くべきか？","back":"マット手前側に、水平な視線で、レンズ高さをマット面付近にして置く。視線をアームの動作平面と平行にしないと視差が乗る。手前からならグリッパが常に最前列に来て肩や肘に隠れず、上カメラの視野にも入らない。","detail":"","key":false,"src":"DAY192"},{"id":"r211","category":"vision","sub":"視差・奥行き・カメラ配置","type":"qa","front":"横カメラの外部パラメータ（位置・向き）を、チェスボードなしでどう校正するか？","back":"アーム自体を校正装置にする。FKスキャンの既知姿勢へ動かし、各姿勢のTIPの3D位置（既知）と横カメラ上のピクセル位置の対応を数十〜数百点集め、多項式回帰やホモグラフィで変換式を作る。レンズ歪み（内部パラメータ）は精度不足が判明してから取る。","detail":"","key":false,"src":"DAY192"},{"id":"r212","category":"vision","sub":"視差・奥行き・カメラ配置","type":"qa","front":"横カメラ1台だけでは人の手の高さが出せないのはなぜ？どう補う？","back":"カメラが1点について与えるのは光線1本ぶんで、画像の縦位置は高さと奥行きの両方で動くから。上カメラで手の水平位置を決めて奥行きを確定させれば、横カメラの縦位置が高さに確定する。直交する2視点で足りる。","detail":"","key":false,"src":"DAY297"},{"id":"r213","category":"vision","sub":"視差・奥行き・カメラ配置","type":"qa","front":"単眼カメラで奥行きを測りにくいのはなぜ？解決策は？","back":"2D画像1枚では奥行きの情報が物理的に足りず、AIが確率的に補うのでぶれる。高速動作や自己遮蔽でさらに悪化する。解決策は深度センサー、複数カメラの三角測量、単眼深度推定モデル（Depth Anything V2など、精度は限定的）の3系統。","detail":"","key":false,"src":"DAY118"},{"id":"r214","category":"vision","sub":"視差・奥行き・カメラ配置","type":"qa","front":"ロボットが物を掴むのに、相対深度ではなく絶対深度（メトリック深度）が要るのはなぜ？","back":"相対深度は「AはBより手前」という順序しか分からず、指先をどこまで動かすか決められない。絶対深度は「320mm」という長さを返す。単眼推定で絶対深度を信じるには、焦点距離・主点・レンズ歪みを実測するカメラキャリブレーションが要る。","detail":"","key":false,"src":"DAY313"},{"id":"r215","category":"vision","sub":"視差・奥行き・カメラ配置","type":"term","front":"深度カメラの3方式","back":"ステレオ（2つのカメラの視差）、ToF（赤外線パルスの往復時間）、構造化光（既知パターンを投影して歪みを見る）。RealSense D435はステレオ＋赤外線ドット、iPhoneのLiDARはToF、Face IDは構造化光。","detail":"","key":false,"src":"DAY166"},{"id":"r216","category":"vision","sub":"視差・奥行き・カメラ配置","type":"qa","front":"上からのカメラだけでは足りなくなる場面と、その構成は？","back":"棚の中・箱の中・物の重なりなど遮蔽があると、上カメラでは原理的に見えない。上カメラで全体を粗く探し、手首のカメラで最後の数十mmを精密に合わせる。業界標準も環境固定のEye-to-handと手首装着のEye-in-handの2台構成。","detail":"","key":false,"src":"DAY159・DAY166"},{"id":"r217","category":"vision","sub":"視差・奥行き・カメラ配置","type":"point","front":"手首カメラは深度なしの広角RGBが多い。理由は重量・サイズ、近距離で深度精度が落ちること（RealSenseは最短30cm）、配線、視野角。mechArm 270の可搬重量では重い深度カメラは載せにくい。","back":"","detail":"","key":false,"src":"DAY166"},{"id":"r218","category":"vision","sub":"視差・奥行き・カメラ配置","type":"term","front":"能動視覚（Next-Best-View）","back":"見えないならカメラを動かして見える位置へ行く考え方。次にどこから見ると情報が最も増えるかを計算してアームやカメラを動かす。遮蔽への対策で、画像処理ではなく動きの設計の話。視点を変えてバナナの検出信頼度が0.30→0.62に上がった報告がある。","detail":"","key":false,"src":"DAY313"},{"id":"r219","category":"vision","sub":"白箱の検出","type":"qa","front":"白箱を色（HSVの白マスク）だけで検出できなかったのはなぜ？","back":"マット外の机もロボットの筐体も白く、色だけでは区別できず、四角形の形フィルタでもロボット本体を拾った。そこでテンプレートマッチングに替え、探索をマット範囲に限定した。横カメラでも白マスクはアームと連結するため、白箱の位置は上カメラに任せた。","detail":"","key":false,"src":"DAY154・DAY165・DAY209"},{"id":"r220","category":"vision","sub":"白箱の検出","type":"term","front":"テンプレートマッチング","back":"参照画像を入力画像の上で滑らせ、各位置の類似度で最も一致する場所を探す手法（cv2.matchTemplate）。正規化相関係数で、複数スケール（0.7〜1.3倍）を試し、スコアの閾値で採否を決めた。","detail":"","key":false,"src":"DAY154"},{"id":"r221","category":"vision","sub":"白箱の検出","type":"qa","front":"テンプレートマッチングのスコアが落ちたとき、まず何を疑う？","back":"方式ではなくテンプレートの鮮度。テンプレートは撮影時の照明・カメラ位置・マット位置に依存する。マット移動前の古いテンプレでスコア0.547だったのが、現環境で12枚撮り直すと0.994になった。旧テンプレがアームのリンクを0.735で誤検出した例もある。","detail":"","key":false,"src":"DAY165・DAY211"},{"id":"r222","category":"vision","sub":"白箱の検出","type":"point","front":"テンプレートマッチングの計算量はチャネル数に比例する。白箱のような無彩色の対象はグレースケールにしても情報損失がほぼなく、評価時間が14.48秒→5.09秒になり、精度も上がった。","back":"","detail":"","key":false,"src":"DAY211"},{"id":"r223","category":"vision","sub":"白箱の検出","type":"qa","front":"テンプレートがアーム胴体を白箱と誤検出したとき、なぜしきい値を緩めず検出範囲を絞った？","back":"真上からは白箱も胴体も白〜グレーの四角で、同じスコアで拾われるのが問題だったから。緩めれば胴体をますます拾う。胴体が写る画面中央上の矩形を候補から外した。白箱を巻き込んでも送信前に止まる安全側の手当て。","detail":"","key":false,"src":"DAY224"},{"id":"r224","category":"vision","sub":"白箱の検出","type":"qa","front":"テンプレートマッチングで出した「白箱の中心」が最大41mmずれていたのはなぜ？どう直した？","back":"matchTemplateはマッチ矩形の左上を返し、テンプレ幅・高さの半分を足して箱中心とみなしていただけで、箱の構造を見ていなかった。テンプレのサイズ・回転・スケールで当たり方が系統的にずれる。白マスク＋正方形＋四角＋4頂点で箱の輪郭を取り（斜め置きはminAreaRectで判定）、その中心を使い、テンプレは粗位置と保険に回した。","detail":"","key":true,"src":"DAY280"},{"id":"r225","category":"vision","sub":"学習ベースと評価指標","type":"qa","front":"画像認識で「分類・検出・セグメンテーション・姿勢推定」を最初に区別するのはなぜ？","back":"モデルより先に、用意すべき正解データの形が変わるから。分類は画像に1ラベル、検出は複数の枠、セグメンテーションは画素単位の塗り、姿勢推定は点。作業量が桁で変わり、決めずに進むと集めたデータが使えないと後で気づく。","detail":"","key":false,"src":"DAY298"},{"id":"r226","category":"vision","sub":"学習ベースと評価指標","type":"qa","front":"古典的な画像処理（人が手続きを書く）と学習ベースはどう使い分ける？","back":"背景が固定で対象の色が決まっている台の上なら、古典的手法のほうが速く安定し、動作も説明できる。対象が増える・照明が変わる・条件の書き直しが追いつかなくなった時点が、学習ベース（正解付きデータから条件を自動で決める）へ移る理由になる。","detail":"","key":false,"src":"DAY298"},{"id":"r227","category":"vision","sub":"学習ベースと評価指標","type":"qa","front":"評価指標（IoU・Precision・Recall）を、学習ベースに入る前に学ぶのはなぜ？","back":"物差しなしでモデルを触ると「なんとなく良くなった」という感想になるから。IoU（予測枠と正解枠の重なり率）は古典的手法の出力にも計算できるので、先に物差しを持てば今の手法の性能も数字で言え、学習ベースとの比較が成立する。","detail":"","key":true,"src":"DAY298"},{"id":"r228","category":"vision","sub":"学習ベースと評価指標","type":"point","front":"生成画像は描いた図形の座標がそのまま正解の枠になるので、アノテーション（正解付け）なしでIoUが出せる。生成画像で理屈を確かめ、自前撮影で現実に何が壊れるかを見る。","back":"","detail":"","key":false,"src":"DAY298"},{"id":"r229","category":"vision","sub":"学習ベースと評価指標","type":"qa","front":"mAP@50・mAP@75・mAP@50:95はどう違い、何が読める？","back":"枠が正解と半分以上重なれば当たり（@50）、4分の3以上で当たり（@75）、基準を50〜95%まで動かして平均（@50:95）。同じ出力でも基準を厳しくするとGPT-6 Astraは82.1%→59.1%に下がる。落ち幅で「だいたいの場所が分かる」と「枠が正確」を分けて測れる。","detail":"","key":false,"src":"DAY317"},{"id":"r230","category":"vision","sub":"学習ベースと評価指標","type":"point","front":"言葉で物を切り出すSAM 3は、物の名前（can・bottle）と色（clear）では絞り込めたが、素材（plastic・glass）と状態（crushed）では絞り込めなかった。","back":"透明なガラス瓶とペットボトルは、どちらの言葉でも同じ4本が選ばれた。","detail":"","key":false,"src":"DAY317"},{"id":"r231","category":"vision","sub":"学習ベースと評価指標","type":"qa","front":"汎用VLM（画像を見て言葉で答えるモデル）は、ロボットのどこに組み込むのが合う？","back":"1枚に8〜30秒かかり課金もされるので、カメラを見ながら少しずつ動かす視覚サーボの繰り返しには入れられない（YOLO26は数ミリ秒）。PICK・PLACEの成否判定のように、1試行に1回だけ呼ぶ位置が合う。","detail":"","key":false,"src":"DAY317"},{"id":"r232","category":"servo","sub":"PICK/PLACEの基本","type":"qa","front":"画像認識が正しくても、機械が狙った場所に行かないのはなぜ？","back":"難しいのは認識より、ピクセル位置を現実のmmに変えて機械に渡す間の部分だから。キャリブレーションのずれ、単眼で奥行きが分からないこと、検出の1コマごとの揺れ（そのまま渡すと機械が震える）、撮影から動作までの時間差、モーターや歯車のガタ、残りの誤認識が段ごとに積み重なる。","detail":"","key":true,"src":"DAY315"},{"id":"r233","category":"servo","sub":"PICK/PLACEの基本","type":"point","front":"PICKは「上空で構える→真下へ降りる」。APPROACH_PICKを上空の爪先高さ帯（100〜125mm）でFKテーブルから引き、DESCENDはそのj0の±3°以内に拘束して、j0を変えずに降ろす。","back":"DAY184版は降下後にj0だけ視覚サーボで寄せていた。DAY275では、approachとdescendでj0を引き直して降下中に9度横へ振れていたのを±3°拘束で抑えた（dry-runで全セル|Δj0|≤3°）。あわせて、ブロック未検出のまま収束を偽装していたj0視覚サーボを本線から外した。DAY175でも、構えと掴みでj0・j1・j3をそろえると爪の向きを保ったまま降りると確かめていた。","detail":"","key":false,"src":"DAY175・DAY184・DAY275"},{"id":"r234","category":"servo","sub":"PICK/PLACEの基本","type":"point","front":"PICK姿勢の正解は「開いた爪先の中点がブロック中心と一致」ではなく「閉じたときに爪がブロックを挟める姿勢」。開→閉で中点が動く分を見込んで、開状態の位置を決める。","back":"","detail":"","key":false,"src":"DAY169"},{"id":"r235","category":"servo","sub":"PICK/PLACEの基本","type":"qa","front":"send_coordsでカメラ追従して降りても、PICKだけsend_anglesにすると何が起きる？","back":"send_anglesは関節角の直接指定なので常に同じ固定位置へ動き、カメラで得たXYがPICKの瞬間に捨てられる。追従を残すなら指令方式をそろえる（現在はsend_coordsを禁止し、send_anglesに一本化している）。","detail":"","key":false,"src":"DAY142・DAY144"},{"id":"r236","category":"servo","sub":"PICK/PLACEの基本","type":"point","front":"ブロックを持って降りる高さは爪先基準ではなく、ぶら下がったブロックの下端が箱の縁（43mm）を越える高さで決める。爪先40mm帯では箱の壁に当たり、70〜100mm帯で箱に入った。","back":"","detail":"","key":false,"src":"DAY263"},{"id":"r237","category":"servo","sub":"PICK/PLACEの基本","type":"qa","front":"PLACEで上カメラだけで水平位置を決めると、何が起きた？","back":"上からは左右は分かるが奥行きを詰めきれず、爪が白箱の手前の縁にかぶった。横カメラは「離してよい高さか」の関所に限り、水平合わせは離す直前の低い高さまで降ろしてから上カメラで行う。高い位置で合わせても降下中に流れるから。","detail":"","key":false,"src":"DAY217"},{"id":"r238","category":"servo","sub":"PICK/PLACEの基本","type":"point","front":"掴み直しはVLMの判定がnoのときだけ行い、unknown（撮影やAPIの失敗）では行わない。掴めているかもしれないブロックを開いて落とさないため。","back":"","detail":"","key":false,"src":"DAY238"},{"id":"r239","category":"servo","sub":"lookupの自由度","type":"point","front":"lookup追従：カメラで対象の位置を測り、FKテーブルから最も近い爪先位置の関節角を引いて送る。最近傍までの距離が閾値（100mm）を超えたら固定角度にフォールバック（代替動作）する。","back":"","detail":"","key":false,"src":"DAY154・DAY168"},{"id":"r240","category":"servo","sub":"lookupの自由度","type":"qa","front":"補正記憶でX方向は縮むのに、Z（奥行き）のズレが縮まなかったのはなぜ？","back":"j0_lookupは採用姿勢のj1〜j5を固定し、j0（ベース回転）だけを振る一軸の方式だったから。j0の回転は主にXを動かし、爪先は円弧上しか動けないので、Δzを渡しても弧上の最寄り点を選び直すだけ。FKテーブルから6関節を引くfk_lookupに替えると、PICKのZのズレは25mm級→10mm級（別セルで-0.4mm）、PLACEのZ残差は36〜84mm→0.02mmになった。","detail":"","key":false,"src":"DAY252・DAY257・DAY263"},{"id":"r241","category":"servo","sub":"lookupの自由度","type":"qa","front":"白箱を1点に固定すると入ったのに、場所を変えると8cmずれたのはなぜ？","back":"落下点の補正をUnity座標のX・Zに固定値で足していたが、ブロックと爪先の位置関係はj0（基部の回転）と一緒に回る。左奥と右ではj0が70°近く違い、補正が合わなくなった。1点で入ったのは、検出・最近傍・補正の向きのずれが偶然相殺していただけ。","detail":"","key":true,"src":"DAY224"},{"id":"r242","category":"servo","sub":"視覚サーボの基本","type":"point","front":"FK（順運動学＝関節角から先端位置を求める計算）の誤差は5点の実測で、奥行きZ方向に+50〜70mmの系統的なずれと確定した。そこで爪先とブロックの両方をカメラで測り、差分を直接フィードバックする閉ループに切り替えた。","back":"","detail":"","key":false,"src":"DAY178・DAY185"},{"id":"r243","category":"servo","sub":"視覚サーボの基本","type":"qa","front":"FK誤差を逆算して目標をずらし、1回だけlookupし直す静的補正に効きムラが出たのはなぜ？","back":"補正後の目標がテーブルの別の領域を指せば大きく効く（107.1mm→13.5mm）が、同じ最近傍点を引く領域では全く効かない（テーブルの疎密）。補正後にマーカーが見えない、マット端で候補が無い場合もある。1回の補正では解消できず、連続ループの視覚サーボへ移った。","detail":"","key":false,"src":"DAY179"},{"id":"r244","category":"servo","sub":"視覚サーボの基本","type":"term","front":"視覚サーボ（visual servoing）","back":"カメラ映像から目標と爪先（TIP）のずれを測り、「どの関節を何度動かすか」に変えてずれをゼロへ追い込む制御。変換の辞書として、関節を1°動かすと先端が何mm動くか（mm/deg係数）を実測しておく。","detail":"","key":false,"src":"DAY180"},{"id":"r245","category":"servo","sub":"視覚サーボの基本","type":"qa","front":"視覚サーボの位置合わせは、上空のAPPROACH姿勢と降下後のPICK姿勢のどちらで精度を出すべき？","back":"降下後のPICK姿勢。上空で合わせても、降下で関節が変わるとTIP位置が連鎖的にずれ、上カメラの視差でも見かけがずれる。上空は大まかでよく、把持高さでTIPとブロックを精密に一致させる。","detail":"","key":false,"src":"DAY184・DAY191"},{"id":"r246","category":"servo","sub":"視覚サーボの基本","type":"qa","front":"j0の更新はX方向の差分だけで行い、収束判定は2D距離で行うのはなぜ？","back":"j0はZ方向にほとんど効かないので、Zの差分でj0を動かしても収束しない。一方、Xだけで判定するとZが大きくずれたまま把持に行く。更新はX、判定はXとZの2D距離という非対称な設計にした。","detail":"","key":false,"src":"DAY185"},{"id":"r247","category":"servo","sub":"視覚サーボの基本","type":"point","front":"mm/deg係数が動く方向の符号まで含むなら、角度更新は delta = diff / 係数。さらにマイナスを付けると二重否定になり、アームは目標と逆へ逃げる。","back":"","detail":"","key":false,"src":"DAY185"},{"id":"r248","category":"servo","sub":"視覚サーボの基本","type":"point","front":"視覚サーボの関節の可動制限は、絶対値ではなく初期姿勢を基準にした相対範囲で設計する。絶対値±30°では、初期j0が-45°の位置で始まった瞬間に範囲外で中断した。","back":"","detail":"","key":false,"src":"DAY180"},{"id":"r249","category":"servo","sub":"視覚サーボの破綻と対策","type":"qa","front":"上カメラのXZ収束だけで「降下完了」と判定できないのはなぜ？","back":"ホモグラフィはマット平面への射影なので、高さ（Y）は最初から取れない。2D距離4.8mmで収束判定が出ても実機は降りていなかった。横カメラの爪先y座標を入力にし、初回値から+30pxで降下完了、5フレームで+10px未満なら進んでいないと判定した。","detail":"","key":false,"src":"DAY199"},{"id":"r250","category":"servo","sub":"視覚サーボの破綻と対策","type":"qa","front":"係数ベースの補正（j1+j2+j4連動・5.0mm/°）が降下後の微調整で効かなくなったのはなぜ？","back":"係数はAPPROACH姿勢で実測した値で、その姿勢域でしか保証されない。姿勢が大きく変わると3関節の効果が打ち消し合い、合計64°動いても爪先のずれは1mmも縮まなかった。バグではなく物理モデルの前提が変わっていた。","detail":"","key":false,"src":"DAY200"},{"id":"r251","category":"servo","sub":"視覚サーボの破綻と対策","type":"term","front":"プローブ式制御","back":"係数に頼らず、毎ループ関節を1°動かして実機の応答を見る補正方法。ずれが前回より減れば同方向を続け、増えれば反転する。X・Zの試行方向は独立に持つ。暴走しうるので関節ごとの安全範囲とループ回数上限を置く。","detail":"","key":false,"src":"DAY200"},{"id":"r252","category":"servo","sub":"視覚サーボの破綻と対策","type":"qa","front":"「XZを合わせてから降りる」という段階分けをなぜやめた？","back":"j4で降ろすとXZも動き、XZを直すと高さYが崩れる相互干渉ループになり、補正量を絞ってもいたちごっこが続いた。上カメラのXZと横カメラのYを同時に見て3軸を同時に追い、3軸が揃った瞬間に爪を閉じる設計に変えた。","detail":"","key":true,"src":"DAY202"},{"id":"r253","category":"servo","sub":"視覚サーボの破綻と対策","type":"point","front":"補正する軸をX→Z→Yの固定順で選ぶと、Zが関節の限界で縮まないときYへ永遠に進めない。Xが把持可能圏に入ったらYも候補に入れ、ずれ/許容値の比が最大の軸を選ぶ。","back":"","detail":"","key":false,"src":"DAY208"},{"id":"r254","category":"servo","sub":"視覚サーボの破綻と対策","type":"qa","front":"整列と降下後修正のループが暴走した構造的な原因は？","back":"どちらも目標との差だけを見て関節を回し、爪先が実際に動いたかを見ていなかった。肘が寝た姿勢域では関節を回しても爪先が動かず差が残り続け、j1は93°→326°まで回って16ビット整数の上限を超え通信エラーになった。操作の結果爪先が動いたかを見る形にする。","detail":"","key":true,"src":"DAY248"},{"id":"r255","category":"servo","sub":"視覚サーボの破綻と対策","type":"point","front":"PICK視覚サーボは全反復でブロック未検出（block_x_mm=None）のまま別の値を縮めて「収束」と記録し、j0を-22→-34へ悪化させていた。検出できない値で収束を偽装する閉ループは本線から外す。","back":"","detail":"","key":false,"src":"DAY275"},{"id":"r256","category":"servo","sub":"視覚サーボの破綻と対策","type":"point","front":"「動かない」を3回連続検知したら自動でHOMEへ戻すセーフティは過保護だった。キュー待ちなどで一時的に止まり、次の瞬間に動き出すことがある。検証段階では警告にとどめ、止める判断は人が持つ。","back":"","detail":"","key":false,"src":"DAY208"},{"id":"r257","category":"servo","sub":"補正記憶","type":"term","front":"補正記憶","back":"検出位置(x,z)を20mm格子のセルに分け、セルごとに爪先のズレΔを記憶する仕組み。次に同じセルへ来たら狙いを「ブロック位置−Δ」に補正してlookupへ渡す。実機でPICKの平均誤差は41.2mm→12.3mmに下がった。記憶の更新は当初、残差の指数移動平均（係数0.5）だったが、のちに積分則へ替えた。","detail":"","key":false,"src":"DAY257・DAY270・DAY275"},{"id":"r258","category":"servo","sub":"補正記憶","type":"term","front":"補正記憶の積分則","back":"試行ごとの残差を補正値に積み足して更新する方式（Δ_new = Δ_old + α·残差）。残差の指数移動平均と違い、落ち着く先（不動点）が「残差ゼロ」になる。ただし1回の更新上限より真の必要補正が大きいと、限界まで巻き上がって発散しうる。","detail":"","key":false,"src":"DAY275・DAY280"},{"id":"r259","category":"servo","sub":"補正記憶","type":"qa","front":"落下点のずれが毎回同じ方向・数mm幅に揃っていたら、何を意味し、どう打ち消す？","back":"掴んだ位置が爪に対して毎回ほぼ一定だという意味（ばらつきなら方向も大きさも散る）。降りる狙いを逆向きに動かせば打ち消せる。一度に全部詰めず半量から符号と量を確かめ、記録には補正前の生の座標を残す。","detail":"","key":false,"src":"DAY222"},{"id":"r260","category":"servo","sub":"補正記憶","type":"point","front":"補正記憶のセルキーにphase接頭辞（pick_/place_）を付けて空間を分けた。空の爪の爪先ずれと、保持したブロックの落下点ずれは物理的な意味が違い、混ぜると壊れる。","back":"","detail":"","key":false,"src":"DAY263"},{"id":"r261","category":"servo","sub":"補正記憶","type":"point","front":"PLACE補正記憶を切ったら着地距離の平均が18mm改善した。降下高さを変える前に学んだ過大補正が有害な在庫になっていた。前提が変わった補正値は破棄する。","back":"","detail":"","key":false,"src":"DAY273"},{"id":"r262","category":"servo","sub":"補正記憶","type":"qa","front":"PLACEのZ方向の系統ズレ（約28mm）を、補正記憶ではなく置く直前のZサーボで詰めたのはなぜ？","back":"真値28mmが1回あたりの補正上限15mmより大きく、試行をまたぐ補正記憶では限界へ積み上がってJ4_SAFE（手首の安全範囲）を割った。その場の閉ループで1試行内にΔz→0へ詰め、次に持ち越さなければ巻き上がりは起きない。収束判定は、動く狙いではなく開始時に1度だけ確定した箱中心zで測る。","detail":"","key":false,"src":"DAY280"},{"id":"r263","category":"servo","sub":"動的追従の設計","type":"point","front":"DAY185の動的追従は、止まって観察→動くステップ駆動をやめ、毎フレーム爪先とブロックを再検出して差分で更新する連続制御にした。「動く間は追い、止まった瞬間に掴む」。","back":"だがDAY200では関節連動の係数ベースのZ追従が爪先をほぼ動かせず不成立になった。DAY272の再設計書は、これを「発振」と位置づけ、ずれが閾値を越えた時だけ狙いを引き直す離散リプランとした。","detail":"","key":false,"src":"DAY185・DAY200・dynamic_tracking_v2_design"},{"id":"r264","category":"servo","sub":"動的追従の設計","type":"qa","front":"なぜ動的追従を連続サーボではなく離散リプランにするのか？","back":"DAY200でj1+j2+j4連動の連続Z追従が発振・不成立になったため。対象位置は常に監視するが、ターゲットを引き直すのはズレが閾値（初期案15mm）を越えた時だけで、毎フレームは反応しない。「追わない勇気」を設計に含める。","detail":"","key":true,"src":"dynamic_tracking_v2_design"},{"id":"r265","category":"servo","sub":"動的追従の設計","type":"term","front":"非同期 dual-system","back":"遅い知覚（重い検出やVLM）と速い制御（反射的な送角）を別周波数・非同期で回す構成。速い系は遅い系を待たず、共有バッファ（最新の検出位置・時刻・確信度）を読むだけで、古い値（例1.5秒超）は使わない。VLA研究の主流解。mechArmの速い系は軽量なOpenCV＋lookupで計算力は足り、足りないのは両者をつなぐ非同期の橋だけ。","detail":"","key":false,"src":"dynamic_tracking_v2_design"},{"id":"r266","category":"servo","sub":"動的追従の設計","type":"qa","front":"リプランが必要になったとき、速い系はどう動く？","back":"進行中の送角を現在角で一旦止め、バッファの最新位置でそのフェーズを引き直し、新ターゲットへsend_anglesを1回だけ送る。移動中に軌道を変えず、同一ステージ内のリプラン回数にも上限（初期案2回）を置く。","detail":"","key":false,"src":"dynamic_tracking_v2_design"},{"id":"r267","category":"servo","sub":"動的追従の設計","type":"point","front":"動的追従は段階導入する：遅延の実測→ほぼ静止区間での白箱監視→移動中はログだけ取る→移動中リプラン。50〜100Hzは目標にせず、実測周期で追える対象だけ追う。","back":"補正記憶は試行間の静的な系統誤差、動的追従は試行内の外乱を受け持つので共存する。","detail":"","key":false,"src":"dynamic_tracking_v2_design"},{"id":"r268","category":"servo","sub":"受け渡し（ハンドオーバー）","type":"qa","front":"受け渡し（アームが差し出し人が受け取る）の一歩目で、「測定」と「安全」をどう分けた？","back":"測定は開ループ（センサーで確かめず決めた動きを出す）で、N秒で決め打ちして開き、落ちた回数を「何秒待てば受け取れるか」の測定値にする。待機の開始とアームが再び動く瞬間は、人の確認入力を経る2段インターロックにした。この2つを混ぜない。","detail":"","key":true,"src":"DAY288"},{"id":"r269","category":"servo","sub":"受け渡し（ハンドオーバー）","type":"qa","front":"受け渡しで送角の自動再送を禁止したのはなぜ？","back":"人が「止まった」と認識した数秒後に、遅れて届いた再送でアームが動く危険があるから。置くタスクでは便利だった再送が凶器になるので、各ウェイポイントでsend_anglesは1回だけにした。","detail":"","key":false,"src":"DAY288"},{"id":"r270","category":"servo","sub":"受け渡し（ハンドオーバー）","type":"point","front":"人の手が可動域にある間はVLMのAPIを呼ばない。撮影はRELEASE直後、判定はアームがHOMEに戻ってから。VLMは参考値なので物理安全の手順より後でよい。","back":"","detail":"","key":false,"src":"DAY288・DAY293"},{"id":"r271","category":"servo","sub":"受け渡し（ハンドオーバー）","type":"qa","front":"受け渡しでグリッパーが開かなかったとき、止まらずHOMEへ帰るのはなぜ？","back":"人の手のすぐ横で保持姿勢のまま静止し続けると、次に何が起きるか読めない状態が続くから。開け直しはせずブロックを保持したまま、人の確認を経て、正常系と同じ退避関数でHOMEへ戻る。経路・速度・期限が同一であることを関数の共有で保証した。","detail":"","key":false,"src":"DAY293"},{"id":"r272","category":"servo","sub":"受け渡し（ハンドオーバー）","type":"qa","front":"受け渡しで、アームが人の手の高さに追従しないと決めたのはなぜ？","back":"送角して到達を待つのに1秒以上かかり、その間に手は動くので追っても合わず揺れ続ける。両方が合わせようとすると逃げ合うので、止まる側をロボット、合わせる側を人にする。開く直前に1枚撮って手がまだあるかを確かめる門番の役割は持たせる。","detail":"","key":false,"src":"DAY297"},{"id":"r324","category":"learning","sub":"学習の位置づけ","type":"qa","front":"従来の産業用ロボットとフィジカルAIは何が違う？","back":"産業用は人がティーチング（動きの事前登録）で動作を決め、制御された空間で動き、失敗は許されない。強みは精度・耐久性・再現性。フィジカルAIは学習と推論で動作を決め、不確実な空間で動き、失敗は学習データになる。強みの源はデータ・モデル・体験設計。","detail":"","key":false,"src":"DAY112"},{"id":"r325","category":"learning","sub":"学習の位置づけ","type":"qa","front":"なぜ古典制御（順運動学・逆運動学・フィードバック）から学習へ移るのか？","back":"机の面だけで関節の動ける範囲が狭まり、障害物が増えるたびに解き直しになる。逆運動学（手先位置から関節角を求める計算）は目標の姿勢は出すが道筋は出さない。認識〜制御を別々に作って繋ぐので誤差が積み重なり、作業や機体が変わるたびに作り直しになる。","detail":"","key":false,"src":"研究メモ:Robot Learning Tutorial（LeRobot入門書）"},{"id":"r326","category":"learning","sub":"学習の位置づけ","type":"point","front":"「C++ではなくニューラルネットで動かす」の対立軸は言語ではない。人が数式で書いた制御則（逆運動学・PID制御など）か、データから学習した方策か、である。","back":"ニューラルネットの担当は約40年で、誤差を吸収する部品→知覚→画像から指令までの一本の写像→全身へと広がった。","detail":"","key":false,"src":"DAY214"},{"id":"r327","category":"learning","sub":"学習の位置づけ","type":"point","front":"Physical AI が学習できる環境は ①データを集める手段 ②学習基盤 ③成否を判定する仕組み ④収集→学習→実機検証→次の収集を回すループ で成り立つ。最大のボトルネックはデータ。","back":"","detail":"","key":true,"src":"研究メモ:Physical AIが学習できる環境の調査"},{"id":"r328","category":"learning","sub":"学習の位置づけ","type":"qa","front":"FKテーブル（関節角→指先位置の対応表）を濃くしても「失敗から学ぶアーム」に近づかないのはなぜか？","back":"テーブルが返すのは行き先の姿勢（終点）だけで、失敗の検知・原因の推定・次の一手の立て直しを持たないから。範囲や密度を上げるのは失敗しにくくする改善で、失敗後に立て直す能力ではない。精度を上げることと失敗から学ぶことは別の軸にある。","detail":"","key":true,"src":"DAY225"},{"id":"r329","category":"learning","sub":"学習の位置づけ","type":"qa","front":"「モジュール型」と「エンドツーエンド」はどう違い、なぜ今はモジュール型を続けるのか？","back":"モジュール型は認識・位置推定・経路計画・制御を別部品にし、受け渡しの形を人が決める。エンドツーエンドは入力から操作までを1つのネットに丸ごと学習させ、誤差の累積がなく言葉にしきれない判断まで学べるが、失敗箇所を特定しにくい。移行が効くのはタスク分岐の爆発・複数ロボット連携・リアルタイム性・環境変化への適応が要るときで、今はどれにも当たらないため、各段を人が検証できるモジュール型が正しい。","detail":"","key":false,"src":"DAY143・DAY316"},{"id":"r330","category":"learning","sub":"学習の位置づけ","type":"point","front":"学習した方策は「なぜそう動いたか」が外から見えにくく、新しい機体へのゼロショット汎化もまだ限定的。規制が説明可能性や非常停止を求めれば、学習方策に古典制御の安全層を組み合わせたハイブリッドが長く残る。","back":"","detail":"","key":false,"src":"DAY214"},{"id":"r331","category":"learning","sub":"模倣学習と強化学習","type":"qa","front":"模倣学習（人の実演をまねる学習）の利点と弱点は？","back":"利点は報酬が要らない（成功条件が実演に含まれる）ことと、危険な探索をしないこと。弱点は、実演者より上手にならない、小さな誤差が積み重なって見たことのない状態に入る、実演のばらつきを単純に平均するとどっちつかずの動きになる（人の実演を単純な回帰で学ばせると成功率が33ポイント下がった）。","detail":"","key":true,"src":"DAY270・DAY323・研究メモ:Robot Learning Tutorial（LeRobot入門書）"},{"id":"r332","category":"learning","sub":"模倣学習と強化学習","type":"qa","front":"なぜ実機での強化学習（試行と報酬で学ぶ方式）は難しい？","back":"学習初期の乱暴な動きで機体を壊しうる、毎回のリセットに手間がかかる、必要な試行回数が多すぎる、シミュレーションは現実とずれる。最大の弱点は報酬設計で、細かく設計すると抜け道を学習され、成功／失敗だけにすると学習が遅い。","detail":"","key":true,"src":"研究メモ:Robot Learning Tutorial（LeRobot入門書）"},{"id":"r333","category":"learning","sub":"模倣学習と強化学習","type":"qa","front":"模倣学習で、VLMによる成否判定（VLM-as-Reward）はどこに使う？","back":"模倣学習は実演に「どこで成功して終わるか」が含まれるので報酬は要らない。VLMの判定は学習には使わず、学習させた動作を何回試して何回成功したかを数える評価の側で使う。実演者より上手くなる段階では、成否判定を報酬にする強化学習（HIL-SERLなど）が要る。","detail":"","key":false,"src":"DAY323"},{"id":"r334","category":"learning","sub":"模倣学習と強化学習","type":"term","front":"HIL-SERL","back":"人が途中で手を出す実機強化学習。成功・失敗の画像で小さな画像認識モデル（報酬分類器）を学習させて報酬にし、人の実演から学習を始め、介入データを優先的に学習する。元論文では1〜2時間の学習で成功率99%以上。","detail":"","key":false,"src":"研究メモ:Robot Learning Tutorial（LeRobot入門書）"},{"id":"r335","category":"learning","sub":"模倣学習と強化学習","type":"qa","front":"Physical Intelligence の π*0.6（RECAP）は何をしていて、どう読むべきか？","back":"オフライン強化学習で汎用VLAを事前学習し、現場ごとに配備して自律実行の記録と人のテレオペ介入による修正を集め、下流タスクに特化させる。読み替えると、汎用モデルが約50%まで運び、残りは現場で人が横について直す。現場ごとの調整は消えず「治具屋がデータ屋になった」だけで、2台目がフルコストという根本は残る。","detail":"","key":false,"src":"DAY286"},{"id":"r336","category":"learning","sub":"データの集め方","type":"qa","front":"なぜロボット学習ではデータが本丸なのか？","back":"ロボットにはネット規模の動作データがない。最大の公開実ロボットデータセット Open X-Embodiment でも約100万軌跡（約60データセットの寄せ集め）で、言語モデル1つの学習には十数兆トークンが使われる。ロボットのデータは実機を動かすかシミュレーションで作るしかなく、ネットから拾えない。","detail":"","key":true,"src":"DAY214・研究メモ:Physical AIが学習できる環境の調査"},{"id":"r337","category":"learning","sub":"データの集め方","type":"qa","front":"ロボットの学習データを作る方法は、それぞれ何が弱い？","back":"実機の遠隔操作（テレオペ）は品質が最も高いがコストが人手に比例する。手持ちデバイス（UMI系）はロボットなしで集められるが人とロボットの体の違いが残る。人の動画に擬似ラベルを付ける方法は既存映像を使えるがラベル精度が課題。シミュレーション・生成は量を出せるが現実との物理の違いが残り、スマホ映像からの生成は物体の動きの物理を扱わない。","detail":"","key":false,"src":"DAY214・研究メモ:Physical AIが学習できる環境の調査"},{"id":"r338","category":"learning","sub":"データの集め方","type":"qa","front":"テレオペ・ティーチング・ドラッグティーチングはどう違う？","back":"テレオペ（遠隔操作）は別の入力デバイス（リーダーアーム・手袋・VRコントローラ）で人がリアルタイムに動かし、現実の動きをそのまま記録する。変化する環境や汎用動作向き。ティーチングは作業前に動きを登録して再現する、定型作業向き。ドラッグティーチングはロボット本体を手で動かして関節角を記録・再生し、追加デバイスが要らない。双腕の模倣学習には最終的にテレオペ（ALOHAのリーダー・フォロワー方式など）が要る。","detail":"","key":false,"src":"DAY118・DAY205"},{"id":"r339","category":"learning","sub":"データの集め方","type":"point","front":"大勢がテレオペで服を畳む工場の映像は、作業ではなく動作データ集め。動作AIはデータ量が汎化に直結し、現実の動きを確実に集める手段は今は人手しかない。","back":"","detail":"","key":false,"src":"DAY118"},{"id":"r340","category":"learning","sub":"データの集め方","type":"term","front":"UMI（Universal Manipulation Interface）","back":"人が手持ちのグリッパー装置（GoPro・ミラー・3Dプリント製グリッパー・ArUcoマーカーで約500ドル）を日常環境で操作してデモを集め、データ収集をロボット本体から切り離す手法。テレオペの約3倍速（1時間111デモ対35デモ）。DexCap（モーキャプ手袋）なども同じ「人の動き→3D動作データ→ロボット学習」の構造で収集コストを下げる。","detail":"","key":false,"src":"DAY126・DAY166"},{"id":"r341","category":"learning","sub":"データの集め方","type":"term","front":"リターゲティング","back":"撮影した人間の動きを、別の骨格（キャラクターやロボット）に合わせて変換し直すこと。","detail":"","key":false,"src":"DAY118"},{"id":"r342","category":"learning","sub":"データの集め方","type":"qa","front":"遠隔操作で、操作から動作までの遅れはどこまで許される？","back":"目安は、0.1秒以下ならほぼ気づかない、0.2〜0.3秒は気づくが慣れれば操作できる、0.5秒以上は手が追いつかず細かい作業が難しい。2秒では物の手渡しもできないので、分身ロボットの想定は0.3秒に訂正した。","detail":"","key":false,"src":"DAY322"},{"id":"r343","category":"learning","sub":"データの集め方","type":"term","front":"一時停止と持ち直し（スマホ遠隔操作）","back":"ボタンを1回押すとロボットが止まり、スマホを自由に動かせる。もう1回押すとその時点のスマホとロボットの位置を新しい基準にして再開する。スマホの小さな可動範囲でロボットの広い範囲を操作できる。","detail":"","key":false,"src":"研究メモ:Phone2Act（スマホ遠隔操作）"},{"id":"r344","category":"learning","sub":"データの集め方","type":"qa","front":"スマホ遠隔操作の「安全の二段構え」とは？","back":"①手先の目標を設定した直方体の範囲内に収める。②前回から一定距離（例: 60mm）以上飛んだ目標は捨てる（追跡外れ・スマホ落下・通信の乱れ対策）。mechArm の実機ガードと同じ考え方を入力側で先にかけている。","detail":"","key":false,"src":"研究メモ:Phone2Act（スマホ遠隔操作）"},{"id":"r345","category":"learning","sub":"データの集め方","type":"point","front":"遠隔操作のアバターで人が働くこと自体が、自律ロボットの学習データを生む。行き着く形は、人が「このカップを取る」と意図を出し、ロボット側のAIが力加減や位置合わせを補う分担。","back":"","detail":"","key":false,"src":"DAY321"},{"id":"r346","category":"learning","sub":"データの集め方","type":"point","front":"ロボット操作の自律レベルはL3（器用な操作）が現フロンティアで、π0.5やGR00Tがここにいる。L4には数億〜十億軌跡級のデータが要ると見積もられ、ロボット版インターネットが無いこと（データの島々）が最大の壁。","back":"","detail":"","key":false,"src":"DAY282"},{"id":"r347","category":"learning","sub":"データの集め方","type":"qa","front":"熟練者の手元を長時間撮っておけば、将来その映像でロボットを模倣学習させられる？","back":"そのままではできない。模倣学習に要るのは、その機体・そのグリッパーでタスクを人が操作して集めたデータで、人の手の映像とは形式が違う。撮る価値は、映像から判断基準（どこを見て何で決めているか）を抜けること。本人が答えられるうちに理由を聞くほうが価値が高い。","detail":"","key":false,"src":"DAY314"},{"id":"r348","category":"learning","sub":"記録と教示データ","type":"point","front":"教示データには意味を付ける：対象物の位置、工程ラベル（APPROACH_PICK→PICK→APPROACH_PLACE→PLACE）、グリッパーの開閉印。構造を持たないデータは、増やしても使えないデータが増えるだけ。","back":"","detail":"","key":false,"src":"DAY226"},{"id":"r349","category":"learning","sub":"記録と教示データ","type":"qa","front":"教示データから「アプローチ姿勢」を抜くとき、工程の最後の姿勢を代表点にすると何が起きたか？","back":"工程キーを降下し終わった後に押していたため、APPROACH_PICK の終端がほぼ PICK と同じ姿勢（差0.18°）になり、上空のアプローチが消えた。工程内で PICK から最も遠い姿勢を選ぶ方式で解決した。教示では工程キーを動作の前に押す。","detail":"","key":false,"src":"DAY228"},{"id":"r350","category":"learning","sub":"記録と教示データ","type":"point","front":"教示データは成功動作の録画ではなく、あとから姿勢を引ける実機の地図。箱に置く姿勢は勘で三度外したが、過去の教示軌道のグリッパー開放時点にそのまま残っていた。","back":"奥行きごとに掴める姿勢を教えておき、検出した奥行きに最も近い姿勢を自動選択する使い方もできる（最寄りでも35mm以上離れていれば掴みに行かず中断）。","detail":"","key":false,"src":"DAY232・DAY244"},{"id":"r351","category":"learning","sub":"記録と教示データ","type":"qa","front":"Pick&Placeの記録を、まばらなスナップショットではなく映像＋関節の連続記録にしたのはなぜか？どんな原則を置いたか？","back":"模倣学習（LeRobot・SmolVLA系）は一定周波数で関節状態と同期した連続記録を要求し、1試行6枚程度の画像では軌跡として読めないため。記録係（recorder）は観測者で制御経路に一切入らず、起動していなくても死んでも本線は完走する、を絶対原則にした。","detail":"","key":false,"src":"DAY287"},{"id":"r352","category":"learning","sub":"記録と教示データ","type":"point","front":"Phone2Act の記録ノードは、全情報源の新しいデータがそろった時だけ1コマ記録し、映像はメモリに溜めて1回分の終了後に MP4 へ書き出す（記録の時間精度を保つため）。出力はそのまま LeRobot 形式。","back":"","detail":"","key":false,"src":"研究メモ:Phone2Act（スマホ遠隔操作）"},{"id":"r353","category":"learning","sub":"記録と教示データ","type":"term","front":"LeRobotDataset の構成","back":"meta/info.json（全体の設計図）、meta/stats.json（項目ごとの平均・標準偏差。学習時の正規化に使う）、meta/tasks.jsonl（作業の説明）、meta/episodes/（1回分ごとの情報）、data/（関節角などを parquet で）、videos/（カメラごとの MP4）。","detail":"","key":false,"src":"研究メモ:Robot Learning Tutorial（LeRobot入門書）"},{"id":"r354","category":"learning","sub":"記録と教示データ","type":"qa","front":"「失敗から学ぶループ」のための機体に要るものは？（mechArmからSO-101を選び直した理由）","back":"ループの主役は失敗の量と、それを記録する仕組み。mechArm には失敗の瞬間を見る手首カメラも、失敗を量産するテレオペの入口も無い。SO-101 は安価なまま、テレオペ・LeRobot 形式の記録・手首カメラ前提の設計をエコシステムごと持つ。","detail":"","key":false,"src":"DAY225"},{"id":"r355","category":"learning","sub":"合成データ","type":"point","front":"R2R2R（実演動画から学習データを生成する研究）は、スマホ動画2本（物体の周囲スキャンと人が手で動かす動画）から3D形状と物体の軌跡を作り、開始・終了位置を変えて何千通りに作り直し、微分逆運動学で関節角を出して描画する。","back":"","detail":"","key":false,"src":"研究メモ:R2R2R（実演動画1本から学習データ生成）"},{"id":"r356","category":"learning","sub":"合成データ","type":"qa","front":"R2R2Rの「実演1本で遠隔操作150本に匹敵」は、どの条件の数字？","back":"生成データを1,000本まで増やしたときの話。π0-FASTでマグを載せるタスクは、遠隔操作150本で73.3%、生成150本で33.3%、生成1,000本で80.0%。同じ本数なら人のデータのほうがずっと良く、付録の検定では「同等」と言えるタスクは1つもなかった。当初（DAY214）は「150回のテレオペと同等」と受け取っていたが、DAY323で条件付きと分かった。","detail":"","key":false,"src":"DAY214・DAY323・研究メモ:R2R2R（実演動画1本から学習データ生成）"},{"id":"r357","category":"learning","sub":"合成データ","type":"qa","front":"R2R2Rの生成データで、本当に成功率に効いていたものは？","back":"きれいな画像の量ではなく、開始位置と終了位置がばらついた動きを作れること。動きを作り直さず元の動きを再生するだけだと、マグのタスクで π0-FAST は80.0%→0.0%、Diffusion Policy は53.3%→6.7%に落ちた。逆に背景や机の模様を変えすぎると π0-FAST は73.3%→35.3%に下がった。","detail":"","key":true,"src":"DAY323・研究メモ:R2R2R（実演動画1本から学習データ生成）"},{"id":"r358","category":"learning","sub":"合成データ","type":"point","front":"マグをコーヒーメーカーに載せるタスクで、実データ150本と生成データ1,000本を混ぜて学習させると、Diffusion Policy は40.0%（実データのみ）→86.7%に伸びた。π0-FAST は73.3%で変わらなかった。","back":"","detail":"","key":false,"src":"研究メモ:R2R2R（実演動画1本から学習データ生成）"},{"id":"r359","category":"learning","sub":"合成データ","type":"point","front":"NVIDIA GR00T-Mimic は少数の人間デモから78万本の合成軌道を11時間で生成した（人間デモ6,500時間相当）。合成と実データの併用で、実データのみより GR00T N1 の性能が40%向上した。","back":"","detail":"","key":false,"src":"DAY166"},{"id":"r360","category":"learning","sub":"合成データ","type":"term","front":"ドメインランダム化","back":"シミュレーションで光・テクスチャ・位置などをランダムに変えて学習させ、現実のばらつきに耐えるようにする手法。OpenAIのDactylはシミュレーションだけで学習し、これで実機のロボットハンドへ転移した（6,000以上のCPUコアと約30時間の訓練）。","detail":"","key":false,"src":"DAY212・DAY214"},{"id":"r361","category":"learning","sub":"手法とモデル","type":"term","front":"ACT（Action Chunking Transformer）","back":"1ステップずつではなく、次の数十〜100ステップ分の関節位置をまとめて予測する（アクションチャンク）模倣学習の手法。安い双腕構成ALOHAと同時に提案された。まとめて予測するだけで成功率が1%→44%に上がり、誤差の累積で訓練データの分布から外れる問題を抑える。10分のデモで難タスク80〜90%の成功率を出した。","detail":"","key":false,"src":"DAY214・DAY323・研究メモ:Robot Learning Tutorial（LeRobot入門書）"},{"id":"r362","category":"learning","sub":"手法とモデル","type":"term","front":"Diffusion Policy","back":"ノイズから動きを削り出す（拡散モデルで行動の系列を生成する）模倣学習の手法。実演50〜150本（遠隔操作で15〜60分）で学習でき、10ステップ程度で動きが出る。元論文の著者は単純な畳み込み型から始めるよう勧めている（変換器型は設定に敏感）。","detail":"","key":false,"src":"研究メモ:Robot Learning Tutorial（LeRobot入門書）"},{"id":"r363","category":"learning","sub":"手法とモデル","type":"term","front":"VLA（視覚・言語・行動モデル）","back":"画像と言葉の指示からロボットの行動を出すモデル（RT-2が起点。OpenVLA・π0・SmolVLAなど）。大規模な視覚言語モデルを行動を出力するよう追加学習させ、言語理解が制御に直結する。観察→行動の対応は学ぶが、その行動で世界がどう変わるかは理解していないため、環境が少し変わると失敗しやすい。","detail":"","key":false,"src":"DAY214・DAY276"},{"id":"r364","category":"learning","sub":"手法とモデル","type":"term","front":"π0.5（パイ・ゼロ・ゴ）","back":"Physical Intelligence社が重みとコード（openpi・Apache-2.0）を公開しているVLA。1万時間以上のロボットデータで学習したベースモデルと、特定ロボット向けに追加学習済みのモデル（例：Franka 7軸アームのDROID）がある。自分の機体で使うには、自分でデータを集めて追加学習するのが前提。","detail":"","key":false,"src":"DAY326"},{"id":"r365","category":"learning","sub":"手法とモデル","type":"term","front":"SmolVLA","back":"約4.5億パラメータの小型の汎用ロボットモデル。π0 に匹敵しつつ約40%速く、メモリは6分の1。SO-100／101 の公開データセット450以上（約2万本）で事前学習。学習時とカメラの名前・解像度を一致させる必要がある。","detail":"","key":false,"src":"研究メモ:Robot Learning Tutorial（LeRobot入門書）"},{"id":"r366","category":"learning","sub":"手法とモデル","type":"qa","front":"SO-101 の並列実機評価（実演50本で学習）で、手法の成績はどうだったか？","back":"総合の成功率は π0.5 が47.6%で首位、Diffusion Policy 26.7%、ACT 19.2%、SmolVLA 15.0%（7手法中最下位）。双腕では順位が入れ替わり、Diffusion Policy が2位（35.8%）、ACT は2.5%に落ちる。ケーブルをホルダーに押し込む接触の多い作業は全手法で0%。","detail":"","key":false,"src":"研究メモ:ArmnetBench（SO-101並列実機評価）"},{"id":"r367","category":"learning","sub":"手法とモデル","type":"point","front":"必要デモ数の目安：ACTは50〜200（単純なPick&Placeなら20〜30）、Diffusion Policyは100〜500、VLAの追加学習は20〜50。対して Open X-Embodiment は100万超の軌跡・22機種・527スキルを束ねる。","back":"","detail":"","key":false,"src":"DAY282"},{"id":"r368","category":"learning","sub":"手法とモデル","type":"qa","front":"ロボット学習の事前学習の3階層とは？小データ模倣学習（MicroFactory型）はどれを残しているか？","back":"第1層は視覚バックボーンの事前学習（ImageNet・DINOv2・SigLIP・CLIP）、第2層は複数タスク・複数ロボットの行動の横断事前学習、第3層はネット規模VLMの意味の事前学習（RT-2・π0）。小データ型は第1層だけ残し、第2・第3層を捨てている。","detail":"","key":false,"src":"DAY282"},{"id":"r369","category":"learning","sub":"手法とモデル","type":"qa","front":"GEN-0・π0・GR00T N1は、構成とデータの集め方がどう違う？","back":"GEN-0は知覚と行動を1本の流れで同時に進め100Hzで行動を出す。データは実世界の約27万時間のみ。π0は統合トランスフォーマーとAction Expertの組み合わせで、フローマッチングにより50Hzで行動を出す。データは実世界とオープンデータ。GR00T N1は遅い層（VLM 10Hz）と速い層（DiT 120Hz）を分ける構成で、シミュレーションと合成データを使う。","detail":"","key":false,"src":"DAY126"},{"id":"r370","category":"learning","sub":"手法とモデル","type":"term","front":"クロスエンボディメント","back":"異なる機体（体）の間で、同じ動作モデルを転用すること。GEN-0では、7自由度のFlexiv Rizon 4と6自由度のUR5の間で、タスク固有のデータなしに転移できたとされる。","detail":"","key":false,"src":"DAY126"},{"id":"r371","category":"learning","sub":"手法とモデル","type":"qa","front":"手先カメラで学習したポリシーを、収集時と別のアームで使い回せるのはなぜか？条件は？","back":"ポリシーは「手先カメラにこう映ったら手先を次にこう動かす」という手先座標系で閉じた入出力で、アームの型番やリンク長が出てこない。アーム固有の部分は逆運動学の薄い一層に押し込める。条件は①グリッパー形状を揃える②手先カメラの取付位置・画角を同じにする③そのアームが目標姿勢に物理的に届くこと。","detail":"","key":false,"src":"DAY291"},{"id":"r372","category":"learning","sub":"手法とモデル","type":"qa","front":"最近のVLA研究で、深度なしのRGBカメラ2〜3台が主流なのはなぜ？","back":"RGBにも深度の手がかりが多く、深度だけでは判別できないタスクが多い。実機の深度はノイズや欠損が多く、シミュの深度は完璧すぎて差が大きい。RGBはネット上に大量の動画や事前学習済みエンコーダーがある。深度のノイズが方策の予測不能な挙動を招くこともある。","detail":"","key":false,"src":"DAY166"},{"id":"r373","category":"learning","sub":"手法とモデル","type":"term","front":"JEPA（Joint Embedding Predictive Architecture）","back":"Yann LeCun が提唱した枠組み。未来を画像として生成せず、潜在空間（特徴ベクトル）で予測する。影・照明・ノイズまで再現する必要がなく、位置・速度・姿勢・関係性といった重要な要素だけを学ぶ。","detail":"","key":false,"src":"DAY276"},{"id":"r374","category":"learning","sub":"手法とモデル","type":"qa","front":"VLA-JEPA はなぜ世界モデルを使うのに推論が軽いのか？","back":"学習時だけ世界モデル（V-JEPA2）を通し、損失を行動の損失と世界モデルの損失の和にする。推論時には世界モデルを捨てるので重くならない。公式デモは RTX3080・VRAM 6GB未満で約10Hz、追加学習のデモは13個だった。","detail":"","key":false,"src":"DAY276"},{"id":"r375","category":"learning","sub":"VLMの使い方と推論の実行","type":"qa","front":"VLM（画像と言葉を扱うモデル）の4つの役割のうち、どれが借りられ、なぜポリシーだけは自分で作るしかないのか？","back":"知覚（シーンの言語化）・高レベル計画・報酬/評価は「見て、言葉にして、考える」仕事で、ネット規模の世界知識がそのまま効くので市販VLMを借りられる。ポリシー（動作を直接出すVLA）は、その身体をある速度・角度で動かすと何が起きるかという身体固有の知識で、ネット上に無いから学習で教え込むしかない。","detail":"","key":true,"src":"DAY221"},{"id":"r376","category":"learning","sub":"VLMの使い方と推論の実行","type":"term","front":"System 1 / System 2（Hi Robot）","back":"考える脳（System 2：上位のVLMが段取りを立てる）と手を動かす脳（System 1：下位のπ0がモーター指令に変える）を分ける二層構造。自前で組むなら、VLMの出力を「掴む／置く／待機」の固定語彙に縛り、動作プリミティブと一対一で対応させると計画と実行が噛み合う。","detail":"","key":false,"src":"DAY219"},{"id":"r377","category":"learning","sub":"VLMの使い方と推論の実行","type":"term","front":"スキルへの接地（グラウンディング／SayCan）","back":"VLMが物理的に不可能な手順を出すのを防ぐ考え方。「役に立つ度（VLM側）」と「実行可能度（実機側）」を掛け合わせ、両方高い行動だけ選ぶ。実装は、呼べるスキル（PICK・PLACE・APPROACH・HOME）のリストを先に渡し、その中からしか選ばせない。","detail":"","key":false,"src":"DAY221"},{"id":"r378","category":"learning","sub":"VLMの使い方と推論の実行","type":"qa","front":"VLMを計画層に置くときの鉄則3つは？","back":"①遅いプランナと速いスキルを分ける：計画はタスクの区切りでだけ回し、動作はローカルの send_angles と FK ルックアップが担う。②スキルを強制する：許可されたAPIからしか選ばせない。③判定を二重化する：VLMの評価を鵜呑みにせず、到達許容2.5°や箱の高さなど確定済みの幾何と照合する。","detail":"","key":false,"src":"DAY221"},{"id":"r379","category":"learning","sub":"VLMの使い方と推論の実行","type":"qa","front":"オーケストレーション型エージェントとVLAはどう役割が違う？","back":"エージェント型は知覚・記憶・道具とやり取りし、どのスキルを呼ぶかを秒単位で判断する（自分では物理動作をしない）。VLAはカメラ画素からミリ秒単位で連続動作を生成する。掴む精度や動的バランスはVLA、運ぶ・人との協調・曖昧な指示の理解はエージェント型が得意で、境界はレイテンシ（応答の遅れ）にある。","detail":"","key":false,"src":"DAY249"},{"id":"r380","category":"learning","sub":"VLMの使い方と推論の実行","type":"qa","front":"π0.7 がプロンプトに「how（どうするか）」の注釈を足したのは何のためか？","back":"多様なデータをただ混ぜても性能が上がらなかったため。速度・品質・制御方式（関節制御か手先制御か）・視覚的サブゴール画像を注釈し、出来の悪い自律データも「低品質」とラベルして訓練に再利用できるようにした。向こうにとって how はデータをスケールさせる道具で、Motion UX では体験を設計する主題として扱う。","detail":"","key":false,"src":"DAY219"},{"id":"r381","category":"learning","sub":"VLMの使い方と推論の実行","type":"qa","front":"人の手の一人称動画は、運動の層と判断の層のどちらに入れるべきか？","back":"判断の層（System 2）。人の手とグリッパは見た目も自由度も違い、その差を埋めるには大規模ロボットデータで事前学習した土台モデルが要る。土台を持たない個人は、動画から手の3D軌道ではなく「どの順番でどう判断したか」をサブゴール系列として抜き出す使い方なら効く。","detail":"","key":false,"src":"DAY219"},{"id":"r382","category":"learning","sub":"VLMの使い方と推論の実行","type":"qa","front":"LeRobot が推論を Policy Server と Robot Client に分けるのはなぜか？どうやってロボットを止めずに動かすか？","back":"方策推論は重くて遅く、制御ループは高頻度・低ジッタ（揺らぎ）で回す必要があるため、同居させると推論のたびに制御がつっかえる。方策が複数ステップ分の動き（アクションチャンク）を予測し、ロボットがそれを実行している間に次を計算する非同期推論で待ち時間を消す。手元の動作が残り少なくなったら次を頼み、ほぼ同じ観測は捨てる。2台に分けるなら Wi-Fi のジッタを避けて有線LANで結ぶ。","detail":"","key":false,"src":"DAY277・研究メモ:Robot Learning Tutorial（LeRobot入門書）"},{"id":"r383","category":"learning","sub":"VLMの使い方と推論の実行","type":"qa","front":"往復に約0.4秒かかっても、VLAで動くロボットが止まりにくいのはなぜ？","back":"π0.5は1回の計算で数ステップ分の動きをまとめて返すので、ロボットは返ってきた動きを順に実行しながら次の計算を頼めるから。どこまでの往復時間なら止まらずに済むかは、1ステップの長さと、何ステップ実行してから次を頼むかで決まる（30コマ毎秒なら制御周期は33ミリ秒）。","detail":"","key":false,"src":"DAY326・研究メモ:Robot Learning Tutorial（LeRobot入門書）"},{"id":"r384","category":"learning","sub":"VLMの使い方と推論の実行","type":"point","front":"必要なGPUはモデルのVRAMでほぼ決まる。Pi0（30億パラメータ）は推論時に約14GB、SmolVLAは約2GB。データセンターGPUが要るのは学習側で、推論は消費者向けハイエンド1枚で成立する。","back":"","detail":"","key":false,"src":"DAY277"},{"id":"r385","category":"learning","sub":"VLMの使い方と推論の実行","type":"qa","front":"π0.5の最初の推論で、クライアントが「keepalive ping timeout」で切断したのはなぜ？","back":"π0.5はJAXで動き、最初の1回だけGPU向けのコンパイルが走る。サーバーは計算中に通信処理を止めるので、クライアントのwebsocketsが20秒ごとに送る生存確認（ping）に返事ができず切断された。実機ではタイムアウトを延ばすか、起動直後に1回空回ししてコンパイルを済ませる。","detail":"","key":false,"src":"DAY326"},{"id":"r386","category":"learning","sub":"VLMの使い方と推論の実行","type":"qa","front":"動作の継ぎ目を、複数の予測を平均して均すとなぜ失敗するのか？","back":"有効な動きの平均は有効な動きとは限らない（障害物を上から避ける軌道と下から避ける軌道の平均は障害物に突っ込む）。論文では激しく振動して保護停止した。解決策は、実行が確定した部分を固定し、続きをそれと整合するように生成し直す方法で、推論遅延にも頑健だった。","detail":"","key":false,"src":"DAY223"},{"id":"r273","category":"eval","sub":"ループと評価の考え方","type":"point","front":"「データを取る」と「ループが回る」は別物。フィードバックとは結果が次の動作を変えること。プロセスのログではなく、タスクの結果（物がどこに置かれたか）を測る。","back":"関節角ログは「指令どおり動いたか」の記録でタスク結果ではなく、次の動作の変え方が出てこない。そこで、置いた後の目標位置をiPhoneで真上から撮って判定する設計にした。","detail":"","key":true,"src":"DAY125"},{"id":"r274","category":"eval","sub":"ループと評価の考え方","type":"point","front":"指令した関節角と実測の関節角は一致しない。PICK姿勢でJ2が約12°、J3が約9.5°ずれた。当初（DAY125）はサーボ内部の制御で指令角に収束すると見ていたが、DAY132の実測で崩れた。","back":"記事では重力・慣性・摩擦・応答遅れの積み重ねと見ている。他はJ1 4.31°、J4 7.9°、J5 6.59°、J6 2.2°。","detail":"","key":false,"src":"DAY125・DAY132"},{"id":"r275","category":"eval","sub":"ループと評価の考え方","type":"qa","front":"「生成と評価を分ける」考え方は、R2R2Rにどう当てはまる？","back":"生成器＝Unityで軌道を作る、評価器＝実機で実行して計測する、フィードバック＝実世界との誤差、再生成＝軌道の補正。作る側と評価する側が同じだと品質の天井を超えられない。mechArmには力センサーがなく評価器が欠けてループが閉じていなかったので、VLM-as-Rewardで埋めた。","detail":"","key":false,"src":"DAY128・DAY140"},{"id":"r276","category":"eval","sub":"ループと評価の考え方","type":"point","front":"失敗から学ぶループは①失敗を検知②原因を推定③次の一手を立て直す④実行して①へ、の4つで回る。人が肩代わりする判断は、即時判定・原因の切り分け・構造的な手当ての3層。","back":"","detail":"","key":false,"src":"DAY225"},{"id":"r277","category":"eval","sub":"ループと評価の考え方","type":"point","front":"ループの良さは介入回数では測らない。指標は「同じ失敗を繰り返さないか」「試行を重ねるごとに良くなるか」。全自律でも同じ失敗を繰り返すなら悪いループ、人が補助しても良くなるなら良いループ。","back":"","detail":"","key":true,"src":"DAY225"},{"id":"r278","category":"eval","sub":"ループと評価の考え方","type":"point","front":"各モジュールの入力と出力をログに残せば、デモを動かすたびに（入力, 正解出力）のペアが貯まり、将来のEnd-to-End学習（入力から出力まで1つのモデルで学ぶ）のデータになる。","back":"","detail":"","key":false,"src":"DAY143"},{"id":"r279","category":"eval","sub":"成否判定（VLM-as-Reward）","type":"term","front":"VLM-as-Reward","back":"VLM（画像を理解する言語モデル）に結果画像を見せて「タスクは成功したか」を判定させ、報酬の代わりに使う手法。専用の報酬モデルを学習せず、iPhoneで撮影→APIで成否判定→次の試行へ、という閉ループがGPU追加なしで組める。","detail":"","key":true,"src":"DAY140・DAY142"},{"id":"r280","category":"eval","sub":"成否判定（VLM-as-Reward）","type":"qa","front":"VLM判定の出力を、True/FalseではなくJSON（result・reason）にしたのはなぜ？","back":"True/Falseだと、ログに成功・失敗の理由が残らない。reasonを1文で返させれば理由が記録され、ログの意味が変わる。応答の前後に余計な文が付くことがあるので、JSON部分だけ抜き出して解析する。","detail":"","key":false,"src":"DAY142"},{"id":"r281","category":"eval","sub":"成否判定（VLM-as-Reward）","type":"qa","front":"VLMのPICK判定が全部yesなのに、爪に引っかかって浮いただけの試行があった。なぜ見分けられなかった？","back":"プロンプトが「リフト後にブロックが床から浮いているか」しか問うていなかったから。一方、爪先とブロックの距離は掴めた試行6〜11mm・引っかかった試行18〜25mmときれいに分かれていた。問い方が区別したいものを区別できる形かを確かめ、判定対象は具体的に書く。","detail":"","key":false,"src":"DAY142・DAY279"},{"id":"r282","category":"eval","sub":"成否判定（VLM-as-Reward）","type":"qa","front":"VLMが正しく「掴めた」と判定したのに、グリッパーを開いてブロックを落とした原因は？","back":"爪先とブロックの距離が362.8mmという物理的にありえない破綻値になり、上書き判定が正しいyesをnoに倒した。壊れた物差しが正しい判定を握り潰す構造。直し方は3分岐（30mm以下はVLMを信じる／30〜150mmはno／150mm超は測定破綻として上書き無効）。","detail":"","key":false,"src":"DAY273"},{"id":"r283","category":"eval","sub":"成否判定（VLM-as-Reward）","type":"point","front":"画像判定AIは写っていること（指先の間に赤ブロックがあるか）はほぼ0%か100%で答え分けたが、写っていないこと（真上から見て床から持ち上がったか）は聞き方を変えても判定できなかった。モデルの性能ではなく入力の情報不足。","back":"横カメラで撮れば写る。","detail":"","key":false,"src":"DAY325"},{"id":"r284","category":"eval","sub":"成否判定（VLM-as-Reward）","type":"point","front":"実機640試行の失敗のうち、画像で見分けるべき失敗（見る・掴む・置く）は約4割。残り6割は関節が目標に届かない・安全チェックで停止・判定AIの呼び出しエラーで、画像判定では解決しない。","back":"","detail":"","key":false,"src":"DAY325"},{"id":"r285","category":"eval","sub":"成否判定（VLM-as-Reward）","type":"qa","front":"掴めたかどうかを、どのタイミングでどう測ることにした？","back":"グリッパーを閉じる直前に上カメラ1枚から爪先（青シール2点の中点）とブロック中心の距離をmmで測る。閉じた直後にその場で1枚撮り、VLMに爪にブロックが挟まっているかを判定させる。持ち上げてからではなく、掴んだ瞬間に撮る。","detail":"","key":false,"src":"DAY246"},{"id":"r286","category":"eval","sub":"成否判定（VLM-as-Reward）","type":"point","front":"探索は内蔵、記録は固定。再計画はエージェント本体の視覚で安く回し、各試行の最終成否だけは固定プロンプトの判定器で構造化して台帳に残す（判定モデルとプロンプトの版も記録）。","back":"","detail":"","key":false,"src":"DAY249"},{"id":"r287","category":"eval","sub":"成否判定（VLM-as-Reward）","type":"qa","front":"報酬分類器とVLMによる成否判定の関係は？模倣学習から始めるなら、VLM判定はどこで使う？","back":"両者は同じ位置にあり、違いは自分のデータで学習させた小さなモデルにするか、外部のVLMに聞くかだけ。模倣学習から始めるならVLM判定は学習には使わず、何回試して何回成功したかを数える評価の側で使う。","detail":"","key":false,"src":"研究メモ:Robot Learning Tutorial（LeRobot入門書）"},{"id":"r288","category":"eval","sub":"成否判定（VLM-as-Reward）","type":"term","front":"TOPReward","back":"学習済みの動画VLMから、追加学習なしで作業の進み具合を推定する報酬の手法。SO-100/101を含む130以上の実タスクで高い相関があり、成功判定やデータ選別にも使える。VLM-as-Rewardと同じ方向。","detail":"","key":false,"src":"研究メモ:Physical AIが学習できる環境の調査"},{"id":"r289","category":"eval","sub":"台帳と記録の設計","type":"point","front":"成否だけを記録しても改善の打ち手は見えない。Pick失敗とPlace失敗は原因が違うので、失敗したステップ（fail_step）を記録する。ログは記録ではなく設計の素材。","back":"失敗はPICK直後・移動中・PLACE直後の3つのタイミングで見る。コードでは全体を1つのtry/exceptで包まず、今いるフェーズを変数で追って失敗時に返す。","detail":"","key":false,"src":"DAY125・DAY130"},{"id":"r290","category":"eval","sub":"台帳と記録の設計","type":"point","front":"台帳は1試行1行で、成否をVLMの判定・座標の幾何距離・写真のパスの3通りで記録する。食い違いを後から拾え、「掴めたが置けなかった」のような中身も消えずに残る。","back":"","detail":"","key":false,"src":"DAY241"},{"id":"r291","category":"eval","sub":"台帳と記録の設計","type":"point","front":"完走と成功は別で、成否の二値の手前の連続量を測る。掴めても爪先とブロックは3.9〜17mm離れていた。yesに潰すと別の成功が同じ行に並ぶ。","back":"掴み判定（VLM）、掴む直前の爪先〜ブロック距離、PICK前後のブロック座標の三方向が揃うと、完走した試行の中の掴み失敗が見える。","detail":"","key":false,"src":"DAY243・DAY246"},{"id":"r292","category":"eval","sub":"台帳と記録の設計","type":"term","front":"pose_id","back":"姿勢に振る背番号。live（実機が読む採用姿勢JSON＝入力）、twin（FKテーブル＝姿勢から爪先位置への変換器）、real（台帳＝試行結果の出力）を同じ姿勢として突き合わせる鍵。ツインの予測と実機の実測のずれを測る前提になる。FKテーブルの行番号だけを永続IDにしない。再生成・マージ・ソートで同じ番号が別の姿勢を指しうるので、テーブルの版かハッシュとセットにする。","detail":"","key":false,"src":"DAY255・DAY258"},{"id":"r293","category":"eval","sub":"台帳と記録の設計","type":"qa","front":"台帳のpick欄が空欄のままだと何が困り、どう直した？","back":"届かなかった・届いたが掴めなかった・掴んだが持ち上げで落とした、がすべて同じ「空」に潰れる。実機を動かす前に台帳ルール（data_manifest_rules.md）を新設し、試行結果を段階の状態語（pick_stage）で持ち、到達・グリップ指令・持ち上げ後の保持・中断理由などの根拠フラグを別列にする設計を決めた。列を足すときは旧台帳を退避して作り直す。","detail":"","key":false,"src":"DAY258"},{"id":"r294","category":"eval","sub":"台帳と記録の設計","type":"qa","front":"状態語「grasped（掴んだが落とした）」を保留にしたのはなぜ？","back":"持ち上げ後の画像でしか保持を見ておらず、掴んだ直後の確認がないため「そもそも掴めなかった」と「掴んで落とした」を切り分けられない。判定手段のない状態語は作らず、当面は reached＋held_after_lift=false で表す。","detail":"","key":false,"src":"DAY258"},{"id":"r295","category":"eval","sub":"台帳と記録の設計","type":"point","front":"台帳の追記処理はヘッダが列定義と一致しないと止める。列を足すときは運用中の台帳に直接足さず、旧版をarchiveへ退避し、同じファイル名で新ヘッダの空台帳を作り直す（台帳は1本）。","back":"","detail":"","key":false,"src":"DAY258"},{"id":"r296","category":"eval","sub":"台帳と記録の設計","type":"qa","front":"置きズレΔは、いつ撮った画像で測るべき？","back":"PLACE姿勢に到達し爪を開く前、ブロックを保持したまま撮る。離して退避した後に測ると、置いたズレに縁で転がったズレが混ざり、補正の教師データが濁る。","detail":"","key":false,"src":"DAY263"},{"id":"r297","category":"eval","sub":"台帳と記録の設計","type":"qa","front":"補正記憶マップを作る前に、台帳から何が分かった？","back":"291試行で73セル中48セルは1回しか訪問されておらず、残差は改善中・横ばい・振動（60→241→24mm）がセルごとに混在していた。だから収束より先に訪問密度を見せ、再訪すべきセルを選んでから走らせる順にした。","detail":"","key":false,"src":"DAY270"},{"id":"r298","category":"eval","sub":"台帳と記録の設計","type":"qa","front":"関節指令のタイムスタンプは、どこで取らないと映像と突き合わせられない？","back":"送角関数が到達確認を終えて戻った後に取ると全行が数秒遅れる。実送信の直前（ts_send）と、許容内到達を最初に確認した瞬間（ts_arrival）を送信ごとに分けて記録する。その差5.24秒に、アームが86度動く実時間が残った。","detail":"","key":false,"src":"DAY287"},{"id":"r299","category":"eval","sub":"測り方・検証の落とし穴","type":"point","front":"採点基準を採点される側から作らない。同じ対応点から推定した変換でその対応点を評価すると、互いに整合するかは測れても、同じ物理点かは保証できない。","back":"","detail":"","key":true,"src":"DAY309"},{"id":"r300","category":"eval","sub":"測り方・検証の落とし穴","type":"qa","front":"4点ホモグラフィの校正誤差が0.00mmと出た。精度は確認できたと言える？","back":"言えない。4点の対応はホモグラフィが数学的に完全に一致させるので、誤差0は当然。本当の精度は、校正に使っていない別の点（マット格子の交点など）で測る。","detail":"","key":false,"src":"DAY164"},{"id":"r301","category":"eval","sub":"測り方・検証の落とし穴","type":"qa","front":"lookupテーブルを実機で動かす前に、どう検証した？","back":"マットの9点（4隅・4辺の中点・中心）で試し引きし、最近傍との距離を見た。10mm以内は1点だけで7点は30mm以上離れ、左下のカバー不足が分かった。起点姿勢から各軸±16°を4°刻みで追加スキャンし、サブミリの候補が取れた。","detail":"","key":false,"src":"DAY154"},{"id":"r302","category":"eval","sub":"測り方・検証の落とし穴","type":"point","front":"失敗はどの段で止まったかを切り分ける：画素検出→座標変換→PICK lookup→PLACE lookup。白箱は画素で検出できても、lookupテーブルの範囲外（188.6mm）でアームは動けなかった。","back":"","detail":"","key":false,"src":"DAY165"},{"id":"r303","category":"eval","sub":"測り方・検証の落とし穴","type":"qa","front":"送信間隔を変えて追従率を測る実験が失敗したのはなぜ？","back":"計測用のget_anglesが送信と同じシリアル線を使い、呼ぶたびに制御ループへ100〜700msの空白を生んだ。計測がHOME目標時に偏り、異常値も混ざった。測る行為が測定対象を変えていた。is_moving()で1回の動作完了時間を測る設計に変えた。","detail":"","key":false,"src":"DAY183"},{"id":"r304","category":"eval","sub":"測り方・検証の落とし穴","type":"point","front":"1回の検出は信頼できない。同じ姿勢・同じ指令でも横カメラのy変化が3/11/13pxとばらついた。検出を3回平均し、range（最大−最小）もログに残してばらつく試行を後から見分ける。","back":"","detail":"","key":false,"src":"DAY204"},{"id":"r305","category":"eval","sub":"測り方・検証の落とし穴","type":"point","front":"静止判定の閾値は検出ノイズに対するマージンで決める。TIP検出のばらつき約0.08mmに対し閾値1.0mm（約12倍）とし、運用で2.0mmに緩めた。","back":"","detail":"","key":false,"src":"DAY185"},{"id":"r306","category":"eval","sub":"測り方・検証の落とし穴","type":"qa","front":"横カメラの「箱に置けたか」判定は何を見るべきで、どんな性質のセンサーだった？","back":"見るのは爪の底面と白箱の上縁の隙間（接触の有無）の二値。横カメラは奥行きが見えないので位置判定は上カメラに任せる。424枚からランダム抽出で検証すると、no（接触・深すぎ）は信頼でき、yesには見逃しがある非対称なセンサーだった。4枚だけのテストでは偏りに気づけなかった。","detail":"","key":false,"src":"DAY279"},{"id":"r307","category":"eval","sub":"測り方・検証の落とし穴","type":"point","front":"診断は本線と同一条件で行う。プローブは目標高さを渡して測っていたが、本線は高さ記憶0のときNoneになり処理が丸ごと飛ぶ経路が残っていた。外からフィルタを再現するときも実装と同じ条件で数える。","back":"","detail":"","key":false,"src":"DAY279・DAY281"},{"id":"r308","category":"eval","sub":"測り方・検証の落とし穴","type":"qa","front":"テストが全部緑なのに、何も検証していなかった2つの例は？","back":"①既存本線と新本線の一致を見るテストが、既存のrun()を一度も走らせず手書きの期待値と比べていた。実際に走らせて呼び出し列を突き合わせると写し違いが3件出た。②「closeが0回」の検査が、RELEASE自体が呼ばれず履歴が空のまま通っていた。openがちょうど1回という正の値でassertする。","detail":"","key":true,"src":"DAY289・DAY293"},{"id":"r309","category":"eval","sub":"測り方・検証の落とし穴","type":"qa","front":"関数名のimport漏れ（NameError）は、なぜ静的レビューもpy_compileも通り抜けた？","back":"NameError（未定義の名前を呼ぶエラー）は実行時にしか出ず、コンパイルは名前が実行時に存在するかまで検査しない。レビューも符号・上限・ガードは見たが、呼ぶ関数が実在するかは追わなかった。レビュー項目に「呼んでいる関数のdefをgrepで確認」を足す。","detail":"","key":false,"src":"DAY273"},{"id":"r310","category":"eval","sub":"測り方・検証の落とし穴","type":"point","front":"検証項目に宛先（外部レビュー向け）を書かないと実装者の自己申告になり、同じ盲点を通す。「修正済み」の報告はgrepで確かめ、定義元はファイル名の当て推量ではなくimport元をgrepして確定する。","back":"","detail":"","key":false,"src":"DAY293・DAY297"},{"id":"r311","category":"eval","sub":"データ管理と観測","type":"point","front":"同じFKテーブルを複数か所に置くなら、更新のたびにmd5で一致を確かめる。片側だけ古いとlookupがずれる。ファイル名は1つに固定して中身だけ入れ替え、点数のような変わる値は文書に書かず実測する。","back":"前例はDAY170の97mm乖離と、同名のv2がMacとUnityで別々に育ち14万点の差が出た事故。旧テーブルは消さずarchiveに退避し、そこから中身を戻せばロールバックできる。","detail":"","key":false,"src":"DAY222・DAY252・DAY265・arm_kinematics"},{"id":"r312","category":"eval","sub":"データ管理と観測","type":"qa","front":"FKスキャンのCSVと、同じ関節角でUnityを測った値が約97mmずれた原因は？","back":"Mac側に、爪先基準へ改修する前の旧CSVが残り、Unity側だけ更新されていた。4つの仮説を測って順に否定し、ファイル日時と行数の比較で特定した。新CSVをコピーすると最近傍距離は71.10mm→0.30mmになった。","detail":"","key":false,"src":"DAY170"},{"id":"r313","category":"eval","sub":"データ管理と観測","type":"point","front":"コードはgitで管理し、学習データや生成物は外付けSSDに置いてgit管理しない。書き込む前に必ずマウントを確認し、未接続なら何も作らず止める（macOSでは未マウント時に同名フォルダが内蔵に作られ得る）。","back":"","detail":"","key":false,"src":"DAY234・DAY243"},{"id":"r314","category":"eval","sub":"データ管理と観測","type":"qa","front":"テレメトリ（運転中の状態観測）を、daemonではなく制御ループ自身から出したのはなぜ？","back":"daemonは1本の接続を切断までつかむ逐次処理で、制御中は2本目の観測クライアントを受け付けない。さらにdaemonが返せるのは6関節角だけで、工程・グリッパー状態・試行の文脈は制御ループの中にしか無い。","detail":"","key":false,"src":"DAY240"},{"id":"r315","category":"eval","sub":"データ管理と観測","type":"point","front":"観測は制御を止めない：送信側はUDPで投げて忘れ、例外を全部握り、非ブロッキングにする。中継は最新の1個だけ配る。供給・中継・表示を分ければ、機体を替えても表示側は変わらない。","back":"経過秒はブラウザのローカル時計で刻むと、データが来ない間も増え続け、工程での詰まりが見える。","detail":"","key":false,"src":"DAY240"},{"id":"r316","category":"eval","sub":"データ管理と観測","type":"point","front":"制御スクリプトを「フェーズ（横軸）×コンポーネント（縦軸）」のタイムラインで可視化すると、どこが失敗しどこが未到達かが一目で分かる。関係しそうな関節だけでなく全関節を並べて初めて構造が見える。","back":"HTMLを唯一の正とし、AIに渡すJSONはそこから生成して乖離を防ぐ。","detail":"","key":false,"src":"DAY203"},{"id":"r317","category":"eval","sub":"試行回数と再現性","type":"term","front":"「再現可能な環境」の判定3条件","back":"①手順が公開されている（GitHub／記事）②依存関係とバージョンが記載されている③自分以外の環境で再現された記録が1件以上ある、または再現に必要な情報が欠けていないことを第三者が確認できる。③を満たさないものは「構築中」で数に入れない。","detail":"","key":true,"src":"DAY276"},{"id":"r318","category":"eval","sub":"試行回数と再現性","type":"qa","front":"30回の試行で出した成功率の差は、どこまで信じてよい？","back":"成功率50%前後で30回だと、偶然のぶれだけで上下に約18ポイント動く（95%の範囲）。10ポイント程度の差は手法の差か偶然か区別できない。約360回まとめれば約±5ポイントまで縮む。試行が少ないうちは細かい順位を当てにしない。","detail":"","key":true,"src":"DAY323・研究メモ:ArmnetBench（SO-101並列実機評価）"},{"id":"r319","category":"eval","sub":"試行回数と再現性","type":"qa","front":"ArmnetBench v0.1の反省から、自分の評価で最初から入れるべき決まりは？","back":"物の初期位置を記録する、1試行の制限時間を決める、カメラ位置を毎回確認する、照明をそろえる。v0.1はこれらが無く、作業台3番では1手法を除く全手法で正面カメラがずれて手法間の条件が違っていた。（ArmnetBench：SO-101の作業台を並べ、7手法を同じ実演50本で学習させ、タスク×手法ごとに30回ずつ3段階で実機評価した研究）","detail":"","key":false,"src":"DAY323・研究メモ:ArmnetBench（SO-101並列実機評価）"},{"id":"r320","category":"eval","sub":"試行回数と再現性","type":"term","front":"再現性の3段階（ArmnetBench）","back":"実行の再現（同じコンテナとチェックポイントで同じ動作）は強い、同じ作業台内の場面の一貫性は中程度、別の作業台での物理的な再現は未検証。自分以外の環境での再現がいちばん難しい。","detail":"","key":false,"src":"研究メモ:ArmnetBench（SO-101並列実機評価）"},{"id":"r321","category":"eval","sub":"試行回数と再現性","type":"qa","front":"ArmnetBenchの公開データは、VLM-as-Rewardの検証にどう使える？","back":"人が採点した3,118本のSO-101映像と成功／失敗ラベルがある。VLMに同じ映像を判定させ、人の採点と何%一致するかを測れば、報酬モデル方式の精度を実機なしで確かめられる。","detail":"","key":false,"src":"研究メモ:ArmnetBench（SO-101並列実機評価）"},{"id":"r322","category":"eval","sub":"試行回数と再現性","type":"qa","front":"Phone2Actの「実機で90%成功」はどう読むべき？","back":"1タスク・10回だけの結果（10回中9回）で、リーダーアーム方式などとの比較はない。データはDobot CR5で130回分、GR00T N1.5を追加学習。遅延は350〜440ミリ秒（平均395ミリ秒）で、ゆっくり動かす作業向け。","detail":"","key":false,"src":"研究メモ:Phone2Act（スマホ遠隔操作）"},{"id":"r323","category":"eval","sub":"試行回数と再現性","type":"qa","front":"R2R2Rの「デモ1本で遠隔操作150本に匹敵」という見出しはどう読む？","back":"同じ本数なら人のデータのほうがずっと良く、生成データは1,000本まで増やしてようやく追いつく。付録の検定では「同等」と言えるタスクは1つもなく、「同等とは言い切れないが、どちらかが明確に勝つ証拠もない」が正確。","detail":"","key":false,"src":"研究メモ:R2R2R（実演動画1本から学習データ生成）"},{"id":"r001","category":"principles","sub":"基本原則","type":"point","front":"精度より体験の成立を優先する（P001）。精度はあとから予算で解決でき、反復改善のほうが最初からの完璧主義より早く目的地に着く。","back":"ただしそう言えるのは、精度の輪郭（何が物理的に可能か、どれだけずれるか）を測って把握しているときだけ。輪郭を知らない体験優先はただの逃げになる。","detail":"","key":true,"src":"principles・DAY212"},{"id":"r002","category":"principles","sub":"基本原則","type":"qa","front":"なぜ進捗報告で「lookup の検索が成功した」と「実機アームの動作が検証された」を分けて書くのか（P002）？","back":"両者は別レイヤーで、自由文でまとめると読み手が誤解する（「lookup成功」は「掴める姿勢」ではない）。レイヤーごとに ✅/❌/❓ と最終確認日を明示する。引き継がれた結論も裏取りせずに使わない。","detail":"","key":false,"src":"principles・DAY168・DAY169"},{"id":"r003","category":"principles","sub":"基本原則","type":"point","front":"実機で試す前にシミュレーションで検証する（P003）。実機の試行錯誤は時間もコストも高いので、シミュで検出できない問題だけを実機検証の対象にする。","back":"","detail":"","key":false,"src":"principles"},{"id":"r004","category":"principles","sub":"基本原則","type":"point","front":"同じ指示がいら立ちとともに繰り返されたら、AI がループしているサイン（P005）。局所的な修正をやめ、根本的に異なるアプローチに切り替える。","back":"","detail":"","key":false,"src":"principles"},{"id":"r005","category":"principles","sub":"基本原則","type":"point","front":"失敗は記録ではなく設計材料として扱う（P007）。どのステップで、なぜ失敗したかを構造化して残すと、次の設計判断の材料になる。","back":"","detail":"","key":false,"src":"principles"},{"id":"r006","category":"principles","sub":"基本原則","type":"point","front":"測る手段を持つことが推論より先（P008）。ログや引き継ぎの数値を推論でつなぐ前に、自分で測り直せる道具（例：任意姿勢の爪先位置を読む TipBrepReader）を作る。","back":"既存関数を流用できるかも、修正せずに呼んで戻り値を数字で記録して判定する。目視で分かっていても確証は数字で残す。","detail":"","key":true,"src":"DAY169・DAY170・DAY196"},{"id":"r007","category":"principles","sub":"基本原則","type":"point","front":"検証の数値と実機での成立は別レイヤー（P009）。ループの「CONVERGED（収束）」表示が出ても、実際の最終位置は最大52mmずれていた。","back":"lookup距離0.1mmでも、マットとロボットが固定という変換の前提が現実と違えば実機は8cmずれる。マットもカメラも動く前提で座標系を作る。","detail":"","key":true,"src":"DAY160・DAY184"},{"id":"r008","category":"principles","sub":"測ってから直す","type":"qa","front":"手首の関節が指令に届かない原因を4つ仮説立てし、単軸テストで測ったら何が分かったか？","back":"4つ（特定角度域・速度/トルク不足・一発送信の限界・荷重）のどれでもなかった。深い側へは-95°まで誤差1°台で届くのに、浅い側（0へ戻る方向）は-61°付近で頭打ちになる「方向の壁」だった。測らなければ4つのどれかを選んで直したつもりになっていた。","detail":"","key":false,"src":"DAY238"},{"id":"r009","category":"principles","sub":"測ってから直す","type":"qa","front":"「同じ接続を使い続けると送信が通らない」という見立てが外れたのはなぜか？","back":"直叩きとdaemon経由で同じ目標姿勢を送っている保証がなく、変数を1つに揃えていなかった。送る角度を固定し、送信条件だけを変えて測り直すと、動くかどうかを決めていたのは接続ではなく肩の目標角（110°）だった。推測で直さず、条件を1つだけ変えて測る。","detail":"","key":false,"src":"DAY215・DAY216"},{"id":"r010","category":"principles","sub":"測ってから直す","type":"qa","front":"HOME定数を誤って書き換えてしまったのはなぜか？","back":"前のテストの後始末で送ったHOME復帰が遅れて実行され、その途中の値を「今の静止姿勢」と取り違えた。目視ではHOMEに見えても、測定値の時間的な意味を確かめずに推論した。","detail":"","key":false,"src":"DAY210"},{"id":"r011","category":"principles","sub":"測ってから直す","type":"point","front":"AIが推測でなく測定で判断できる粒度に切る。739行の一体型スクリプトは4回直しても原因に届かなかったが、検証する挙動が1つだけの単体スクリプト（50〜200行）に分解すると原因を測定で特定できた。","back":"daemon・送信・カメラは正常で、誤検出の原因はテンプレートの劣化だった。","detail":"","key":false,"src":"DAY211"},{"id":"r012","category":"principles","sub":"測ってから直す","type":"point","front":"点が薄いことと届かないことは違う。未充填の領域を「構造的に届かない」と即断せず、関節を実際に振ってスキャンし、数で確かめてから言う。","back":"","detail":"","key":false,"src":"DAY253"},{"id":"r013","category":"principles","sub":"測ってから直す","type":"point","front":"予測を立てる前に、測り方そのものが持つ誤差（基準線）を測る。撮影を挟まず設計画像を同じ処理に通して基準線を出していれば、面積が傾きに鈍感なことは事前に読めた。","back":"","detail":"","key":false,"src":"DAY310"},{"id":"r014","category":"principles","sub":"測ってから直す","type":"point","front":"どのファイルが読まれているかは、更新日時・コメント・ドキュメントではなく、コードが開くファイル名を直接見て確定する。読まれていないファイルをいくら拡充しても実機は1mmも変わらない。","back":"","detail":"","key":false,"src":"DAY252・DAY256"},{"id":"r015","category":"principles","sub":"測ってから直す","type":"qa","front":"動的追従の制御周期を上げたいとき、なぜ先に時間分解を実測するのか？","back":"律速はカメラ遅延と送角往復だと見ているが、推測で有線カメラ化や非同期化に走らないため（P008）。フレーム取得・検出・送角〜応答・到達確認を区間ごとに刻み、律速区間を数字で特定してから対策する。","detail":"","key":false,"src":"dynamic_tracking_v2_design"},{"id":"r016","category":"principles","sub":"測ってから直す","type":"point","front":"補正で逃げ続けて行き詰まったら、過去のテーブル・定数・オフセットを判断根拠から外し、座標系の確定→実測→検出→変換の順に土台から積み直す。","back":"無いものは補正できない。症状を補正する前に、選び方の問題かデータの欠損かを数えられる形で測る。","detail":"","key":false,"src":"DAY162・DAY164・DAY265"},{"id":"r017","category":"principles","sub":"測ってから直す","type":"point","front":"閾値を追いかけない。DIST_MAX を0.030→0.035→0.045と三度上げても少し先の縁で止まった。真因は補正記憶の1セルが-29mmへ巻き上がったことで、腐ったセルのリセットと1回の更新上限（40→15mm）で上流を直した。","back":"","detail":"","key":false,"src":"DAY280"},{"id":"r018","category":"principles","sub":"測ってから直す","type":"point","front":"回帰したら、新機能を足すより元に戻すのが最小の一手。FKテーブルを拡充前（1,003,992点）へロールバックしたらPICKが復活した。原因の取り違えを正したのはログ分析ではなく実機の画像と挙動だった。","back":"","detail":"","key":false,"src":"DAY275"},{"id":"r019","category":"principles","sub":"目的に合わせた検証","type":"qa","front":"把持判定のZ閾値を8mmから12mmに緩めたのが、なぜ正解だったのか？","back":"視覚サーボの収束精度は今のホモグラフィ（画像→平面の座標変換）と検出で約±10mmが限界で、把持に必要な精度もグリッパー開口と30mm角ブロックから中心±10mmと同じオーダーだった。8mmはシステムの実力より厳しすぎた。閾値を物理現実に合わせるのは精度を諦めることではない。","detail":"","key":false,"src":"DAY208"},{"id":"r020","category":"principles","sub":"目的に合わせた検証","type":"point","front":"2.5°以内の到達を待つ関門をやめ、だいたいの位置で離して箱に入ったかを y/n で記録したら、データは0件から9件になった。目的は関節角が届くことではなく箱に入ること。","back":"","detail":"","key":false,"src":"DAY220"},{"id":"r021","category":"principles","sub":"目的に合わせた検証","type":"point","front":"最後の一手が成立しなければ、それまでが完璧でも価値はゼロ。設計が引き受けるべきは平均的な精度ではなく、最後の一手が成立する確率。","back":"","detail":"","key":false,"src":"DAY237"},{"id":"r022","category":"principles","sub":"目的に合わせた検証","type":"qa","front":"関節角からアームの骨格を描くビューを作ったのに、ダッシュボードから消したのはなぜか？","back":"運用の判断（止めるか、直近の変更が効いたか、同じ失敗の反復か）を何も変えなかったから。監視画面の規律は「判断を変えるものだけ見せる」。判断に効いたのは赤ブロックと白箱の座標そのものだった。","detail":"","key":false,"src":"DAY241"},{"id":"r023","category":"principles","sub":"構造の分け方","type":"qa","front":"動作を「意味・軌跡・実行」の3層に分けたのはなぜ？","back":"意味（カップを掴んで置くというタスク定義）と軌跡（関節角度のCSV）はハードに依存させず、実行（各機のSDKへの変換）だけをHAL（ハードウェア抽象化層）に閉じ込めるため。別のアームには実行層だけ差し替えればよく、CSVを差し替えるだけで比較実験も組める。送信前の安全チェックもHALの send_angles 内で必ず呼ぶ構造にした。","detail":"","key":false,"src":"DAY102・DAY108"},{"id":"r024","category":"principles","sub":"構造の分け方","type":"point","front":"座標変換は1箇所に集約する。MacとPiで二段に変換したら、二重にかかったり値が渡らなかったりした。","back":"シミュと実機の座標の向きのずれも、下流の変換で辻褄を合わせず、データ自体を揃えて直す。","detail":"","key":false,"src":"DAY144・DAY146・DAY156"},{"id":"r025","category":"principles","sub":"構造の分け方","type":"point","front":"空間を先に確定してから動きを乗せる。奥行き（Z軸）の判定（空間の確定）→動きの判定（時系列の変化）→CSV出力の順。スキャンで物の位置を先に持てば、奥行きを推定せずに動作を設計できる。","back":"","detail":"","key":false,"src":"DAY118"},{"id":"r026","category":"principles","sub":"構造の分け方","type":"point","front":"実機が土台で、デジタルツインはそこに合わせる。ツイン側の記録項目は実機が1試行で取れる36項目に同じ列・同じ並びで揃え、並べて初めて差分が測れる。","back":"","detail":"","key":false,"src":"DAY250"},{"id":"r027","category":"principles","sub":"構造の分け方","type":"qa","front":"19mmの誤差に対し、姿勢ごとに補正値を足す方式を最初に却下したのはなぜか？","back":"姿勢ごとに違う補正値は学習で求めるしかなく、大量シミュレーションや強化学習が難しい環境では採れないから。片側をずらすとURDF（機体の構造定義）・FKスキャン・lookup表・ホモグラフィが連動して崩れるので、差を一度測ってキャリブレーション定数として焼き込めるかを判断した。当時はUnityを正として実機を合わせる構造だったが、DAY250で「実機が土台、ツインが合わせる側」に改めた。","detail":"","key":false,"src":"DAY169・DAY250"},{"id":"r028","category":"principles","sub":"構造の分け方","type":"point","front":"Raspberry Pi は脳であって筋肉ではない。Linux はOSの割り込みがあり硬い実時間制御に構造的に向かないので、Pi は知覚・段取り・上位ロジックを担い、関節を回す層はマイコンとサーボに任せる。","back":"","detail":"","key":false,"src":"DAY260"},{"id":"r029","category":"principles","sub":"構造の分け方","type":"point","front":"ロバストなロボットは変動を消すのではなく一点に集める。照明とカメラは作業ブースに、決定論的な動きはルーチンに、最終位置合わせの残差は機械的な柔らかさ（コンプライアンス）に、推論周期はローカル筐体に寄せる。","back":"","detail":"","key":false,"src":"DAY277"},{"id":"r030","category":"principles","sub":"構造の分け方","type":"point","front":"動きの核を最小構成で実機に通してから、記録・安全・検証の層を必要な分だけ後ろに足す。全ブロックを積んでから実機に出したら、動きは前と変わらず、44列の台帳には意味のある中身が入らなかった。","back":"","detail":"","key":true,"src":"DAY294"},{"id":"r031","category":"principles","sub":"構造の分け方","type":"point","front":"単腕で動かないものは双腕でも動かない。双腕は単腕の問題が2倍ではなく2乗になる（同期制御・衝突回避・キャリブレーション・座標系の統一）ので、単腕の決着を先に付ける。","back":"双腕は左右同じ性能である必要はなく、精密に注ぐ腕とカップを支えるだけの腕のように役割で非対称に組める。","detail":"","key":false,"src":"DAY201・DAY205"},{"id":"r032","category":"principles","sub":"構造の分け方","type":"point","front":"新しいタスクはまず「動くものリスト」（実機で動いた実績のある資産の一覧）を見て、そこで組めるなら新規スクリプトを書かない。実機実績の無いものは資産ではない。","back":"","detail":"","key":false,"src":"DAY230"},{"id":"r033","category":"principles","sub":"構造の分け方","type":"point","front":"深度カメラは2Dの限界まで詰めてから導入する。成功率が頭打ち・物の大きさがばらつく・光環境に困る・高さの推定が必要、のどれかが買う合図。先に買うと何が解決したか見えなくなる。","back":"","detail":"","key":false,"src":"DAY166"},{"id":"r034","category":"principles","sub":"AIと安全の境界","type":"point","front":"設計者と実装者が同じ前提を共有すると同じ盲点を持つ。関節制御・姿勢系のように物理リスクがある変更は外部レビューを必ず挟む。","back":"codexのレビューで、目標値の消失・基準角の巻き戻り・失敗時も把持へ進む・クランプなし、の致命バグ4件が実機前に見つかった。","detail":"","key":false,"src":"DAY200"},{"id":"r035","category":"principles","sub":"AIと安全の境界","type":"qa","front":"安全制御（角度クランプ・ループ上限・時間上限）を外して何が分かったか？","back":"安全制御は問題を解決していたのではなく、暴走を途中で打ち切って見えなくしていた。外したのは動きの自動制限だけで、脱力コマンドや基準データ書き換えなど目視で防げない不可逆な操作の禁止は残した。見失ったときの復帰動作は「止める制限」ではなく「止まらないための動作」で、一緒に消したら22秒停止した。","detail":"","key":false,"src":"DAY248"},{"id":"r036","category":"principles","sub":"AIと安全の境界","type":"qa","front":"動作中のロボットにAIを入れるとき、AIにどこまで任せる？","back":"AIはテスト済みの動作関数（近づく・降ろす・掴む・持ち上げる・置く）から1つを選ぶだけにし、生の関節角指令や動きそのものは作らせない。その場でコードを書かせると毎回違うコードが動き、事前に確かめられない。関節角の安全はコード側のガードが確かめ、自信が低いときは「止まって人を呼ぶ」を選ぶ。選択肢は3〜4個と「その他」で始め、その他に落ちた例から増やす。","detail":"","key":true,"src":"DAY249・DAY325"},{"id":"r037","category":"principles","sub":"AIと安全の境界","type":"point","front":"安全層はAIから独立させる。AIは動きを提案するだけで、止めるかどうかは確実に動くと検証できる単純な仕組み（距離・関節角の上下限・指令途絶で停止）が最後に決める。考える層が賢くなってもこのガードは外さない。","back":"","detail":"","key":true,"src":"DAY316"},{"id":"r038","category":"principles","sub":"AIと安全の境界","type":"qa","front":"なぜ開発時（ビルドタイム）と稼働中（ランタイム）のコード生成を分けるのか？","back":"開発時にエージェントとコードを直し、人がレビューして反映するのは安全。稼働中にロボットが自分のコードを書き換えると、成功を幻覚しうる自己評価の上に誤ったコードが積み上がる。だから稼働中の自己改変は不可とした。","detail":"","key":false,"src":"DAY249"},{"id":"r039","category":"principles","sub":"AIと安全の境界","type":"point","front":"MicroFactory の構成では AI にロボットを直接リアルタイム制御させない。決まった動作はコード、ばらつきの大きい把持は π0.5、判断と復旧は Claude が担い、各工程の間に検証（Verify）を置く。","back":"","detail":"","key":false,"src":"研究メモ:Physical AIが学習できる環境の調査"},{"id":"r040","category":"principles","sub":"AIと安全の境界","type":"point","front":"安全確認をUIで簡単に飛ばせる設計は事故を招く（1984年ミシガンの死亡事故の一因とされる）。慣れた人ほど手順を省くので、危険な操作の前に自然と立ち止まらせる設計が要る。","back":"","detail":"","key":false,"src":"DAY135"},{"id":"r041","category":"principles","sub":"動きと体験の設計","type":"point","front":"動作体験には精度・速度・可動域で表せない設計要素がある：次の動きを予測できる間合い、急停止か滑らかに収束するかの終わり方、やり直せるか、ハードを選ばないか。","back":"ロボットアームのキャラクター性も動きで決まり、速度・止まるタイミング・減速・次の動きまでの間で印象が変わる。","detail":"","key":false,"src":"DAY112・DAY117"},{"id":"r042","category":"principles","sub":"動きと体験の設計","type":"qa","front":"人の目は、ロボットの動きのカクつきをどこで感じ取るか？","back":"人の目は速度の不連続より加速度の不連続に敏感で、「ガクッ」と見えるのは加速度がジャンプした瞬間。動作の継ぎ目に加速度のスパイクが出るとカクついて見える。見るべき指標は位置でも速度でもなく加速度。","detail":"","key":false,"src":"DAY223"},{"id":"r043","category":"principles","sub":"動きと体験の設計","type":"point","front":"動きの設計は二層で捉える。下層は位置に応じて確実に届く骨格を計算で作り（確定論的）、上層は何がいい動きかを人が設計する。計算は正しい動きを導けるが、いい動きは決められない。","back":"","detail":"","key":false,"src":"DAY223"},{"id":"r044","category":"principles","sub":"動きと体験の設計","type":"term","front":"動きの不気味の谷","back":"横軸を動きの人間・生物らしさ、縦軸を人の安心感にとると、完全に機械的な動きと完全に自然な動きは安心され、中途半端に滑らかな中央が谷の底になる。推論遅延による0.5秒の躊躇や、最後だけ機械的に決まる姿勢角などが組み合わさって違和感になる。","detail":"","key":false,"src":"DAY212"},{"id":"r045","category":"principles","sub":"動きと体験の設計","type":"qa","front":"ロボット操作UIの本当の問題は、入力と出力のどちら？","back":"出力。数値やアラートは出るが、止まってよい警告か今すぐ手を離すべき警告かが一目で分からず、ロボットの状態が操作者の身体に届かない。ゲームはアダプティブトリガーや振動パターンで状態を身体に翻訳する設計を30年磨いてきた。借りるべきはコントローラーではなくこの思想。","detail":"","key":false,"src":"DAY135"},{"id":"r046","category":"principles","sub":"動きと体験の設計","type":"qa","front":"音声AIロボットの「間」が悪くなるのはなぜで、どう設計するか？","back":"発話区間検出・音声認識・LLM推論・音声合成の4段を直列に通るため、間は構造的に生まれる（最も重いのはLLM推論）。待ち時間を消すのではなく、聞き終わりの合図・考える仕草・話し始めの予備動作・割り込みの許容で、無反応を「考えている時間」に読み替えさせる。ただし体感は変えても実際の遅延は消えない。","detail":"","key":false,"src":"DAY262"},{"id":"r047","category":"principles","sub":"動きと体験の設計","type":"qa","front":"機械的な柔らかさ（コンプライアンス）は、人と共存するロボットの設計でどの順番に置くべきか？","back":"最後に買う保険レイヤー。予備動作・減速カーブ・一貫した経路・光や音の予告は安く予測可能性を作れる。コンプライアンスだけはロボットが状況を誤解していても物理的に効き、高速衝突は能動制御では間に合わずバネだけが間に合う。一方、柔らかくしたぶん精度が出ず仕事が少なかった Rethink Robotics は事業を停止しており、必要条件でも十分条件ではない。","detail":"","key":false,"src":"DAY296"},{"id":"r048","category":"principles","sub":"動きと体験の設計","type":"term","front":"運動主体感","back":"自分の意志で体を動かしている感覚。操作した結果が思ったとおりに返ると強まり、ずれたり遅れたりすると弱まる。遠隔操作のAI補助はこの感覚を削らない範囲にとどめ、「AIは操縦者より先には動かない」を基準にする。","detail":"","key":false,"src":"DAY322"},{"id":"r387","category":"society","sub":"導入が進まない構造","type":"point","front":"ロボットの動作には持ち運びの効く形（ポータビリティ）が無い。メーカーごとに制御言語・通信・座標系の定義が違い、ある機種の動作プログラムは別機種で動かない。","back":"同じ機種でもカメラ位置・机の高さ・ワークが違うと前回の学習が移らず、2台目がフルコストになる。この再設計がSIer（導入を請け負う会社）の工数の正体。","detail":"","key":false,"src":"DAY102・DAY286"},{"id":"r388","category":"society","sub":"導入が進まない構造","type":"qa","front":"日本のロボット導入でSIerに全面委託すると、どんな副作用があるか？","back":"なぜその動作・パラメータになったかが導入企業側に残らず、次の導入でも再びSIerに頼るので知識不足が続く。フィジカルAIでは物の位置や照明が変わるたびに動作を再設計・再学習できる組織能力が要り、「発注して3ヶ月待つ」では価値を引き出せない。","detail":"","key":false,"src":"DAY107・DAY174"},{"id":"r389","category":"society","sub":"導入が進まない構造","type":"point","front":"多品種少量生産では、品種ごとの動作の再設定コストがロボットの投資回収を下げる。","back":"デジタルツインでの事前設計・検証と、汎用ロボット＋少量データの学習の組み合わせで、このコストを下げられる可能性がある。","detail":"","key":false,"src":"DAY107・DAY174"},{"id":"r390","category":"society","sub":"導入が進まない構造","type":"point","front":"導入の動機は「コスト削減」から「人がいないから入れるしかない」へ移りつつある。心理的な引き金は賃金水準より欠員（時給を上げても応募が来ない）で、人口減少地域で先に来る。","back":"人が確保できなければ自動化しないほうが高くつき、投資回収の計算軸が変わる。導入・インテグレーション費は本体と同等以上が通例で、そこを下げれば分岐点を手前に引き寄せられる。","detail":"","key":false,"src":"DAY174・DAY264"},{"id":"r391","category":"society","sub":"導入が進まない構造","type":"qa","front":"移乗ロボットのように技術があっても現場に普及しないのはなぜ？","back":"詰まりの正体は性能ではなく、現場での体験と経済の設計にある。移乗は準備に時間がかかり結局人力の方が速い。農業は稼働率、飲食は単価の壁がある。","detail":"","key":false,"src":"DAY264"},{"id":"r392","category":"society","sub":"導入が進まない構造","type":"qa","front":"産業用ロボットが60年かけても中小企業に降りてこないのに、ルンバが普及したのはなぜ？","back":"大企業の解は環境の標準化で、中小には揃える規模がなく設計工数が割れない（ボトルネックは機械の値段ではない）。ルンバは性能を諦め、取りこぼしても誰も困らない仕事を選んで失敗の代償をゼロにしたため、環境整備なしで使えた。","detail":"","key":false,"src":"DAY306"},{"id":"r393","category":"society","sub":"導入が進まない構造","type":"qa","front":"中小企業の現場に、人型ロボットより「既存の機械へのAI後付け（レトロフィット）」が入りやすいのはなぜ？","back":"投資がカメラと制御ユニットの追加で済み、作業員は慣れた機械をそのまま使え、最終判断は人に残る。導入前後で作業時間を比べやすく、AIが誤動作しても手動に戻せば仕事は止まらない。弱点は機械ごと・現場ごとに毎回の調整が要ること。","detail":"","key":false,"src":"DAY315"},{"id":"r394","category":"society","sub":"現場で足りない設計","type":"point","front":"導入現場で足りないのは「動くロボットを作れる人」より「どう動くかを設計できる人」。","back":"要るのは、現場の要望を実装仕様に訳す力、人とロボットの分担と例外時に人へ引き渡す流れの設計、使う人の視点で検証し改善を回す仕組みの3つ。","detail":"","key":true,"src":"DAY107・DAY174"},{"id":"r395","category":"society","sub":"現場で足りない設計","type":"point","front":"ロボットに渡す仕事が人間の職種の輪郭（看護師の仕事・仕分けの仕事）で切り出されている。例外を含む部分は人に残し、例外の出ない部分だけを切り取って渡す。この切り取りを決める工程が誰の担当でもない。","back":"","detail":"","key":true,"src":"DAY314"},{"id":"r396","category":"society","sub":"現場で足りない設計","type":"qa","front":"産業用ロボットの外側に、自動化されない仕事が積み上がっているのはなぜ？","back":"大量と精度で解ける仕事だけが自動化されてきた結果、解けなかった仕事が外に残っているから。毎回形が違う物（食品・農産物・返品）や、数が少なく専用機の予算が出ない工程などで、共通点は精度不足ではなく「人が要求を仕様に書けない」こと。","detail":"","key":false,"src":"DAY314"},{"id":"r397","category":"society","sub":"現場で足りない設計","type":"point","front":"配膳・清掃・警備のサービスロボットは、どれも定常動作は解けていて、例外が来たときに止まる。導入後に例外対応が人に戻る主因は、技術不足ではなく運用人材の不足（三菱総合研究所）。","back":"","detail":"","key":true,"src":"DAY306"},{"id":"r398","category":"society","sub":"現場で足りない設計","type":"qa","front":"配膳ロボの「横取り」対策が、ロボット本体ではなくテーブル端末に入ったのはなぜ？（しゃぶ葉の例）","back":"横取りする客はロボットを見ておらず、ロボット上の光は手が動き始めた後にしか目に入らない。端末通知なら手が動く前に、客が既に見ている画面に割り込める。端末は自社管理で直しやすい一方、ロボット側はメーカーのファーム更新を3,000台に配る必要がある。","detail":"","key":false,"src":"DAY306"},{"id":"r399","category":"society","sub":"現場で足りない設計","type":"qa","front":"警備ロボットが配膳・清掃より普及しない構造的な理由は？","back":"巡回ロボットは一度に一箇所にしかおらず、全地点を同時に見る固定カメラに検知で構造的に負ける。さらに移動のコスト（バッテリー・LiDAR・転倒・段差）を払いながら、見つけた後に扉を閉める・人を止めるといった物理作用を持たない。配膳は運ぶ、清掃は床に触れる作用があるから成立している。","detail":"","key":false,"src":"DAY306"},{"id":"r400","category":"society","sub":"現場で足りない設計","type":"point","front":"ロボットの固有領域は、世界の物理状態を変えること（力を出す・移動する・掴んで状態を変える）。情報を出すだけの案はスマートスピーカーやディスプレイで足りる。","back":"","detail":"","key":false,"src":"DAY264"},{"id":"r401","category":"society","sub":"環境と役割で解く","type":"qa","front":"半導体工場のロボットは賢くないのに、なぜほぼ全自動で動くのか？","back":"業界がFOUP（ウェハキャリア）をSEMI規格で標準化し、ウェハの位置が規格で決まっているから。知能の問題を規格の問題に変換して解いた。パレット・トート・パーツフィーダも同じで、ロボットを賢くせずワーク側のばらつきを下げている。","detail":"","key":false,"src":"DAY286"},{"id":"r402","category":"society","sub":"環境と役割で解く","type":"point","front":"ロボットを賢くする前に、治具で環境側のばらつきを消す。MicroFactory の本質は、治具設計を AI と3Dプリンタで安くしたこと。","back":"","detail":"","key":false,"src":"研究メモ:Physical AIが学習できる環境の調査"},{"id":"r403","category":"society","sub":"環境と役割で解く","type":"point","front":"現場のロボットは、本体・関節制御・安全の仕組みを従来型のまま残し、AIを「何がどこにあるかを見る目」と「段取り」にだけ入れている。AIが何を・どこへを決め、どう動くか（通り道・速度・安全）は従来の制御が保証する。","back":"","detail":"","key":true,"src":"DAY324"},{"id":"r404","category":"society","sub":"環境と役割で解く","type":"qa","front":"学習したロボットの動きのずれを吸収する方法は？","back":"4つある。機械で吸収する（治具や、力を受けると逃げるRCCなどの機構）、役割を分ける（AIは粗く決め、最後の数mmは従来の位置・力制御が詰める）、環境を変える（部品形状や作業台を失敗しにくく設計し直す）、データで詰める（大量の実機データや触覚で精度を上げる）。どれを主軸にするかで、精度の責任を誰が負うかも変わる。","detail":"","key":false,"src":"DAY324"},{"id":"r405","category":"society","sub":"環境と役割で解く"
