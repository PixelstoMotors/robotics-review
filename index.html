て上書き無効）。","key":false,"src":"DAY273"},{"id":"r283","category":"eval","sub":"成否判定（VLM-as-Reward）","type":"point","front":"画像判定AIは写っていること（指先の間に赤ブロックがあるか）はほぼ0%か100%で答え分けたが、写っていないこと（真上から見て床から持ち上がったか）は聞き方を変えても判定できなかった。モデルの性能ではなく入力の情報不足。","back":"横カメラで撮れば写る。","key":false,"src":"DAY325"},{"id":"r284","category":"eval","sub":"成否判定（VLM-as-Reward）","type":"point","front":"実機640試行の失敗のうち、画像で見分けるべき失敗（見る・掴む・置く）は約4割。残り6割は関節が目標に届かない・安全チェックで停止・判定AIの呼び出しエラーで、画像判定では解決しない。","back":"","key":false,"src":"DAY325"},{"id":"r285","category":"eval","sub":"成否判定（VLM-as-Reward）","type":"qa","front":"掴めたかどうかを、どのタイミングでどう測ることにした？","back":"グリッパーを閉じる直前に上カメラ1枚から爪先（青シール2点の中点）とブロック中心の距離をmmで測る。閉じた直後にその場で1枚撮り、VLMに爪にブロックが挟まっているかを判定させる。持ち上げてからではなく、掴んだ瞬間に撮る。","key":false,"src":"DAY246"},{"id":"r286","category":"eval","sub":"成否判定（VLM-as-Reward）","type":"point","front":"探索は内蔵、記録は固定。再計画はエージェント本体の視覚で安く回し、各試行の最終成否だけは固定プロンプトの判定器で構造化して台帳に残す（判定モデルとプロンプトの版も記録）。","back":"","key":false,"src":"DAY249"},{"id":"r287","category":"eval","sub":"成否判定（VLM-as-Reward）","type":"qa","front":"報酬分類器とVLMによる成否判定の関係は？模倣学習から始めるなら、VLM判定はどこで使う？","back":"両者は同じ位置にあり、違いは自分のデータで学習させた小さなモデルにするか、外部のVLMに聞くかだけ。模倣学習から始めるならVLM判定は学習には使わず、何回試して何回成功したかを数える評価の側で使う。","key":false,"src":"研究メモ:Robot Learning Tutorial（LeRobot入門書）"},{"id":"r288","category":"eval","sub":"成否判定（VLM-as-Reward）","type":"term","front":"TOPReward","back":"学習済みの動画VLMから、追加学習なしで作業の進み具合を推定する報酬の手法。SO-100/101を含む130以上の実タスクで高い相関があり、成功判定やデータ選別にも使える。VLM-as-Rewardと同じ方向。","key":false,"src":"研究メモ:Physical AIが学習できる環境の調査"},{"id":"r289","category":"eval","sub":"台帳と記録の設計","type":"point","front":"成否だけを記録しても改善の打ち手は見えない。Pick失敗とPlace失敗は原因が違うので、失敗したステップ（fail_step）を記録する。ログは記録ではなく設計の素材。","back":"失敗はPICK直後・移動中・PLACE直後の3つのタイミングで見る。コードでは全体を1つのtry/exceptで包まず、今いるフェーズを変数で追って失敗時に返す。","key":false,"src":"DAY125・DAY130"},{"id":"r290","category":"eval","sub":"台帳と記録の設計","type":"point","front":"台帳は1試行1行で、成否をVLMの判定・座標の幾何距離・写真のパスの3通りで記録する。食い違いを後から拾え、「掴めたが置けなかった」のような中身も消えずに残る。","back":"","key":false,"src":"DAY241"},{"id":"r291","category":"eval","sub":"台帳と記録の設計","type":"point","front":"完走と成功は別で、成否の二値の手前の連続量を測る。掴めても爪先とブロックは3.9〜17mm離れていた。yesに潰すと別の成功が同じ行に並ぶ。","back":"掴み判定（VLM）、掴む直前の爪先〜ブロック距離、PICK前後のブロック座標の三方向が揃うと、完走した試行の中の掴み失敗が見える。","key":false,"src":"DAY243・DAY246"},{"id":"r292","category":"eval","sub":"台帳と記録の設計","type":"term","front":"pose_id","back":"姿勢に振る背番号。live（実機が読む採用姿勢JSON＝入力）、twin（FKテーブル＝姿勢から爪先位置への変換器）、real（台帳＝試行結果の出力）を同じ姿勢として突き合わせる鍵。ツインの予測と実機の実測のずれを測る前提になる。FKテーブルの行番号だけを永続IDにしない。再生成・マージ・ソートで同じ番号が別の姿勢を指しうるので、テーブルの版かハッシュとセットにする。","key":false,"src":"DAY255・DAY258"},{"id":"r293","category":"eval","sub":"台帳と記録の設計","type":"qa","front":"台帳のpick欄が空欄のままだと何が困り、どう直した？","back":"届かなかった・届いたが掴めなかった・掴んだが持ち上げで落とした、がすべて同じ「空」に潰れる。実機を動かす前に台帳ルール（data_manifest_rules.md）を新設し、試行結果を段階の状態語（pick_stage）で持ち、到達・グリップ指令・持ち上げ後の保持・中断理由などの根拠フラグを別列にする設計を決めた。列を足すときは旧台帳を退避して作り直す。","key":false,"src":"DAY258"},{"id":"r294","category":"eval","sub":"台帳と記録の設計","type":"qa","front":"状態語「grasped（掴んだが落とした）」を保留にしたのはなぜ？","back":"持ち上げ後の画像でしか保持を見ておらず、掴んだ直後の確認がないため「そもそも掴めなかった」と「掴んで落とした」を切り分けられない。判定手段のない状態語は作らず、当面は reached＋held_after_lift=false で表す。","key":false,"src":"DAY258"},{"id":"r295","category":"eval","sub":"台帳と記録の設計","type":"point","front":"台帳の追記処理はヘッダが列定義と一致しないと止める。列を足すときは運用中の台帳に直接足さず、旧版をarchiveへ退避し、同じファイル名で新ヘッダの空台帳を作り直す（台帳は1本）。","back":"","key":false,"src":"DAY258"},{"id":"r296","category":"eval","sub":"台帳と記録の設計","type":"qa","front":"置きズレΔは、いつ撮った画像で測るべき？","back":"PLACE姿勢に到達し爪を開く前、ブロックを保持したまま撮る。離して退避した後に測ると、置いたズレに縁で転がったズレが混ざり、補正の教師データが濁る。","key":false,"src":"DAY263"},{"id":"r297","category":"eval","sub":"台帳と記録の設計","type":"qa","front":"補正記憶マップを作る前に、台帳から何が分かった？","back":"291試行で73セル中48セルは1回しか訪問されておらず、残差は改善中・横ばい・振動（60→241→24mm）がセルごとに混在していた。だから収束より先に訪問密度を見せ、再訪すべきセルを選んでから走らせる順にした。","key":false,"src":"DAY270"},{"id":"r298","category":"eval","sub":"台帳と記録の設計","type":"qa","front":"関節指令のタイムスタンプは、どこで取らないと映像と突き合わせられない？","back":"送角関数が到達確認を終えて戻った後に取ると全行が数秒遅れる。実送信の直前（ts_send）と、許容内到達を最初に確認した瞬間（ts_arrival）を送信ごとに分けて記録する。その差5.24秒に、アームが86度動く実時間が残った。","key":false,"src":"DAY287"},{"id":"r299","category":"eval","sub":"測り方・検証の落とし穴","type":"point","front":"採点基準を採点される側から作らない。同じ対応点から推定した変換でその対応点を評価すると、互いに整合するかは測れても、同じ物理点かは保証できない。","back":"","key":true,"src":"DAY309"},{"id":"r300","category":"eval","sub":"測り方・検証の落とし穴","type":"qa","front":"4点ホモグラフィの校正誤差が0.00mmと出た。精度は確認できたと言える？","back":"言えない。4点の対応はホモグラフィが数学的に完全に一致させるので、誤差0は当然。本当の精度は、校正に使っていない別の点（マット格子の交点など）で測る。","key":false,"src":"DAY164"},{"id":"r301","category":"eval","sub":"測り方・検証の落とし穴","type":"qa","front":"lookupテーブルを実機で動かす前に、どう検証した？","back":"マットの9点（4隅・4辺の中点・中心）で試し引きし、最近傍との距離を見た。10mm以内は1点だけで7点は30mm以上離れ、左下のカバー不足が分かった。起点姿勢から各軸±16°を4°刻みで追加スキャンし、サブミリの候補が取れた。","key":false,"src":"DAY154"},{"id":"r302","category":"eval","sub":"測り方・検証の落とし穴","type":"point","front":"失敗はどの段で止まったかを切り分ける：画素検出→座標変換→PICK lookup→PLACE lookup。白箱は画素で検出できても、lookupテーブルの範囲外（188.6mm）でアームは動けなかった。","back":"","key":false,"src":"DAY165"},{"id":"r303","category":"eval","sub":"測り方・検証の落とし穴","type":"qa","front":"送信間隔を変えて追従率を測る実験が失敗したのはなぜ？","back":"計測用のget_anglesが送信と同じシリアル線を使い、呼ぶたびに制御ループへ100〜700msの空白を生んだ。計測がHOME目標時に偏り、異常値も混ざった。測る行為が測定対象を変えていた。is_moving()で1回の動作完了時間を測る設計に変えた。","key":false,"src":"DAY183"},{"id":"r304","category":"eval","sub":"測り方・検証の落とし穴","type":"point","front":"1回の検出は信頼できない。同じ姿勢・同じ指令でも横カメラのy変化が3/11/13pxとばらついた。検出を3回平均し、range（最大−最小）もログに残してばらつく試行を後から見分ける。","back":"","key":false,"src":"DAY204"},{"id":"r305","category":"eval","sub":"測り方・検証の落とし穴","type":"point","front":"静止判定の閾値は検出ノイズに対するマージンで決める。TIP検出のばらつき約0.08mmに対し閾値1.0mm（約12倍）とし、運用で2.0mmに緩めた。","back":"","key":false,"src":"DAY185"},{"id":"r306","category":"eval","sub":"測り方・検証の落とし穴","type":"qa","front":"横カメラの「箱に置けたか」判定は何を見るべきで、どんな性質のセンサーだった？","back":"見るのは爪の底面と白箱の上縁の隙間（接触の有無）の二値。横カメラは奥行きが見えないので位置判定は上カメラに任せる。424枚からランダム抽出で検証すると、no（接触・深すぎ）は信頼でき、yesには見逃しがある非対称なセンサーだった。4枚だけのテストでは偏りに気づけなかった。","key":false,"src":"DAY279"},{"id":"r307","category":"eval","sub":"測り方・検証の落とし穴","type":"point","front":"診断は本線と同一条件で行う。プローブは目標高さを渡して測っていたが、本線は高さ記憶0のときNoneになり処理が丸ごと飛ぶ経路が残っていた。外からフィルタを再現するときも実装と同じ条件で数える。","back":"","key":false,"src":"DAY279・DAY281"},{"id":"r308","category":"eval","sub":"測り方・検証の落とし穴","type":"qa","front":"テストが全部緑なのに、何も検証していなかった2つの例は？","back":"①既存本線と新本線の一致を見るテストが、既存のrun()を一度も走らせず手書きの期待値と比べていた。実際に走らせて呼び出し列を突き合わせると写し違いが3件出た。②「closeが0回」の検査が、RELEASE自体が呼ばれず履歴が空のまま通っていた。openがちょうど1回という正の値でassertする。","key":true,"src":"DAY289・DAY293"},{"id":"r309","category":"eval","sub":"測り方・検証の落とし穴","type":"qa","front":"関数名のimport漏れ（NameError）は、なぜ静的レビューもpy_compileも通り抜けた？","back":"NameError（未定義の名前を呼ぶエラー）は実行時にしか出ず、コンパイルは名前が実行時に存在するかまで検査しない。レビューも符号・上限・ガードは見たが、呼ぶ関数が実在するかは追わなかった。レビュー項目に「呼んでいる関数のdefをgrepで確認」を足す。","key":false,"src":"DAY273"},{"id":"r310","category":"eval","sub":"測り方・検証の落とし穴","type":"point","front":"検証項目に宛先（外部レビュー向け）を書かないと実装者の自己申告になり、同じ盲点を通す。「修正済み」の報告はgrepで確かめ、定義元はファイル名の当て推量ではなくimport元をgrepして確定する。","back":"","key":false,"src":"DAY293・DAY297"},{"id":"r311","category":"eval","sub":"データ管理と観測","type":"point","front":"同じFKテーブルを複数か所に置くなら、更新のたびにmd5で一致を確かめる。片側だけ古いとlookupがずれる。ファイル名は1つに固定して中身だけ入れ替え、点数のような変わる値は文書に書かず実測する。","back":"前例はDAY170の97mm乖離と、同名のv2がMacとUnityで別々に育ち14万点の差が出た事故。旧テーブルは消さずarchiveに退避し、そこから中身を戻せばロールバックできる。","key":false,"src":"DAY222・DAY252・DAY265・arm_kinematics"},{"id":"r312","category":"eval","sub":"データ管理と観測","type":"qa","front":"FKスキャンのCSVと、同じ関節角でUnityを測った値が約97mmずれた原因は？","back":"Mac側に、爪先基準へ改修する前の旧CSVが残り、Unity側だけ更新されていた。4つの仮説を測って順に否定し、ファイル日時と行数の比較で特定した。新CSVをコピーすると最近傍距離は71.10mm→0.30mmになった。","key":false,"src":"DAY170"},{"id":"r313","category":"eval","sub":"データ管理と観測","type":"point","front":"コードはgitで管理し、学習データや生成物は外付けSSDに置いてgit管理しない。書き込む前に必ずマウントを確認し、未接続なら何も作らず止める（macOSでは未マウント時に同名フォルダが内蔵に作られ得る）。","back":"","key":false,"src":"DAY234・DAY243"},{"id":"r314","category":"eval","sub":"データ管理と観測","type":"qa","front":"テレメトリ（運転中の状態観測）を、daemonではなく制御ループ自身から出したのはなぜ？","back":"daemonは1本の接続を切断までつかむ逐次処理で、制御中は2本目の観測クライアントを受け付けない。さらにdaemonが返せるのは6関節角だけで、工程・グリッパー状態・試行の文脈は制御ループの中にしか無い。","key":false,"src":"DAY240"},{"id":"r315","category":"eval","sub":"データ管理と観測","type":"point","front":"観測は制御を止めない：送信側はUDPで投げて忘れ、例外を全部握り、非ブロッキングにする。中継は最新の1個だけ配る。供給・中継・表示を分ければ、機体を替えても表示側は変わらない。","back":"経過秒はブラウザのローカル時計で刻むと、データが来ない間も増え続け、工程での詰まりが見える。","key":false,"src":"DAY240"},{"id":"r316","category":"eval","sub":"データ管理と観測","type":"point","front":"制御スクリプトを「フェーズ（横軸）×コンポーネント（縦軸）」のタイムラインで可視化すると、どこが失敗しどこが未到達かが一目で分かる。関係しそうな関節だけでなく全関節を並べて初めて構造が見える。","back":"HTMLを唯一の正とし、AIに渡すJSONはそこから生成して乖離を防ぐ。","key":false,"src":"DAY203"},{"id":"r317","category":"eval","sub":"試行回数と再現性","type":"term","front":"「再現可能な環境」の判定3条件","back":"①手順が公開されている（GitHub／記事）②依存関係とバージョンが記載されている③自分以外の環境で再現された記録が1件以上ある、または再現に必要な情報が欠けていないことを第三者が確認できる。③を満たさないものは「構築中」で数に入れない。","key":true,"src":"DAY276"},{"id":"r318","category":"eval","sub":"試行回数と再現性","type":"qa","front":"30回の試行で出した成功率の差は、どこまで信じてよい？","back":"成功率50%前後で30回だと、偶然のぶれだけで上下に約18ポイント動く（95%の範囲）。10ポイント程度の差は手法の差か偶然か区別できない。約360回まとめれば約±5ポイントまで縮む。試行が少ないうちは細かい順位を当てにしない。","key":true,"src":"DAY323・研究メモ:ArmnetBench（SO-101並列実機評価）"},{"id":"r319","category":"eval","sub":"試行回数と再現性","type":"qa","front":"ArmnetBench v0.1の反省から、自分の評価で最初から入れるべき決まりは？","back":"物の初期位置を記録する、1試行の制限時間を決める、カメラ位置を毎回確認する、照明をそろえる。v0.1はこれらが無く、作業台3番では1手法を除く全手法で正面カメラがずれて手法間の条件が違っていた。（ArmnetBench：SO-101の作業台を並べ、7手法を同じ実演50本で学習させ、タスク×手法ごとに30回ずつ3段階で実機評価した研究）","key":false,"src":"DAY323・研究メモ:ArmnetBench（SO-101並列実機評価）"},{"id":"r320","category":"eval","sub":"試行回数と再現性","type":"term","front":"再現性の3段階（ArmnetBench）","back":"実行の再現（同じコンテナとチェックポイントで同じ動作）は強い、同じ作業台内の場面の一貫性は中程度、別の作業台での物理的な再現は未検証。自分以外の環境での再現がいちばん難しい。","key":false,"src":"研究メモ:ArmnetBench（SO-101並列実機評価）"},{"id":"r321","category":"eval","sub":"試行回数と再現性","type":"qa","front":"ArmnetBenchの公開データは、VLM-as-Rewardの検証にどう使える？","back":"人が採点した3,118本のSO-101映像と成功／失敗ラベルがある。VLMに同じ映像を判定させ、人の採点と何%一致するかを測れば、報酬モデル方式の精度を実機なしで確かめられる。","key":false,"src":"研究メモ:ArmnetBench（SO-101並列実機評価）"},{"id":"r322","category":"eval","sub":"試行回数と再現性","type":"qa","front":"Phone2Actの「実機で90%成功」はどう読むべき？","back":"1タスク・10回だけの結果（10回中9回）で、リーダーアーム方式などとの比較はない。データはDobot CR5で130回分、GR00T N1.5を追加学習。遅延は350〜440ミリ秒（平均395ミリ秒）で、ゆっくり動かす作業向け。","key":false,"src":"研究メモ:Phone2Act（スマホ遠隔操作）"},{"id":"r323","category":"eval","sub":"試行回数と再現性","type":"qa","front":"R2R2Rの「デモ1本で遠隔操作150本に匹敵」という見出しはどう読む？","back":"同じ本数なら人のデータのほうがずっと良く、生成データは1,000本まで増やしてようやく追いつく。付録の検定では「同等」と言えるタスクは1つもなく、「同等とは言い切れないが、どちらかが明確に勝つ証拠もない」が正確。","key":false,"src":"研究メモ:R2R2R（実演動画1本から学習データ生成）"},{"id":"r324","category":"learning","sub":"学習の位置づけ","type":"qa","front":"従来の産業用ロボットとフィジカルAIは何が違う？","back":"産業用は人がティーチング（動きの事前登録）で動作を決め、制御された空間で動き、失敗は許されない。強みは精度・耐久性・再現性。フィジカルAIは学習と推論で動作を決め、不確実な空間で動き、失敗は学習データになる。強みの源はデータ・モデル・体験設計。","key":false,"src":"DAY112"},{"id":"r325","category":"learning","sub":"学習の位置づけ","type":"qa","front":"なぜ古典制御（順運動学・逆運動学・フィードバック）から学習へ移るのか？","back":"机の面だけで関節の動ける範囲が狭まり、障害物が増えるたびに解き直しになる。逆運動学（手先位置から関節角を求める計算）は目標の姿勢は出すが道筋は出さない。認識〜制御を別々に作って繋ぐので誤差が積み重なり、作業や機体が変わるたびに作り直しになる。","key":false,"src":"研究メモ:Robot Learning Tutorial（LeRobot入門書）"},{"id":"r326","category":"learning","sub":"学習の位置づけ","type":"point","front":"「C++ではなくニューラルネットで動かす」の対立軸は言語ではない。人が数式で書いた制御則（逆運動学・PID制御など）か、データから学習した方策か、である。","back":"ニューラルネットの担当は約40年で、誤差を吸収する部品→知覚→画像から指令までの一本の写像→全身へと広がった。","key":false,"src":"DAY214"},{"id":"r327","category":"learning","sub":"学習の位置づけ","type":"point","front":"Physical AI が学習できる環境は ①データを集める手段 ②学習基盤 ③成否を判定する仕組み ④収集→学習→実機検証→次の収集を回すループ で成り立つ。最大のボトルネックはデータ。","back":"","key":true,"src":"研究メモ:Physical AIが学習できる環境の調査"},{"id":"r328","category":"learning","sub":"学習の位置づけ","type":"qa","front":"FKテーブル（関節角→指先位置の対応表）を濃くしても「失敗から学ぶアーム」に近づかないのはなぜか？","back":"テーブルが返すのは行き先の姿勢（終点）だけで、失敗の検知・原因の推定・次の一手の立て直しを持たないから。範囲や密度を上げるのは失敗しにくくする改善で、失敗後に立て直す能力ではない。精度を上げることと失敗から学ぶことは別の軸にある。","key":true,"src":"DAY225"},{"id":"r329","category":"learning","sub":"学習の位置づけ","type":"qa","front":"「モジュール型」と「エンドツーエンド」はどう違い、なぜ今はモジュール型を続けるのか？","back":"モジュール型は認識・位置推定・経路計画・制御を別部品にし、受け渡しの形を人が決める。エンドツーエンドは入力から操作までを1つのネットに丸ごと学習させ、誤差の累積がなく言葉にしきれない判断まで学べるが、失敗箇所を特定しにくい。移行が効くのはタスク分岐の爆発・複数ロボット連携・リアルタイム性・環境変化への適応が要るときで、今はどれにも当たらないため、各段を人が検証できるモジュール型が正しい。","key":false,"src":"DAY143・DAY316"},{"id":"r330","category":"learning","sub":"学習の位置づけ","type":"point","front":"学習した方策は「なぜそう動いたか」が外から見えにくく、新しい機体へのゼロショット汎化もまだ限定的。規制が説明可能性や非常停止を求めれば、学習方策に古典制御の安全層を組み合わせたハイブリッドが長く残る。","back":"","key":false,"src":"DAY214"},{"id":"r331","category":"learning","sub":"模倣学習と強化学習","type":"qa","front":"模倣学習（人の実演をまねる学習）の利点と弱点は？","back":"利点は報酬が要らない（成功条件が実演に含まれる）ことと、危険な探索をしないこと。弱点は、実演者より上手にならない、小さな誤差が積み重なって見たことのない状態に入る、実演のばらつきを単純に平均するとどっちつかずの動きになる（人の実演を単純な回帰で学ばせると成功率が33ポイント下がった）。","key":true,"src":"DAY270・DAY323・研究メモ:Robot Learning Tutorial（LeRobot入門書）"},{"id":"r332","category":"learning","sub":"模倣学習と強化学習","type":"qa","front":"なぜ実機での強化学習（試行と報酬で学ぶ方式）は難しい？","back":"学習初期の乱暴な動きで機体を壊しうる、毎回のリセットに手間がかかる、必要な試行回数が多すぎる、シミュレーションは現実とずれる。最大の弱点は報酬設計で、細かく設計すると抜け道を学習され、成功／失敗だけにすると学習が遅い。","key":true,"src":"研究メモ:Robot Learning Tutorial（LeRobot入門書）"},{"id":"r333","category":"learning","sub":"模倣学習と強化学習","type":"qa","front":"模倣学習で、VLMによる成否判定（VLM-as-Reward）はどこに使う？","back":"模倣学習は実演に「どこで成功して終わるか」が含まれるので報酬は要らない。VLMの判定は学習には使わず、学習させた動作を何回試して何回成功したかを数える評価の側で使う。実演者より上手くなる段階では、成否判定を報酬にする強化学習（HIL-SERLなど）が要る。","key":false,"src":"DAY323"},{"id":"r334","category":"learning","sub":"模倣学習と強化学習","type":"term","front":"HIL-SERL","back":"人が途中で手を出す実機強化学習。成功・失敗の画像で小さな画像認識モデル（報酬分類器）を学習させて報酬にし、人の実演から学習を始め、介入データを優先的に学習する。元論文では1〜2時間の学習で成功率99%以上。","key":false,"src":"研究メモ:Robot Learning Tutorial（LeRobot入門書）"},{"id":"r335","category":"learning","sub":"模倣学習と強化学習","type":"qa","front":"Physical Intelligence の π*0.6（RECAP）は何をしていて、どう読むべきか？","back":"オフライン強化学習で汎用VLAを事前学習し、現場ごとに配備して自律実行の記録と人のテレオペ介入による修正を集め、下流タスクに特化させる。読み替えると、汎用モデルが約50%まで運び、残りは現場で人が横について直す。現場ごとの調整は消えず「治具屋がデータ屋になった」だけで、2台目がフルコストという根本は残る。","key":false,"src":"DAY286"},{"id":"r336","category":"learning","sub":"データの集め方","type":"qa","front":"なぜロボット学習ではデータが本丸なのか？","back":"ロボットにはネット規模の動作データがない。最大の公開実ロボットデータセット Open X-Embodiment でも約100万軌跡（約60データセットの寄せ集め）で、言語モデル1つの学習には十数兆トークンが使われる。ロボットのデータは実機を動かすかシミュレーションで作るしかなく、ネットから拾えない。","key":true,"src":"DAY214・研究メモ:Physical AIが学習できる環境の調査"},{"id":"r337","category":"learning","sub":"データの集め方","type":"qa","front":"ロボットの学習データを作る方法は、それぞれ何が弱い？","back":"実機の遠隔操作（テレオペ）は品質が最も高いがコストが人手に比例する。手持ちデバイス（UMI系）はロボットなしで集められるが人とロボットの体の違いが残る。人の動画に擬似ラベルを付ける方法は既存映像を使えるがラベル精度が課題。シミュレーション・生成は量を出せるが現実との物理の違いが残り、スマホ映像からの生成は物体の動きの物理を扱わない。","key":false,"src":"DAY214・研究メモ:Physical AIが学習できる環境の調査"},{"id":"r338","category":"learning","sub":"データの集め方","type":"qa","front":"テレオペ・ティーチング・ドラッグティーチングはどう違う？","back":"テレオペ（遠隔操作）は別の入力デバイス（リーダーアーム・手袋・VRコントローラ）で人がリアルタイムに動かし、現実の動きをそのまま記録する。変化する環境や汎用動作向き。ティーチングは作業前に動きを登録して再現する、定型作業向き。ドラッグティーチングはロボット本体を手で動かして関節角を記録・再生し、追加デバイスが要らない。双腕の模倣学習には最終的にテレオペ（ALOHAのリーダー・フォロワー方式など）が要る。","key":false,"src":"DAY118・DAY205"},{"id":"r339","category":"learning","sub":"データの集め方","type":"point","front":"大勢がテレオペで服を畳む工場の映像は、作業ではなく動作データ集め。動作AIはデータ量が汎化に直結し、現実の動きを確実に集める手段は今は人手しかない。","back":"","key":false,"src":"DAY118"},{"id":"r340","category":"learning","sub":"データの集め方","type":"term","front":"UMI（Universal Manipulation Interface）","back":"人が手持ちのグリッパー装置（GoPro・ミラー・3Dプリント製グリッパー・ArUcoマーカーで約500ドル）を日常環境で操作してデモを集め、データ収集をロボット本体から切り離す手法。テレオペの約3倍速（1時間111デモ対35デモ）。DexCap（モーキャプ手袋）なども同じ「人の動き→3D動作データ→ロボット学習」の構造で収集コストを下げる。","key":false,"src":"DAY126・DAY166"},{"id":"r341","category":"learning","sub":"データの集め方","type":"term","front":"リターゲティング","back":"撮影した人間の動きを、別の骨格（キャラクターやロボット）に合わせて変換し直すこと。","key":false,"src":"DAY118"},{"id":"r342","category":"learning","sub":"データの集め方","type":"qa","front":"遠隔操作で、操作から動作までの遅れはどこまで許される？","back":"目安は、0.1秒以下ならほぼ気づかない、0.2〜0.3秒は気づくが慣れれば操作できる、0.5秒以上は手が追いつかず細かい作業が難しい。2秒では物の手渡しもできないので、分身ロボットの想定は0.3秒に訂正した。","key":false,"src":"DAY322"},{"id":"r343","category":"learning","sub":"データの集め方","type":"term","front":"一時停止と持ち直し（スマホ遠隔操作）","back":"ボタンを1回押すとロボットが止まり、スマホを自由に動かせる。もう1回押すとその時点のスマホとロボットの位置を新しい基準にして再開する。スマホの小さな可動範囲でロボットの広い範囲を操作できる。","key":false,"src":"研究メモ:Phone2Act（スマホ遠隔操作）"},{"id":"r344","category":"learning","sub":"データの集め方","type":"qa","front":"スマホ遠隔操作の「安全の二段構え」とは？","back":"①手先の目標を設定した直方体の範囲内に収める。②前回から一定距離（例: 60mm）以上飛んだ目標は捨てる（追跡外れ・スマホ落下・通信の乱れ対策）。mechArm の実機ガードと同じ考え方を入力側で先にかけている。","key":false,"src":"研究メモ:Phone2Act（スマホ遠隔操作）"},{"id":"r345","category":"learning","sub":"データの集め方","type":"point","front":"遠隔操作のアバターで人が働くこと自体が、自律ロボットの学習データを生む。行き着く形は、人が「このカップを取る」と意図を出し、ロボット側のAIが力加減や位置合わせを補う分担。","back":"","key":false,"src":"DAY321"},{"id":"r346","category":"learning","sub":"データの集め方","type":"point","front":"ロボット操作の自律レベルはL3（器用な操作）が現フロンティアで、π0.5やGR00Tがここにいる。L4には数億〜十億軌跡級のデータが要ると見積もられ、ロボット版インターネットが無いこと（データの島々）が最大の壁。","back":"","key":false,"src":"DAY282"},{"id":"r347","category":"learning","sub":"データの集め方","type":"qa","front":"熟練者の手元を長時間撮っておけば、将来その映像でロボットを模倣学習させられる？","back":"そのままではできない。模倣学習に要るのは、その機体・そのグリッパーでタスクを人が操作して集めたデータで、人の手の映像とは形式が違う。撮る価値は、映像から判断基準（どこを見て何で決めているか）を抜けること。本人が答えられるうちに理由を聞くほうが価値が高い。","key":false,"src":"DAY314"},{"id":"r348","category":"learning","sub":"記録と教示データ","type":"point","front":"教示データには意味を付ける：対象物の位置、工程ラベル（APPROACH_PICK→PICK→APPROACH_PLACE→PLACE）、グリッパーの開閉印。構造を持たないデータは、増やしても使えないデータが増えるだけ。","back":"","key":false,"src":"DAY226"},{"id":"r349","category":"learning","sub":"記録と教示データ","type":"qa","front":"教示データから「アプローチ姿勢」を抜くとき、工程の最後の姿勢を代表点にすると何が起きたか？","back":"工程キーを降下し終わった後に押していたため、APPROACH_PICK の終端がほぼ PICK と同じ姿勢（差0.18°）になり、上空のアプローチが消えた。工程内で PICK から最も遠い姿勢を選ぶ方式で解決した。教示では工程キーを動作の前に押す。","key":false,"src":"DAY228"},{"id":"r350","category":"learning","sub":"記録と教示データ","type":"point","front":"教示データは成功動作の録画ではなく、あとから姿勢を引ける実機の地図。箱に置く姿勢は勘で三度外したが、過去の教示軌道のグリッパー開放時点にそのまま残っていた。","back":"奥行きごとに掴める姿勢を教えておき、検出した奥行きに最も近い姿勢を自動選択する使い方もできる（最寄りでも35mm以上離れていれば掴みに行かず中断）。","key":false,"src":"DAY232・DAY244"},{"id":"r351","category":"learning","sub":"記録と教示データ","type":"qa","front":"Pick&Placeの記録を、まばらなスナップショットではなく映像＋関節の連続記録にしたのはなぜか？どんな原則を置いたか？","back":"模倣学習（LeRobot・SmolVLA系）は一定周波数で関節状態と同期した連続記録を要求し、1試行6枚程度の画像では軌跡として読めないため。記録係（recorder）は観測者で制御経路に一切入らず、起動していなくても死んでも本線は完走する、を絶対原則にした。","key":false,"src":"DAY287"},{"id":"r352","category":"learning","sub":"記録と教示データ","type":"point","front":"Phone2Act の記録ノードは、全情報源の新しいデータがそろった時だけ1コマ記録し、映像はメモリに溜めて1回分の終了後に MP4 へ書き出す（記録の時間精度を保つため）。出力はそのまま LeRobot 形式。","back":"","key":false,"src":"研究メモ:Phone2Act（スマホ遠隔操作）"},{"id":"r353","category":"learning","sub":"記録と教示データ","type":"term","front":"LeRobotDataset の構成","back":"meta/info.json（全体の設計図）、meta/stats.json（項目ごとの平均・標準偏差。学習時の正規化に使う）、meta/tasks.jsonl（作業の説明）、meta/episodes/（1回分ごとの情報）、data/（関節角などを parquet で）、videos/（カメラごとの MP4）。","key":false,"src":"研究メモ:Robot Learning Tutorial（LeRobot入門書）"},{"id":"r354","category":"learning","sub":"記録と教示データ","type":"qa","front":"「失敗から学ぶループ」のための機体に要るものは？（mechArmからSO-101を選び直した理由）","back":"ループの主役は失敗の量と、それを記録する仕組み。mechArm には失敗の瞬間を見る手首カメラも、失敗を量産するテレオペの入口も無い。SO-101 は安価なまま、テレオペ・LeRobot 形式の記録・手首カメラ前提の設計をエコシステムごと持つ。","key":false,"src":"DAY225"},{"id":"r355","category":"learning","sub":"合成データ","type":"point","front":"R2R2R（実演動画から学習データを生成する研究）は、スマホ動画2本（物体の周囲スキャンと人が手で動かす動画）から3D形状と物体の軌跡を作り、開始・終了位置を変えて何千通りに作り直し、微分逆運動学で関節角を出して描画する。","back":"","key":false,"src":"研究メモ:R2R2R（実演動画1本から学習データ生成）"},{"id":"r356","category":"learning","sub":"合成データ","type":"qa","front":"R2R2Rの「実演1本で遠隔操作150本に匹敵」は、どの条件の数字？","back":"生成データを1,000本まで増やしたときの話。π0-FASTでマグを載せるタスクは、遠隔操作150本で73.3%、生成150本で33.3%、生成1,000本で80.0%。同じ本数なら人のデータのほうがずっと良く、付録の検定では「同等」と言えるタスクは1つもなかった。当初（DAY214）は「150回のテレオペと同等」と受け取っていたが、DAY323で条件付きと分かった。","key":false,"src":"DAY214・DAY323・研究メモ:R2R2R（実演動画1本から学習データ生成）"},{"id":"r357","category":"learning","sub":"合成データ","type":"qa","front":"R2R2Rの生成データで、本当に成功率に効いていたものは？","back":"きれいな画像の量ではなく、開始位置と終了位置がばらついた動きを作れること。動きを作り直さず元の動きを再生するだけだと、マグのタスクで π0-FAST は80.0%→0.0%、Diffusion Policy は53.3%→6.7%に落ちた。逆に背景や机の模様を変えすぎると π0-FAST は73.3%→35.3%に下がった。","key":true,"src":"DAY323・研究メモ:R2R2R（実演動画1本から学習データ生成）"},{"id":"r358","category":"learning","sub":"合成データ","type":"point","front":"マグをコーヒーメーカーに載せるタスクで、実データ150本と生成データ1,000本を混ぜて学習させると、Diffusion Policy は40.0%（実データのみ）→86.7%に伸びた。π0-FAST は73.3%で変わらなかった。","back":"","key":false,"src":"研究メモ:R2R2R（実演動画1本から学習データ生成）"},{"id":"r359","category":"learning","sub":"合成データ","type":"point","front":"NVIDIA GR00T-Mimic は少数の人間デモから78万本の合成軌道を11時間で生成した（人間デモ6,500時間相当）。合成と実データの併用で、実データのみより GR00T N1 の性能が40%向上した。","back":"","key":false,"src":"DAY166"},{"id":"r360","category":"learning","sub":"合成データ","type":"term","front":"ドメインランダム化","back":"シミュレーションで光・テクスチャ・位置などをランダムに変えて学習させ、現実のばらつきに耐えるようにする手法。OpenAIのDactylはシミュレーションだけで学習し、これで実機のロボットハンドへ転移した（6,000以上のCPUコアと約30時間の訓練）。","key":false,"src":"DAY212・DAY214"},{"id":"r361","category":"learning","sub":"手法とモデル","type":"term","front":"ACT（Action Chunking Transformer）","back":"1ステップずつではなく、次の数十〜100ステップ分の関節位置をまとめて予測する（アクションチャンク）模倣学習の手法。安い双腕構成ALOHAと同時に提案された。まとめて予測するだけで成功率が1%→44%に上がり、誤差の累積で訓練データの分布から外れる問題を抑える。10分のデモで難タスク80〜90%の成功率を出した。","key":false,"src":"DAY214・DAY323・研究メモ:Robot Learning Tutorial（LeRobot入門書）"},{"id":"r362","category":"learning","sub":"手法とモデル","type":"term","front":"Diffusion Policy","back":"ノイズから動きを削り出す（拡散モデルで行動の系列を生成する）模倣学習の手法。実演50〜150本（遠隔操作で15〜60分）で学習でき、10ステップ程度で動きが出る。元論文の著者は単純な畳み込み型から始めるよう勧めている（変換器型は設定に敏感）。","key":false,"src":"研究メモ:Robot Learning Tutorial（LeRobot入門書）"},{"id":"r363","category":"learning","sub":"手法とモデル","type":"term","front":"VLA（視覚・言語・行動モデル）","back":"画像と言葉の指示からロボットの行動を出すモデル（RT-2が起点。OpenVLA・π0・SmolVLAなど）。大規模な視覚言語モデルを行動を出力するよう追加学習させ、言語理解が制御に直結する。観察→行動の対応は学ぶが、その行動で世界がどう変わるかは理解していないため、環境が少し変わると失敗しやすい。","key":false,"src":"DAY214・DAY276"},{"id":"r364","category":"learning","sub":"手法とモデル","type":"term","front":"π0.5（パイ・ゼロ・ゴ）","back":"Physical Intelligence社が重みとコード（openpi・Apache-2.0）を公開しているVLA。1万時間以上のロボットデータで学習したベースモデルと、特定ロボット向けに追加学習済みのモデル（例：Franka 7軸アームのDROID）がある。自分の機体で使うには、自分でデータを集めて追加学習するのが前提。","key":false,"src":"DAY326"},{"id":"r365","category":"learning","sub":"手法とモデル","type":"term","front":"SmolVLA","back":"約4.5億パラメータの小型の汎用ロボットモデル。π0 に匹敵しつつ約40%速く、メモリは6分の1。SO-100／101 の公開データセット450以上（約2万本）で事前学習。学習時とカメラの名前・解像度を一致させる必要がある。","key":false,"src":"研究メモ:Robot Learning Tutorial（LeRobot入門書）"},{"id":"r366","category":"learning","sub":"手法とモデル","type":"qa","front":"SO-101 の並列実機評価（実演50本で学習）で、手法の成績はどうだったか？","back":"総合の成功率は π0.5 が47.6%で首位、Diffusion Policy 26.7%、ACT 19.2%、SmolVLA 15.0%（7手法中最下位）。双腕では順位が入れ替わり、Diffusion Policy が2位（35.8%）、ACT は2.5%に落ちる。ケーブルをホルダーに押し込む接触の多い作業は全手法で0%。","key":false,"src":"研究メモ:ArmnetBench（SO-101並列実機評価）"},{"id":"r367","category":"learning","sub":"手法とモデル","type":"point","front":"必要デモ数の目安：ACTは50〜200（単純なPick&Placeなら20〜30）、Diffusion Policyは100〜500、VLAの追加学習は20〜50。対して Open X-Embodiment は100万超の軌跡・22機種・527スキルを束ねる。","back":"","key":false,"src":"DAY282"},{"id":"r368","category":"learning","sub":"手法とモデル","type":"qa","front":"ロボット学習の事前学習の3階層とは？小データ模倣学習（MicroFactory型）はどれを残しているか？","back":"第1層は視覚バックボーンの事前学習（ImageNet・DINOv2・SigLIP・CLIP）、第2層は複数タスク・複数ロボットの行動の横断事前学習、第3層はネット規模VLMの意味の事前学習（RT-2・π0）。小データ型は第1層だけ残し、第2・第3層を捨てている。","key":false,"src":"DAY282"},{"id":"r369","category":"learning","sub":"手法とモデル","type":"qa","front":"GEN-0・π0・GR00T N1は、構成とデータの集め方がどう違う？","back":"GEN-0は知覚と行動を1本の流れで同時に進め100Hzで行動を出す。データは実世界の約27万時間のみ。π0は統合トランスフォーマーとAction Expertの組み合わせで、フローマッチングにより50Hzで行動を出す。データは実世界とオープンデータ。GR00T N1は遅い層（VLM 10Hz）と速い層（DiT 120Hz）を分ける構成で、シミュレーションと合成データを使う。","key":false,"src":"DAY126"},{"id":"r370","category":"learning","sub":"手法とモデル","type":"term","front":"クロスエンボディメント","back":"異なる機体（体）の間で、同じ動作モデルを転用すること。GEN-0では、7自由度のFlexiv Rizon 4と6自由度のUR5の間で、タスク固有のデータなしに転移できたとされる。","key":false,"src":"DAY126"},{"id":"r371","category":"learning","sub":"手法とモデル","type":"qa","front":"手先カメラで学習したポリシーを、収集時と別のアームで使い回せるのはなぜか？条件は？","back":"ポリシーは「手先カメラにこう映ったら手先を次にこう動かす」という手先座標系で閉じた入出力で、アームの型番やリンク長が出てこない。アーム固有の部分は逆運動学の薄い一層に押し込める。条件は①グリッパー形状を揃える②手先カメラの取付位置・画角を同じにする③そのアームが目標姿勢に物理的に届くこと。","key":false,"src":"DAY291"},{"id":"r372","category":"learning","sub":"手法とモデル","type":"qa","front":"最近のVLA研究で、深度なしのRGBカメラ2〜3台が主流なのはなぜ？","back":"RGBにも深度の手がかりが多く、深度だけでは判別できないタスクが多い。実機の深度はノイズや欠損が多く、シミュの深度は完璧すぎて差が大きい。RGBはネット上に大量の動画や事前学習済みエンコーダーがある。深度のノイズが方策の予測不能な挙動を招くこともある。","key":false,"src":"DAY166"},{"id":"r373","category":"learning","sub":"手法とモデル","type":"term","front":"JEPA（Joint Embedding Predictive Architecture）","back":"Yann LeCun が提唱した枠組み。未来を画像として生成せず、潜在空間（特徴ベクトル）で予測する。影・照明・ノイズまで再現する必要がなく、位置・速度・姿勢・関係性といった重要な要素だけを学ぶ。","key":false,"src":"DAY276"},{"id":"r374","category":"learning","sub":"手法とモデル","type":"qa","front":"VLA-JEPA はなぜ世界モデルを使うのに推論が軽いのか？","back":"学習時だけ世界モデル（V-JEPA2）を通し、損失を行動の損失と世界モデルの損失の和にする。推論時には世界モデルを捨てるので重くならない。公式デモは RTX3080・VRAM 6GB未満で約10Hz、追加学習のデモは13個だった。","key":false,"src":"DAY276"},{"id":"r375","category":"learning","sub":"VLMの使い方と推論の実行","type":"qa","front":"VLM（画像と言葉を扱うモデル）の4つの役割のうち、どれが借りられ、なぜポリシーだけは自分で作るしかないのか？","back":"知覚（シーンの言語化）・高レベル計画・報酬/評価は「見て、言葉にして、考える」仕事で、ネット規模の世界知識がそのまま効くので市販VLMを借りられる。ポリシー（動作を直接出すVLA）は、その身体をある速度・角度で動かすと何が起きるかという身体固有の知識で、ネット上に無いから学習で教え込むしかない。","key":true,"src":"DAY221"},{"id":"r376","category":"learning","sub":"VLMの使い方と推論の実行","type":"term","front":"System 1 / System 2（Hi Robot）","back":"考える脳（System 2：上位のVLMが段取りを立てる）と手を動かす脳（System 1：下位のπ0がモーター指令に変える）を分ける二層構造。自前で組むなら、VLMの出力を「掴む／置く／待機」の固定語彙に縛り、動作プリミティブと一対一で対応させると計画と実行が噛み合う。","key":false,"src":"DAY219"},{"id":"r377","category":"learning","sub":"VLMの使い方と推論の実行","type":"term","front":"スキルへの接地（グラウンディング／SayCan）","back":"VLMが物理的に不可能な手順を出すのを防ぐ考え方。「役に立つ度（VLM側）」と「実行可能度（実機側）」を掛け合わせ、両方高い行動だけ選ぶ。実装は、呼べるスキル（PICK・PLACE・APPROACH・HOME）のリストを先に渡し、その中からしか選ばせない。","key":false,"src":"DAY221"},{"id":"r378","category":"learning","sub":"VLMの使い方と推論の実行","type":"qa","front":"VLMを計画層に置くときの鉄則3つは？","back":"①遅いプランナと速いスキルを分ける：計画はタスクの区切りでだけ回し、動作はローカルの send_angles と FK ルックアップが担う。②スキルを強制する：許可されたAPIからしか選ばせない。③判定を二重化する：VLMの評価を鵜呑みにせず、到達許容2.5°や箱の高さなど確定済みの幾何と照合する。","key":false,"src":"DAY221"},{"id":"r379","category":"learning","sub":"VLMの使い方と推論の実行","type":"qa","front":"オーケストレーション型エージェントとVLAはどう役割が違う？","back":"エージェント型は知覚・記憶・道具とやり取りし、どのスキルを呼ぶかを秒単位で判断する（自分では物理動作をしない）。VLAはカメラ画素からミリ秒単位で連続動作を生成する。掴む精度や動的バランスはVLA、運ぶ・人との協調・曖昧な指示の理解はエージェント型が得意で、境界はレイテンシ（応答の遅れ）にある。","key":false,"src":"DAY249"},{"id":"r380","category":"learning","sub":"VLMの使い方と推論の実行","type":"qa","front":"π0.7 がプロンプトに「how（どうするか）」の注釈を足したのは何のためか？","back":"多様なデータをただ混ぜても性能が上がらなかったため。速度・品質・制御方式（関節制御か手先制御か）・視覚的サブゴール画像を注釈し、出来の悪い自律データも「低品質」とラベルして訓練に再利用できるようにした。向こうにとって how はデータをスケールさせる道具で、Motion UX では体験を設計する主題として扱う。","key":false,"src":"DAY219"},{"id":"r381","category":"learning","sub":"VLMの使い方と推論の実行","type":"qa","front":"人の手の一人称動画は、運動の層と判断の層のどちらに入れるべきか？","back":"判断の層（System 2）。人の手とグリッパは見た目も自由度も違い、その差を埋めるには大規模ロボットデータで事前学習した土台モデルが要る。土台を持たない個人は、動画から手の3D軌道ではなく「どの順番でどう判断したか」をサブゴール系列として抜き出す使い方なら効く。","key":false,"src":"DAY219"},{"id":"r382","category":"learning","sub":"VLMの使い方と推論の実行","type":"qa","front":"LeRobot が推論を Policy Server と Robot Client に分けるのはなぜか？どうやってロボットを止めずに動かすか？","back":"方策推論は重くて遅く、制御ループは高頻度・低ジッタ（揺らぎ）で回す必要があるため、同居させると推論のたびに制御がつっかえる。方策が複数ステップ分の動き（アクションチャンク）を予測し、ロボットがそれを実行している間に次を計算する非同期推論で待ち時間を消す。手元の動作が残り少なくなったら次を頼み、ほぼ同じ観測は捨てる。2台に分けるなら Wi-Fi のジッタを避けて有線LANで結ぶ。","key":false,"src":"DAY277・研究メモ:Robot Learning Tutorial（LeRobot入門書）"},{"id":"r383","category":"learning","sub":"VLMの使い方と推論の実行","type":"qa","front":"往復に約0.4秒かかっても、VLAで動くロボットが止まりにくいのはなぜ？","back":"π0.5は1回の計算で数ステップ分の動きをまとめて返すので、ロボットは返ってきた動きを順に実行しながら次の計算を頼めるから。どこまでの往復時間なら止まらずに済むかは、1ステップの長さと、何ステップ実行してから次を頼むかで決まる（30コマ毎秒なら制御周期は33ミリ秒）。","key":false,"src":"DAY326・研究メモ:Robot Learning Tutorial（LeRobot入門書）"},{"id":"r384","category":"learning","sub":"VLMの使い方と推論の実行","type":"point","front":"必要なGPUはモデルのVRAMでほぼ決まる。Pi0（30億パラメータ）は推論時に約14GB、SmolVLAは約2GB。データセンターGPUが要るのは学習側で、推論は消費者向けハイエンド1枚で成立する。","back":"","key":false,"src":"DAY277"},{"id":"r385","category":"learning","sub":"VLMの使い方と推論の実行","type":"qa","front":"π0.5の最初の推論で、クライアントが「keepalive ping timeout」で切断したのはなぜ？","back":"π0.5はJAXで動き、最初の1回だけGPU向けのコンパイルが走る。サーバーは計算中に通信処理を止めるので、クライアントのwebsocketsが20秒ごとに送る生存確認（ping）に返事ができず切断された。実機ではタイムアウトを延ばすか、起動直後に1回空回ししてコンパイルを済ませる。","key":false,"src":"DAY326"},{"id":"r386","category":"learning","sub":"VLMの使い方と推論の実行","type":"qa","front":"動作の継ぎ目を、複数の予測を平均して均すとなぜ失敗するのか？","back":"有効な動きの平均は有効な動きとは限らない（障害物を上から避ける軌道と下から避ける軌道の平均は障害物に突っ込む）。論文では激しく振動して保護停止した。解決策は、実行が確定した部分を固定し、続きをそれと整合するように生成し直す方法で、推論遅延にも頑健だった。","key":false,"src":"DAY223"},{"id":"r387","category":"society","sub":"導入が進まない構造","type":"point","front":"ロボットの動作には持ち運びの効く形（ポータビリティ）が無い。メーカーごとに制御言語・通信・座標系の定義が違い、ある機種の動作プログラムは別機種で動かない。","back":"同じ機種でもカメラ位置・机の高さ・ワークが違うと前回の学習が移らず、2台目がフルコストになる。この再設計がSIer（導入を請け負う会社）の工数の正体。","key":false,"src":"DAY102・DAY286"},{"id":"r388","category":"society","sub":"導入が進まない構造","type":"qa","front":"日本のロボット導入でSIerに全面委託すると、どんな副作用があるか？","back":"なぜその動作・パラメータになったかが導入企業側に残らず、次の導入でも再びSIerに頼るので知識不足が続く。フィジカルAIでは物の位置や照明が変わるたびに動作を再設計・再学習できる組織能力が要り、「発注して3ヶ月待つ」では価値を引き出せない。","key":false,"src":"DAY107・DAY174"},{"id":"r389","category":"society","sub":"導入が進まない構造","type":"point","front":"多品種少量生産では、品種ごとの動作の再設定コストがロボットの投資回収を下げる。","back":"デジタルツインでの事前設計・検証と、汎用ロボット＋少量データの学習の組み合わせで、このコストを下げられる可能性がある。","key":false,"src":"DAY107・DAY174"},{"id":"r390","category":"society","sub":"導入が進まない構造","type":"point","front":"導入の動機は「コスト削減」から「人がいないから入れるしかない」へ移りつつある。心理的な引き金は賃金水準より欠員（時給を上げても応募が来ない）で、人口減少地域で先に来る。","back":"人が確保できなければ自動化しないほうが高くつき、投資回収の計算軸が変わる。導入・インテグレーション費は本体と同等以上が通例で、そこを下げれば分岐点を手前に引き寄せられる。","key":false,"src":"DAY174・DAY264"},{"id":"r391","category":"society","sub":"導入が進まない構造","type":"qa","front":"移乗ロボットのように技術があっても現場に普及しないのはなぜ？","back":"詰まりの正体は性能ではなく、現場での体験と経済の設計にある。移乗は準備に時間がかかり結局人力の方が速い。農業は稼働率、飲食は単価の壁がある。","key":false,"src":"DAY264"},{"id":"r392","category":"society","sub":"導入が進まない構造","type":"qa","front":"産業用ロボットが60年かけても中小企業に降りてこないのに、ルンバが普及したのはなぜ？","back":"大企業の解は環境の標準化で、中小には揃える規模がなく設計工数が割れない（ボトルネックは機械の値段ではない）。ルンバは性能を諦め、取りこぼしても誰も困らない仕事を選んで失敗の代償をゼロにしたため、環境整備なしで使えた。","key":false,"src":"DAY306"},{"id":"r393","category":"society","sub":"導入が進まない構造","type":"qa","front":"中小企業の現場に、人型ロボットより「既存の機械へのAI後付け（レトロフィット）」が入りやすいのはなぜ？","back":"投資がカメラと制御ユニットの追加で済み、作業員は慣れた機械をそのまま使え、最終判断は人に残る。導入前後で作業時間を比べやすく、AIが誤動作しても手動に戻せば仕事は止まらない。弱点は機械ごと・現場ごとに毎回の調整が要ること。","key":false,"src":"DAY315"},{"id":"r394","category":"society","sub":"現場で足りない設計","type":"point","front":"導入現場で足りないのは「動くロボットを作れる人」より「どう動くかを設計できる人」。","back":"要るのは、現場の要望を実装仕様に訳す力、人とロボットの分担と例外時に人へ引き渡す流れの設計、使う人の視点で検証し改善を回す仕組みの3つ。","key":true,"src":"DAY107・DAY174"},{"id":"r395","category":"society","sub":"現場で足りない設計","type":"point","front":"ロボットに渡す仕事が人間の職種の輪郭（看護師の仕事・仕分けの仕事）で切り出されている。例外を含む部分は人に残し、例外の出ない部分だけを切り取って渡す。この切り取りを決める工程が誰の担当でもない。","back":"","key":true,"src":"DAY314"},{"id":"r396","category":"society","sub":"現場で足りない設計","type":"qa","front":"産業用ロボットの外側に、自動化されない仕事が積み上がっているのはなぜ？","back":"大量と精度で解ける仕事だけが自動化されてきた結果、解けなかった仕事が外に残っているから。毎回形が違う物（食品・農産物・返品）や、数が少なく専用機の予算が出ない工程などで、共通点は精度不足ではなく「人が要求を仕様に書けない」こと。","key":false,"src":"DAY314"},{"id":"r397","category":"society","sub":"現場で足りない設計","type":"point","front":"配膳・清掃・警備のサービスロボットは、どれも定常動作は解けていて、例外が来たときに止まる。導入後に例外対応が人に戻る主因は、技術不足ではなく運用人材の不足（三菱総合研究所）。","back":"","key":true,"src":"DAY306"},{"id":"r398","category":"society","sub":"現場で足りない設計","type":"qa","front":"配膳ロボの「横取り」対策が、ロボット本体ではなくテーブル端末に入ったのはなぜ？（しゃぶ葉の例）","back":"横取りする客はロボットを見ておらず、ロボット上の光は手が動き始めた後にしか目に入らない。端末通知なら手が動く前に、客が既に見ている画面に割り込める。端末は自社管理で直しやすい一方、ロボット側はメーカーのファーム更新を3,000台に配る必要がある。","key":false,"src":"DAY306"},{"id":"r399","category":"society","sub":"現場で足りない設計","type":"qa","front":"警備ロボットが配膳・清掃より普及しない構造的な理由は？","back":"巡回ロボットは一度に一箇所にしかおらず、全地点を同時に見る固定カメラに検知で構造的に負ける。さらに移動のコスト（バッテリー・LiDAR・転倒・段差）を払いながら、見つけた後に扉を閉める・人を止めるといった物理作用を持たない。配膳は運ぶ、清掃は床に触れる作用があるから成立している。","key":false,"src":"DAY306"},{"id":"r400","category":"society","sub":"現場で足りない設計","type":"point","front":"ロボットの固有領域は、世界の物理状態を変えること（力を出す・移動する・掴んで状態を変える）。情報を出すだけの案はスマートスピーカーやディスプレイで足りる。","back":"","key":false,"src":"DAY264"},{"id":"r401","category":"society","sub":"環境と役割で解く","type":"qa","front":"半導体工場のロボットは賢くないのに、なぜほぼ全自動で動くのか？","back":"業界がFOUP（ウェハキャリア）をSEMI規格で標準化し、ウェハの位置が規格で決まっているから。知能の問題を規格の問題に変換して解いた。パレット・トート・パーツフィーダも同じで、ロボットを賢くせずワーク側のばらつきを下げている。","key":false,"src":"DAY286"},{"id":"r402","category":"society","sub":"環境と役割で解く","type":"point","front":"ロボットを賢くする前に、治具で環境側のばらつきを消す。MicroFactory の本質は、治具設計を AI と3Dプリンタで安くしたこと。","back":"","key":false,"src":"研究メモ:Physical AIが学習できる環境の調査"},{"id":"r403","category":"society","sub":"環境と役割で解く","type":"point","front":"現場のロボットは、本体・関節制御・安全の仕組みを従来型のまま残し、AIを「何がどこにあるかを見る目」と「段取り」にだけ入れている。AIが何を・どこへを決め、どう動くか（通り道・速度・安全）は従来の制御が保証する。","back":"","key":true,"src":"DAY324"},{"id":"r404","category":"society","sub":"環境と役割で解く","type":"qa","front":"学習したロボットの動きのずれを吸収する方法は？","back":"4つある。機械で吸収する（治具や、力を受けると逃げるRCCなどの機構）、役割を分ける（AIは粗く決め、最後の数mmは従来の位置・力制御が詰める）、環境を変える（部品形状や作業台を失敗しにくく設計し直す）、データで詰める（大量の実機データや触覚で精度を上げる）。どれを主軸にするかで、精度の責任を誰が負うかも変わる。","key":false,"src":"DAY324"},{"id":"r405","category":"society","sub":"環境と役割で解く","type":"qa","front":"複数工程のロボット作業で、各工程の間に検証（Verify）と再試行を置くと何が変わる？","back":"工程成功率は掛け算で効く（95%×5工程≒77%、90%×5工程≒59%）。Verify＋1回の再試行で90%の工程が実質99%になり、5工程でも約95%になる。","key":true,"src":"研究メモ:Physical AIが学習できる環境の調査"},{"id":"r406","category":"society","sub":"環境と役割で解く","type":"term","front":"ロボットの動かし方の4段階","back":"直接操縦（人がすべて操作）→補助付きの操縦（人が大まかに指示し、細部や衝突回避はロボット）→見守り付きの自律（詰まったときだけ遠隔の人が介入し、1人で複数台を見る）→群の管理（複数台の配置や役割をシステムが決める）。人の操縦で始め、データがたまった作業から順に自律へ移す。","key":false,"src":"DAY324"},{"id":"r407","category":"society","sub":"環境と役割で解く","type":"point","front":"AIRoA（AIロボット協会）はトヨタ HSR を5拠点・44台で遠隔操作し、5,025時間・成功エピソード約118万件を公開。平和島拠点では収集・学習・実機検証を同じ拠点で回し、検証結果をすぐ次の収集に反映する。","back":"","key":false,"src":"研究メモ:Physical AIが学習できる環境の調査"},{"id":"r408","category":"society","sub":"安全・規制・セキュリティ","type":"qa","front":"フィジカルAIがソフトウェアAIより難しいのはなぜ？","back":"出力が物理的な動作なので、失敗のコストが高い（機器の損傷・安全リスク）。現実は照明が変わり、物の位置がずれ、人が割り込むなど常に変動し、同じ入力に同じ出力が保証されない。その変動に対応しながら安全に動き続ける必要がある。","key":false,"src":"DAY107"},{"id":"r409","category":"society","sub":"安全・規制・セキュリティ","type":"point","front":"Physical AIは身体に触れるため、ソフトウェアAIより政治的な摩擦が大きい。Cruiseは2023年の1件の事故で運行許可を止められた。技術は指数関数的に進むが、制度は線形にしか進まない。","back":"","key":false,"src":"DAY145"},{"id":"r410","category":"society","sub":"安全・規制・セキュリティ","type":"qa","front":"フィジカルAIでセキュリティの意味はどう変わる？","back":"失敗が情報漏洩ではなく、物理的な破壊やけがにつながる。現実のリスクは高度なSFの話ではなく、単純な認証の穴を突いた乗っ取り。mechArmの操作UIを外部公開するときは、Cloudflare Tunnel＋Accessでロボット側のIPを公開せずに済ませた。","key":false,"src":"DAY155"},{"id":"r411","category":"society","sub":"安全・規制・セキュリティ","type":"qa","front":"日本の産業用ロボット「80W規制」はどう誤解されていて、実際はどうなっているか？","back":"「2013年の改定で80W未満は柵不要になった」は別制度の混同。80W以下の除外は1983年の告示51号（産業用ロボットとみなさない定義）。2013年の通達は、80W超でもリスクアセスメントで危険のおそれが無いと評価できれば柵義務に該当しないという運用の話で、許可ではなく立証責任を移しただけ。規制対象外でも製造物責任・民事責任は免除されない。","key":false,"src":"DAY286"},{"id":"r412","category":"society","sub":"安全・規制・セキュリティ","type":"point","front":"協働ロボットの安全規格の4モードは、監視停止・ハンドガイド・速度と距離の監視・出力と力の制限。接触を許すのは4つ目だけで、主流は人を検知して減速・停止する方式のため、柔らかさより知覚に投資が向いている。","back":"","key":false,"src":"DAY296"},{"id":"r413","category":"society","sub":"安全・規制・セキュリティ","type":"qa","front":"病院ロボットにとって停電と電波断はどう違い、どう設計するか？","back":"電波断は計算機が動いていてクラウドに届かないだけなので、ローカルのフォールバックで吸収できる。停電はロボット自身が電気を失うので、止まる・荷物を落とさない・通路を塞がないなど安全側に倒れる設計が要る。上の機能から順に落ちる段階的縮退を作り、主制御ループはネットワーク呼び出しゼロで完走できるようにする（クラウド呼び出しは任意・タイムアウト付き・ローカル既定値あり）。","key":false,"src":"DAY260"},{"id":"r414","category":"society","sub":"安全・規制・セキュリティ","type":"qa","front":"街に出る地上ロボットの「ナンバープレート」は、ドローンの Remote ID とどう違う必要があるか？","back":"Remote ID は識別情報と位置を電波で放送する機械向けのIDで、視覚的なプレートではない。人のすぐ隣を動く地上ロボットには、電子IDに加え、役割・責任主体・接近の可否を人がひと目で読める視覚IDが要る。既存の安全規格は物理的な安全が中心で、意図の読みやすさは空白のまま。","key":false,"src":"DAY245"},{"id":"r415","category":"society","sub":"人との共存","type":"term","front":"HRI（人とロボットの相互作用）","back":"人とロボットが同じ空間にいるときの相互作用全体の設計。距離の取り方、視線、近づき方と離れ方、物の手渡し、人が横切ったときの止まり方、エラー時の振る舞い、加減速が人の予測に収まるかなどを扱う。","key":false,"src":"DAY194"},{"id":"r416","category":"society","sub":"人との共存","type":"point","front":"ロボット本体の振る舞い（LED・音・ディスプレイ表示・動き出す前の予告動作）は見た目の装飾ではない。ロボットが何をしようとしているかを人が瞬時に読み取れるようにする情報設計である。","back":"","key":false,"src":"DAY194"},{"id":"r417","category":"society","sub":"人との共存","type":"qa","front":"今のロボットの多くが人と一緒に働く設計になっていないのはなぜ？","back":"産業用ロボットは安全柵の中で人を排除し、最大効率を出すよう最適化されてきた。人がいない前提では予備動作や怖がらせない減速は無駄で、削るのが正解だった。柵の外で人と同じ床に立つと、削ってきたものが全部必要になる。今のコスパ計算も、周りの人が怖がって作業が止まる・監視し続けるといった人間側のコストを入れていない。","key":false,"src":"DAY262"},{"id":"r418","category":"society","sub":"人との共存","type":"point","front":"人と共存する現場（家庭・介護・接客・物流）では、谷を越えて自然さを追うより、不気味の谷の手前で機械として礼儀正しく動かす方向が効く。停止の仕方・減速の形・接近角度・状態表示はモデルではなくデザインの問題。","back":"","key":false,"src":"DAY212"},{"id":"r419","category":"society","sub":"人との共存","type":"qa","front":"医療現場での人とロボットの受け渡しは、何を一致させるよう設計するか？","back":"物理的な受け渡しと、責任（と情報）の受け渡しを一致させる。認証はロボットが相手を見て扉を開ける「権限のゲート」、受領は人がカードをかざす「引き受ける宣言」と分ける。受領の前に本来の品目一覧を見せ、欠品時に押せる「差し戻し」も用意して確認を形骸化させない。","key":false,"src":"DAY229"},{"id":"r420","category":"society","sub":"移動・屋外・双腕の市場","type":"qa","front":"自動運転の技術が完成すれば、移動の問題は解決する？","back":"しない。技術は必要条件であって十分条件ではない。過疎地は地図整備や採算の壁で後回しになり、最も必要な地域が最後になる。家から乗り場までのラストワンマイルも残る。","key":false,"src":"DAY145"},{"id":"r421","category":"society","sub":"移動・屋外・双腕の市場","type":"qa","front":"自動運転の高精度地図依存派とマップレス派の違いと、マップレスの本当の弱点は？","back":"依存派（Waymoなど）は事前の高精度3D地図にLiDAR点群を照合して自己位置を出し、運行設計領域（ODD）が地図範囲で決まる。マップレス派（Tesla FSD・Wayve）はカメラ映像からその場で推論する。マップレスの弱点は平均精度ではなく保証で、稀なケースのリスクとODD境界の説明可能性。地図は認識の主役から、外したときのセーフティネットへ役割が移りつつある。","key":false,"src":"DAY290"},{"id":"r422","category":"society","sub":"移動・屋外・双腕の市場","type":"qa","front":"全天候で屋外が開けたとき、その市場は人型が取るのか？","back":"取りにくい。屋外点検は四足がすでにスケールしている（Spot は1,500台超稼働）。二足はバランス制御に演算とバッテリーを食われるので、屋外の長時間稼働では車輪型・移動型双腕が合理的。本命は「全天候×非人型×月額で借りるRaaS」で、人型は人間用の設備をそのまま使う狭い区画になる。","key":false,"src":"DAY245"},{"id":"r423","category":"society","sub":"移動・屋外・双腕の市場","type":"point","front":"双腕が単腕や固定設備に勝つ条件は4つ：片手で押さえて片手で作業する、対象が柔らかく形が毎回違い治具が効かない、作業空間を作り替えられない、人手不足で単調か過酷。","back":"","key":false,"src":"DAY229"},{"id":"r424","category":"society","sub":"移動・屋外・双腕の市場","type":"qa","front":"現場で双腕ロボットが本当に困っているのは把持精度か？","back":"それだけではない。8時間動き続けられないことが大きい（ある二足ロボットは90分稼働で、実際の倉庫では30分刻みの運用）。「デモから配備への谷」が主戦場で、配備の大半は人間の監督に強く依存する。当面の現実解は、人が監督しながら8割を任せる中間状態。","key":false,"src":"DAY229"}]};

      .filter(x => filter === 'all' || (saved[x.id] && saved[x.id].s < GOOD));
    draw();
    track.scrollLeft = 0; cur = 0; updatePos(); showResult();
  }
  function draw() { // 今のカードのまま描き直す（言い終えたあと）
    track.innerHTML = cards.map(x => {
      const say = sayText(x);
      const r = results[x.id], p = saved[x.id];
      const done = r ? `<span class="done${r.score < GOOD ? ' low' : ''}">${r.n > 1 ? `${r.n}回目 ` : ''}一致 ${r.score}%</span>`
        : p ? `<span class="done${p.s < GOOD ? ' low' : ''}">前回 ${p.s}%</span>` : '';
      const lb = x.key ? '<div class="lb">核心</div>' : '';
      const sec = `${cat === 'key' || cat === 'all' ? LABEL[x.category] + '｜' : ''}${x.sub}`;
      let q = '', t, cls = say.length > 60 ? ' long' : '', b = '';
      if (x.type === 'point') {
        if (mode === 'hide' && !r) { t = say.slice(0, 10) + '…'; cls = ' hide'; } else t = say;
        if (mode === 'see' && x.back) b = `<div class="b">${esc(x.back)}</div>`;
      } else {
        const ask = x.type === 'term' ? `「${x.front}」とは？` : x.front;
        if (mode === 'hide' && !r) { q = ''; t = ask; cls = x.front.length > 40 ? ' long' : ''; }
        else { q = `<div class="q">${esc(ask)}</div>`; t = say; }
      }
      const kind = x.type === 'point' ? '要点' : x.type === 'term' ? '用語' : '問い';
      return `<div class="card"><div class="sec">${esc(sec)}</div>${lb}${q}<div class="t${cls}">${esc(t)}</div>${b}<div class="m"><span>${kind}・${esc(x.src)}</span>${done}</div></div>`;
    }).join('') || '<div class="card"><div class="t">ここに出す項目がありません</div></div>';
    const keys = cards.filter(x => x.key).length;
    $('info').textContent = `${cards.length}枚${keys ? `（核心 ${keys}）` : ''}`;
  }

  function updatePos() {
    const el = track.children[0];
    if (!el || !cards.length) { $('pos').textContent = ''; micBtn.disabled = true; return; }
    const w = el.getBoundingClientRect().width + 10;
    cur = Math.min(cards.length - 1, Math.max(0, Math.round(track.scrollLeft / w)));
    $('pos').textContent = `${cur + 1} / ${cards.length}`;
    const cel = track.children[cur]; if (cel) track.style.height = (cel.offsetHeight + 14) + 'px'; // 今のカードの高さに合わせる（長いカードの分の空白を作らない）
    micBtn.disabled = false;
  }
  let posTimer;
  track.addEventListener('scroll', () => { clearTimeout(posTimer); posTimer = setTimeout(() => { const before = cur; updatePos(); if (before !== cur) showResult(); }, 80); }, {passive: true});

  // 文字の比較（GIG の読み合わせと同じ。句読点と空白は無視し、記号は読み方にそろえる）
  const SYM = [['°', '度'], ['mm', 'ミリ'], ['cm', 'センチ'], ['px', 'ピクセル'], ['%', 'パーセント'], ['％', 'パーセント'], ['±', 'プラスマイナス'], ['×', 'かける'], ['＝', 'は'], ['=', 'は'], ['→', ''], ['＋', 'プラス'], ['+', 'プラス']];
  const sym = s => SYM.reduce((t, [a, b]) => t.split(a).join(b), s);
  const PUNCT = /[\s、。，．,.!！?？「」『』（）()・…〜~：:；;"'“”‘’\-―｜|／/①②③④⑤⑥]/;
  const kata2hira = s => s.replace(/[\u30A1-\u30F6]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
  const half = ch => ch.replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  // 1文字ずつ「表示する字」と「比べる字」を持つ（カタカナ・ひらがな、全角・半角、大文字・小文字は同じとみなす）
  const prep = s => [...sym(s)].filter(ch => !PUNCT.test(ch)).map(ch => ({o: ch, k: kata2hira(half(ch).toLowerCase())}));
  const VARIANTS = [['とおり', '通り'], ['ほか', '他'], ['わかり', '分かり'], ['いただ', '頂'], ['でき', '出来'], ['くらい', '位'], ['ころ', '頃'], ['ずれ', 'ズレ'], ['もの', '物'], ['こと', '事'], ['とき', '時'], ['ため', '為']];
  const align = (script, said) => VARIANTS.reduce((t, g) => { const k = g.find(v => script.includes(v)); return k ? g.filter(v => v !== k).reduce((u, v) => u.split(v).join(k), t) : t; }, said);
  function diff(a, b) { // a=カード, b=話した（prep の配列）
    const n = a.length, m = b.length, dp = Array.from({length: n + 1}, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = a[i].k === b[j].k ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    const ops = []; let i = 0, j = 0;
    while (i < n && j < m) { if (a[i].k === b[j].k) { ops.push(['=', a[i].o]); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push(['-', a[i].o]); i++; } else { ops.push(['+', b[j].o]); j++; } }
    while (i < n) ops.push(['-', a[i++].o]); while (j < m) ops.push(['+', b[j++].o]);
    return {ops, same: dp[0][0]};
  }
  function opsHtml(ops) {
    let h = '', run = '', type = null;
    const flush = () => { if (!run) return; const t = esc(run); h += type === '=' ? t : `<span class="${type === '-' ? 'miss' : 'extra'}">${t}</span>`; run = ''; };
    ops.forEach(([o, ch]) => { if (o !== type) { flush(); type = o; } run += ch; });
    flush(); return h;
  }

  function showResult() {
    const x = cards[cur];
    const r = x ? results[x.id] : null;
    if (!r) { $('said').textContent = 'ここに出ます'; $('cmp').textContent = '—'; $('stats').innerHTML = ''; return; }
    $('said').textContent = r.raw || '（聞き取れませんでした）';
    $('cmp').innerHTML = opsHtml(r.ops);
    const p = saved[x.id] && saved[x.id].prev;
    $('stats').innerHTML = `<span>${r.n}回目</span><span>一致 <b class="${r.score >= GOOD ? 'good' : 'bad'}">${r.score}%</b>${p != null ? `（前回 ${p}%）` : ''}</span>`;
  }

  function renderLog() {
    const done = DATA.items.filter(x => results[x.id]);
    $('log').innerHTML = done.length ? done.map(x => { const r = results[x.id], p = saved[x.id] && saved[x.id].prev; const s = x.front;
      return `<tr><td>${esc(s.slice(0, 16))}${s.length > 16 ? '…' : ''}</td><td>${r.score}%${r.n > 1 ? `<br><small>${r.n}回目</small>` : ''}</td><td>${p != null ? p + '%' : '—'}</td></tr>`; }).join('')
      : '<tr><td colspan="3">まだありません</td></tr>';
  }

  // 音声認識（押している間だけ）
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let rec = null, listening = false, finalText = '', interim = '', t0 = 0, target = null, restarts = 0;
  if (!SR) { micBtn.disabled = true; showWarn('このブラウザでは声を文字にできません。iPhoneはSafari、PCはChromeかSafariで開いてください。'); }
  function makeRec() {
    const r = new SR(); r.lang = 'ja-JP'; r.continuous = true; r.interimResults = true;
    r.onresult = e => { if (r !== rec) return; interim = ''; for (let i = e.resultIndex; i < e.results.length; i++) { const tx = e.results[i][0].transcript; if (e.results[i].isFinal) finalText += tx; else interim += tx; } $('said').textContent = (finalText + interim) || '…'; };
    r.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') showWarn('マイクが許可されていません。ブラウザの設定でマイクを許可してください。'); };
    r.onend = () => {
      if (r !== rec) return;
      if (listening && restarts < 3) { restarts++; finalText += interim; interim = ''; rec = makeRec(); try { rec.start(); } catch (_) {} }
      else finish();
    };
    return r;
  }
  // PC：iPhoneと同じ「始まり」「終わり」の音を鳴らす
  let actx = null;
  function beep(up) {
    if (IOS) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const t = actx.currentTime + 0.01;
      (up ? [660, 990] : [990, 660]).forEach((f, k) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t + k * 0.09); g.gain.exponentialRampToValueAtTime(0.25, t + k * 0.09 + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + k * 0.09 + 0.08);
        o.connect(g).connect(actx.destination); o.start(t + k * 0.09); o.stop(t + k * 0.09 + 0.09);
      });
    } catch (_) {}
  }
  const PRE = IOS ? 0 : 200;
  function start(ev) {
    if (micBtn.disabled || listening || !SR) return;
    ev.preventDefault();
    target = cards[cur]; if (!target) return;
    finalText = ''; interim = ''; listening = true; t0 = performance.now(); restarts = 0;
    micBtn.classList.add('on'); micBtn.firstChild.textContent = '聞いています…';
    $('said').textContent = '…'; $('cmp').textContent = '—'; $('stats').innerHTML = '';
    beep(true);
    try { if (rec) rec.abort(); } catch (_) {}
    rec = makeRec();
    const go = () => { if (!listening) return; try { rec.start(); } catch (_) {} };
    PRE ? setTimeout(go, PRE) : go();
  }
  function stop(ev) {
    if (!listening) return;
    if (ev) ev.preventDefault();
    listening = false; target.sec = (performance.now() - t0) / 1000;
    micBtn.classList.remove('on'); micBtn.firstChild.textContent = '押している間だけ聞く';
    setTimeout(() => { try { rec.stop(); } catch (_) { finish(); } beep(false); }, 250); // 言い終わりを取りこぼさない
  }
  function finish() {
    if (!target) return;
    const x = target; target = null;
    const raw = (finalText + interim).trim();
    if (!raw || x.sec < 0.6) { $('said').textContent = !raw ? '聞き取れませんでした。押したまま話して、言い終わってから離してください' : '押す時間が短すぎました'; return; }
    const say = sayText(x);
    const a = prep(say), b = prep(align(say, raw));
    const {ops, same} = diff(a, b);
    const score = a.length ? Math.round(same / Math.max(a.length, b.length) * 100) : 0;
    (tries[x.id] = tries[x.id] || []).push(score);
    results[x.id] = {raw, ops, score, n: tries[x.id].length};
    if (tries[x.id].length === 1) saved[x.id] = {s: score, prev: saved[x.id] ? saved[x.id].s : null};
    else saved[x.id] = {s: score, prev: saved[x.id] ? saved[x.id].prev : null};
    persist();
    const keep = track.scrollLeft; draw(); track.scrollLeft = keep; updatePos(); showResult(); renderLog();
  }
  micBtn.addEventListener('touchstart', start, {passive: false});
  micBtn.addEventListener('touchend', stop, {passive: false});
  micBtn.addEventListener('touchcancel', stop, {passive: false});
  micBtn.addEventListener('mousedown', start);
  window.addEventListener('mouseup', () => stop());
  micBtn.addEventListener('contextmenu', e => e.preventDefault());
  // PC：スペースを押している間だけ聞く／←→でカードを移動
  const typing = e => /INPUT|TEXTAREA|SELECT/.test((e.target || {}).tagName || '');
  window.addEventListener('keydown', e => {
    if (typing(e)) return;
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) start(e); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault(); const el = track.children[0]; if (!el || listening) return;
      const w = el.getBoundingClientRect().width + 10;
      track.scrollTo({left: Math.round(track.scrollLeft / w + (e.key === 'ArrowRight' ? 1 : -1)) * w, behavior: 'smooth'});
    }
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space' && !typing(e)) { e.preventDefault(); stop(e); if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); } });
  window.addEventListener('blur', () => stop());
  if (!IOS) micBtn.querySelector('small').textContent = 'スペースキーでも同じ。←→でカードを移動';

  function showWarn(t) { const w = $('warn'); w.textContent = t; w.hidden = false; }

  const press = (on, off, set) => { $(on).setAttribute('aria-pressed', true); $(off).setAttribute('aria-pressed', false); set(); render(); };
  $('mSee').addEventListener('click', () => press('mSee', 'mHide', () => mode = 'see'));
  $('mHide').addEventListener('click', () => press('mHide', 'mSee', () => mode = 'hide'));
  $('fAll').addEventListener('click', () => press('fAll', 'fWeak', () => filter = 'all'));
  $('fWeak').addEventListener('click', () => press('fWeak', 'fAll', () => filter = 'weak'));
  $('cat').addEventListener('change', e => { cat = e.target.value; render(); e.target.blur(); });
  $('clear').addEventListener('click', () => { results = {}; tries = {}; draw(); showResult(); renderLog(); });
  render();
})();
</script>
</body>
</html>
