,"type":"qa","front":"複数工程のロボット作業で、各工程の間に検証（Verify）と再試行を置くと何が変わる？","back":"工程成功率は掛け算で効く（95%×5工程≒77%、90%×5工程≒59%）。Verify＋1回の再試行で90%の工程が実質99%になり、5工程でも約95%になる。","detail":"","key":true,"src":"研究メモ:Physical AIが学習できる環境の調査"},{"id":"r406","category":"society","sub":"環境と役割で解く","type":"term","front":"ロボットの動かし方の4段階","back":"直接操縦（人がすべて操作）→補助付きの操縦（人が大まかに指示し、細部や衝突回避はロボット）→見守り付きの自律（詰まったときだけ遠隔の人が介入し、1人で複数台を見る）→群の管理（複数台の配置や役割をシステムが決める）。人の操縦で始め、データがたまった作業から順に自律へ移す。","detail":"","key":false,"src":"DAY324"},{"id":"r407","category":"society","sub":"環境と役割で解く","type":"point","front":"AIRoA（AIロボット協会）はトヨタ HSR を5拠点・44台で遠隔操作し、5,025時間・成功エピソード約118万件を公開。平和島拠点では収集・学習・実機検証を同じ拠点で回し、検証結果をすぐ次の収集に反映する。","back":"","detail":"","key":false,"src":"研究メモ:Physical AIが学習できる環境の調査"},{"id":"r408","category":"society","sub":"安全・規制・セキュリティ","type":"qa","front":"フィジカルAIがソフトウェアAIより難しいのはなぜ？","back":"出力が物理的な動作なので、失敗のコストが高い（機器の損傷・安全リスク）。現実は照明が変わり、物の位置がずれ、人が割り込むなど常に変動し、同じ入力に同じ出力が保証されない。その変動に対応しながら安全に動き続ける必要がある。","detail":"","key":false,"src":"DAY107"},{"id":"r409","category":"society","sub":"安全・規制・セキュリティ","type":"point","front":"Physical AIは身体に触れるため、ソフトウェアAIより政治的な摩擦が大きい。Cruiseは2023年の1件の事故で運行許可を止められた。技術は指数関数的に進むが、制度は線形にしか進まない。","back":"","detail":"","key":false,"src":"DAY145"},{"id":"r410","category":"society","sub":"安全・規制・セキュリティ","type":"qa","front":"フィジカルAIでセキュリティの意味はどう変わる？","back":"失敗が情報漏洩ではなく、物理的な破壊やけがにつながる。現実のリスクは高度なSFの話ではなく、単純な認証の穴を突いた乗っ取り。mechArmの操作UIを外部公開するときは、Cloudflare Tunnel＋Accessでロボット側のIPを公開せずに済ませた。","detail":"","key":false,"src":"DAY155"},{"id":"r411","category":"society","sub":"安全・規制・セキュリティ","type":"qa","front":"日本の産業用ロボット「80W規制」はどう誤解されていて、実際はどうなっているか？","back":"「2013年の改定で80W未満は柵不要になった」は別制度の混同。80W以下の除外は1983年の告示51号（産業用ロボットとみなさない定義）。2013年の通達は、80W超でもリスクアセスメントで危険のおそれが無いと評価できれば柵義務に該当しないという運用の話で、許可ではなく立証責任を移しただけ。規制対象外でも製造物責任・民事責任は免除されない。","detail":"","key":false,"src":"DAY286"},{"id":"r412","category":"society","sub":"安全・規制・セキュリティ","type":"point","front":"協働ロボットの安全規格の4モードは、監視停止・ハンドガイド・速度と距離の監視・出力と力の制限。接触を許すのは4つ目だけで、主流は人を検知して減速・停止する方式のため、柔らかさより知覚に投資が向いている。","back":"","detail":"","key":false,"src":"DAY296"},{"id":"r413","category":"society","sub":"安全・規制・セキュリティ","type":"qa","front":"病院ロボットにとって停電と電波断はどう違い、どう設計するか？","back":"電波断は計算機が動いていてクラウドに届かないだけなので、ローカルのフォールバックで吸収できる。停電はロボット自身が電気を失うので、止まる・荷物を落とさない・通路を塞がないなど安全側に倒れる設計が要る。上の機能から順に落ちる段階的縮退を作り、主制御ループはネットワーク呼び出しゼロで完走できるようにする（クラウド呼び出しは任意・タイムアウト付き・ローカル既定値あり）。","detail":"","key":false,"src":"DAY260"},{"id":"r414","category":"society","sub":"安全・規制・セキュリティ","type":"qa","front":"街に出る地上ロボットの「ナンバープレート」は、ドローンの Remote ID とどう違う必要があるか？","back":"Remote ID は識別情報と位置を電波で放送する機械向けのIDで、視覚的なプレートではない。人のすぐ隣を動く地上ロボットには、電子IDに加え、役割・責任主体・接近の可否を人がひと目で読める視覚IDが要る。既存の安全規格は物理的な安全が中心で、意図の読みやすさは空白のまま。","detail":"","key":false,"src":"DAY245"},{"id":"r415","category":"society","sub":"人との共存","type":"term","front":"HRI（人とロボットの相互作用）","back":"人とロボットが同じ空間にいるときの相互作用全体の設計。距離の取り方、視線、近づき方と離れ方、物の手渡し、人が横切ったときの止まり方、エラー時の振る舞い、加減速が人の予測に収まるかなどを扱う。","detail":"","key":false,"src":"DAY194"},{"id":"r416","category":"society","sub":"人との共存","type":"point","front":"ロボット本体の振る舞い（LED・音・ディスプレイ表示・動き出す前の予告動作）は見た目の装飾ではない。ロボットが何をしようとしているかを人が瞬時に読み取れるようにする情報設計である。","back":"","detail":"","key":false,"src":"DAY194"},{"id":"r417","category":"society","sub":"人との共存","type":"qa","front":"今のロボットの多くが人と一緒に働く設計になっていないのはなぜ？","back":"産業用ロボットは安全柵の中で人を排除し、最大効率を出すよう最適化されてきた。人がいない前提では予備動作や怖がらせない減速は無駄で、削るのが正解だった。柵の外で人と同じ床に立つと、削ってきたものが全部必要になる。今のコスパ計算も、周りの人が怖がって作業が止まる・監視し続けるといった人間側のコストを入れていない。","detail":"","key":false,"src":"DAY262"},{"id":"r418","category":"society","sub":"人との共存","type":"point","front":"人と共存する現場（家庭・介護・接客・物流）では、谷を越えて自然さを追うより、不気味の谷の手前で機械として礼儀正しく動かす方向が効く。停止の仕方・減速の形・接近角度・状態表示はモデルではなくデザインの問題。","back":"","detail":"","key":false,"src":"DAY212"},{"id":"r419","category":"society","sub":"人との共存","type":"qa","front":"医療現場での人とロボットの受け渡しは、何を一致させるよう設計するか？","back":"物理的な受け渡しと、責任（と情報）の受け渡しを一致させる。認証はロボットが相手を見て扉を開ける「権限のゲート」、受領は人がカードをかざす「引き受ける宣言」と分ける。受領の前に本来の品目一覧を見せ、欠品時に押せる「差し戻し」も用意して確認を形骸化させない。","detail":"","key":false,"src":"DAY229"},{"id":"r420","category":"society","sub":"移動・屋外・双腕の市場","type":"qa","front":"自動運転の技術が完成すれば、移動の問題は解決する？","back":"しない。技術は必要条件であって十分条件ではない。過疎地は地図整備や採算の壁で後回しになり、最も必要な地域が最後になる。家から乗り場までのラストワンマイルも残る。","detail":"","key":false,"src":"DAY145"},{"id":"r421","category":"society","sub":"移動・屋外・双腕の市場","type":"qa","front":"自動運転の高精度地図依存派とマップレス派の違いと、マップレスの本当の弱点は？","back":"依存派（Waymoなど）は事前の高精度3D地図にLiDAR点群を照合して自己位置を出し、運行設計領域（ODD）が地図範囲で決まる。マップレス派（Tesla FSD・Wayve）はカメラ映像からその場で推論する。マップレスの弱点は平均精度ではなく保証で、稀なケースのリスクとODD境界の説明可能性。地図は認識の主役から、外したときのセーフティネットへ役割が移りつつある。","detail":"","key":false,"src":"DAY290"},{"id":"r422","category":"society","sub":"移動・屋外・双腕の市場","type":"qa","front":"全天候で屋外が開けたとき、その市場は人型が取るのか？","back":"取りにくい。屋外点検は四足がすでにスケールしている（Spot は1,500台超稼働）。二足はバランス制御に演算とバッテリーを食われるので、屋外の長時間稼働では車輪型・移動型双腕が合理的。本命は「全天候×非人型×月額で借りるRaaS」で、人型は人間用の設備をそのまま使う狭い区画になる。","detail":"","key":false,"src":"DAY245"},{"id":"r423","category":"society","sub":"移動・屋外・双腕の市場","type":"point","front":"双腕が単腕や固定設備に勝つ条件は4つ：片手で押さえて片手で作業する、対象が柔らかく形が毎回違い治具が効かない、作業空間を作り替えられない、人手不足で単調か過酷。","back":"","detail":"","key":false,"src":"DAY229"},{"id":"r424","category":"society","sub":"移動・屋外・双腕の市場","type":"qa","front":"現場で双腕ロボットが本当に困っているのは把持精度か？","back":"それだけではない。8時間動き続けられないことが大きい（ある二足ロボットは90分稼働で、実際の倉庫では30分刻みの運用）。「デモから配備への谷」が主戦場で、配備の大半は人間の監督に強く依存する。当面の現実解は、人が監督しながら8割を任せる中間状態。","detail":"","key":false,"src":"DAY229"}]};

  // 保存した練習記録の集計（iCloud の 練習記録 → _tools/practice_review.py → 書き出し時に埋め込む）。端末の記録より新しければこちらを使う

  const sayText = x => x.type === 'word' ? (step === 2 ? x.detail : x.back) : x.type === 'point' ? x.front : x.back;
  const termForms = w => { const m = w.match(/^(.*?)（(.*)）$/); if (!m) return [w]; const sub = m[2].split(/・|、/).map(t => t.trim()).filter(Boolean); return [m[1], ...sub, m[1] + m[2]]; };
  const targets = x => x.type === 'word' && step === 1 ? termForms(x.front).flatMap(t => [`${t}は、${x.back}`, `${t}、${x.back}`]) : [sayText(x)];
  const pool = () => DATA.items.filter(x => step === 3 ? x.type !== 'word' : x.type === 'word');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

  // カテゴリの選択肢（段階ごとに件数が変わる）
  function fillCats() {

  function render() { // 出すカードを選び直して描く

  function draw() { // 今のカードのまま描き直す（言い終えたあと）
    track.innerHTML = cards.map(x => {

      const r = results[rk(x)], p = saved[rk(x)];
      const done = r ? `<span class="done${r.score < GOOD ? ' low' : ''}">${r.n > 1 ? `${r.n}回目 ` : ''}一致 ${r.score}%</span>`
        : p ? `<span class="done${p.s < GOOD ? ' low' : ''}">前回 ${p.s}%</span>` : '';
      const lb = x.key ? `<div class="lb">${x.type === 'word' ? 'まず覚える' : '核心'}</div>` : '';
      const sec = x.type === 'word' ? LABEL[x.category] : `${cat === 'key' || cat === 'all' ? LABEL[x.category] + '｜' : ''}${x.sub}`;
      let q = '', t, cls = say.length > 60 ? ' long' : '', b = '', w = '';
      if (x.type === 'word') {
        const hidden = mode === 'hide' && !r;

        else { w = `<div class="w small">${esc(x.front)}</div><div class="q">${esc(x.back)}</div>`; t = hidden ? 'もう少し詳しく言うと？' : say; cls = hidden ? ' mid hide' : ' long'; }
      } else if (x.type === 'point') {

        if (mode === 'see' && x.back) b = `<div class="b">${esc(x.back)}</div>`;
      } else {

      return `<div class="card"><div class="sec">${esc(sec)}</div>${lb}${w}${q}<div class="t${cls}">${esc(t)}</div>${b}<div class="m"><span>${esc(kind)}</span>${done}</div></div>`;
    }).join('') || '<div class="card"><div class="t">ここに出す項目がありません</div></div>';
    const keys = cards.filter(x => x.key).length;
    $('info').textContent = `${cards.length}枚${keys && cat !== 'key' ? `（${step === 3 ? '核心' : 'まず覚える'} ${keys}）` : ''}${step === 1 ? '・用語から続けて言う' : ''}`;
  }

  function updatePos() {
    const el = track.children[0];

    const w = el.getBoundingClientRect().width + 10;
    cur = Math.min(cards.length - 1, Math.max(0, Math.round(track.scrollLeft / w)));
    $('pos').textContent = `${cur + 1} / ${cards.length}`;
    const cel = track.children[cur]; if (cel) track.style.height = (cel.offsetHeight + 14) + 'px'; // 今のカードの高さに合わせる（長いカードの分の空白を作らない）
    micBtn.disabled = false;
  }
  let posTimer;
  track.addEventListener('scroll', () => { clearTimeout(posTimer); posTimer = setTimeout(() => { const before = cur; updatePos(); if (before !== cur) showResult(); }, 80); }, {passive: true});

  // 文字の比較（GIG の読み合わせと同じ。句読点と空白は無視し、記号は読み方にそろえる）
  const SYM = [['°', '度'], ['mm', 'ミリ'], ['cm', 'センチ'], ['px', 'ピクセル'], ['%', 'パーセント'], ['％', 'パーセント'], ['±', 'プラスマイナス'], ['×', 'かける'], ['＝', 'は'], ['=', 'は'], ['→', ''], ['＋', 'プラス'], ['+', 'プラス']];
  const sym = s => SYM.reduce((t, [a, b]) => t.split(a).join(b), s);
  const PUNCT = /[\s、。，．,.!！?？「」『』（）()・…〜~：:；;"'“”‘’\-―｜|／/①②③④⑤⑥]/;
  const kata2hira = s => s.replace(/[\u30A1-\u30F6]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
  const half = ch => ch.replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));

  const prep = s => [...sym(s)].filter(ch => !PUNCT.test(ch)).map(ch => ({o: ch, k: kata2hira(half(ch).toLowerCase())}));
  const VARIANTS = [['とおり', '通り'], ['ほか', '他'], ['わかり', '分かり'], ['いただ', '頂'], ['でき', '出来'], ['くらい', '位'], ['ころ', '頃'], ['ずれ', 'ズレ'], ['もの', '物'], ['こと', '事'], ['とき', '時'], ['ため', '為']];
  const align = (script, said) => VARIANTS.reduce((t, g) => { const k = g.find(v => script.includes(v)); return k ? g.filter(v => v !== k).reduce((u, v) => u.split(v).join(k), t) : t; }, said);
  function diff(a, b) { // a=カード, b=話した（prep の配列）
    const n = a.length, m = b.length, dp = Array.from({length: n + 1}, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = a[i].k === b[j].k ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    const ops = []; let i = 0, j = 0;
    while (i < n && j < m) { if (a[i].k === b[j].k) { ops.push(['=', a[i].o]); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push(['-', a[i].o]); i++; } else { ops.push(['+', b[j].o]); j++; } }
    while (i < n) ops.push(['-', a[i++].o]); while (j < m) ops.push(['+', b[j++].o]);

  // 音声認識（押している間だけ）
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let rec = null, listening = false, finalText = '', interim = '', t0 = 0, target = null, restarts = 0;
  if (!SR) { micBtn.disabled = true; showWarn('このブラウザでは声を文字にできません。iPhoneはSafari、PCはChromeかSafariで開いてください。'); }
  function makeRec() {
    const r = new SR(); r.lang = 'ja-JP'; r.continuous = true; r.interimResults = true;
    r.onresult = e => { if (r !== rec) return; interim = ''; for (let i = e.resultIndex; i < e.results.length; i++) { const tx = e.results[i][0].transcript; if (e.results[i].isFinal) finalText += tx; else interim += tx; } $('said').textContent = (finalText + interim) || '…'; };
    r.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') showWarn('マイクが許可されていません。ブラウザの設定でマイクを許可してください。'); };
    r.onend = () => {
      if (r !== rec) return;
      if (listening && restarts < 3) { restarts++; finalText += interim; interim = ''; rec = makeRec(); try { rec.start(); } catch (_) {} }
      else finish();
    };
    return r;
  }
  // PC：iPhoneと同じ「始まり」「終わり」の音を鳴らす
  let actx = null;
  function beep(up) {
    if (IOS) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const t = actx.currentTime + 0.01;
      (up ? [660, 990] : [990, 660]).forEach((f, k) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t + k * 0.09); g.gain.exponentialRampToValueAtTime(0.25, t + k * 0.09 + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + k * 0.09 + 0.08);
        o.connect(g).connect(actx.destination); o.start(t + k * 0.09); o.stop(t + k * 0.09 + 0.09);
      });
    } catch (_) {}
  }
  const PRE = IOS ? 0 : 200;
  function start(ev) {
    if (micBtn.disabled || listening || !SR) return;
    ev.preventDefault();
    target = cards[cur]; if (!target) return;
    finalText = ''; interim = ''; listening = true; t0 = performance.now(); restarts = 0;
    micBtn.classList.add('on'); micBtn.firstChild.textContent = '聞いています…';
    $('said').textContent = '…'; $('cmp').textContent = '—'; $('stats').innerHTML = '';
    beep(true);
    try { if (rec) rec.abort(); } catch (_) {}
    rec = makeRec();
    const go = () => { if (!listening) return; try { rec.start(); } catch (_) {} };
    PRE ? setTimeout(go, PRE) : go();
  }
  function stop(ev) {
    if (!listening) return;
    if (ev) ev.preventDefault();
    listening = false; target.sec = (performance.now() - t0) / 1000;
    micBtn.classList.remove('on'); micBtn.firstChild.textContent = '押している間だけ聞く';
    setTimeout(() => { try { rec.stop(); } catch (_) { finish(); } beep(false); }, 250); // 言い終わりを取りこぼさない
  }
  function finish() {
    if (!target) return;
    const x = target; target = null;
    const raw = (finalText + interim).trim();
    if (!raw || x.sec < 0.6) { $('said').textContent = !raw ? '聞き取れませんでした。押したまま話して、言い終わってから離してください' : '押す時間が短すぎました'; return; }
    // 1 単語は「用語＋意味」を一続きで言う。用語はカッコの前後どちらで言ってもよく、「は」は無くてもよい（いちばん合う言い方で比べる）
    const cands = targets(x);
    let best = null;
    cands.forEach(t => { const a = prep(t), b = prep(align(t, raw)); const d = diff(a, b); const sc = a.length ? Math.round(d.same / Math.max(a.length, b.length) * 100) : 0; if (!best || sc > best.score) best = {say: t, ops: d.ops, score: sc}; });
    const {say, ops, score} = best;
    const key = rk(x);
    (tries[key] = tries[key] || []).push(score);
    const at = stamp();
    results[key] = {raw, ops, score, n: tries[key].length, x, st: step};
    if (tries[key].length === 1) saved[key] = {s: score, prev: saved[key] ? saved[key].s : null, at};
    else saved[key] = {s: score, prev: saved[key] ? saved[key].prev : null, at};
    persist();
    attempts.push({id: x.id, step, word: x.front, card: say, said: raw, score, sec: Math.round(x.sec * 10) / 10, at});
    unsaved++; saveLabel();
    const keep = track.scrollLeft; draw(); track.scrollLeft = keep; updatePos(); showResult(); renderLog();
  }
  micBtn.addEventListener('touchstart', start, {passive: false});
  micBtn.addEventListener('touchend', stop, {passive: false});
  micBtn.addEventListener('touchcancel', stop, {passive: false});
  micBtn.addEventListener('mousedown', start);
  window.addEventListener('mouseup', () => stop());
  micBtn.addEventListener('contextmenu', e => e.preventDefault());
  // PC：スペースを押している間だけ聞く／←→でカードを移動
  const typing = e => /INPUT|TEXTAREA|SELECT/.test((e.target || {}).tagName || '');
  window.addEventListener('keydown', e => {
    if (typing(e)) return;
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) start(e); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault(); const el = track.children[0]; if (!el || listening) return;
      const w = el.getBoundingClientRect().width + 10;
      track.scrollTo({left: Math.round(track.scrollLeft / w + (e.key === 'ArrowRight' ? 1 : -1)) * w, behavior: 'smooth'});
    }
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space' && !typing(e)) { e.preventDefault(); stop(e); if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); } });
  window.addEventListener('blur', () => stop());
  if (!IOS) micBtn.querySelector('small').textContent = 'スペースキーでも同じ。←→でカードを移動';

  function showWarn(t) { const w = $('warn'); w.textContent = t; w.hidden = false; }

  const press = (on, off, set) => { $(on).setAttribute('aria-pressed', true); $(off).setAttribute('aria-pressed', false); set(); render(); };
  $('mSee').addEventListener('click', () => { press('mSee', 'mHide', () => mode = 'see'); keepView(); });
  $('mHide').addEventListener('click', () => { press('mHide', 'mSee', () => mode = 'hide'); keepView(); });
  $('fAll').addEventListener('click', () => press('fAll', 'fWeak', () => filter = 'all'));
  $('fWeak').addEventListener('click', () => press('fWeak', 'fAll', () => filter = 'weak'));
  const PREF = 'robotics-review-view';
  const keepView = () => { try { localStorage.setItem(PREF, JSON.stringify({step, cat, mode})); } catch (_) {} };
  const setStep = n => { step = n; [1, 2, 3].forEach(k => $('s' + k).setAttribute('aria-pressed', k === n)); fillCats(); render(); keepView(); };
  [1, 2, 3].forEach(k => $('s' + k).addEventListener('click', () => setStep(k)));
  $('cat').addEventListener('change', e => { cat = e.target.value; render(); keepView(); e.target.blur(); });
  $('clear').addEventListener('click', () => { results = {}; tries = {}; attempts = []; unsaved = 0; saveLabel(); draw(); showResult(); renderLog(); });

  // ===== 記録の保存（GIG の読み合わせと同じ流れ。保存先は iCloud の ロボティクス復習/練習記録） =====
  function stamp() { const d = new Date(), z = n => String(n).padStart(2, '0'); const o = -d.getTimezoneOffset(); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}${o >= 0 ? '+' : '-'}${z(Math.floor(Math.abs(o) / 60))}:${z(Math.abs(o) % 60)}`; }
  let unsaved = 0;
  const saveLabel = () => { $('save').textContent = unsaved ? `結果を保存（未保存 ${unsaved}回）` : '結果を保存'; };
  const STEPNAME = {1: '1 単語', 2: '2 説明', 3: '3 実機の知見'};
  function report() {
    const d = new Date(); const ts = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    let s = `# ロボティクス見直しの記録（${ts}）\n\n${attempts.length}回・データ ${DATA.updated}\n\n`;
    attempts.forEach(a => { s += `## ${STEPNAME[a.step]}｜${a.word}\n- カード：${a.card}\n- 話した：${a.said}\n- 一致 ${a.score}%／${a.sec}秒\n\n`; });
    s += '<!-- 集計用（_tools/practice_review.py が読む） -->\n```json\n' + JSON.stringify({page: 'robotics-review', data: DATA.updated, at: stamp(), tries: attempts}) + '\n```\n';
    return s;
  }
  const fileName = () => { const d = new Date(), z = n => String(n).padStart(2, '0'); return `ロボ見直し_${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}.md`; };
  const doneSaving = msg => { unsaved = 0; $('save').textContent = msg; setTimeout(saveLabel, 2500); };
  function download() {
    const b = new Blob([report()], {type: 'application/octet-stream'}); const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = fileName(); document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    doneSaving('保存しました（ダウンロード）');
  }
  // PC（Chrome・Edge）：一度選んだ「練習記録」フォルダへ直接書き込む（選んだフォルダはこのブラウザの中だけに覚える）
  const CAN_DIR = !IOS && 'showDirectoryPicker' in window;
  const idb = (mode, fn) => new Promise((ok, ng) => { try { const q = indexedDB.open('robotics-review', 1); q.onupgradeneeded = () => q.result.createObjectStore('kv'); q.onerror = () => ng(q.error);
    q.onsuccess = () => { try { const t = q.result.transaction('kv', mode); const r = fn(t.objectStore('kv')); t.oncomplete = () => ok(r && r.result); t.onerror = () => ng(t.error); } catch (e) { ng(e); } }; } catch (e) { ng(e); } });
  const getDir = () => idb('readonly', st => st.get('dir')).catch(() => null);
  const putDir = h => idb('readwrite', st => st.put(h, 'dir')).catch(() => null);
  const showDirName = h => { $('dirName').textContent = h ? `保存先：${h.name}` : '保存先：まだ選んでいません'; };
  async function pickDir() {
    const h = await window.showDirectoryPicker({id: 'robo-renshu', mode: 'readwrite'});
    if (h.name !== '練習記録') showWarn(`選んだのは「${h.name}」です。iCloud Drive → PixelstoMotors → ロボティクス復習 → 練習記録 を選んでください。`); else $('warn').hidden = true;
    await putDir(h); showDirName(h); return h;
  }
  // iPhone：共有の画面から「"ファイル"に保存」→ ロボティクス復習 → 練習記録（2回目からは同じ場所が出る）
  async function shareSave() {
    const f = new File([report()], fileName(), {type: 'text/markdown'});
    if (navigator.canShare && navigator.canShare({files: [f]})) { await navigator.share({files: [f]}); doneSaving('保存しました'); return true; }
    return false;
  }
  $('save').addEventListener('click', async () => {
    if (!attempts.length) { $('save').textContent = 'まだ記録がありません'; setTimeout(saveLabel, 1800); return; }
    if (IOS) { try { if (await shareSave()) return; } catch (e) { if (e && e.name === 'AbortError') return; } return download(); }
    if (!CAN_DIR) return download();
    try {
      let h = await getDir();
      if (h && (await h.queryPermission({mode: 'readwrite'})) !== 'granted' && (await h.requestPermission({mode: 'readwrite'})) !== 'granted') h = null;
      if (!h) { showWarn('保存先のフォルダを選んでください：iCloud Drive → PixelstoMotors → ロボティクス復習 → 練習記録（最初の1回だけ）'); h = await pickDir(); }
      const w = await (await h.getFileHandle(fileName(), {create: true})).createWritable(); await w.write(report()); await w.close();
      doneSaving(`${h.name}に保存しました`);
    } catch (e) {
      if (e && e.name === 'AbortError') { $('warn').hidden = true; return; }
      showWarn('練習記録に書き込めなかったので、ダウンロードに保存しました。'); download();
    }
  });
  $('copy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(report()); $('copy').textContent = 'コピーしました'; } catch (_) { $('copy').textContent = 'コピーできませんでした'; } setTimeout(() => $('copy').textContent = '結果をコピー', 1800); });
  if (CAN_DIR) { $('dirRow').hidden = false; $('redir').addEventListener('click', () => pickDir().catch(() => {})); getDir().then(showDirName); }
  $('saveNote').textContent = IOS ? '保存先：「"ファイル"に保存」→ ロボティクス復習 → 練習記録' : CAN_DIR ? '' : '保存はダウンロードに入ります。練習記録に直接入れたいときはChromeで開いてください';
  window.addEventListener('beforeunload', e => { if (unsaved) { e.preventDefault(); e.returnValue = ''; } });
  // 前に開いていた段階・カテゴリ・言い方から始める（この端末の中だけ）
  try { const v = JSON.parse(localStorage.getItem(PREF) || 'null'); if (v) { cat = v.cat || 'all'; if (v.mode === 'hide') { mode = 'hide'; $('mHide').setAttribute('aria-pressed', true); $('mSee').setAttribute('aria-pressed', false); } setStep(v.step || 1); } else setStep(1); } catch (_) { setStep(1); }
})();
</script>
</body>
</html>
