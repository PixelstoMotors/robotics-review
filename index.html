<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ロボティクスの見直し</title>
<style>
/* GIG の「台本読み合わせ」と同じ見た目：横スワイプのカード＋その下に「押している間だけ聞く」 */
:root{
  --bg:#f2f3f5; --fg:#1d2129; --muted:#6b7280; --panel:#ffffff; --line:#e3e5e9;
  --card:#1a1b1f; --card-fg:#ffffff; --card-sub:#a9adb6; --gold:#f2c14e; --time:#c98a12;
  --miss:#fde2e1; --miss-fg:#b42318; --extra:#dbeafe; --extra-fg:#1e40af; --ok:#15803d;
  --btn:#1a1b1f; --btn-fg:#ffffff; --rec:#b42318;
  --font:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111215; --fg:#e8eaee; --muted:#9aa0aa; --panel:#1c1d22; --line:#2c2e35;
  --card:#000000; --miss:#4a1714; --miss-fg:#ffb4ab; --extra:#13284d; --extra-fg:#bcd3ff; --ok:#4ade80;
  --btn:#e8eaee; --btn-fg:#111215; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111215; --fg:#e8eaee; --muted:#9aa0aa; --panel:#1c1d22; --line:#2c2e35;
  --card:#000000; --miss:#4a1714; --miss-fg:#ffb4ab; --extra:#13284d; --extra-fg:#bcd3ff; --ok:#4ade80;
  --btn:#e8eaee; --btn-fg:#111215; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.7 var(--font);padding:0 0 calc(24px + env(safe-area-inset-bottom))}
header{background:#1a1b1f;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
header h1{margin:0;font-size:21px}
header p{margin:2px 0 0;font-size:14px;color:rgba(255,255,255,.75)}
main{padding:12px 16px 0;max-width:720px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.selwrap{position:relative;display:block;width:100%}
select{-webkit-appearance:none;appearance:none;display:block;width:100%;font:inherit;font-size:16px;font-weight:600;background:var(--btn);color:var(--btn-fg);border:0;border-radius:10px;padding:10px 44px 10px 14px;margin:0}
.selwrap::after{content:"";position:absolute;right:19px;top:50%;width:9px;height:9px;border-right:2.75px solid var(--btn-fg);border-bottom:2.75px solid var(--btn-fg);border-radius:1px;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--fg);font:inherit;font-size:15px;padding:8px 12px}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg)}
.seg.step{display:flex;margin:0 0 8px}.seg.step button{flex:1;font-size:16px;font-weight:600;padding:10px 6px}
.card .w{font-size:27px;line-height:1.5;font-weight:700;margin:8px 0 2px}
.card .w.small{font-size:20px;margin-bottom:0}
.info{font-size:14px;color:var(--muted);margin:0 2px 8px}
.track{display:flex;align-items:flex-start;overflow-x:auto;overflow-y:hidden;transition:height .15s;scroll-snap-type:x mandatory;gap:10px;padding:4px 2px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 88%;scroll-snap-align:center;background:var(--card);color:var(--card-fg);border-radius:14px;padding:16px 16px 12px;min-height:250px;display:flex;flex-direction:column}
.card .sec{font-size:13.5px;color:var(--card-sub)}
.card .lb{font-size:13.5px;font-weight:700;color:var(--gold);margin-top:2px}
.card .q{font-size:15px;color:var(--card-sub);margin-top:6px}
.card .t{font-size:25px;line-height:1.75;font-weight:600;flex:1;margin:8px 0}
.card .t.long{font-size:20px}
.card .t.mid{font-size:22px}
.card .t.hide{color:var(--card-sub)}
.card .b{font-size:14.5px;line-height:1.7;color:var(--card-sub);margin:0 0 8px}
.card .m{font-size:13.5px;color:var(--time);display:flex;justify-content:space-between;gap:8px}
.card .m .done{color:#9be3b2}.card .m .done.low{color:#ffb4ab}.card .m .done small{color:#a9adb6;font-size:12.5px;margin-left:4px}
.pos{font-size:14px;color:var(--muted);text-align:center;margin:0 0 8px;font-variant-numeric:tabular-nums}
.mic{display:block;width:100%;border:0;border-radius:16px;padding:18px 12px;font:inherit;font-size:20px;font-weight:700;background:var(--btn);color:var(--btn-fg);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.mic.on{background:var(--rec);color:#fff}
.mic:disabled{opacity:.45}
.mic small{display:block;font-size:13.5px;font-weight:400;opacity:.8}
.res{background:var(--panel);border-radius:14px;padding:12px 14px;margin:12px 0 0;border:1px solid var(--line)}
.res h2{font-size:15px;margin:0 0 6px;color:var(--muted);font-weight:600}
.res .said{font-size:19px;line-height:1.8;min-height:1.8em;word-break:break-all}
.res .cmp{font-size:19px;line-height:1.8;word-break:break-all}
.res .miss{background:var(--miss);color:var(--miss-fg);border-radius:3px}
.res .extra{background:var(--extra);color:var(--extra-fg);border-radius:3px}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px;margin-top:8px;font-variant-numeric:tabular-nums}
.stats b{font-size:20px}
.stats .good{color:var(--ok)}.stats .bad{color:var(--miss-fg)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row #save{background:var(--btn);color:var(--btn-fg);border-color:var(--btn);font-weight:700}
.row button{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-size:15px;border-radius:10px;padding:8px 12px}
.log{margin:18px 0 0}
.log h2{font-size:18px;margin:0 0 8px;padding-left:10px;border-left:4px solid var(--fg)}
.log table{width:100%;border-collapse:collapse;font-size:15px;background:var(--panel);border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums}
.log th,.log td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
.log th:first-child,.log td:first-child{text-align:left}
.log th{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:14px 2px 0}
.warn{background:var(--miss);color:var(--miss-fg);border-radius:10px;padding:10px 12px;font-size:15px;margin:0 0 10px}
button:focus-visible,select:focus-visible{outline:3px solid var(--time);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>ロボティクスの見直し</h1>
  <p id="sub"></p>
</header>
<main>
  <div class="seg step" role="group" aria-label="段階">
    <button id="s1" type="button" aria-pressed="true">1 単語</button>
    <button id="s2" type="button" aria-pressed="false">2 説明</button>
    <button id="s3" type="button" aria-pressed="false">3 実機の知見</button>
  </div>
  <div class="bar">
    <span class="selwrap"><select id="cat" aria-label="カテゴリ"></select></span>
    <div class="seg" role="group" aria-label="言い方">
      <button id="mSee" type="button" aria-pressed="true">見て言う</button>
      <button id="mHide" type="button" aria-pressed="false">見ないで言う</button>
    </div>
    <div class="seg" role="group" aria-label="出す範囲">
      <button id="fAll" type="button" aria-pressed="true">全部</button>
      <button id="fWeak" type="button" aria-pressed="false">苦手だけ</button>
    </div>
  </div>
  <div id="warn" class="warn" hidden></div>
  <p class="info" id="info"></p>
  <div class="track" id="track" aria-live="off"></div>
  <p class="pos" id="pos"></p>
  <button id="mic" class="mic" type="button">押している間だけ聞く<small>カードを見て話して、指を離す</small></button>
  <section class="res" id="res" aria-live="polite">
    <h2>話した言葉</h2>
    <div class="said" id="said">ここに出ます</div>
    <h2 style="margin-top:10px">違い（赤＝言わなかった・青＝余分）</h2>
    <div class="cmp" id="cmp">—</div>
    <div class="stats" id="stats"></div>
  </section>
  <section class="log">
    <h2>今回の練習</h2>
    <table><thead><tr><th>文</th><th>一致</th><th>前回</th></tr></thead><tbody id="log"><tr><td colspan="3">まだありません</td></tr></tbody></table>
    <div class="row"><button id="save" type="button">結果を保存</button><button id="copy" type="button">結果をコピー</button><button id="clear" type="button">今回の結果を消す</button></div>
    <div class="row" id="dirRow" hidden><button id="redir" type="button">保存先を選び直す</button><span id="dirName" class="note" style="margin:0;align-self:center"></span></div>
    <p class="note" id="saveNote" style="margin-top:6px"></p>
  </section>
  <p class="note" id="ver"></p>
</main>
<script>
(() => {
  const DATA = {"updated":"2026-10-11","categories":[{"key":"kinematics","label":"運動学・座標系"},{"key":"hardware","label":"実機・サーボ制御"},{"key":"sim","label":"シミュレーション・デジタルツイン"},{"key":"vision","label":"画像認識・カメラ"},{"key":"servo","label":"視覚サーボ・Pick&Place・受け渡し"},{"key":"learning","label":"ロボット学習"},{"key":"eval","label":"評価・データ管理"},{"key":"principles","label":"設計原則・進め方"},{"key":"society","label":"社会実装・現場"}],"items":[{"id":"w001","category":"kinematics","sub":"","type":"word","front":"関節（ジョイント）","back":"ロボットの部品と部品をつなぎ、動きを生む継ぎ目","detail":"モーターで角度や位置が変わる部分で、人の腕なら肩やひじにあたる。関節の数と種類で、ロボットがどう動けるかが決まる。制御では各関節の角度を関節角と呼び、アームの形はこの角度の組で決まる。","key":true,"src":""},{"id":"w002","category":"kinematics","sub":"","type":"word","front":"リンク","back":"関節と関節の間をつなぐ、硬い骨組みの部分","detail":"人の腕なら上腕や前腕にあたり、それ自体は曲がらない部品として扱う。ロボットは、リンクと関節が交互につながった鎖として表される。リンクの長さが、手先がどこまで届くかを決める。","key":false,"src":""},{"id":"w003","category":"kinematics","sub":"","type":"word","front":"自由度（DOF）","back":"ロボットが互いに独立して動かせる、動きの方向の数","detail":"空間で物の位置と向きを自由に決めるには、6自由度が必要になる。アームでは関節の数がそのまま自由度になることが多く、グリッパーの開閉はふつう数えない。mechArm 270 は6軸のアームで、グリッパーは別に扱う。","key":true,"src":"DAY120"},{"id":"w004","category":"kinematics","sub":"","type":"word","front":"回転関節と直動関節","back":"回って角度が変わる関節と、まっすぐ伸び縮みする関節","detail":"回転関節はレボリュート、直動関節はプリズマティックとも呼ぶ。多関節アームは、ほぼ回転関節だけでできている。直動関節は、直交ロボットやリニアレールのように、直線で動かす場所に使われる。","key":false,"src":""},{"id":"w005","category":"kinematics","sub":"","type":"word","front":"エンドエフェクタ（EE）","back":"アームの先端に付けて、作業をする道具の部分","detail":"グリッパー、吸着パッド、溶接トーチなど、作業ごとに付け替える。アームの制御は、エンドエフェクタの位置と向きを狙いどおりにすることが目的になる。mechArm には、手先の座標を直接指定して動かす命令もある。","key":true,"src":"DAY139"},{"id":"w006","category":"kinematics","sub":"","type":"word","front":"ツール中心点（TCP）","back":"ロボットが位置を合わせる基準となる、道具の先端の一点","detail":"グリッパーなら爪の間、溶接なら炎の先などに置く。手首の取り付け面ではなくTCPを基準にすると、道具を替えても狙った点に合わせられる。通信のTCPとは別の言葉なので、文脈で区別する。","key":false,"src":""},{"id":"w007","category":"kinematics","sub":"","type":"word","front":"座標系（フレーム）","back":"位置や向きを数字で表すための、原点と軸の決まり","detail":"台座が原点のベース座標系、作業場全体のワールド座標系、手先のツール座標系などを使い分ける。ソフトによって上向きの軸が違う点に注意する。mechArm のツインでは、URDFのZ軸が上とUnityのY軸が上の変換を誤り、成功率が0になった。","key":true,"src":"DAY149"},{"id":"w008","category":"kinematics","sub":"","type":"word","front":"座標変換","back":"ある座標系での位置や向きを、別の座標系の値に直す計算","detail":"カメラで見た位置をロボットの座標に直す場面で、必ず使う。回転と平行移動をまとめた、同次変換行列で表すのが一般的。mechArm では、ホモグラフィをやめ、2点の実測にもとづくアフィン変換に書き換えた。","key":false,"src":"DAY160"},{"id":"w009","category":"kinematics","sub":"","type":"word","front":"位置姿勢（ポーズ）","back":"物や手先がどこにあり、どちらを向いているかの組み合わせ","detail":"位置の3つの値と、向きの3つの値を合わせて、6つの値で表すことが多い。日本語の姿勢は、向きだけを指す場合と、アーム全体の関節の形を指す場合があり、混同しやすい。","key":false,"src":""},{"id":"w010","category":"kinematics","sub":"","type":"word","front":"オイラー角（ロール・ピッチ・ヨー）","back":"向きを、3つの軸まわりの回転角の組で表す方法","detail":"直感的で読みやすいため、画面表示や指令値によく使われる。ただし回す順番で意味が変わり、特定の向きで軸が重なって自由度が1つ消える、ジンバルロックが起きる。計算ではクォータニオンと使い分ける。","key":false,"src":""},{"id":"w011","category":"kinematics","sub":"","type":"word","front":"クォータニオン（四元数）","back":"向きを4つの数で表す方法で、計算で扱いやすい","detail":"ジンバルロックが起きず、2つの向きのあいだをなめらかにつなぐ補間も安定する。そのため、UnityやROSの内部では向きをクォータニオンで持つ。値を見ても向きが直感で分からないので、表示ではオイラー角に直すことが多い。","key":false,"src":""},{"id":"w012","category":"kinematics","sub":"","type":"word","front":"順運動学（FK）","back":"各関節の角度から、手先の位置と向きを求める計算","detail":"角度が決まれば答えは必ず1つに決まるので、計算は比較的やさしい。逆運動学は、この逆向きの計算になる。mechArm では、実機で校正した512,087点のFKテーブルから目標位置に近い点を探し、関節角を逆に引いて使った。","key":true,"src":"DAY192"},{"id":"w013","category":"kinematics","sub":"","type":"word","front":"逆運動学（IK）","back":"手先の目標位置から、各関節の角度を逆算する計算","detail":"答えが複数ある場合や、届かず答えがない場合があり、順運動学より難しい。式で直接解く解析解と、少しずつ近づける数値解がある。mechArm では、座標指定の命令で手首の回転RZが位置により暴れたため、角度指定だけで動かす方針にした。","key":true,"src":"DAY212"},{"id":"w014","category":"kinematics","sub":"","type":"word","front":"作業空間（ワークスペース）","back":"ロボットの手先が届き、作業できる空間の範囲","detail":"リンクの長さと、関節の可動域で決まる。届くことと、狙った向きで届くことは別で、向きまで自由に決められる範囲はもっと狭い。カタログのリーチは、この範囲の最大の半径を示す数字。","key":false,"src":""},{"id":"w015","category":"kinematics","sub":"","type":"word","front":"関節可動域（ジョイントリミット）","back":"各関節が安全に動ける、角度の上限と下限の範囲","detail":"機構の限界や配線、ぶつかりを避けるために決まっている。指令を送る前に範囲内か確かめるのが、基本の安全策になる。mechArm では、SDKの pymycobot 4.0.5 から関節リミットの定数を読み出して使った。","key":false,"src":"DAY253"},{"id":"w016","category":"kinematics","sub":"","type":"word","front":"特異点（特異姿勢）","back":"手先が特定の方向へ動けなくなる、アームの特殊な姿勢","detail":"腕がまっすぐ伸び切ったときや、2つの関節の軸が一直線にそろったときに起きる。近くでは、手先をわずかに動かすだけで、関節が急に大きく回ろうとする。軌道を作るときは、特異点を避けて通す。","key":false,"src":""},{"id":"w017","category":"kinematics","sub":"","type":"word","front":"ヤコビ行列（ヤコビアン）","back":"関節の速さと、手先の速さの関係を表す行列","detail":"姿勢ごとに中身が変わり、数値で逆運動学を解くときや、力の計算に使う。特異点では、この行列の逆が求められなくなる。mechArm では、ヤコビアンを使う数値解を候補に挙げたが、実時間で回すには重いとして見送った。","key":false,"src":"DAY192"},{"id":"w018","category":"kinematics","sub":"","type":"word","front":"DHパラメータ","back":"リンクの長さやねじれを、関節ごとに4つの数で表す決まり","detail":"デナビット・ハーテンベルグ法の略で、運動学の教科書で標準的に使われる。表を作れば、順運動学の式が機械的に組める。mechArm では、公式値の正確さに不安があり、机上のDHパラメータより実機で校正したFKテーブルを優先した。","key":false,"src":"DAY192"},{"id":"w019","category":"hardware","sub":"","type":"word","front":"アクチュエータ","back":"電気などのエネルギーを、実際の動きに変える装置","detail":"ロボットでは電気モーターが主流で、大きな力が要る機械では油圧や空気圧も使う。センサーが世界を読む側なら、アクチュエータは世界に働きかける側。関節ごとに1つ置くのが、基本の構成になる。","key":false,"src":""},{"id":"w020","category":"hardware","sub":"","type":"word","front":"サーボモーター","back":"指令した角度や位置へ、自分で合わせて止まるモーター","detail":"モーター、回転を測るエンコーダ、制御回路が組になり、ずれを測りながら目標へ寄せる。ホビー機では、これらを一体にしたスマートサーボがよく使われる。mechArm には6個のスマートサーボが入り、角度や温度を個別に読み戻せる。","key":true,"src":"DAY260"},{"id":"w021","category":"hardware","sub":"","type":"word","front":"減速機（ギア）","back":"モーターの速い回転を遅くして、そのぶん力を大きくする部品","detail":"モーター単体は速く回るが力が弱いので、歯車などで回転を落として関節を動かす。減速比が大きいほど力は増えるが速さは落ち、ガタや摩擦も入りやすい。産業用アームでは、根元側にRV減速機、手首側に波動歯車減速機を使う例が多い。","key":false,"src":""},{"id":"w022","category":"hardware","sub":"","type":"word","front":"エンコーダ","back":"モーターや関節が、どれだけ回ったかを測るセンサー","detail":"回転角を数値に変え、制御の側に今の位置を知らせる。電源を入れた瞬間から位置が分かるアブソリュート型と、動いた量を数えるインクリメンタル型がある。mechArm では、サーボが角度を読み戻せることから、各サーボにエンコーダがあると見ている。","key":true,"src":"DAY260"},{"id":"w023","category":"hardware","sub":"","type":"word","front":"トルク","back":"関節や軸を回転させようとする、回す力の強さ","detail":"単位はニュートンメートルで、力に腕の長さをかけたもの。同じ重さでも、腕を伸ばして遠くで持つほど、根元の関節に大きなトルクがかかる。モーターの電流はトルクとほぼ比例するので、電流から負荷を推定できる。","key":true,"src":""},{"id":"w024","category":"hardware","sub":"","type":"word","front":"サーボオンとサーボオフ","back":"モーターに力を入れて姿勢を保つ状態と、力を抜く状態","detail":"サーボオンでは指令の位置を保ち、サーボオフでは手で関節を動かせる。オフにした瞬間、重力でアームが落ちることがあるので、支えてから切る。mechArm では、全関節のトルクを切る命令で、手で動かせる状態にできる。","key":false,"src":"DAY205"},{"id":"w025","category":"hardware","sub":"","type":"word","front":"フィードバック制御（閉ループ制御）","back":"結果を測り、目標とのずれを見ながら指令を直し続ける制御","detail":"測らずに決めた指令を送るだけの、オープンループ制御と対になる言葉。センサーで今の状態を測り、ずれが小さくなる方向へ出力を変える。ロボットの関節制御は、ほぼすべてこの考え方で動いている。","key":true,"src":""},{"id":"w026","category":"hardware","sub":"","type":"word","front":"PID制御","back":"ずれの今の大きさ、たまった量、変化の速さで出力を決める制御","detail":"比例、積分、微分の頭文字で、フィードバック制御で最も広く使われる方式。3つの係数の調整をゲイン調整と呼び、強すぎると振動し、弱すぎると遅れる。mechArm では角度を送るだけで、Pi ではなくマイコンとサーボの側が指令角まで寄せる。","key":false,"src":"DAY260"},{"id":"w027","category":"hardware","sub":"","type":"word","front":"可搬重量（ペイロード）","back":"ロボットが手先で持って動かせる、重さの上限","detail":"グリッパー自体の重さも含めて数えるのがふつうで、腕を伸ばすほど実際に持てる量は減る。カタログの値は最大の条件なので、余裕を持って選ぶ。mechArm 270 の常用ペイロードは250gで、約600gの中身入りコーヒーカップは運べない。","key":true,"src":"DAY205"},{"id":"w028","category":"hardware","sub":"","type":"word","front":"リーチ","back":"台座の中心から、手先が届く一番遠い点までの距離","detail":"アームの大きさを比べるときの基本の数字。ただしこれは最大値で、端のほうでは持てる重さや精度が落ちる。届く範囲の広さと、その中で使える範囲は分けて考える。mechArm 270 のリーチは270mm。","key":false,"src":"DAY205"},{"id":"w029","category":"hardware","sub":"","type":"word","front":"繰り返し精度","back":"同じ場所へ何度も動かしたとき、止まる位置がどれだけそろうか","detail":"カタログで最もよく見る精度の数字で、ばらつきの幅を示す。狙った座標への正確さを示す絶対精度とは別物で、繰り返し精度が良くても絶対精度が悪いことはふつうにある。mechArm 270 の繰り返し精度は±0.5mm。","key":true,"src":"DAY205"},{"id":"w030","category":"hardware","sub":"","type":"word","front":"絶対精度","back":"指令した座標に、実際どれだけ正確に到達できるか","detail":"リンク長の誤差、たわみ、取り付けのずれなどが積み重なって悪くなる。多くのアームでは繰り返し精度よりかなり悪く、カタログに載らないこともある。キャリブレーションで改善を狙うのは、こちらの精度。","key":false,"src":""},{"id":"w031","category":"hardware","sub":"","type":"word","front":"バックラッシ","back":"歯車のかみ合わせのすき間による、動きのガタ","detail":"回る向きを変えたとき、すき間の分だけ出力が遅れて動き出す。行きと帰りで止まる位置がずれる原因になる。mechArm では、関節を動かす向きによって約17%の非対称が出て、バックラッシュかヒステリシスの可能性を考えた。","key":false,"src":"DAY189"},{"id":"w032","category":"hardware","sub":"","type":"word","front":"力覚センサー（力トルクセンサー）","back":"手先にかかる押す力とねじる力を、直接測るセンサー","detail":"手首に付けて、押し付けの強さや接触を測る。6軸タイプは、3方向の力と3軸まわりのトルクを測れる。mechArm には標準では付いておらず、モーターの電流値から、触れたことを間接的に検出できる。","key":false,"src":"DAY205"},{"id":"w033","category":"hardware","sub":"","type":"word","front":"マイコン（MCU）","back":"機械に組み込まれ、決まった処理を素早く回す小さなコンピュータ","detail":"パソコン型のコンピュータが上位の判断を担い、マイコンがモーターなど実時間に近い処理を担う、という分担が多い。mechArm では、Raspberry Pi からの指令をESP32系のマイコンが受けて、サーボを動かしている。","key":false,"src":"DAY260"},{"id":"w034","category":"hardware","sub":"","type":"word","front":"シリアル通信とボーレート","back":"データを1ビットずつ順番に送る通信と、その速さの設定","detail":"マイコンやサーボとのやりとりで、今も広く使われる。送る側と受ける側でボーレートが合っていないと、文字化けや無応答になる。mechArm では、Raspberry Pi とマイコンを1Mbpsのシリアル通信でつないでいる。","key":false,"src":"DAY260"},{"id":"w035","category":"hardware","sub":"","type":"word","front":"制御周期（制御ループ周波数）","back":"測って指令を出す一回りを、1秒に何回くり返せるか","detail":"単位はヘルツで、高いほど素早い変化や接触に反応できる。外から指令を送る周期と、モーター内部の周期は別もので、内部のほうがずっと速い。mechArm では関節角の読み出し1回に約20ミリ秒かかり、読むだけでも約50Hzが上限になる。","key":false,"src":"DAY296"},{"id":"w036","category":"sim","sub":"","type":"word","front":"シミュレーション（シミュレータ）","back":"現実の動きを、コンピュータの中で再現して試すこと","detail":"実機を壊さず、何度でも、何台分でも同時に試せるのが利点。一方で、摩擦や接触などは現実どおりに再現しきれない。その差をどう扱うかが、ロボット開発の大きなテーマになる。","key":true,"src":""},{"id":"w037","category":"sim","sub":"","type":"word","front":"デジタルツイン","back":"実物と同じ形と動きを持つ、コンピュータの中の双子","detail":"単なるシミュレーションと違い、実物のデータで合わせ込み、実物と対応づけて使うのが要点。mechArm では、Unity上のツインでアームを動かし、関節角から爪先の位置を引くFKテーブルを作っている。","key":true,"src":"DAY254"},{"id":"w038","category":"sim","sub":"","type":"word","front":"物理エンジン","back":"重力やぶつかりなど、物の動きを計算で再現するソフトの心臓部","detail":"少しずつ時間を進めながら、力、速度、接触を計算する。ゲーム用とロボット研究用では、速さと正確さの重みが違う。mechArm のツインでは、関節角を瞬時に入れたいとき、物理計算を飛ばして角度を直接セットした。","key":true,"src":"DAY150"},{"id":"w039","category":"sim","sub":"","type":"word","front":"タイムステップ","back":"シミュレーションで、時間を一度に進める刻み幅","detail":"刻みが細かいほど正確だが、計算は重くなる。粗すぎると、速い物がすり抜けたり、関節が振動して発散したりする。実機の制御周期とそろえるかどうかも、sim2realで気にする点になる。","key":false,"src":""},{"id":"w040","category":"sim","sub":"","type":"word","front":"剛性と減衰（スティフネスとダンピング）","back":"関節を目標へ引き戻すばねの強さと、揺れを抑えるブレーキの強さ","detail":"シミュレータで関節を角度指令で動かすとき、ばねとダンパーの組として設定する。剛性が強すぎると暴れ、弱すぎると目標に届かない。mechArm のツインでは、剛性20,000、減衰2,000に固定し、変更禁止にしている。","key":false,"src":"DAY154"},{"id":"w041","category":"sim","sub":"","type":"word","front":"コリジョン形状","back":"ぶつかりの判定に使う、見た目より単純にした形","detail":"見た目用の細かい形状とは分けて持ち、箱や円柱などで近似して計算を軽くする。形を粗くしすぎると、実機では当たるのにシミュレーションでは当たらない、といったずれが出る。","key":false,"src":""},{"id":"w042","category":"sim","sub":"","type":"word","front":"URDF","back":"ロボットのリンクと関節の構成を書き表す、標準のファイル形式","detail":"ROSで生まれたXML形式で、各リンクの形や重さ、関節の種類と可動域を書く。多くのシミュレータが読み込めるので、機種の共通の入り口になる。mechArm では、DAY101まで mechArm 270 M5 のURDFでシミュレーションを組んできた。","key":true,"src":"DAY102"},{"id":"w043","category":"sim","sub":"","type":"word","front":"ROS 2","back":"ロボットのソフトを部品に分けて、つなぎ合わせるための共通基盤","detail":"名前はOSだが、実体は通信の仕組みと、道具や部品の集まり。センサー、計画、制御などを別々のプログラムとして動かし、決まった形式でデータをやりとりする。研究や開発の現場で、広く使われている。","key":true,"src":""},{"id":"w044","category":"sim","sub":"","type":"word","front":"ノードとトピック","back":"ROSで、処理の単位と、そのあいだを流れるデータの通り道","detail":"ノードは、カメラの読み取りや経路計画など、1つの役目を持つプログラム。トピックは名前の付いた通り道で、送る側と受け取る側が互いを知らなくてもデータをやりとりできる。","key":false,"src":""},{"id":"w045","category":"sim","sub":"","type":"word","front":"MoveIt","back":"アームの動作計画をまとめて扱う、ROSの代表的な道具","detail":"逆運動学、ぶつからない経路の計画、軌道の生成を、URDFなどの設定から組み立てられる。自前で書くと大変な部分を肩代わりしてくれる反面、設定項目が多い。ROS 2 版は MoveIt 2 と呼ぶ。","key":false,"src":""},{"id":"w046","category":"sim","sub":"","type":"word","front":"Gazebo","back":"ROSと組み合わせて使われてきた、無料のロボット用シミュレータ","detail":"ロボットとセンサーを仮想空間に置き、ROSのプログラムをそのままつないで試せる。移動ロボットの開発で、特によく使われる。旧版は Gazebo Classic、今の系統は Gazebo と呼び分ける。","key":false,"src":""},{"id":"w047","category":"sim","sub":"","type":"word","front":"Isaac Sim","back":"NVIDIAが提供する、GPUで動く高精細なロボット用シミュレータ","detail":"見た目のリアルさと、大量の並列計算が強み。強化学習用の Isaac Lab と組み合わせて、合成データづくりや学習に使われる。動かすには、NVIDIAのGPUを積んだ性能の高いマシンが要る。","key":false,"src":""},{"id":"w048","category":"sim","sub":"","type":"word","front":"MuJoCo（ムジョコ）","back":"接触の計算が速くて正確な、研究でよく使われる物理シミュレータ","detail":"名前は、接触を伴う多関節の力学という英語の頭文字から。強化学習の研究で、ベンチマーク環境として広く使われてきた。現在は Google DeepMind が、無料のオープンソースとして公開している。","key":false,"src":""},{"id":"w049","category":"sim","sub":"","type":"word","front":"並列シミュレーション","back":"同じ環境を何個も同時に動かして、データを一気に集めること","detail":"実機では1台ずつしか試せないが、シミュレーションなら何十、何千と並べられる。強化学習や、大量のデータ集めで特に効く。mechArm のツインでは、20体のアームを並列で動かし、約2.5時間かけてFKデータを取った。","key":false,"src":"DAY154"},{"id":"w050","category":"sim","sub":"","type":"word","front":"sim2real（シムツーリアル）","back":"シミュレーションで作った動きや学習結果を、実機へ持っていくこと","detail":"Sim-to-Real とも書く。安く大量に試せるシミュレーションの利点を、実機で生かすための考え方。そのまま持っていくと現実との差でうまく動かないことが多く、差を埋める工夫と組で語られる。","key":true,"src":""},{"id":"w051","category":"sim","sub":"","type":"word","front":"リアリティギャップ（sim2realギャップ）","back":"シミュレーションと現実のあいだにある、ずれのこと","detail":"摩擦、重さ、ギアのガタ、センサーの雑音、遅れなどが原因になる。シミュレーションでうまくいった動きが実機で失敗する理由の多くは、ここにある。差を測り、モデルを実機に合わせ込むことが第一歩。","key":false,"src":""},{"id":"w052","category":"sim","sub":"","type":"word","front":"ドメインランダマイゼーション","back":"シミュレーションの条件をわざとばらつかせ、現実のずれに強くする手法","detail":"色、明るさ、摩擦、重さなどを、試行ごとに変えて学習させる。現実を、たくさんの条件のうちの1つとして扱えるようにする考え方。OpenAI がロボットハンドを、シミュレーションだけで学習させて実機へ移した例が有名。","key":false,"src":""},{"id":"w053","category":"sim","sub":"","type":"word","front":"合成データ","back":"シミュレーションや画像生成で作った、学習用のデータ","detail":"実機で集めるより安く、正解のラベルも自動で付けられるのが強み。一方で、見た目や物理が現実とずれると、学習したモデルが実機で効かない。現実のデータと混ぜて使うのが一般的。","key":false,"src":""},{"id":"w054","category":"sim","sub":"","type":"word","front":"real2sim（リアルツーシム）","back":"現実の物や動きを測り取って、シミュレーションの中に再現すること","detail":"sim2real の逆向きで、現実をもとにシミュレーションを作る流れ。写真や動画から物の形を立て直したり、実機の値で物理の設定を合わせたりする。現実に近い仮想環境ほど、リアリティギャップは小さくなる。","key":false,"src":""},{"id":"w055","category":"vision","sub":"","type":"word","front":"画素（ピクセル）","back":"デジタル画像をつくる、色の数値を持った最小の点","detail":"画像は縦と横に並んだ画素の集まりで、各画素が明るさや色の数値を持つ。解像度は画素の縦横の数を指す。画像上の位置は画素の番号で表すため、ロボットを動かすにはmmなど実世界の長さへの変換が必要になる。","key":false,"src":""},{"id":"w056","category":"vision","sub":"","type":"word","front":"色空間（RGB・HSV）","back":"色を数字で表すときの、表し方の決まりごと","detail":"RGBは赤・緑・青の光の混ぜ具合で色を表す。HSVは色相・彩度・明度に分けるので、明るさが変わっても色の種類を保ちやすい。自分の検証では、照明の色を変えると色相が最大155度動き、青いブロックが色を失った。","key":true,"src":"DAY300"},{"id":"w057","category":"vision","sub":"","type":"word","front":"二値化（しきい値処理）","back":"決めた境目の値で、画素を白と黒の二つに分ける処理","detail":"色や明るさが境目より上か下かで画素を選び、白黒のマスク画像を作る。色で物を探す処理の基本になる。境目を固定すると照明の変化に弱く、自分の検証では光が変わると赤の検出が青を拾った。","key":false,"src":"DAY301"},{"id":"w058","category":"vision","sub":"","type":"word","front":"モルフォロジー演算","back":"白黒画像の小さな粒や穴を、形の大きさで整える処理","detail":"膨張と収縮を組み合わせ、決めた大きさより小さい白い粒を消したり、物の中の黒い穴を埋めたりする。消すのがオープニング、埋めるのがクロージング。しきい値処理の後始末に使うが、しきい値で取りこぼした部分までは直せない。","key":false,"src":""},{"id":"w059","category":"vision","sub":"","type":"word","front":"輪郭抽出（コンター）","back":"白黒画像から、物の外側のふちを線としてたどる処理","detail":"輪郭が取れると、面積・重心・外接する四角形などの形の情報を計算できる。物の位置や大きさを測る土台になる。ただし傾きに弱い量もあり、自分の検証では紙を43度回すと外接する四角形が1.75倍に膨らんだ。","key":false,"src":"DAY304"},{"id":"w060","category":"vision","sub":"","type":"word","front":"ROI（関心領域）","back":"画像の中で、処理の対象にする範囲だけを切り出した部分","detail":"見る範囲を絞ると計算が軽くなり、関係ない物の誤検出も減る。検出が不安定なときは、しきい値をいじる前に範囲を見直すと効く場合がある。mechArmでは、アームの胴体を白箱と誤検出したため、胴体の範囲を除外した。","key":false,"src":"DAY224"},{"id":"w061","category":"vision","sub":"","type":"word","front":"テンプレートマッチング","back":"見本の画像を少しずつずらし、似ている場所を探す方法","detail":"探したい物の見本画像を用意し、画像全体と重ねて一致度を計算する。手軽だが、大きさや向き、照明が見本と違うと弱い。mechArmでは白箱の見本を12枚撮り直し、一致度が0.547から0.994に上がった。","key":false,"src":"DAY165"},{"id":"w062","category":"vision","sub":"","type":"word","front":"特徴点マッチング","back":"二枚の画像から、同じ場所を指す特徴的な点を結びつける方法","detail":"角や模様の目立つ点を見つけ、その周りの様子を数値にして二枚の間で照合する。ORBやSIFTが代表的で、パノラマ合成や立体の復元に使う。自分の検証では、別の物を撮った写真どうしでも同じと判定される場合があった。","key":false,"src":"DAY309"},{"id":"w063","category":"vision","sub":"","type":"word","front":"物体検出（オブジェクトディテクション）","back":"画像の中の物を見つけ、四角い枠と名前と確からしさで返す処理","detail":"一枚に複数の物があっても、それぞれの位置と種類を出す。YOLOなどの学習済みモデルが代表例。画像全体に一つのラベルを付ける画像分類とは違い、どこに写っているかまで答える。自分の物を探させるには学習用データが要る。","key":true,"src":""},{"id":"w064","category":"vision","sub":"","type":"word","front":"バウンディングボックス（BBox）","back":"検出した物を囲むように描く、画像上の四角い枠","detail":"左上と右下の座標、または中心と幅と高さで表す。物体検出の標準的な出力形式。画面の縦横にそろえた枠が一般的で、斜めに置かれた物では余白が大きくなる。向きまで表す回転付きの枠もある。","key":false,"src":""},{"id":"w065","category":"vision","sub":"","type":"word","front":"IoU","back":"二つの枠がどれだけ重なっているかを、0から1で表す指標","detail":"重なった面積を、二つを合わせた面積で割って求める。1なら完全一致、0なら重なりなし。物体検出では、予測の枠と正解の枠のIoUが基準値以上なら当たりと数える。精度指標のmAPもこの判定の上に成り立つ。","key":false,"src":""},{"id":"w066","category":"vision","sub":"","type":"word","front":"セグメンテーション","back":"画像の画素ごとに、どの物に属するかを塗り分ける処理","detail":"四角い枠ではなく、物の形どおりの輪郭まで分かるので、掴む位置や向きを決めたいときに役立つ。最近は言葉で対象を指定できるモデルもある。自分の検証では、SAM 3が透明なガラス瓶とペットボトルを同じ物として切り出した。","key":false,"src":"DAY317"},{"id":"w067","category":"vision","sub":"","type":"word","front":"カメラ校正（キャリブレーション）","back":"カメラの特性や置き場所を、数値として求めておく作業","detail":"チェスボードなど寸法が分かった模様を何枚も撮って計算するのが一般的。求めた値を使うと、画像のゆがみを直したり、画像上の位置を実世界の位置へ変換したりできる。内部パラメータと外部パラメータの二つに分けて考える。","key":true,"src":""},{"id":"w068","category":"vision","sub":"","type":"word","front":"内部パラメータ","back":"焦点距離やレンズのゆがみなど、カメラ自体が持つ性質の値","detail":"画像の中心位置、焦点距離、レンズの歪み係数などを指す。カメラとレンズが同じなら、置き場所を変えても値は変わらない。mechArmの上カメラでは、ホモグラフィで十分な精度が出ていたため、チェスボードでの校正はやらない判断にした。","key":false,"src":"DAY192"},{"id":"w069","category":"vision","sub":"","type":"word","front":"外部パラメータ","back":"カメラが空間のどこに、どの向きで置かれているかを表す値","detail":"カメラの位置と向きを、ロボットや机の座標系に対する回転と平行移動で表す。カメラを動かしたりぶつけたりすると変わるので、取り直しが必要になる。内部パラメータと組み合わせると、画像の点と空間の点を対応づけられる。","key":false,"src":""},{"id":"w070","category":"vision","sub":"","type":"word","front":"ホモグラフィ","back":"ある平面の見え方を、別の視点から見た平面へ写しかえる変換","detail":"3行3列の行列で表し、斜めから撮った机の面を真上から見た形に直せる。対象が一つの平面上にある場合にだけ正しく成り立つ。mechArmでは、マットの四隅を検出し、ピクセル座標をmmに変換する行列を作った。","key":true,"src":"DAY164"},{"id":"w071","category":"vision","sub":"","type":"word","front":"視差（パララックス）","back":"見る位置が変わると、物の見える位置がずれて見える現象","detail":"二つのカメラの見え方のずれから距離を計算するのが、ステレオカメラの原理。一方で一台のカメラでは、高さの違いが位置のずれとして現れ、誤差の原因になる。mechArmでは、上カメラで見たZ方向のズレが視差だと分かり、横カメラが必要になった。","key":false,"src":"DAY191"},{"id":"w072","category":"vision","sub":"","type":"word","front":"深度カメラ（RGB-Dカメラ）","back":"色の画像と一緒に、各画素までの距離も測れるカメラ","detail":"赤外線の模様を当てる方式、光が返る時間を測る方式、二つのレンズの視差を使う方式がある。普通のカメラでは分からない高さや奥行きが取れる。mechArmでは、真上のカメラ写真だけではブロックが持ち上がったかをAIが判定できなかった。","key":true,"src":"DAY325"},{"id":"w073","category":"vision","sub":"","type":"word","front":"点群（ポイントクラウド）","back":"物の表面を、三次元の位置を持つたくさんの点の集まりで表したデータ","detail":"深度カメラやLiDARで得られ、各点がXYZの位置を持つ。画像と違い、物の立体的な形や距離をそのまま扱える。把持位置の計算や障害物の把握に使う。データ量が大きく、ノイズ除去や間引きなどの前処理が欠かせない。","key":false,"src":""},{"id":"w074","category":"servo","sub":"","type":"word","front":"経由点（ウェイポイント）","back":"動きの途中で通るように指定する、目印となる点","detail":"始点と終点だけでなく途中に経由点を置くと、障害物をよけたり、決まった姿勢を通らせたりできる。経由点の間をどうつなぐかは補間で決める。点を増やすほど動きは決まるが、教える手間も増える。","key":false,"src":""},{"id":"w075","category":"servo","sub":"","type":"word","front":"経路と軌道（パスとトラジェクトリ）","back":"経路は通る道筋、軌道はそこに時間と速さを加えたもの","detail":"経路はどこを通るかという形の情報だけを持つ。軌道は各時刻にどこにいるかまで決めたもので、速度や加速度も含む。実機に送るのは軌道。同じ経路でも速さの付け方で、動きの印象や安全性が大きく変わる。","key":true,"src":""},{"id":"w076","category":"servo","sub":"","type":"word","front":"補間（インターポレーション）","back":"離れた点と点のあいだを、なめらかな値でつないで埋めること","detail":"直線でつなぐ線形補間のほか、始めと終わりをゆっくりにする曲線の補間がある。教えた点が少なくても、補間で細かい動きを作れる。mechArmでは、実機の8点の動きをイーズインアウト補間で81点に広げた。","key":true,"src":"DAY152"},{"id":"w077","category":"servo","sub":"","type":"word","front":"速度プロファイル（加減速）","back":"動き出しから止まるまで、速さをどう変えるかの決め方","detail":"加速、一定速度、減速の三段で表す台形型が代表的。加速度の変化までなめらかにしたS字型は、揺れや衝撃が少ない。急に動き出したり止まったりすると、モーターや物に負担がかかり、見ている人も不安に感じやすい。","key":false,"src":""},{"id":"w078","category":"servo","sub":"","type":"word","front":"関節補間と直線補間","back":"関節の角度でつなぐか、手先の直線でつなぐかという補間の違い","detail":"関節補間は各関節の角度を同時に変えるので計算が軽いが、手先は曲線を描く。直線補間は手先がまっすぐ進むので、差し込みや真下への降下に向く。ただし途中ごとに逆運動学を解く必要があり、特異点の近くでは動けないことがある。","key":false,"src":""},{"id":"w079","category":"servo","sub":"","type":"word","front":"ティーチング（教示）","back":"ロボットに動きや位置を、人が直接教えて記録させること","detail":"操作盤で少しずつ動かして教える方法と、手でアームを動かして教えるダイレクトティーチングがある。教えた動きは何度でも再生できる。mechArmでは、関節の力を抜いて手で動かし、教えた軌道を実機で再生した。","key":true,"src":"DAY226"},{"id":"w080","category":"servo","sub":"","type":"word","front":"把持（グラスプ）","back":"グリッパーやハンドで、物をつかんで保持すること","detail":"どこを、どの向きで、どれくらいの力でつかむかを決める必要がある。つかめても、動かすうちに滑って落ちることがある。mechArmでは、爪を位置で止めるのをやめ、閉じ切らない目標値で押し込むように握ったら落ちなくなった。","key":true,"src":"DAY261"},{"id":"w081","category":"servo","sub":"","type":"word","front":"ピックアンドプレース（Pick&Place）","back":"物をつかんで持ち上げ、別の場所へ運んで置く一連の作業","detail":"産業用ロボットで最も基本的な作業の一つ。認識、接近、把持、搬送、解放がつながって初めて成立し、どこか一つの失敗で全体が止まる。mechArmでは、赤ブロックをつかんで運んで離す一連を、一本のスクリプトで初めて完走させた。","key":true,"src":"DAY176"},{"id":"w082","category":"servo","sub":"","type":"word","front":"アプローチと退避","back":"対象の手前まで近づく動きと、作業後に離れる動きのこと","detail":"いきなり目標へ向かわず、少し上の手前位置で一度止まり、そこからゆっくり近づく。作業後も来た方向へまっすぐ戻る。こうすると周りの物にぶつかりにくく、最後の位置合わせも安定する。","key":false,"src":""},{"id":"w083","category":"servo","sub":"","type":"word","front":"許容誤差（トレランス）","back":"目標に届いたとみなしてよい、ずれの許される範囲","detail":"目標とのずれがこの範囲に入ったら、到達や収束とみなして次の動作に進む。厳しすぎるといつまでも終わらず、緩すぎると作業に失敗する。mechArmの視覚サーボでは、8mmでは詰まり、12mmに緩めたところで爪が閉じた。","key":false,"src":"DAY208"},{"id":"w084","category":"servo","sub":"","type":"word","front":"動作計画（モーションプランニング）","back":"障害物を避けながら、目標までの動きを自動で求めること","detail":"ロボットの形と周りの障害物を考えて、ぶつからない経路を探す。RRTのように空間をランダムに探る方法がよく使われ、ROS2ではMoveItが標準的な道具になっている。見つけた経路は、そのあと速さを付けて軌道にする。","key":false,"src":""},{"id":"w085","category":"servo","sub":"","type":"word","front":"衝突回避","back":"ロボットが周りの物や人、自分の体にぶつからないようにすること","detail":"前もって障害物を避ける経路を計画する方法と、動作中にセンサーで検知して止める方法がある。持っている物の大きさも計算に入れる必要がある。mechArmでは、置くときにブロックの底が箱の縁に当たり、ブロックを持った状態で姿勢を教え直した。","key":false,"src":"DAY235"},{"id":"w086","category":"servo","sub":"","type":"word","front":"視覚サーボ（ビジュアルサーボ）","back":"カメラで見たずれを使い、目標に合うまで動きを直し続ける制御","detail":"見る、ずれを計算する、少し動く、をくり返して目標に近づける閉ループ制御。カメラや機体の誤差を、動きながら打ち消せる。mechArmでは、視覚サーボだけでブロックをつかむまでに21回のループを回した。","key":true,"src":"DAY208"},{"id":"w087","category":"servo","sub":"","type":"word","front":"アイインハンドとアイトゥハンド","back":"カメラを手先に付けるか、外に固定するかという二つの配置","detail":"手先に付けると対象に近づいて見られるが、動くたびに視点が変わる。外に固定すると全体を安定して見られるが、隠れた場所は見えない。mechArmは上の固定カメラを使い、手先用の部品はグリッパーと同時に付けられないと分かった。","key":false,"src":"DAY159"},{"id":"w088","category":"servo","sub":"","type":"word","front":"ハンドアイ校正（ハンドアイキャリブレーション）","back":"カメラとロボットの、位置と向きの関係を求める作業","detail":"ロボットをいくつかの姿勢に動かしながら目印を撮り、座標の変換を計算する。手先にカメラを付けるなら手先との関係、外に固定するなら土台との関係を求める。これがないと、カメラで見つけた物へ手先を正しく動かせない。","key":false,"src":""},{"id":"w089","category":"servo","sub":"","type":"word","front":"受け渡し（ハンドオーバー）","back":"ロボットと人のあいだで、物を手渡したり受け取ったりする動作","detail":"差し出す位置と高さ、離すタイミング、人が受け取ったかの判定が要になる。人の手が動作範囲に入るため、置く作業より安全への配慮が増える。mechArmでは、アームが差し出し人が受け取る設計を、外部レビュー4回を経て固めた。","key":false,"src":"DAY288"},{"id":"w090","category":"servo","sub":"","type":"word","front":"コンプライアンス（柔らかさ）","back":"外から力を受けたとき、ロボットが逆らわずに少したわむ性質","detail":"ばねのような柔らかい部品で作る機械的な方法と、力の検出と制御で作る方法がある。穴への差し込みや人との接触で、位置のずれや衝撃を吸収できる。位置を硬く守る位置制御とは、考え方が逆になる。","key":false,"src":""},{"id":"w091","category":"servo","sub":"","type":"word","front":"インピーダンス制御","back":"ばねとダンパーのような柔らかさを、制御でロボットに持たせる方法","detail":"目標位置からのずれと押し返す力の関係を、ばねの硬さと揺れの抑えで決める。力センサーやモーターの電流を使って実現し、押し付け作業や人との協働で使われる。力そのものを目標にする力制御とは区別される。","key":false,"src":""},{"id":"w092","category":"learning","sub":"","type":"word","front":"学習（トレーニング）","back":"データを使って、モデルの中の数値を少しずつ調整すること","detail":"予測と正解のずれを損失として計算し、それが小さくなる方向へパラメータを更新する。これを大量のデータでくり返す。計算が重く、GPUが必要になることが多い。学習が終わったモデルを使う段階は推論と呼んで区別する。","key":false,"src":""},{"id":"w093","category":"learning","sub":"","type":"word","front":"推論（インファレンス）","back":"学習済みのモデルに入力を渡し、答えを出させること","detail":"ロボットでは、画像や関節の状態を入力して次の動きを出させる。学習より計算は軽いが、動きを止めない速さが求められる。借りたクラウドのGPU（A40）でπ0.5を動かすと、一回の計算は平均97ミリ秒だった。","key":false,"src":"DAY326"},{"id":"w094","category":"learning","sub":"","type":"word","front":"観測と行動（オブザベーションとアクション）","back":"ロボットが受け取る情報と、それをもとに出す動きの指令","detail":"観測はカメラ画像や関節角など、行動は次の関節角や手先の移動量などを指す。ロボット学習のデータは、この二つを時刻でそろえた組の連続になる。時刻がずれると、どの観測からどの行動が出たのか読めなくなる。","key":false,"src":""},{"id":"w095","category":"learning","sub":"","type":"word","front":"方策（ポリシー）","back":"観測を受け取り、次にどう動くかを決める仕組み","detail":"強化学習でも模倣学習でも、学習で最終的に得るのはこの方策。ルールで書いた方策もあるが、ロボット学習ではニューラルネットワークで表すことが多い。モデルとほぼ同じ意味で使われるが、方策は観測から行動を決める役割を指す言葉。","key":true,"src":""},{"id":"w096","category":"learning","sub":"","type":"word","front":"エピソード","back":"タスクの開始から終了までの、ひと区切りの試行","detail":"強化学習や模倣学習のデータは、エピソード単位で集めて数える。一つのエピソードは、観測と行動の組が時間順に並んだもので、成功か失敗かもエピソードごとに記録する。AGIBOTの約100万エピソードに対し、mechArmは10エピソードから始めると考えた。","key":false,"src":"DAY140"},{"id":"w097","category":"learning","sub":"","type":"word","front":"デモンストレーション（実演データ）","back":"人がお手本として操作して見せた、動きの記録","detail":"人が遠隔操作や手で動かして作業をこなし、その観測と行動を記録する。模倣学習の材料になる。本数だけでなく、置き場所や手順のばらつき方が質を左右する。SO-101では、リーダーアームで実演を50本集める案を立てた。","key":false,"src":"DAY323"},{"id":"w098","category":"learning","sub":"","type":"word","front":"テレオペレーション（遠隔操作）","back":"人が離れた場所から、ロボットをリアルタイムに操作すること","detail":"コントローラーやVR、同じ形の操作用アームなどで動かす。操作用アームをリーダー、動く側をフォロワーと呼ぶ構成が、ロボット学習のデータ集めで広く使われる。人の判断が入るので、自律では難しい作業の実演も集められる。","key":true,"src":""},{"id":"w099","category":"learning","sub":"","type":"word","front":"模倣学習","back":"人の実演データをお手本に、ロボットに動きを覚えさせる学習","detail":"報酬を設計しなくても、見本があれば学べるのが利点。少ないデータで始めやすい反面、見本にない状況には弱い。強化学習と組み合わせることもある。mechArmでは、模倣学習に使える形で、試行の映像と関節データを同期して残し始めた。","key":true,"src":"DAY287"},{"id":"w100","category":"learning","sub":"","type":"word","front":"行動クローニング（BC）","back":"観測と行動の組を、そのまま真似るように学ぶ最も単純な模倣学習","detail":"実演データを、観測から行動を当てる問題として普通に学習する。手軽だが、少しずれると見本にない状態に入り、誤差が積み重なりやすい。人の実演はやり方がばらつくため、単純に平均を学ばせると動きが崩れる場合がある。","key":false,"src":""},{"id":"w101","category":"learning","sub":"","type":"word","front":"強化学習（RL）","back":"試行錯誤の結果に点数を付け、点数が高くなる動きを学ぶ方法","detail":"ロボットが動き、成功や失敗に応じた報酬を受け取り、報酬の合計が大きくなるように方策を更新する。お手本がなくても学べるが、膨大な試行が必要になる。そのため実機ではなく、シミュレーションで学習させることが多い。","key":true,"src":""},{"id":"w102","category":"learning","sub":"","type":"word","front":"報酬（リワード）","back":"行動の結果がどれだけ良かったかを示す、強化学習の点数","detail":"何に点を与えるかで、学習される動きが大きく変わる。設計が甘いと、意図しない近道で点だけ稼ぐ報酬ハッキングが起きる。mechArmでは、真上のカメラ写真を画像の読めるAIに渡し、掴めたか置けたかを判定させている。","key":true,"src":"DAY325"},{"id":"w103","category":"learning","sub":"","type":"word","front":"汎化","back":"学習で見たことのない状況でも、うまく動けること","detail":"物の置き場所、照明、背景、物の種類が変わっても成功するかで測る。データの多様さが汎化を左右する。学習時と同じ条件だけで成功率を測ると、実力を高く見積もってしまう。ロボット学習の最大の課題の一つ。","key":false,"src":""},{"id":"w104","category":"learning","sub":"","type":"word","front":"過学習（オーバーフィッティング）","back":"学習データを覚えすぎて、新しいデータに弱くなる状態","detail":"学習用データでは高い成績なのに、初めて見るデータで成績が落ちる。これを見分けるため、データを学習用・検証用・テスト用に分けて評価する。データを増やす、条件を散らすといった工夫で防ぐ。汎化と裏表の関係にある。","key":false,"src":""},{"id":"w105","category":"learning","sub":"","type":"word","front":"基盤モデル（ファウンデーションモデル）","back":"大量のデータで事前に学習され、多くの用途に転用できる大きなモデル","detail":"言語や画像の分野で広がり、ロボット向けの基盤モデルも登場している。一から学習するより、少ないデータで新しい作業に対応しやすい。ただしモデルが大きく、動かすには高性能なGPUが必要になることが多い。","key":false,"src":""},{"id":"w106","category":"learning","sub":"","type":"word","front":"事前学習（プレトレーニング）","back":"特定の作業の前に、大量の一般的なデータで学ばせておく段階","detail":"物の見え方や動きの一般的なパターンを先に身につけさせる。基盤モデルを作る段階にあたり、膨大な計算資源が必要で、主に大手が担う。個人や小さなチームは、公開された事前学習済みのモデルを使って始めることが多い。","key":false,"src":""},{"id":"w107","category":"learning","sub":"","type":"word","front":"ファインチューニング","back":"事前学習済みのモデルを、自分のデータで追加学習して合わせること","detail":"自分の機体、カメラの配置、作業内容に合わせるために行う。一から学習するより、少ないデータと計算で済む。ただし元のモデルの入力の形や関節の数に合わせる必要があり、データが少なすぎると過学習しやすい。","key":false,"src":""},{"id":"w108","category":"learning","sub":"","type":"word","front":"VLM（視覚言語モデル）","back":"画像と言葉を一緒に理解し、言葉で答えるAIモデル","detail":"画像について質問すると文章で答えられる。ロボットでは状況の説明、作業の計画、成功したかの判定などに使う。動きの指令そのものは出さない点がVLAとの違い。mechArmでは、掴みと置きの成否をVLMに判定させ、人の目を介さずに返している。","key":false,"src":"DAY235"},{"id":"w109","category":"learning","sub":"","type":"word","front":"VLA（視覚言語行動モデル）","back":"画像と言葉の指示から、ロボットの動きを直接出力するモデル","detail":"VLMに行動の出力を加えたもので、ロボット向け基盤モデルの主流になりつつある。π0やSmolVLAなどが公開されている。借りたクラウドのGPUでπ0.5を動かし、画像と指示を送って動きの数値を受け取るところまで通した。","key":true,"src":"DAY326"},{"id":"w110","category":"eval","sub":"","type":"word","front":"試行（トライアル）","back":"同じ条件で、ロボットに動作を1回やらせること","detail":"評価の最小単位。1回の結果は偶然に左右されるので、同じ条件で何回も試行して傾向を見る。置き場所や照明など、試行ごとの条件と結果を記録しておかないと、あとで比べたり原因を探したりできない。","key":true,"src":""},{"id":"w111","category":"eval","sub":"","type":"word","front":"成功率（サクセスレート）","back":"試行した回数のうち、成功した回数が占める割合","detail":"ロボット学習で最もよく使う評価の数字。パーセントだけでなく、何回中何回かを必ず添えて言う。回数が少ないと数字が大きくぶれる。mechArm では1日の63試行のうち、PICK の成功は41回だった。","key":true,"src":"DAY266"},{"id":"w112","category":"eval","sub":"","type":"word","front":"成功条件","back":"何をもって成功とするかを、試行の前に決めた基準","detail":"どこに置けば成功か、何秒以内なら成功か、などを試行の前に決めておく。基準があいまいだと、人や日によって判定が変わり、成功率を比べられなくなる。途中で基準を変えたら、それ以前の数字とは別に扱う。","key":false,"src":""},{"id":"w113","category":"eval","sub":"","type":"word","front":"ロギング（ログ）","back":"動作中の状態や結果を、あとで見返せるよう記録すること","detail":"指令値、実際に届いた値、時刻、成否などを残す。記録がなければ失敗の原因は推測でしか語れない。mechArm では通し動作1回ごとに、成否を台帳へ1行残す決まりにしている。","key":true,"src":"DAY249"},{"id":"w114","category":"eval","sub":"","type":"word","front":"データセット","back":"学習や評価に使うために集めて整理したデータのまとまり","detail":"画像、関節角、動作の記録などを、決まった形式でそろえたもの。学習用と評価用は分けておくのが基本。学習に使ったデータで評価すると、本当の実力より良い数字が出てしまう。","key":true,"src":""},{"id":"w115","category":"eval","sub":"","type":"word","front":"失敗モード","back":"失敗を、その起き方や原因ごとに分けた種類","detail":"成功率だけでは何を直せばよいか分からない。掴めなかったのか、置けなかったのかを分けて数えると、打ち手が見える。mechArm でも PICK 失敗と PLACE 失敗を分けて記録する設計にした。","key":false,"src":"DAY130"},{"id":"w116","category":"eval","sub":"","type":"word","front":"ベースライン","back":"改善の効果を比べるための、基準となる結果","detail":"何かを変える前の成績や、単純な方法での成績を基準として置く。基準がないと、良くなったのか分からない。mechArm では PLACE の接近が1回成立した状態を基準にして、次の改善に進もうとした。","key":true,"src":"DAY210"},{"id":"w117","category":"eval","sub":"","type":"word","front":"再現性","back":"同じ手順と条件で、同じ結果がもう一度得られること","detail":"1回うまくいっただけでは、偶然かもしれない。条件を記録し、繰り返して同じ結果が出るかを確かめる。mechArm でも、1回の成功だけでは閾値12mmで常に抜けられるとは言えず、再現テストが必要とした。","key":true,"src":"DAY208"},{"id":"w118","category":"eval","sub":"","type":"word","front":"誤差","back":"測った値や到達した位置と、本当の値とのずれ","detail":"ロボットではカメラの測定、関節の到達、計算モデルなど、あちこちで誤差が出る。誤差は大きく、いつも同じ向きにずれる系統誤差と、毎回ばらつく偶然誤差に分けて考える。","key":false,"src":""},{"id":"w119","category":"eval","sub":"","type":"word","front":"系統誤差","back":"原因が決まっていて、いつも同じ向きにずれる誤差","detail":"原因が決まっているので、見つけて補正しやすい。平均をとっても消えないのが特徴。mechArm では、計算上の手先と実機の爪先の間に、マット上の奥行き方向で約58mmの系統的なずれがあると、5点の実測で確かめた。","key":false,"src":"DAY178"},{"id":"w120","category":"eval","sub":"","type":"word","front":"偶然誤差（ばらつき）","back":"毎回ランダムに上下する、向きの決まらない誤差","detail":"回数を重ねて平均をとると小さくできる。どれくらいばらつくかは標準偏差で表す。mechArm の同じ測定では、左右方向のずれは向きが決まらず、プラスマイナス20mm程度のばらつきだった。","key":false,"src":"DAY178"},{"id":"w121","category":"eval","sub":"","type":"word","front":"正確さと精密さ","back":"狙いに近いのが正確さ、毎回そろうのが精密さ","detail":"的当てで言えば、中心に近いのが正確さ、矢がまとまっているのが精密さ。毎回同じ所にずれて当たるロボットは、精密だが正確ではない。どちらが足りないかで直し方が変わる。","key":false,"src":""},{"id":"w122","category":"eval","sub":"","type":"word","front":"外れ値","back":"他のデータから大きく離れた、例外的な値のこと","detail":"測定の失敗や一時的なノイズで出ることが多い。そのまま平均に入れると結果がゆがむ。ただし外れ値が本当の問題を示すこともあるので、黙って捨てず理由を残す。mechArm のマット四隅検出では、外れ値を除いてから平均した。","key":false,"src":"DAY164"},{"id":"w123","category":"eval","sub":"","type":"word","front":"アノテーション","back":"画像やデータに、人が正解の情報を書き込む作業","detail":"物体を枠で囲む、輪郭をなぞる、点を打つ、などの種類がある。学習用データ作りで最も時間がかかる工程といわれる。付ける人によって基準がぶれないよう、先に手順と判断のルールを決めておく。","key":false,"src":""},{"id":"w124","category":"eval","sub":"","type":"word","front":"正解データ（グラウンドトゥルース）","back":"評価の基準にする、本当の値とみなすデータ","detail":"評価する仕組みとは別の方法で作るのが原則。同じ仕組みで正解を作ると、間違いに気づけない。画像認識シリーズでは、表紙の四隅の真値を手動のアノテーションで作り、評価対象と分けた。","key":false,"src":"DAY309"},{"id":"w125","category":"eval","sub":"","type":"word","front":"評価指標（メトリクス）","back":"性能を数字で表すために使う、決まった物差し","detail":"成功率、位置の誤差、作業にかかる時間などがある。何を指標にするかで、改善の向かう方向そのものが変わる。一つの数字だけを追いかけると、安全性や動きの質など、他の大事な性質を見落としやすい。","key":false,"src":""},{"id":"w126","category":"eval","sub":"","type":"word","front":"ベンチマーク","back":"性能を比べるための、共通の課題と評価のやり方","detail":"同じ課題、同じ手順、同じ指標で測るので、違う手法どうしを公平に比べられる。研究の進み具合を示す共通の物差しになる。ただし、ベンチマークで高得点でも、自分の現場で同じように通用するとは限らない。","key":false,"src":""},{"id":"w127","category":"eval","sub":"","type":"word","front":"統計的なぶれ（信頼区間）","back":"試行回数が少ないと、成功率が偶然だけで動く幅","detail":"回数が少ないほど、たまたまの結果に引っ張られる。小さな差を手法の差と言うには、十分な回数が要る。成功率50%前後で30回だと、95%の範囲で上下に約18ポイントぶれると記事で見積もった。","key":false,"src":"DAY323"},{"id":"w128","category":"eval","sub":"","type":"word","front":"分布外（OOD）","back":"学習のときに見たことのない、新しい条件やデータ","detail":"照明、置き場所、物の形や色などが学習時と違うと、性能が大きく落ちやすい。評価では、学習と同じ条件だけでなく、あえて分布外の条件でも試して、汎化の力がどこまであるかを確かめる。","key":false,"src":""},{"id":"w129","category":"eval","sub":"","type":"word","front":"アブレーション","back":"部品を一つずつ外して、それぞれの効き目を確かめる実験","detail":"手法のどの要素が成績に効いているかを切り分けるために行う。全部入りの結果だけでは、何が効いたのか分からない。研究論文ではほぼ必ず載っている比較のやり方で、読むときの大事な手がかりになる。","key":false,"src":""},{"id":"w130","category":"principles","sub":"","type":"word","front":"反復開発（イテレーション）","back":"小さく作って試し、直す流れを何度も回す進め方","detail":"最初から完成形を狙わず、動く最小のものを作って試し、その結果から次の一手を決める。ロボットは実機で試して初めて分かることが多いので、特にこの進め方が合う。1回の周期を短くするほど、学びが速くなる。","key":true,"src":""},{"id":"w131","category":"principles","sub":"","type":"word","front":"仮説検証","back":"原因の予想を立て、実験でそれが正しいか確かめること","detail":"予想は一度に一つずつ確かめる。外れた仮説も、原因の候補を減らす成果になる。mechArm で関節が届かない問題では、待ち時間を短くしても6回とも届き、待ち時間は主因でないと分かった。","key":false,"src":"DAY273"},{"id":"w132","category":"principles","sub":"","type":"word","front":"切り分け","back":"問題の範囲を少しずつ狭めて、原因の場所を特定すること","detail":"全体をまとめて疑うのではなく、部品ごとに分けて単独で動かし、どこで壊れるかを探す。mechArm では動かない739行のスクリプトを、6つの単体スクリプトに分けて調べた。","key":false,"src":"DAY211"},{"id":"w133","category":"principles","sub":"","type":"word","front":"ボトルネック","back":"全体の速さや性能を、いちばん強く制限している部分","detail":"瓶の首のように、そこが詰まると全体が詰まる。他を速くしても全体は速くならないので、まず測って場所を見つける。mechArm の画像検出では、グレースケール化で14.48秒が5.09秒に縮んだ。","key":true,"src":"DAY211"},{"id":"w134","category":"principles","sub":"","type":"word","front":"根本原因分析（RCA）","back":"表に出た症状ではなく、問題を生んだ大もとを突き止めること","detail":"症状だけを直すと、形を変えて再発する。なぜを繰り返して大もとまでたどる。mechArm では、補正値をいじっても爪が合わない原因が、手首と爪先の位置の違いにあると分かった。","key":true,"src":"DAY162"},{"id":"w135","category":"principles","sub":"","type":"word","front":"段階的検証","back":"小さな単位から順に確かめ、少しずつ範囲を広げる検証","detail":"部品単体、部品をつないだ状態、実機での通し動作、の順に進める。いきなり全体を動かすと、失敗しても原因がどこにあるか分からず、ロボットや周りの物を壊す危険もある。前の段階が通ってから次へ進む。","key":true,"src":""},{"id":"w136","category":"principles","sub":"","type":"word","front":"ドライラン（dry-run）","back":"実際には動かさず、計画や処理の流れだけを試すこと","detail":"ロボットに指令を送らずに、計算結果や動作の予定を確認できる。危険な動作の前の安全確認として使う。mechArm では、dry-run で計画を確かめてから本番の PICK から PLACE を通す順番を決めた。","key":false,"src":"DAY256"},{"id":"w137","category":"principles","sub":"","type":"word","front":"フェイルセーフ","back":"故障や異常が起きても、安全な側に倒れるようにする設計","detail":"信号が途切れたら止まる、電源が落ちたらブレーキがかかる、などが代表例。ただし止まること自体が危険な場合もあるので、その機械にとって何が安全な状態なのかを、設計の最初に決めておく必要がある。","key":true,"src":""},{"id":"w138","category":"principles","sub":"","type":"word","front":"フォールバック","back":"主な方法が使えないときに切り替える、代わりの手段","detail":"便利な反面、気づかないうちに代わりの道で動き続ける危険がある。mechArm では、記録先の外付けドライブがないときに別の場所へ書かず、そこで止める設計にした。","key":false,"src":"DAY244"},{"id":"w139","category":"principles","sub":"","type":"word","front":"非常停止（E-stop）","back":"異常時に、人がすぐロボットを止めるための仕組み","detail":"押しボタンなどで、すぐ確実に止められることが求められる。電源を切るだけでは、関節の保持力が抜けて腕が落ちることがある。mechArm の受け渡し設計でも、電源断は非常停止とは言えないと指摘された。","key":false,"src":"DAY288"},{"id":"w140","category":"principles","sub":"","type":"word","front":"インターロック","back":"条件がそろわない限り、動作できないようにする仕組み","detail":"安全柵の扉が開いたらロボットが動かない、などが代表例。人の注意や記憶に頼らず、仕組みで危険な組み合わせを起こさせない。ソフトウェアで、条件がそろわないと次の処理に進まないようにするのも同じ考え方。","key":false,"src":""},{"id":"w141","category":"principles","sub":"","type":"word","front":"安全マージン","back":"限界ぎりぎりではなく、余裕を残して決める設定の幅","detail":"関節の可動範囲や速度、力の上限を、仕様の限界よりも内側に設定する。誤差やばらつきが出ても、危険な状態に入らないようにするため。余裕を取りすぎると、今度はできる動きが狭くなるので、実測で決める。","key":false,"src":""},{"id":"w142","category":"principles","sub":"","type":"word","front":"最小構成（MVP）","back":"目的を確かめるのに必要な、いちばん小さな形","detail":"機能を足す前に、核になる部分だけで目的が成り立つかを確かめる。早く試せて、無駄な作り込みを防げる。足りないものは試したあとで実測して分かるが、余計なものは作ったあとでは気づきにくい。","key":false,"src":""},{"id":"w143","category":"principles","sub":"","type":"word","front":"技術的負債","back":"その場しのぎの実装が、あとで修正の手間として返ってくること","detail":"急いで書いたコードや、場当たりの補正値が典型。動いているうちは問題に見えないが、あとから直すほど手間が増え、別の変更の足を引っぱる。借金と同じで、気づいたら早めに返すほうが安くつく。","key":false,"src":""},{"id":"w144","category":"principles","sub":"","type":"word","front":"コードレビュー","back":"書いたコードを、別の人や別の目で確認すること","detail":"書いた本人は同じ思い込みを持つので、自分では見落としに気づきにくい。mechArm でも、関節制御で繰り返し止まる問題は、自分の仮説だけで進めず外部のレビューに通した。","key":false,"src":"DAY235"},{"id":"w145","category":"principles","sub":"","type":"word","front":"HRI（ヒューマンロボットインタラクション）","back":"人とロボットのやり取りや関わり方を扱う分野","detail":"安全だけでなく、分かりやすさ、安心感、信頼などを扱う。研究分野であると同時に、設計の実務でもある。mechArm では、アームが差し出したブロックを人が受け取る動作を設計した。","key":true,"src":"DAY288"},{"id":"w146","category":"principles","sub":"","type":"word","front":"動きの分かりやすさ（レジビリティ）","back":"動きを見ただけで、ロボットの狙いが人に伝わる性質","detail":"どの物を取りに行くのかが、途中の動きから早めに分かると、人は安心して横で作業できる。最短で効率のよい動きが、人にとって一番分かりやすい動きとは限らない。HRI の研究でよく扱われる性質。","key":false,"src":""},{"id":"w147","category":"principles","sub":"","type":"word","front":"ヒューマンインザループ","back":"判断や修正の流れの中に、人を組み込んだ仕組み","detail":"ロボットに全部を任せず、迷った場面や失敗しかけた場面で人が判断したり手を貸したりする。学習の場面では、人が途中で修正した内容をそのままデータとして使い、学習を早める方法もある。","key":false,"src":""},{"id":"w148","category":"society","sub":"","type":"word","front":"産業用ロボット","back":"工場で溶接や組立、搬送などを自動で行うロボット","detail":"主に安全柵の中で、決まった動きを高速かつ正確に繰り返す。自動車や電子部品の工場が代表的な現場。人と同じ空間で働く協働ロボットとは、安全の考え方や求められる性能の優先順位が違う。","key":true,"src":""},{"id":"w149","category":"society","sub":"","type":"word","front":"協働ロボット（コボット）","back":"柵なしで、人のそばで一緒に働けるよう作られたロボット","detail":"力の制限や接触の検知などで、人と同じ空間で使えるよう作られている。速度や力は産業用ロボットより抑えめ。ただし協働ロボットを使えば自動的に安全、ではない。使い方ごとにリスクアセスメントが必要になる。","key":true,"src":""},{"id":"w150","category":"society","sub":"","type":"word","front":"サービスロボット","back":"工場の外で、人の生活や仕事を手伝うロボット","detail":"配膳、清掃、警備、案内、介護などの分野で使われる。工場と違って、環境が整えられていない場所で、しかも一般の人のそばで動く。そのため想定外の出来事が多く、安全と使いやすさの設計が難しい。","key":false,"src":""},{"id":"w151","category":"society","sub":"","type":"word","front":"AGV（無人搬送車）","back":"床の線や印に沿って、決まった経路で荷物を運ぶ車","detail":"磁気テープや床の印などで経路を決め、その上を走る。動きが決まっているので安定して使える反面、経路を変えるには設備の工事が要る。地図を持って自分で道を選ぶ AMR との違いが、よく比べられる。","key":false,"src":""},{"id":"w152","category":"society","sub":"","type":"word","front":"AMR（自律移動ロボット）","back":"地図とセンサで、自分で道を選んで移動するロボット","detail":"センサで周りを見ながら、障害物を避けて経路をその場で決め直せる。倉庫や工場の搬送でよく使われる。床に線を引く必要がないので、棚の配置を変えるなどのレイアウト変更にも強い。","key":false,"src":""},{"id":"w153","category":"society","sub":"","type":"word","front":"ヒューマノイド","back":"人に近い体の形をした、二足歩行などのロボット","detail":"人向けに作られた建物や道具を、そのまま使える可能性があるとして注目されている。一方で、機構が複雑で値段が高く、転倒などの安全面の課題もある。現場で安定して働かせるのは、まだ難しい段階にある。","key":false,"src":""},{"id":"w154","category":"society","sub":"","type":"word","front":"省人化","back":"作業に必要な人の数を、機械化や自動化で減らすこと","detail":"人手不足への対策として、日本の製造や物流の現場でよく使われる言葉。人を完全になくす無人化とは違い、判断や例外対応など人が担う部分を残しながら、人の数や負担を減らしていく考え方。","key":false,"src":""},{"id":"w155","category":"society","sub":"","type":"word","front":"タクトタイム","back":"製品1個を作るのに許される、生産上の目標時間","detail":"生産したい数と使える時間から決まる時間で、ロボットの動作はこの中に収まる必要がある。実際に1個の作業にかかる時間であるサイクルタイムとは別の言葉なので、混同しないよう注意する。","key":false,"src":""},{"id":"w156","category":"society","sub":"","type":"word","front":"SIer（システムインテグレータ）","back":"ロボットを現場に合わせて組み込み、仕組みとして納める会社","detail":"ロボット本体だけでは仕事にならず、ハンドや周辺機器、プログラムを組み合わせて初めて現場で動く。日本のロボット導入の多くは、この SIer が支えている。人手が足りず、導入の待ちが生まれることもある。","key":true,"src":""},{"id":"w157","category":"society","sub":"","type":"word","front":"PoC（概念実証）","back":"本格導入の前に、小さく試して効果を確かめること","detail":"現場の一部で小さく試し、技術的にできるか、効果が出るかを確かめる。本格導入の前に失敗の芽を見つけられる。一方で、試すだけで本番に進まないPoC止まりが、業界の課題としてよく語られる。","key":false,"src":""},{"id":"w158","category":"society","sub":"","type":"word","front":"ROI（投資対効果）","back":"かけたお金に対して、どれだけの効果が返ってくるかの指標","detail":"ロボット導入では、本体の値段だけでなく、組み込み、保守、教育にかかる費用も含めて考える。何年で元が取れるかという回収期間とあわせて、導入するかどうかを決める主な判断材料になる。","key":true,"src":""},{"id":"w159","category":"society","sub":"","type":"word","front":"安全柵","back":"ロボットの動く範囲に、人が入れないよう囲う柵","detail":"産業用ロボットの基本的な安全対策。扉が開くと止まるインターロックと組み合わせて使う。柵が要らない使い方をするには、リスクアセスメントで安全を確かめる必要がある。","key":false,"src":""},{"id":"w160","category":"society","sub":"","type":"word","front":"リスクアセスメント","back":"危険を洗い出し、その大きさを見積もって対策を決める手順","detail":"どんな危険があるか、起きたらどれくらい重いかを評価する。対策は、まず設計で危険を減らし、次に保護装置、最後に注意表示や教育の順で考える。ロボットの安全の出発点になる手順。","key":true,"src":""},{"id":"w161","category":"society","sub":"","type":"word","front":"安全規格（ISO 10218）","back":"産業用ロボットの安全について定めた国際規格","detail":"ロボット本体の作り方と、現場への組み込み方の両方について安全の要求を定めている。日本ではこれに対応したJIS規格がある。2025年の改訂で、協働の使い方を定めた技術仕様 ISO/TS 15066 の内容も取り込まれた。","key":false,"src":""},{"id":"w162","category":"society","sub":"","type":"word","front":"機能安全","back":"制御の仕組みが壊れても、安全を保てるようにする考え方","detail":"センサやプログラムが故障することを前提に、安全を担う機能の信頼性を決めて作る考え方。ふつうの機能とは別に、安全のための機能を設計し、どれだけ確実に働くかを評価する。機械や車でも使われる。","key":false,"src":""},{"id":"w163","category":"society","sub":"","type":"word","front":"RaaS（ロボットアズアサービス）","back":"ロボットを買わずに、月額などの利用料で使う仕組み","detail":"ロボットを買い取らずに使えるので、初期費用を抑えられる。保守や更新も提供する側がまとめて受け持つ。導入のハードルを下げる売り方として、物流や清掃などのサービス分野で広がっている。","key":false,"src":""},{"id":"w164","category":"society","sub":"","type":"word","front":"フィジカルAI（Physical AI）","back":"現実の世界を認識し、体を動かして働くAI","detail":"画面の中で文章や画像を作るAIと違い、ロボットなどの体を通して、現実の物に働きかける。カメラの映像や言葉の指示から動作を決めるモデルが発展したことで、業界の注目が一気に集まっている。","key":true,"src":""},{"id":"r049","category":"kinematics","sub":"座標系と関節の名前","type":"term","front":"mechArm の6軸（j0〜j5）","back":"j0=ベース回転、j1=肩、j2=肘、j3=腕の捻り、j4=手首の曲げ（ピッチ）、j5=グリッパーの捻り。捻り（j3・j5）と曲げ（j1・j2・j4）は別種の軸で、捻りは側面図には出ない。","detail":"","key":false,"src":"arm_kinematics"},{"id":"r050","category":"kinematics","sub":"座標系と関節の名前","type":"point","front":"座標系はロボット＝マット＝Unityで統一し、原点はアームベースの真下。上カメラから見て Unity X+ は画面左、Z+ は手前、Y+ は上。mm×0.001 で m に変換する。","back":"当初は mechArm の座標（X=前後・Y=左右・Z=高さ）と Unity 座標・人の直感が食い違い、Unity 座標を正に統一した。mechArm ネイティブは Z が上なので、上方向オフセットはどの座標系のコードか必ず確認する。","detail":"","key":true,"src":"DAY149・DAY158・DAY160・DAY164・arm_kinematics"},{"id":"r051","category":"kinematics","sub":"座標系と関節の名前","type":"point","front":"ROS（右手系）と Unity（左手系）は座標系が違う。URDF の値を Unity へ移すときは Unity.x=ROS.x、Unity.y=ROS.z、Unity.z=ROS.y と軸を入れ替える。","back":"","detail":"","key":false,"src":"DAY133"},{"id":"r052","category":"kinematics","sub":"座標系と関節の名前","type":"qa","front":"lookup の距離は0.7mmなのに、アームがブロックと逆方向へ動いた原因は？","back":"ホモグラフィ（画像→平面座標の変換）校正の Y 軸の符号が最初から逆だった。コードは正しく見えたが、実機で j0 を−30°動かし手先の向きを見て分かり、1行の符号修正で直った。Unity と実機で j0 の回転方向が逆なこともこのとき判明した。","detail":"","key":false,"src":"DAY154"},{"id":"r053","category":"kinematics","sub":"座標系と関節の名前","type":"qa","front":"カメラの座標とロボット座標を、1点で求めたオフセット式で繋ぐとどうなる？","back":"原点も向きも違うので、1点で合わせた式は別の位置で崩れる（X約38mm・Y約50mmずれた）。ホモグラフィの対応点にロボット座標の実測値を入れ、画素→ロボット座標を直接出す方式に変えた。","detail":"","key":false,"src":"DAY144"},{"id":"r054","category":"kinematics","sub":"座標系と関節の名前","type":"qa","front":"スマホで手先の位置と向き（6自由度）を指示する方式を SO-101 に使うと何が問題？","back":"SO-101 は5関節＋グリッパーなので、指示した向きを全部は再現できない。Phone2Act の論文はその扱いを書いていない。","detail":"","key":false,"src":"研究メモ:Phone2Act（スマホ遠隔操作）"},{"id":"r055","category":"kinematics","sub":"手先（EE）の定義","type":"qa","front":"EE（エンドエフェクタ＝手先の基準点）はどこに定義すべきか？","back":"手首フランジ（link6）ではなく、左右の爪先（Brep）の中点をルート相対で記録する。手首基準では白箱中心への最近傍が69mm、爪先中点基準では0.43mmになった。中点なら指が閉じても奥にずれるだけで、掴む直前の入口位置として意味がある。","detail":"","key":true,"src":"DAY157・DAY168・DAY169"},{"id":"r056","category":"kinematics","sub":"手先（EE）の定義","type":"qa","front":"手首と爪のずれを、固定オフセットの補正で直せないのはなぜ？","back":"爪は手首から約90mm先にあり、ずれの出る方向は j0（ベース回転）の向きで変わる。j0=48°で測った補正値は j0=60°では合わない。EE の定義を爪先に変えて FK テーブルを作り直すしかない。","detail":"","key":false,"src":"DAY162"},{"id":"r057","category":"kinematics","sub":"IKをやめてFKテーブルへ","type":"term","front":"CCD IK","back":"Cyclic Coordinate Descent。手先に近い関節から1つずつ、手先が目標へ向くよう回す反復型の逆運動学（手先位置から関節角を求める計算）。6軸＋関節制限では局所解に陥りやすく、mechArm では5日間試しても収束せず（最高でも11/273＝4%）、捨てた。","detail":"","key":false,"src":"DAY149・DAY150"},{"id":"r058","category":"kinematics","sub":"IKをやめてFKテーブルへ","type":"qa","front":"ikpy による解析的 IK を採用しなかった理由は？","back":"1,066点すべてが「成功」と出たが、実機で確認済みの角度と全関節で大きくずれていた。約26%の点で j1 が上限120°に張り付いてもいた。計算上の成功と実機で正しい角度は別物。","detail":"","key":false,"src":"DAY150"},{"id":"r059","category":"kinematics","sub":"IKをやめてFKテーブルへ","type":"point","front":"IK を解く代わりに、確認済みの姿勢から関節角を少しずつずらして FK（順運動学：関節角→手先位置）で記録すれば「角度→位置」の対応表（FK テーブル）ができる。IK は逆問題で失敗しうるが、FK は順問題で失敗しない。","back":"","detail":"","key":true,"src":"DAY150"},{"id":"r060","category":"kinematics","sub":"IKをやめてFKテーブルへ","type":"point","front":"PICK/PLACE 用の FK テーブルは j1 が20.17〜125°で、HOME（j1=0）付近を含まない。別スキャンで測った HOME の爪先は高さ232.4mm・人側267.1mmで、真上ではなく垂直から約49°前傾していた。","back":"","detail":"","key":false,"src":"DAY289・DAY297"},{"id":"r061","category":"kinematics","sub":"IKをやめてFKテーブルへ","type":"qa","front":"FK テーブルの「範囲を広げる」と「密度を上げる」では、計算時間の増え方がどう違う？","back":"時間は総点数にほぼ比例する（約25ms/点、20体並列で10万点約42分）。範囲拡張は基準姿勢の数に線形で増える。密度は6軸格子の掛け算で、各軸の刻みを半分にすると最悪 2^6=64倍（約45時間）。だから全域を作り直さず、穴の領域だけ差分で足す。","detail":"","key":false,"src":"DAY225"},{"id":"r062","category":"kinematics","sub":"FKテーブルの引き方","type":"qa","front":"XZ 距離だけで最近傍を選ぶ lookup が、間違った姿勢を返したのはなぜ？","back":"6軸アームには冗長解があり、同じ先端座標で姿勢が大きく違う点がテーブルに複数ある。XZ だけでは高さも姿勢も違う点を拾い、3Dで32mmずれる例もあった。確定 PICK 姿勢の j2〜j5 に近い候補と目標の高さ範囲で絞ってから最近傍を選ぶ。","detail":"","key":true,"src":"DAY170・DAY177"},{"id":"r063","category":"kinematics","sub":"FKテーブルの引き方","type":"qa","front":"最近傍の合否を3D距離だけで決めると何が起きる？","back":"高さが大きく下振れした点が通ってしまう。3D距離40.2mm（閾値内）なのに高さ80mm（目標120mm）を引いた。テーブルの密度は場所で違い（最近傍距離4.1〜54.6mm）、肘・手首が捻れた別の腕の形も選ばれる。高さの下振れ制限（APPROACH 30mm・降下15mm）を足し、送信前に止めた。","detail":"","key":false,"src":"DAY213・DAY215・DAY217"},{"id":"r064","category":"kinematics","sub":"FKテーブルの引き方","type":"point","front":"位置 (X,Y,Z) で最近傍を引くと、位置に効かない爪の回転 j5 は偶然の値になる（0°が返り、HOME の-30°から30°回りかけた）。位置で決まらない関節は HOME 値に固定して送る。","back":"","detail":"","key":false,"src":"DAY210"},{"id":"r065","category":"kinematics","sub":"FKテーブルの引き方","type":"qa","front":"x-z 座標の最近傍だけで6関節の姿勢を選ぶと何が起きた？","back":"下げるだけでよいのに j3（腕の捻り）が-32°、次に j5（グリッパーの捻り）が30°ずれた姿勢が選ばれ、爪が箱に当たった。補正は x-z しか動かさないので直らない。j3・j5 に±5°の帯フィルタを足すと捻りは消えたが、今度は曲げの関節が極端な深さに振れた。","detail":"","key":false,"src":"DAY263"},{"id":"r066","category":"kinematics","sub":"FKテーブルの引き方","type":"qa","front":"昨日まで掴めたブロックに爪先が7cmずれて降りた。接近姿勢の何が問題だった？","back":"真下に下ろすには接近と降下の j0（ベース回転）が同じでなければならない。接近は円弧 lookup（j0=-17）、降下は FK 最近傍（j0=-26）で9°食い違い、下ろしながら横に振っていた。接近も FK lookup に揃え、降下の j0 を接近の±3°に拘束すると、PICK→PLACE を3連続で通し、最良で爪先のずれは2.3mmになった。","detail":"","key":true,"src":"DAY275"},{"id":"r067","category":"kinematics","sub":"FKテーブルの引き方","type":"qa","front":"PLACE 降下で、接近姿勢とかけ離れた深い姿勢が選ばれる問題をどう解いた？","back":"接近から全軸±15°以内で降りられる実在点を格子ごとに数えると195セル全部が空で、選び方ではなくデータの欠損だった。9つの基準姿勢を Unity でスキャンして151,263点を追加し、lookup に参照姿勢と許容関節差15°を渡すと、最大関節移動は27.84°→14.66°になった。","detail":"","key":false,"src":"DAY263・DAY265"},{"id":"r068","category":"kinematics","sub":"FKテーブルの引き方","type":"qa","front":"PLACE 補正が毎回安全側に破棄された真因は？","back":"テーブルには j4 に余裕のある姿勢が351点あったが、接近の基準姿勢が手首を限界 j4=-89.38° に張り付かせていた。PLACE は接近から全軸±15°の範囲でしか動けず、良い姿勢に乗り換えられない。上流の姿勢が悪いと下流も悪いまま。j1 と j4 の基準値は、組がテーブルに実在するよう対で変える。","detail":"","key":false,"src":"DAY279"},{"id":"r069","category":"kinematics","sub":"FKテーブルの引き方","type":"qa","front":"FK テーブルに67,228点を足しても PLACE の Z 残差（約15mm）が動かなかった。届く姿勢を消していたのは？","back":"lookup の候補フィルタ。①高さ許容±5mmが到達候補を門前払い ②スコア式が m 単位の距離と度単位の関節差を混ぜ、j1 の1°が300mm相当になって基準姿勢と同じ点しか選ばれない ③最良点は j4=-101 で安全範囲により正当に除外。①②を直し、追加スキャンの点と合わせて初めて残差は14.7mm→7.9mm。③は物理保護なので変えない。","detail":"","key":false,"src":"DAY281"},{"id":"r070","category":"kinematics","sub":"テーブルの穴と被覆","type":"qa","front":"狙いの近くに1万点以上あるのに、欲しい高さの姿勢が最近傍に選ばれなかったのはなぜ？","back":"点が無いのではなく、密な低い点（ee_y≈0.08m）に高い点（2割）が埋もれていた。元の基準姿勢やグリッドの j0 範囲が片側に偏っていたのが原因。その領域の高さ分布を検算し、高い点を出す実在姿勢を基に±15°格子で再スキャンする。勘で姿勢を作らない。","detail":"","key":false,"src":"DAY222・DAY253・arm_kinematics"},{"id":"r071","category":"kinematics","sub":"テーブルの穴と被覆","type":"qa","front":"FK テーブルの「穴」が1軸ずつのヒストグラムで見えないのはなぜ？","back":"降下姿勢の j1≈90° も床近くの高さも、1軸ごとに見れば最も濃い帯だった。掴むのに要るのは「関節の組み合わせ×床近くの高さ」という多次元の条件で、穴はその交差にしか現れない。1軸ごとの集計では有無を判断できない。","detail":"","key":false,"src":"DAY251"},{"id":"r072","category":"kinematics","sub":"テーブルの穴と被覆","type":"point","front":"代表姿勢の近傍だけで被覆を語ると偽の穴が出る。PLACE 姿勢±10°には0点でも、白箱の床近くには別姿勢で31,422点あった。穴は場所ではなく姿勢の選び方にある。","back":"","detail":"","key":false,"src":"DAY251"},{"id":"r073","category":"kinematics","sub":"テーブルの穴と被覆","type":"point","front":"1つの姿勢で j0 だけを振ると、爪先は面ではなく細い弧を描く（置く姿勢なら半径約280mmで奥〜横の半周、手前には届かない）。全点の雲が面に見えるのは、別姿勢の弧が重なった錯覚。","back":"","detail":"","key":false,"src":"DAY251・DAY254"},{"id":"r074","category":"kinematics","sub":"テーブルの穴と被覆","type":"qa","front":"1本の弧しかない姿勢を「面」にするには何が要る？","back":"j1〜j5 を固定して j0 だけ振る限り1基準姿勢＝1弧で、奥行き135〜320mmに散るブロックのほぼ一点しか通らない。j1（肩）と j2（肘）で到達半径の違う基準姿勢を複数持ち、それぞれで j0 を振れば弧が入れ子になり面になる。lookup 側にも奥行きで弧を選ぶ段が要る。","detail":"","key":false,"src":"DAY252"},{"id":"r075","category":"kinematics","sub":"関節の効き（感度）","type":"point","front":"可動域は1関節の角度範囲ではなく、6関節が補い合う姿勢空間で決まる。肩を単独で深く曲げると爪がマットに当たるが、手首のピッチも合わせて曲げると肩は70°以上まで届いた。","back":"","detail":"","key":false,"src":"DAY173"},{"id":"r076","category":"kinematics","sub":"関節の効き（感度）","type":"point","front":"ベース回転 j0 は爪先を左右（X）に約-6.5mm/° 動かすが、奥行き（Z）にはほぼ効かない（約0.55mm/°）。X の追従は j0 で行い、Z には別の関節群が要る。","back":"","detail":"","key":false,"src":"DAY180・DAY185"},{"id":"r077","category":"kinematics","sub":"関節の効き（感度）","type":"qa","front":"接近・PICK・PLACE と高さを変えても、箱を向く j0 が同じ+4.5°だったのはなぜ？","back":"j0 は基部の回転で、方位だけを変える軸だから。高さを変えると爪先の弧の半径は変わる（0.35m／0.31m／0.30m）が、向きは変わらない。","detail":"","key":false,"src":"DAY232"},{"id":"r078","category":"kinematics","sub":"関節の効き（感度）","type":"qa","front":"Z 方向の追従が縮まらず振動し続けた本当の原因は？","back":"「j1+, j2+, j4- で Z+ に動く」と幾何学的に推論していたが、実測では逆に Z- へ動いた（-12.64mm）。毎フレーム逆向きの指令が出て振動していた。4ケースの実測で3関節の符号を反転し、さらにSSH送信をPi常駐デーモンに置き換えて、1.7秒で2D距離2.9mmに収束した。","detail":"","key":true,"src":"DAY186・DAY189"},{"id":"r079","category":"kinematics","sub":"関節の効き（感度）","type":"point","front":"関節を動かしたときの爪先の動きは、姿勢で効き方も向きも変わる。連動3関節の Z 係数は領域で18%違い、j2 を浅くすると-24°付近を境に爪先が下がるから上がるに転じた。関節値の符号と直感も食い違うので、向きは実機で確かめる。","back":"","detail":"","key":false,"src":"DAY186・DAY189・DAY191・DAY199・DAY200・DAY204"},{"id":"r080","category":"kinematics","sub":"関節の効き（感度）","type":"qa","front":"高さ（Y）の補正に j2 ではなく j4 を使うのはなぜ？","back":"3姿勢で測ると、各姿勢で j2 と j4 の Y への効き（6〜10px/°）は同程度だが、奥行き Z への干渉は j2 が-1.6〜-2.0mm/°、j4 は±0.3mm/°以下だった。j4 は j2 より5〜13倍 Y 専用に近い。机上で考えた「j2 と j4 を逆向きに連動させて干渉を打ち消す」設計は不要になった。","detail":"","key":false,"src":"DAY204"},{"id":"r081","category":"kinematics","sub":"関節の効き（感度）","type":"point","front":"j4 の Y 感度は高い姿勢+10→中+8.2→低+6px/° とほぼ線形に下がるので、j2 の値で線形補間して使う（誤差最大2.5%）。固定値だと低い姿勢で補正が過剰になり振動する。","back":"","detail":"","key":false,"src":"DAY204"},{"id":"r082","category":"kinematics","sub":"関節の効き（感度）","type":"point","front":"降下後（肘が寝た姿勢）で爪先の奥行き Z を動かせるのは実質 j2 だけで、感度は0.7〜1.1mm/°。しかも X も動く。33mm の差を詰めるには約44°要り、姿勢が壊れる。","back":"","detail":"","key":false,"src":"DAY248"},{"id":"r083","category":"kinematics","sub":"関節の効き（感度）","type":"qa","front":"爪先をブロックへ降ろすのに、なぜ j4（手首）単独の回転が効いたのか？","back":"手首を軸に j4 を回すと爪先は円弧を描いて降り、腕全体の姿勢を作り替えずに済む。円弧なので XZ もずれるため、毎ステップ j0 で X、j1+j2 で Z を補正し、1回の send_angles にまとめた。回転の符号はコードと実機で逆だった。","detail":"","key":false,"src":"DAY200"},{"id":"r084","category":"kinematics","sub":"関節の効き（感度）","type":"qa","front":"j1 を据え置き j2 を増やして爪を降ろそうとしたら何が起きた？","back":"到達はしたが、爪は降りずに16mm前へ伸びただけだった。その姿勢領域では「降りる」より「前に伸びる」が勝つ。真上のカメラでは高さが分からず、横カメラで初めて箱の縁よりずっと上だと分かった。","detail":"","key":false,"src":"DAY232"},{"id":"r085","category":"kinematics","sub":"関節の効き（感度）","type":"term","front":"平行スライド","back":"グリッパを水平・同じ高さに保ったまま、爪先の x・z だけを動かす動き。j1+j2+j4 を同方向に動かすリーチ伸縮とは別物で、姿勢を拘束した運動学が要る。リーチ伸縮で測った係数は使えない。","detail":"","key":false,"src":"DAY191・DAY192"},{"id":"r086","category":"kinematics","sub":"関節の効き（感度）","type":"qa","front":"平行スライドを解く方法に、lookup 逆引きを選んだのはなぜ？","back":"解析的 IK は正確な DH パラメータ（リンク寸法の定式化）が要り、ヤコビアン疑似逆の数値解は反復が重い。lookup は実機で検証してきた FK テーブルを「目標高さ・水平姿勢」で絞って最近傍を選ぶだけ。表に姿勢列が無いので、グリッパのピッチは肩・肘・手首のピッチ角の和で事後計算する（要検証の仮説）。","detail":"","key":false,"src":"DAY192"},{"id":"r087","category":"kinematics","sub":"経路と干渉","type":"qa","front":"HOME から任意の位置へ動かすとき、なぜ2段階（ベースだけ回す→全関節を展開）にしたのか？","back":"HOME から直接送ると関節空間で補間され、手先が途中で想定外に下がりうる。腕を畳んだまま j0 だけ回して向きを揃え、それから腕を伸ばす。復路も逆順の2段階にする。","detail":"","key":false,"src":"DAY215"},{"id":"r088","category":"kinematics","sub":"経路と干渉","type":"point","front":"FK が指す爪先位置が正しくても、手前のリンクが対象にぶつかることがある（白箱上空75mmで接触）。到達点だけでなく、アーム全体が占める体積を考える。","back":"","detail":"","key":false,"src":"DAY209"},{"id":"r089","category":"kinematics","sub":"経路と干渉","type":"qa","front":"始点と終点が安全な姿勢なら、その間の移動も安全と言えるか？","back":"言えない。関節補間で動くアームは、途中で爪・肘・手首が一時的に人側へ膨らむことがある。中間姿勢を FK テーブルから選び、全リンクが通過する空間（スウェプトボリューム）を Unity で確認し、人なし実機→ダミー手→補助者同席の順で確かめる。","detail":"","key":false,"src":"DAY288"},{"id":"r090","category":"kinematics","sub":"経路と干渉","type":"qa","front":"弧より手前（ベース寄り）のブロックを掴もうとして、本当に壊れたのはどこだった？","back":"掴み精度ではなく持ち上げ。ベースに寄せるほど深く折りたたんだ窮屈な姿勢で掴むことになり、そこから上空へ戻る LIFT で手首が20〜28°未到達のまま止まった。弧をもう一本足せば済む話ではなかった。","detail":"","key":false,"src":"DAY244"},{"id":"r091","category":"hardware","sub":"機体の構成","type":"qa","front":"同じメーカー・同価格帯の myCobot 280 ではなく mechArm 270 を選んだのはなぜ？","back":"どちらも pymycobot で動くが構造が違う。myCobot は UR 型（協働ロボット型）で可動域は広いが、モーターで姿勢を保つ分だけ安定性が劣る。mechArm は中心対称構造（産業用ロボットに近い形）で、Pick&Place のような産業動作に合う。","detail":"","key":false,"src":"DAY102"},{"id":"r092","category":"hardware","sub":"機体の構成","type":"point","front":"mechArm 270 のペイロード（持ち上げられる重さ）は250gで、グリッパー込みの実効値はさらに下がる。コーヒーカップは重すぎる。","back":"","detail":"","key":false,"src":"DAY102・DAY127"},{"id":"r093","category":"hardware","sub":"機体の構成","type":"qa","front":"カップを掴むのに、吸着パッドではなく Adaptive Gripper を選んだのはなぜ？","back":"真空吸着は円筒の側面に吸い付けず、口の開いたカップは上面からも不安定。2本指の Adaptive Gripper は形に合わせて掴め、シミュの把持に最も近い。","detail":"","key":false,"src":"DAY102"},{"id":"r094","category":"hardware","sub":"機体の構成","type":"qa","front":"mechArm 270 Pi で実時間のモーター制御を担っているのはどこか？","back":"Raspberry Pi 4B ではない。Pi は pymycobot で指令を送る上位層で、シリアル（1Mbps）の先の M5Stack Atom（ESP32 系マイコン）が指令を解釈してサーボを駆動し、各スマートサーボが位置保持を内部で回していると見られる（未確定）。だから Mac/Pi 側の視覚サーボは監督ループで、カメラのレートで回ってよい。","detail":"","key":false,"src":"DAY260"},{"id":"r095","category":"hardware","sub":"機体の構成","type":"point","front":"純正の Camera Flange 2.0 はアーム先端の取付口に差す部品で、グリッパーと同時には付けられない。仕様書の「eye in hand」だけでなく、物理的に一緒に装着できるかを確かめる。","back":"","detail":"","key":false,"src":"DAY159"},{"id":"r096","category":"hardware","sub":"機体の構成","type":"qa","front":"3D CAD のソリッドと、画像から3Dを作る生成 AI のメッシュはどう違う？","back":"ソリッドは「四角を5mm押し出した」という手順が残り、寸法を変えると形が追従する。メッシュは三角形で表面だけを表し、寸法変更や穴の追加は実質できない。大きさを確かめる模型ならメッシュで足り、相手部品に合わせる金具はソリッドで作る。","detail":"","key":false,"src":"DAY311"},{"id":"r097","category":"hardware","sub":"機体の構成","type":"point","front":"FDM（溶かした樹脂を積む方式）の3Dプリントは設計値ちょうどだと嵌まらない。片側0.1mmでぴったり、0.2mmで手で入る、0.3mmで緩い（10mmのダボなら穴は10.4mm）。実値はテストピースで確かめる。","back":"","detail":"","key":false,"src":"DAY311"},{"id":"r098","category":"hardware","sub":"通信とデーモン","type":"point","front":"mechArm 270-Pi の内部シリアルは /dev/ttyAMA0・通信速度1000000（pymycobot の PI_PORT/PI_BAUD と同じ）。テストツールの「関節7と通信不可」はグリッパー未装着のためで異常ではない。","back":"","detail":"","key":false,"src":"DAY120"},{"id":"r099","category":"hardware","sub":"通信とデーモン","type":"point","front":"SSH には Mac を Pi のホットスポットへ、スマホカメラ（Iriun）には家庭 WiFi への接続が要り、無線1本では両立しない。Pi と Mac を有線 Ethernet で直結し、有線（SSH）と無線（カメラ）を分けた。","back":"","detail":"","key":false,"src":"DAY129・DAY130・DAY131"},{"id":"r100","category":"hardware","sub":"通信とデーモン","type":"qa","front":"シミュが出した全フレームの CSV を、そのまま実機に流さないのはなぜ？","back":"シリアル通信の速度限界で詰まり危険だから。GRASP や LIFT など5点程度のキーフレーム（要所の姿勢）を抜き出すスクリプトを、実機到着前に用意する計画にした。シミュと実機のゼロ点（全関節0°の姿勢）が一致しているかも最重要の確認項目で、ずれていると CSV の角度が別の位置を指す。","detail":"","key":false,"src":"DAY102"},{"id":"r101","category":"hardware","sub":"通信とデーモン","type":"qa","front":"別スレッドで50msごとに get_angles() を呼んだら、記録が0行だったのはなぜ？","back":"メインスレッドの send_angles() がシリアルポートを占有している間、別スレッドの読み取りがすべて失敗し、例外を黙って捨てていた。スレッドをやめ、各ステップの待機後にメインスレッドで1回だけ取得する方式にしたら取れた。","detail":"","key":false,"src":"DAY132"},{"id":"r102","category":"hardware","sub":"通信とデーモン","type":"qa","front":"SSH で1コマンドずつ Pi の Python を起動する構造が、追従を止めたのはなぜ？","back":"毎回 SSH 接続・python3 起動・import・シリアルを開く処理が走り、1コマンド500〜1000msかかった。捌けない命令はプロセスとして溜まり、同じシリアルポートを奪い合った。Pi 側に接続を保持し続ける常駐デーモンを置き、Mac から TCP ソケットで JSON 命令を送る構造に変えて、追従が初めて収束した。","detail":"","key":true,"src":"DAY186・DAY189"},{"id":"r103","category":"hardware","sub":"通信とデーモン","type":"qa","front":"デーモン通信のタイムアウトはどう設計すべきだったか？","back":"一律5秒では、待ち4秒の命令にシリアルのジッタが乗ると超える。命令の待ち時間に応じて「wait+3秒」にする。タイムアウト時はソケットを強制的に閉じて次回再接続する。閉じないと遅れて届いた応答が残り、別コマンドの応答として誤読される。","detail":"","key":false,"src":"DAY190"},{"id":"r104","category":"hardware","sub":"通信とデーモン","type":"qa","front":"カメラ付きのスキャンでアームが動かなかった原因を、どう切り分けたか？","back":"pymycobot 直叩き→動く、デーモン経由→動く、カメラなし→動く、と1つずつ確かめた。カメラとデーモンを組み合わせたときだけ止まり、cv2.VideoCapture 実行中にデーモンとの TCP 接続が切れていると確定した。正しい部品同士でも組み合わせで壊れるので、共存を設計する。","detail":"","key":false,"src":"DAY197"},{"id":"r105","category":"hardware","sub":"通信とデーモン","type":"qa","front":"デーモンが居るかを pgrep -f で確認してはいけないのはなぜ？","back":"-f はコマンドライン全体に一致するため、確認コマンド自身の SSH プロセスを拾って「居る」と誤検出し、pkill -f では親シェルを殺すこともある。ss -ltn で5555番を listen しているかで判定する。SSH 越しに nohup で起動するときは <\/dev/null で入力を切らないと SSH が返らない。","detail":"","key":false,"src":"DAY191・DAY294・DAY297"},{"id":"r106","category":"hardware","sub":"通信とデーモン","type":"point","front":"Pi 側デーモンは1クライアントしか受けないので、本線の接続中は別プロセスが関節の実測値を取れない。そこで本線の送角指令値を UDP で流す。mechArm は指令→待ちの離散運動なので指令値の列が軌跡になる。","back":"","detail":"","key":false,"src":"DAY287"},{"id":"r107","category":"hardware","sub":"送信命令の性質","type":"qa","front":"send_angles と send_coords はどう違うか？","back":"send_angles は6関節の角度を直接指定する。send_coords は先端の位置と向き（x, y, z, rx, ry, rz）を指定し、mechArm 内蔵の逆運動学が関節角に変換する。ただし実機では send_coords は信頼できず、使用を禁止した。","detail":"","key":false,"src":"DAY180・arm_kinematics"},{"id":"r108","category":"hardware","sub":"送信命令の性質","type":"qa","front":"なぜ send_coords を永久禁止し、send_angles だけにしたのか？","back":"手先の向き RX/RY/RZ は位置で大きく変わり（RZ は167°〜−140°）、固定値を渡すと内蔵 IK が別の解を選んで全く違う場所へ動いた。直線補間モードでホームから下ろすと横滑りしてブロックを押すこともあった。以後 send_angles のみとし、失敗時の自動 HOME リトライも禁止した。","detail":"","key":true,"src":"DAY142・DAY146・DAY154・arm_kinematics"},{"id":"r109","category":"hardware","sub":"送信命令の性質","type":"qa","front":"視覚サーボで新しい目標を送り続けても、アームが追従しなかったのはなぜ？","back":"pymycobot は既定で、動作中に来た新指令をキューに積んで順番待ちにする。1.5秒周期で目標を投げると詰まり、最新の指令が反映されない。ノンブロッキングの send_angles と set_fresh_mode(1)（新指令で未完了の動作を破棄して即実行）に切り替え、終了時は0に戻す。","detail":"","key":true,"src":"DAY180・DAY185・DAY208"},{"id":"r110","category":"hardware","sub":"送信命令の性質","type":"point","front":"「送れる速さ」と「動ける速さ」は別物。命令送信は91Hz出ても、アームの物理応答は振幅10°で約500ms（2Hz）かかり、差は約45倍。ループ周期は物理側で決まり、1ループの移動量を小さく制御する設計が要る。","back":"","detail":"","key":true,"src":"DAY183・DAY185"},{"id":"r111","category":"hardware","sub":"送信命令の性質","type":"qa","front":"届かない姿勢を sync_send_angles（到達まで待つ送信）で送ると何が起きた？","back":"タイムアウト後に get_angles() が空リスト、is_moving() が-1を返し、シリアル通信が壊れた状態になった。非同期の send_angles で送って待つと、実際には届く範囲まで動いていた。届かない姿勢を同期送信で待たない。","detail":"","key":false,"src":"DAY173"},{"id":"r112","category":"hardware","sub":"送信命令の性質","type":"point","front":"デーモンの send_angles の wait 引数は Pi 側で無視されていた（sleep していない）。到達を待つには、Mac 側で明示的に待つか、実測角で到達を確認する。","back":"","detail":"","key":false,"src":"DAY204・DAY210"},{"id":"r113","category":"hardware","sub":"送信命令の性質","type":"qa","front":"lookup は成功しているのに、アームが低い位置を横滑りしてブロックを弾いたのはなぜ？","back":"Mac 側で計算した補間の起点が「HOME 移動前の中途半端な実機姿勢」だった。Pi 側はまず HOME へ動き、そこから補間の1点目へジャンプしたため低空で横移動した。補間の起点を HOME に固定して直った。","detail":"","key":false,"src":"DAY168・DAY177"},{"id":"r114","category":"hardware","sub":"送信命令の性質","type":"qa","front":"グリッパー直後の単発 send_angles が無視されたとき、何が効いたか？","back":"待ち延長・3回再送・0.1秒間隔の連打はどれも効かず、単体テストでは各要素とも動いた。完走実績のある再生（0.1秒周期で補間姿勢を流すストリーミング）の送信文脈をそのまま写し、入力だけ差し替えたら通った。動く前例があればまずその文脈に乗り、差分は1つずつ試す。","detail":"","key":false,"src":"DAY228"},{"id":"r115","category":"hardware","sub":"読み取りと到達確認","type":"qa","front":"get_angles() にはどんな落とし穴があり、どう対処するか？","back":"空リスト・直前の古い値・180°のような異常値を返すことがあり、移動中やシリアル初期化直後（約1.2秒）に起きやすい。読みが数秒沈黙することもある。リトライ（例：200ms×12回）で待ち、可動域を大きく外れた値は捨て、読めなくても動作の本流を止めない構造にする。","detail":"","key":false,"src":"DAY123・DAY176・DAY183・DAY189・DAY190・DAY197・DAY210・DAY228"},{"id":"r116","category":"hardware","sub":"読み取りと到達確認","type":"qa","front":"送信の戻り値 OK や is_moving=0（停止）で「到達した」とみなしてはいけないのはなぜ？","back":"指令は低い確率で黙って無視され、通信異常でも停止状態になるから。get_angles の実測と目標の差が許容内かで判定し、None・-1・タイムアウトは未到達とする。未到達なら同じ目標を再送し（約5回に1回の無視は再送で通る）、それでも届かなければ止める。降下やストール疑いでは再送を控える。","detail":"","key":true,"src":"DAY216・DAY217・DAY231・DAY288"},{"id":"r117","category":"hardware","sub":"読み取りと到達確認","type":"point","front":"送信角と到達角のずれの実測では、j1 が約1.02°、j4 が約0.88°の着き不足で、他の関節は0.4°以下だった。","back":"","detail":"","key":false,"src":"DAY190"},{"id":"r118","category":"hardware","sub":"読み取りと到達確認","type":"term","front":"サーボの不感帯（デッドバンド）","back":"小さすぎる指令にサーボが反応しない範囲。mechArm 270 Pi では±1°の指令で実機が動かなかった（3回再現）。「細かく制御すれば精度が上がる」前提でループを組むと振動する。","detail":"","key":false,"src":"DAY204"},{"id":"r119","category":"hardware","sub":"読み取りと到達確認","type":"qa","front":"動かしていない関節まで厳しい許容差で到達確認すると、なぜ中断が量産されたのか？","back":"j1 は87.74°付近で重力負荷を強く受け、保持力が負けて+1.11°ドリフトした。測りたい関節は止まっているのに、測らない関節が止まりきれずに中断していた。動かす関節と動かさない関節で許容差を分けた（1.5°/2.0°）。","detail":"","key":false,"src":"DAY204"},{"id":"r120","category":"hardware","sub":"読み取りと到達確認","type":"point","front":"デーモン経由でグリッパーを閉じた後、send_angles がアーム側コントローラで全く反応しなくなることがある。再送・時間経過・デーモン再起動では解けず、アームの電源リセットでのみ解除された。","back":"","detail":"","key":false,"src":"DAY230"},{"id":"r121","category":"hardware","sub":"関節の上限とガード","type":"point","front":"MechArm270 の SDK 関節リミットは j0±160°、j1 -75〜+120°、j2 -175〜+65°、j3±155°、j4±115°、j5±180°（pymycobot の定義）。座標リミットは xyz±272mm。","back":"","detail":"","key":false,"src":"DAY253"},{"id":"r122","category":"hardware","sub":"関節の上限とガード","type":"qa","front":"肩関節 j1 の指令が約90°を超えるとどうなるか？","back":"SDK の定義は+120°だが、実機では j1=90.0°までは届き、90.5°以上を1つでも含む send_angles はエラーも返さず丸ごと無視される（他の関節も動かない）。手で曲げれば90.7°まで行くので、教示角をそのまま送ると黙って止まる。FK テーブル（j1 は125°まで）の候補は j1≤88° の運用上限で絞る。","detail":"","key":true,"src":"DAY173・DAY213・DAY216・DAY231・DAY244・DAY246・DAY257・DAY253"},{"id":"r123","category":"hardware","sub":"関節の上限とガード","type":"qa","front":"可動域の仮置き値で再生が弾かれたとき、どう直したか？","back":"実機はその姿勢を現に取れていたので、全関節を脱力して6軸を手で可動端まで動かし、記録の最小・最大を集計した（1662サンプル）。端ぎりぎりは届かず落ちやすいので、実測から2°内側を可動域に採った。安全装置は残したまま窓を実態に合わせた。","detail":"","key":false,"src":"DAY226"},{"id":"r124","category":"hardware","sub":"関節の上限とガード","type":"qa","front":"j0 だけを振るスイープで手首が抜けたとき、「重力が逆に効く」説が誤りだったのはなぜ？","back":"j0 は鉛直軸まわりの回転なので、回しても静的な重力トルクは変わらない。見るべきは配線・摩擦・ガタ・加減速の方向依存で、主因は手首が-89°付近で保持の余裕が小さいこと。対策は速度を下げる、範囲を実用域に絞る、手首を保持しやすい角度にすること。","detail":"","key":false,"src":"DAY235"},{"id":"r125","category":"hardware","sub":"関節の上限とガード","type":"point","front":"送角後の待ちは1.0秒から短くしない。0.3秒に削ると j4（手首）の未到達が7回中2回→6回中5回に増え、同じ値で止まる物理的ストール（動ききらない現象）が出た。j4 の安全範囲は-90〜+60°。","back":"","detail":"","key":false,"src":"DAY268・arm_kinematics"},{"id":"r126","category":"hardware","sub":"関節の上限とガード","type":"qa","front":"降下の高さ下振れ許容を5mm→6mmに緩めるとき、外部レビューは何を警告したか？","back":"テーブル上の高さは下限より0.47mm上だが、旧接触高さから約4.5mmしか余裕がない。その姿勢付近では j1 が5°違うと高さが約21mm動くので、1°の到達ずれでも余裕を食う。FK の高さチェックだけで安全とは言えず、初回は目視を条件にした。","detail":"","key":false,"src":"DAY224"},{"id":"r127","category":"hardware","sub":"関節の上限とガード","type":"qa","front":"関節差分10°超で送角を止めるガードが、正常な動きまで止めたのはなぜ？","back":"閾値を机上の定義値で決めたが、実機の正常な移動量は LIFT で18〜21°、PLACE 降下で12〜13°、戻りで44〜46°あった。未到達の13°は正常な大移動に埋もれ、差分の量では切り分けられない。「直前の降下が未到達だったか」で止める方式に変えた。未到達のまま理論姿勢から大きく送ると、ずれたまま大移動が走る。","detail":"","key":false,"src":"DAY266・DAY268"},{"id":"r128","category":"hardware","sub":"関節の上限とガード","type":"qa","front":"同じ「送信前ガードで止まる」でも、ホワイトリスト漏れと残差超過では直す場所がどう違う？","back":"名前がホワイトリストに無いだけで撥ねるのはコードの欠陥なので、リストに足して直す。FK テーブル最近傍への残差（21.9mm＞閾値20mm）で止まるのはガード本来の仕事で、直すのはデータ側（穴を埋める）。PLACE の穴を埋めて最近傍は18.62mm→1.53mmになった。","detail":"","key":false,"src":"DAY274"},{"id":"r129","category":"hardware","sub":"関節の上限とガード","type":"point","front":"戻り値の形を確かめてから安全判定に使う。検出関数は低スコアでも None ではなく辞書＋フラグを返し、モード有効化は失敗時に例外ではなく False を返した。None チェックだけでは誤検出が素通りする。","back":"","detail":"","key":false,"src":"DAY215"},{"id":"r130","category":"hardware","sub":"関節の上限とガード","type":"point","front":"安全範囲は JSON から読まずコードに固定し、JSON は一致検証だけにする。NaN が入ると比較が全部 False になりガードをすり抜ける。Ctrl-C（KeyboardInterrupt）は Exception ではないので、例外側の後始末が通らない。","back":"","detail":"","key":false,"src":"DAY297"},{"id":"r131","category":"hardware","sub":"関節の上限とガード","type":"qa","front":"試行中の Ctrl-C でアームを自動で HOME へ戻すとき、どんな制約を置いたか？","back":"グリッパーには触らない（開けば落とす）、HOME 定数への単発送角のみ、デーモン無応答なら送らない、2度目の Ctrl-C も握って記録を必ず残す。実機では生存確認がタイムアウトし、安全側に止まったが HOME へは運べなかった。","detail":"","key":false,"src":"DAY283"},{"id":"r132","category":"hardware","sub":"グリッパー","type":"point","front":"Adaptive Gripper を付けると全関節0°でグリッパーが傾く。J6=-30°が水平になるホーム位置（send_angles([0,0,0,0,0,-30],20)）。","back":"","detail":"","key":false,"src":"DAY123"},{"id":"r133","category":"hardware","sub":"グリッパー","type":"point","front":"pymycobot のグリッパー制御は set_gripper_state（開閉。0=開・1=閉）・set_gripper_value（0〜100の開度）・set_gripper_protection_current（1〜500）の3系統。保護電流は閉じるときの安全閾値で、握力を保つ指令ではない。","back":"","detail":"","key":false,"src":"DAY259・arm_kinematics"},{"id":"r134","category":"hardware","sub":"グリッパー","type":"point","front":"グリッパー指令の戻り値 result=-1 は、物理的に開閉したかを表さない（実機では常に-1）。連続送信で2回目が動かないこともあるので2秒以上待ち、送信完了と開閉の観測は別の列に記録する。","back":"","detail":"","key":false,"src":"DAY175・DAY288・DAY294・arm_kinematics"},{"id":"r135","category":"hardware","sub":"グリッパー","type":"point","front":"get_gripper_value() は0〜100で大きいほど開く（開97・空振りで閉じ切り6・ブロックを挟むと36〜38）。動作中は無効値なので整定後に読む。実開度を記録すれば、空振りと把持を写真なしで見分けられる可能性がある。","back":"当初の pymycobot にはこの関数がなく、掴み判定はカメラに一本化していた。","detail":"","key":false,"src":"DAY129・DAY259・DAY325"},{"id":"r136","category":"hardware","sub":"グリッパー","type":"qa","front":"PLACE 姿勢でグリッパーが5回に1回しか開かなかったとき、どう解決したか？","back":"開こうとするが力が足りない様子で、特定の姿勢で給電が不安定になっている可能性があった。置く位置の手前の中間姿勢へ少し戻ってから開くと、毎回安定して開いた。","detail":"","key":false,"src":"DAY129"},{"id":"r137","category":"hardware","sub":"グリッパー","type":"qa","front":"ブロックを掴めているのに、運ぶ途中で落とす原因は何だったか？","back":"set_gripper_state(1) で閉じた爪は「位置で止まる」だけで圧力をかけ続けない。爪のガタの隙間が残り、姿勢を変えて揺さぶるとそこから抜ける。通信の切断や手首の垂れは、測定で原因から外れた。","detail":"","key":true,"src":"DAY259"},{"id":"r138","category":"hardware","sub":"グリッパー","type":"qa","front":"爪の「押し込み保持」とは何で、どの値で効いたか？","back":"set_gripper_value でブロック厚み相当（開度約36）より小さい目標を渡すと、爪は閉じ切れず押し込み力が残り続ける。力制御ではないが位置サーボの押し込みを保持力に使える。50は浅すぎて掴めず、最も強く掴んだ20を採用し、通しでも落ちなかった。","detail":"","key":false,"src":"DAY261"},{"id":"r139","category":"hardware","sub":"グリッパー","type":"point","front":"押し込み保持では目標値10が20より緩く、開度値と握り強さは単純な比例ではない（原因は未確定）。押し込み中は開度値が-1で読めないので、成否判定は画像や目視に置く。","back":"","detail":"","key":false,"src":"DAY261"},{"id":"r140","category":"hardware","sub":"教示と力の制御","type":"term","front":"フリーモード","back":"release_all_servos() でサーボの保持を外し、アームを手で動かせる状態。手で目標位置に合わせて get_angles() などで実測すれば、校正点や姿勢の正解値が取れる。","detail":"","key":false,"src":"DAY144・DAY146"},{"id":"r141","category":"hardware","sub":"教示と力の制御","type":"qa","front":"ドラッグティーチング（手でアームを動かして教える）で release_all_servos() をどう扱うか？","back":"引数なしは damping mode（抵抗が残り完全には脱力しない）、data=1 は完全脱力。自律動作のスクリプトでは永久禁止、教示専用スクリプトに限り damping のみ許可する。必ず手で支えてから脱力し、try/finally で必ず通電を戻す。","detail":"","key":false,"src":"DAY226"},{"id":"r142","category":"hardware","sub":"教示と力の制御","type":"qa","front":"教示中に位置も取るため、デーモンに脱力コマンドを足す案を採らなかったのはなぜか？","back":"デーモンは自律パイプライン全体の土台で、脱力の口を開けると全スクリプトから呼べてしまい、自律側の脱力禁止に穴が開く。必要なのは同じ配置での位置1回で、ブロックと箱を動かさなければ教示の前後どちらでも同じ値になる。順序を決めるだけで解けた。","detail":"","key":false,"src":"DAY227"},{"id":"r143","category":"hardware","sub":"教示と力の制御","type":"qa","front":"PLACE 姿勢を「高さだけ30mm上げる」のに、FK テーブル計算をやめて教示し直したのはなぜか？","back":"PLACE の基準姿勢は手で教えたもので、FK テーブルの密な領域から関節角で19.65°離れていた。高さだけ上げた素直な解が無く、5軸を大きく動かす別解しか出なかった。咥えたブロックの厚み（24mm）が箱の縁に当たらない高さを見ながら教えた。","detail":"","key":false,"src":"DAY235"},{"id":"r144","category":"hardware","sub":"教示と力の制御","type":"point","front":"mechArm 270 Pi は力覚センサーがなくても、get_servo_status() の電流値（負荷トルクと相関）で「触れた・押された」を間接的に検出できる。get_error_information() のコード16〜19は衝突保護。","back":"","detail":"","key":false,"src":"DAY205"},{"id":"r145","category":"hardware","sub":"教示と力の制御","type":"term","front":"インピーダンス制御","back":"位置でも力でもなく「押されたらこの硬さで応答する」という位置と力の関係を制御する手法。手先に仮想の質量・ダンパ・バネを設定する。ハードに①手で押すと関節が回る（バックドライバビリティ）②トルク検出③500Hz〜1kHz の制御ループが要る。","detail":"","key":false,"src":"DAY296"},{"id":"r146","category":"hardware","sub":"教示と力の制御","type":"qa","front":"アームを手で押したときの柔らかさを決めるのは、制御周期か減速比か？","back":"減速比。減速機は駆動方向ではトルクを N 倍にするが、逆方向では慣性を N の二乗倍にする。N=191 なら手先で36,481倍、10:1 なら100倍。力が双方向に通るハードなら制御はモータ側に降り、上位は遅くてよい。SO-101 も高減速比のバスサーボで mechArm と同じ部類。","detail":"","key":true,"src":"DAY296"},{"id":"r147","category":"hardware","sub":"教示と力の制御","type":"point","front":"mechArm 270 Pi の get_angles() は1回最低20msかかる（ATOM ファームウェア内部の処理）。読み書き両方で40ms超、カメラ込みで実効10〜15Hz で、インピーダンス制御に要る帯域より2桁足りない。","back":"","detail":"","key":false,"src":"DAY296"},{"id":"r148","category":"sim","sub":"Unityの関節モデル","type":"point","front":"Unity の ArticulationBody（関節付き物理モデル）は Stiffness=20,000／Damping=2,000 を絶対に変えず、コードからは drive.target（関節の目標角）だけを更新する。Motion=Limited は Stiffness が1e+25に化けるので使わない。","back":"","detail":"","key":true,"src":"arm_kinematics"},{"id":"r149","category":"sim","sub":"Unityの関節モデル","type":"qa","front":"Unity で任意の関節角を取らせて爪先位置を読むとき、なぜ SetJointPositions だけでなく drive.target も書くのか？","back":"SetJointPositions は物理計算を通さず姿勢を瞬時に確定させるが、drive.target が古いままだと物理エンジンが元の姿勢へ戻そうとする。両方を書いて初めて姿勢が固定される。","detail":"","key":false,"src":"DAY169"},{"id":"r150","category":"sim","sub":"Unityの関節モデル","type":"qa","front":"なぜ ArticulationBody 上で CCD IK が収束しなかったのか？","back":"drive.target を更新しても、関節はばね・減衰で徐々にしか動かない。CCD は更新前の古い手先位置を見て回転を足し続け、間違った方向へ力をかけ続けた。1回の回転を±5°に制限しても成功率は0のままだった。","detail":"","key":false,"src":"DAY149・DAY150"},{"id":"r151","category":"sim","sub":"Unityの関節モデル","type":"point","front":"Unity は FK（関節角→手先位置）を毎フレーム正確に計算済み。endEffector.transform.position を読めばよく、FK をコードで書き直す必要はない。URDF 行列で自作した FK は軸変換ミスで失敗した。","back":"","detail":"","key":true,"src":"DAY149"},{"id":"r152","category":"sim","sub":"Unityの関節モデル","type":"point","front":"複数のツインを並べて並列スキャンするときは、手先位置をワールド座標ではなくルートからの相対座標で記録する。2m間隔に並べたら ee_x=27.87m という異常値が出た。","back":"","detail":"","key":false,"src":"DAY150"},{"id":"r153","category":"sim","sub":"URDF取り込みとグリッパー","type":"qa","front":"グリッパーの URDF を Unity に取り込んだとき、何が問題になった？","back":"URDF Importer は ROS の package:// パスを解決できず、メッシュのパスをファイル名だけに書き換えた。取り込みで付く ArticulationBody と関節スクリプトが勝手に動いてグリッパーが暴走したので全部削除し、開閉は自作スクリプトで6パーツを連動させた（URDF の mimic joint に相当）。","detail":"","key":false,"src":"DAY134"},{"id":"r154","category":"sim","sub":"URDF取り込みとグリッパー","type":"qa","front":"再生時にグリッパーが約30°傾いたのはなぜ？","back":"link6 の取り付け座標系の違いで、CSV 読込時に J6 へ+30°を足して補正していた（MotionLogPlayer.cs）。新しい再生スクリプトにその加算がなく、また傾いた。同じ CSV を読むスクリプトは角度の定義をそろえる。","detail":"","key":false,"src":"DAY134・DAY152"},{"id"
