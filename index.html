<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ロボティクスの見直し</title>
<style>
/* GIG の「台本読み合わせ」と同じ見た目：横スワイプのカード＋その下に「押している間だけ聞く」 */
:root{
  --bg:#f2f3f5; --fg:#1d2129; --muted:#6b7280; --panel:#ffffff; --line:#e3e5e9;
  --card:#1a1b1f; --card-fg:#ffffff; --card-sub:#a9adb6; --gold:#f2c14e; --time:#c98a12;
  --miss:#fde2e1; --miss-fg:#b42318; --extra:#dbeafe; --extra-fg:#1e40af; --ok:#15803d;
  --btn:#1a1b1f; --btn-fg:#ffffff; --rec:#b42318;
  --font:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111215; --fg:#e8eaee; --muted:#9aa0aa; --panel:#1c1d22; --line:#2c2e35;
  --card:#000000; --miss:#4a1714; --miss-fg:#ffb4ab; --extra:#13284d; --extra-fg:#bcd3ff; --ok:#4ade80;
  --btn:#e8eaee; --btn-fg:#111215; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111215; --fg:#e8eaee; --muted:#9aa0aa; --panel:#1c1d22; --line:#2c2e35;
  --card:#000000; --miss:#4a1714; --miss-fg:#ffb4ab; --extra:#13284d; --extra-fg:#bcd3ff; --ok:#4ade80;
  --btn:#e8eaee; --btn-fg:#111215; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.7 var(--font);padding:0 0 calc(24px + env(safe-area-inset-bottom))}
header{background:#1a1b1f;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
header h1{margin:0;font-size:21px}
header p{margin:2px 0 0;font-size:14px;color:rgba(255,255,255,.75)}
main{padding:12px 16px 0;max-width:720px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
select{font:inherit;font-size:16px;font-weight:600;background:var(--btn);color:var(--btn-fg);border:0;border-radius:10px;padding:9px 12px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--fg);font:inherit;font-size:15px;padding:8px 12px}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg)}
.info{font-size:14px;color:var(--muted);margin:0 2px 8px}
.track{display:flex;align-items:flex-start;overflow-x:auto;overflow-y:hidden;transition:height .15s;scroll-snap-type:x mandatory;gap:10px;padding:4px 2px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 88%;scroll-snap-align:center;background:var(--card);color:var(--card-fg);border-radius:14px;padding:16px 16px 12px;min-height:250px;display:flex;flex-direction:column}
.card .sec{font-size:13.5px;color:var(--card-sub)}
.card .lb{font-size:13.5px;font-weight:700;color:var(--gold);margin-top:2px}
.card .q{font-size:15px;color:var(--card-sub);margin-top:6px}
.card .t{font-size:25px;line-height:1.75;font-weight:600;flex:1;margin:8px 0}
.card .t.long{font-size:20px}
.card .t.hide{color:var(--card-sub)}
.card .b{font-size:14.5px;line-height:1.7;color:var(--card-sub);margin:0 0 8px}
.card .m{font-size:13.5px;color:var(--time);display:flex;justify-content:space-between;gap:8px}
.card .m .done{color:#9be3b2}.card .m .done.low{color:#ffb4ab}.card .m .done small{color:#a9adb6;font-size:12.5px;margin-left:4px}
.pos{font-size:14px;color:var(--muted);text-align:center;margin:0 0 8px;font-variant-numeric:tabular-nums}
.mic{display:block;width:100%;border:0;border-radius:16px;padding:18px 12px;font:inherit;font-size:20px;font-weight:700;background:var(--btn);color:var(--btn-fg);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.mic.on{background:var(--rec);color:#fff}
.mic:disabled{opacity:.45}
.mic small{display:block;font-size:13.5px;font-weight:400;opacity:.8}
.res{background:var(--panel);border-radius:14px;padding:12px 14px;margin:12px 0 0;border:1px solid var(--line)}
.res h2{font-size:15px;margin:0 0 6px;color:var(--muted);font-weight:600}
.res .said{font-size:19px;line-height:1.8;min-height:1.8em;word-break:break-all}
.res .cmp{font-size:19px;line-height:1.8;word-break:break-all}
.res .miss{background:var(--miss);color:var(--miss-fg);border-radius:3px}
.res .extra{background:var(--extra);color:var(--extra-fg);border-radius:3px}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px;margin-top:8px;font-variant-numeric:tabular-nums}
.stats b{font-size:20px}
.stats .good{color:var(--ok)}.stats .bad{color:var(--miss-fg)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row button{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-size:15px;border-radius:10px;padding:8px 12px}
.log{margin:18px 0 0}
.log h2{font-size:18px;margin:0 0 8px;padding-left:10px;border-left:4px solid var(--fg)}
.log table{width:100%;border-collapse:collapse;font-size:15px;background:var(--panel);border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums}
.log th,.log td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
.log th:first-child,.log td:first-child{text-align:left}
.log th{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:14px 2px 0}
.warn{background:var(--miss);color:var(--miss-fg);border-radius:10px;padding:10px 12px;font-size:15px;margin:0 0 10px}
button:focus-visible,select:focus-visible{outline:3px solid var(--time);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>ロボティクスの見直し</h1>
  <p id="sub"></p>
</header>
<main>
  <div class="bar">
    <select id="cat" aria-label="カテゴリ"></select>
    <div class="seg" role="group" aria-label="言い方">
      <button id="mSee" type="button" aria-pressed="true">見て言う</button>
      <button id="mHide" type="button" aria-pressed="false">見ないで言う</button>
    </div>
    <div class="seg" role="group" aria-label="出す範囲">
      <button id="fAll" type="button" aria-pressed="true">全部</button>
      <button id="fWeak" type="button" aria-pressed="false">苦手だけ</button>
    </div>
  </div>
  <div id="warn" class="warn" hidden></div>
  <p class="info" id="info"></p>
  <div class="track" id="track" aria-live="off"></div>
  <p class="pos" id="pos"></p>
  <button id="mic" class="mic" type="button">押している間だけ聞く<small>カードを見て話して、指を離す</small></button>
  <section class="res" id="res" aria-live="polite">
    <h2>話した言葉</h2>
    <div class="said" id="said">ここに出ます</div>
    <h2 style="margin-top:10px">違い（赤＝言わなかった・青＝余分）</h2>
    <div class="cmp" id="cmp">—</div>
    <div class="stats" id="stats"></div>
  </section>
  <section class="log">
    <h2>今回の練習</h2>
    <table><thead><tr><th>文</th><th>一致</th><th>前回</th></tr></thead><tbody id="log"><tr><td colspan="3">まだありません</td></tr></tbody></table>
    <div class="row"><button id="clear" type="button">今回の結果を消す</button></div>
  </section>
  <p class="note" id="ver"></p>
</main>
<script>
(() => {
  const DATA = {"updated":"2026-10-11","categories":[{"key":"principles","label":"設計原則・進め方"},{"key":"kinematics","label":"運動学・座標系"},{"key":"hardware","label":"実機・サーボ制御"},{"key":"sim","label":"シミュレーション・デジタルツイン"},{"key":"vision","label":"画像認識・カメラ"},{"key":"servo","label":"視覚サーボ・Pick&Place・受け渡し"},{"key":"eval","label":"評価・データ管理"},{"key":"learning","label":"ロボット学習"},{"key":"society","label":"社会実装・現場"}],"items":[{"id":"r001","category":"principles","sub":"基本原則","type":"point","front":"精度より体験の成立を優先する（P001）。精度はあとから予算で解決でき、反復改善のほうが最初からの完璧主義より早く目的地に着く。","back":"ただしそう言えるのは、精度の輪郭（何が物理的に可能か、どれだけずれるか）を測って把握しているときだけ。輪郭を知らない体験優先はただの逃げになる。","key":true,"src":"principles・DAY212"},{"id":"r002","category":"principles","sub":"基本原則","type":"qa","front":"なぜ進捗報告で「lookup の検索が成功した」と「実機アームの動作が検証された」を分けて書くのか（P002）？","back":"両者は別レイヤーで、自由文でまとめると読み手が誤解する（「lookup成功」は「掴める姿勢」ではない）。レイヤーごとに ✅/❌/❓ と最終確認日を明示する。引き継がれた結論も裏取りせずに使わない。","key":false,"src":"principles・DAY168・DAY169"},{"id":"r003","category":"principles","sub":"基本原則","type":"point","front":"実機で試す前にシミュレーションで検証する（P003）。実機の試行錯誤は時間もコストも高いので、シミュで検出できない問題だけを実機検証の対象にする。","back":"","key":false,"src":"principles"},{"id":"r004","category":"principles","sub":"基本原則","type":"point","front":"同じ指示がいら立ちとともに繰り返されたら、AI がループしているサイン（P005）。局所的な修正をやめ、根本的に異なるアプローチに切り替える。","back":"","key":false,"src":"principles"},{"id":"r005","category":"principles","sub":"基本原則","type":"point","front":"失敗は記録ではなく設計材料として扱う（P007）。どのステップで、なぜ失敗したかを構造化して残すと、次の設計判断の材料になる。","back":"","key":false,"src":"principles"},{"id":"r006","category":"principles","sub":"基本原則","type":"point","front":"測る手段を持つことが推論より先（P008）。ログや引き継ぎの数値を推論でつなぐ前に、自分で測り直せる道具（例：任意姿勢の爪先位置を読む TipBrepReader）を作る。","back":"既存関数を流用できるかも、修正せずに呼んで戻り値を数字で記録して判定する。目視で分かっていても確証は数字で残す。","key":true,"src":"DAY169・DAY170・DAY196"},{"id":"r007","category":"principles","sub":"基本原則","type":"point","front":"検証の数値と実機での成立は別レイヤー（P009）。ループの「CONVERGED（収束）」表示が出ても、実際の最終位置は最大52mmずれていた。","back":"lookup距離0.1mmでも、マットとロボットが固定という変換の前提が現実と違えば実機は8cmずれる。マットもカメラも動く前提で座標系を作る。","key":true,"src":"DAY160・DAY184"},{"id":"r008","category":"principles","sub":"測ってから直す","type":"qa","front":"手首の関節が指令に届かない原因を4つ仮説立てし、単軸テストで測ったら何が分かったか？","back":"4つ（特定角度域・速度/トルク不足・一発送信の限界・荷重）のどれでもなかった。深い側へは-95°まで誤差1°台で届くのに、浅い側（0へ戻る方向）は-61°付近で頭打ちになる「方向の壁」だった。測らなければ4つのどれかを選んで直したつもりになっていた。","key":false,"src":"DAY238"},{"id":"r009","category":"principles","sub":"測ってから直す","type":"qa","front":"「同じ接続を使い続けると送信が通らない」という見立てが外れたのはなぜか？","back":"直叩きとdaemon経由で同じ目標姿勢を送っている保証がなく、変数を1つに揃えていなかった。送る角度を固定し、送信条件だけを変えて測り直すと、動くかどうかを決めていたのは接続ではなく肩の目標角（110°）だった。推測で直さず、条件を1つだけ変えて測る。","key":false,"src":"DAY215・DAY216"},{"id":"r010","category":"principles","sub":"測ってから直す","type":"qa","front":"HOME定数を誤って書き換えてしまったのはなぜか？","back":"前のテストの後始末で送ったHOME復帰が遅れて実行され、その途中の値を「今の静止姿勢」と取り違えた。目視ではHOMEに見えても、測定値の時間的な意味を確かめずに推論した。","key":false,"src":"DAY210"},{"id":"r011","category":"principles","sub":"測ってから直す","type":"point","front":"AIが推測でなく測定で判断できる粒度に切る。739行の一体型スクリプトは4回直しても原因に届かなかったが、検証する挙動が1つだけの単体スクリプト（50〜200行）に分解すると原因を測定で特定できた。","back":"daemon・送信・カメラは正常で、誤検出の原因はテンプレートの劣化だった。","key":false,"src":"DAY211"},{"id":"r012","category":"principles","sub":"測ってから直す","type":"point","front":"点が薄いことと届かないことは違う。未充填の領域を「構造的に届かない」と即断せず、関節を実際に振ってスキャンし、数で確かめてから言う。","back":"","key":false,"src":"DAY253"},{"id":"r013","category":"principles","sub":"測ってから直す","type":"point","front":"予測を立てる前に、測り方そのものが持つ誤差（基準線）を測る。撮影を挟まず設計画像を同じ処理に通して基準線を出していれば、面積が傾きに鈍感なことは事前に読めた。","back":"","key":false,"src":"DAY310"},{"id":"r014","category":"principles","sub":"測ってから直す","type":"point","front":"どのファイルが読まれているかは、更新日時・コメント・ドキュメントではなく、コードが開くファイル名を直接見て確定する。読まれていないファイルをいくら拡充しても実機は1mmも変わらない。","back":"","key":false,"src":"DAY252・DAY256"},{"id":"r015","category":"principles","sub":"測ってから直す","type":"qa","front":"動的追従の制御周期を上げたいとき、なぜ先に時間分解を実測するのか？","back":"律速はカメラ遅延と送角往復だと見ているが、推測で有線カメラ化や非同期化に走らないため（P008）。フレーム取得・検出・送角〜応答・到達確認を区間ごとに刻み、律速区間を数字で特定してから対策する。","key":false,"src":"dynamic_tracking_v2_design"},{"id":"r016","category":"principles","sub":"測ってから直す","type":"point","front":"補正で逃げ続けて行き詰まったら、過去のテーブル・定数・オフセットを判断根拠から外し、座標系の確定→実測→検出→変換の順に土台から積み直す。","back":"無いものは補正できない。症状を補正する前に、選び方の問題かデータの欠損かを数えられる形で測る。","key":false,"src":"DAY162・DAY164・DAY265"},{"id":"r017","category":"principles","sub":"測ってから直す","type":"point","front":"閾値を追いかけない。DIST_MAX を0.030→0.035→0.045と三度上げても少し先の縁で止まった。真因は補正記憶の1セルが-29mmへ巻き上がったことで、腐ったセルのリセットと1回の更新上限（40→15mm）で上流を直した。","back":"","key":false,"src":"DAY280"},{"id":"r018","category":"principles","sub":"測ってから直す","type":"point","front":"回帰したら、新機能を足すより元に戻すのが最小の一手。FKテーブルを拡充前（1,003,992点）へロールバックしたらPICKが復活した。原因の取り違えを正したのはログ分析ではなく実機の画像と挙動だった。","back":"","key":false,"src":"DAY275"},{"id":"r019","category":"principles","sub":"目的に合わせた検証","type":"qa","front":"把持判定のZ閾値を8mmから12mmに緩めたのが、なぜ正解だったのか？","back":"視覚サーボの収束精度は今のホモグラフィ（画像→平面の座標変換）と検出で約±10mmが限界で、把持に必要な精度もグリッパー開口と30mm角ブロックから中心±10mmと同じオーダーだった。8mmはシステムの実力より厳しすぎた。閾値を物理現実に合わせるのは精度を諦めることではない。","key":false,"src":"DAY208"},{"id":"r020","category":"principles","sub":"目的に合わせた検証","type":"point","front":"2.5°以内の到達を待つ関門をやめ、だいたいの位置で離して箱に入ったかを y/n で記録したら、データは0件から9件になった。目的は関節角が届くことではなく箱に入ること。","back":"","key":false,"src":"DAY220"},{"id":"r021","category":"principles","sub":"目的に合わせた検証","type":"point","front":"最後の一手が成立しなければ、それまでが完璧でも価値はゼロ。設計が引き受けるべきは平均的な精度ではなく、最後の一手が成立する確率。","back":"","key":false,"src":"DAY237"},{"id":"r022","category":"principles","sub":"目的に合わせた検証","type":"qa","front":"関節角からアームの骨格を描くビューを作ったのに、ダッシュボードから消したのはなぜか？","back":"運用の判断（止めるか、直近の変更が効いたか、同じ失敗の反復か）を何も変えなかったから。監視画面の規律は「判断を変えるものだけ見せる」。判断に効いたのは赤ブロックと白箱の座標そのものだった。","key":false,"src":"DAY241"},{"id":"r023","category":"principles","sub":"構造の分け方","type":"qa","front":"動作を「意味・軌跡・実行」の3層に分けたのはなぜ？","back":"意味（カップを掴んで置くというタスク定義）と軌跡（関節角度のCSV）はハードに依存させず、実行（各機のSDKへの変換）だけをHAL（ハードウェア抽象化層）に閉じ込めるため。別のアームには実行層だけ差し替えればよく、CSVを差し替えるだけで比較実験も組める。送信前の安全チェックもHALの send_angles 内で必ず呼ぶ構造にした。","key":false,"src":"DAY102・DAY108"},{"id":"r024","category":"principles","sub":"構造の分け方","type":"point","front":"座標変換は1箇所に集約する。MacとPiで二段に変換したら、二重にかかったり値が渡らなかったりした。","back":"シミュと実機の座標の向きのずれも、下流の変換で辻褄を合わせず、データ自体を揃えて直す。","key":false,"src":"DAY144・DAY146・DAY156"},{"id":"r025","category":"principles","sub":"構造の分け方","type":"point","front":"空間を先に確定してから動きを乗せる。奥行き（Z軸）の判定（空間の確定）→動きの判定（時系列の変化）→CSV出力の順。スキャンで物の位置を先に持てば、奥行きを推定せずに動作を設計できる。","back":"","key":false,"src":"DAY118"},{"id":"r026","category":"principles","sub":"構造の分け方","type":"point","front":"実機が土台で、デジタルツインはそこに合わせる。ツイン側の記録項目は実機が1試行で取れる36項目に同じ列・同じ並びで揃え、並べて初めて差分が測れる。","back":"","key":false,"src":"DAY250"},{"id":"r027","category":"principles","sub":"構造の分け方","type":"qa","front":"19mmの誤差に対し、姿勢ごとに補正値を足す方式を最初に却下したのはなぜか？","back":"姿勢ごとに違う補正値は学習で求めるしかなく、大量シミュレーションや強化学習が難しい環境では採れないから。片側をずらすとURDF（機体の構造定義）・FKスキャン・lookup表・ホモグラフィが連動して崩れるので、差を一度測ってキャリブレーション定数として焼き込めるかを判断した。当時はUnityを正として実機を合わせる構造だったが、DAY250で「実機が土台、ツインが合わせる側」に改めた。","key":false,"src":"DAY169・DAY250"},{"id":"r028","category":"principles","sub":"構造の分け方","type":"point","front":"Raspberry Pi は脳であって筋肉ではない。Linux はOSの割り込みがあり硬い実時間制御に構造的に向かないので、Pi は知覚・段取り・上位ロジックを担い、関節を回す層はマイコンとサーボに任せる。","back":"","key":false,"src":"DAY260"},{"id":"r029","category":"principles","sub":"構造の分け方","type":"point","front":"ロバストなロボットは変動を消すのではなく一点に集める。照明とカメラは作業ブースに、決定論的な動きはルーチンに、最終位置合わせの残差は機械的な柔らかさ（コンプライアンス）に、推論周期はローカル筐体に寄せる。","back":"","key":false,"src":"DAY277"},{"id":"r030","category":"principles","sub":"構造の分け方","type":"point","front":"動きの核を最小構成で実機に通してから、記録・安全・検証の層を必要な分だけ後ろに足す。全ブロックを積んでから実機に出したら、動きは前と変わらず、44列の台帳には意味のある中身が入らなかった。","back":"","key":true,"src":"DAY294"},{"id":"r031","category":"principles","sub":"構造の分け方","type":"point","front":"単腕で動かないものは双腕でも動かない。双腕は単腕の問題が2倍ではなく2乗になる（同期制御・衝突回避・キャリブレーション・座標系の統一）ので、単腕の決着を先に付ける。","back":"双腕は左右同じ性能である必要はなく、精密に注ぐ腕とカップを支えるだけの腕のように役割で非対称に組める。","key":false,"src":"DAY201・DAY205"},{"id":"r032","category":"principles","sub":"構造の分け方","type":"point","front":"新しいタスクはまず「動くものリスト」（実機で動いた実績のある資産の一覧）を見て、そこで組めるなら新規スクリプトを書かない。実機実績の無いものは資産ではない。","back":"","key":false,"src":"DAY230"},{"id":"r033","category":"principles","sub":"構造の分け方","type":"point","front":"深度カメラは2Dの限界まで詰めてから導入する。成功率が頭打ち・物の大きさがばらつく・光環境に困る・高さの推定が必要、のどれかが買う合図。先に買うと何が解決したか見えなくなる。","back":"","key":false,"src":"DAY166"},{"id":"r034","category":"principles","sub":"AIと安全の境界","type":"point","front":"設計者と実装者が同じ前提を共有すると同じ盲点を持つ。関節制御・姿勢系のように物理リスクがある変更は外部レビューを必ず挟む。","back":"codexのレビューで、目標値の消失・基準角の巻き戻り・失敗時も把持へ進む・クランプなし、の致命バグ4件が実機前に見つかった。","key":false,"src":"DAY200"},{"id":"r035","category":"principles","sub":"AIと安全の境界","type":"qa","front":"安全制御（角度クランプ・ループ上限・時間上限）を外して何が分かったか？","back":"安全制御は問題を解決していたのではなく、暴走を途中で打ち切って見えなくしていた。外したのは動きの自動制限だけで、脱力コマンドや基準データ書き換えなど目視で防げない不可逆な操作の禁止は残した。見失ったときの復帰動作は「止める制限」ではなく「止まらないための動作」で、一緒に消したら22秒停止した。","key":false,"src":"DAY248"},{"id":"r036","category":"principles","sub":"AIと安全の境界","type":"qa","front":"動作中のロボットにAIを入れるとき、AIにどこまで任せる？","back":"AIはテスト済みの動作関数（近づく・降ろす・掴む・持ち上げる・置く）から1つを選ぶだけにし、生の関節角指令や動きそのものは作らせない。その場でコードを書かせると毎回違うコードが動き、事前に確かめられない。関節角の安全はコード側のガードが確かめ、自信が低いときは「止まって人を呼ぶ」を選ぶ。選択肢は3〜4個と「その他」で始め、その他に落ちた例から増やす。","key":true,"src":"DAY249・DAY325"},{"id":"r037","category":"principles","sub":"AIと安全の境界","type":"point","front":"安全層はAIから独立させる。AIは動きを提案するだけで、止めるかどうかは確実に動くと検証できる単純な仕組み（距離・関節角の上下限・指令途絶で停止）が最後に決める。考える層が賢くなってもこのガードは外さない。","back":"","key":true,"src":"DAY316"},{"id":"r038","category":"principles","sub":"AIと安全の境界","type":"qa","front":"なぜ開発時（ビルドタイム）と稼働中（ランタイム）のコード生成を分けるのか？","back":"開発時にエージェントとコードを直し、人がレビューして反映するのは安全。稼働中にロボットが自分のコードを書き換えると、成功を幻覚しうる自己評価の上に誤ったコードが積み上がる。だから稼働中の自己改変は不可とした。","key":false,"src":"DAY249"},{"id":"r039","category":"principles","sub":"AIと安全の境界","type":"point","front":"MicroFactory の構成では AI にロボットを直接リアルタイム制御させない。決まった動作はコード、ばらつきの大きい把持は π0.5、判断と復旧は Claude が担い、各工程の間に検証（Verify）を置く。","back":"","key":false,"src":"研究メモ:Physical AIが学習できる環境の調査"},{"id":"r040","category":"principles","sub":"AIと安全の境界","type":"point","front":"安全確認をUIで簡単に飛ばせる設計は事故を招く（1984年ミシガンの死亡事故の一因とされる）。慣れた人ほど手順を省くので、危険な操作の前に自然と立ち止まらせる設計が要る。","back":"","key":false,"src":"DAY135"},{"id":"r041","category":"principles","sub":"動きと体験の設計","type":"point","front":"動作体験には精度・速度・可動域で表せない設計要素がある：次の動きを予測できる間合い、急停止か滑らかに収束するかの終わり方、やり直せるか、ハードを選ばないか。","back":"ロボットアームのキャラクター性も動きで決まり、速度・止まるタイミング・減速・次の動きまでの間で印象が変わる。","key":false,"src":"DAY112・DAY117"},{"id":"r042","category":"principles","sub":"動きと体験の設計","type":"qa","front":"人の目は、ロボットの動きのカクつきをどこで感じ取るか？","back":"人の目は速度の不連続より加速度の不連続に敏感で、「ガクッ」と見えるのは加速度がジャンプした瞬間。動作の継ぎ目に加速度のスパイクが出るとカクついて見える。見るべき指標は位置でも速度でもなく加速度。","key":false,"src":"DAY223"},{"id":"r043","category":"principles","sub":"動きと体験の設計","type":"point","front":"動きの設計は二層で捉える。下層は位置に応じて確実に届く骨格を計算で作り（確定論的）、上層は何がいい動きかを人が設計する。計算は正しい動きを導けるが、いい動きは決められない。","back":"","key":false,"src":"DAY223"},{"id":"r044","category":"principles","sub":"動きと体験の設計","type":"term","front":"動きの不気味の谷","back":"横軸を動きの人間・生物らしさ、縦軸を人の安心感にとると、完全に機械的な動きと完全に自然な動きは安心され、中途半端に滑らかな中央が谷の底になる。推論遅延による0.5秒の躊躇や、最後だけ機械的に決まる姿勢角などが組み合わさって違和感になる。","key":false,"src":"DAY212"},{"id":"r045","category":"principles","sub":"動きと体験の設計","type":"qa","front":"ロボット操作UIの本当の問題は、入力と出力のどちら？","back":"出力。数値やアラートは出るが、止まってよい警告か今すぐ手を離すべき警告かが一目で分からず、ロボットの状態が操作者の身体に届かない。ゲームはアダプティブトリガーや振動パターンで状態を身体に翻訳する設計を30年磨いてきた。借りるべきはコントローラーではなくこの思想。","key":false,"src":"DAY135"},{"id":"r046","category":"principles","sub":"動きと体験の設計","type":"qa","front":"音声AIロボットの「間」が悪くなるのはなぜで、どう設計するか？","back":"発話区間検出・音声認識・LLM推論・音声合成の4段を直列に通るため、間は構造的に生まれる（最も重いのはLLM推論）。待ち時間を消すのではなく、聞き終わりの合図・考える仕草・話し始めの予備動作・割り込みの許容で、無反応を「考えている時間」に読み替えさせる。ただし体感は変えても実際の遅延は消えない。","key":false,"src":"DAY262"},{"id":"r047","category":"principles","sub":"動きと体験の設計","type":"qa","front":"機械的な柔らかさ（コンプライアンス）は、人と共存するロボットの設計でどの順番に置くべきか？","back":"最後に買う保険レイヤー。予備動作・減速カーブ・一貫した経路・光や音の予告は安く予測可能性を作れる。コンプライアンスだけはロボットが状況を誤解していても物理的に効き、高速衝突は能動制御では間に合わずバネだけが間に合う。一方、柔らかくしたぶん精度が出ず仕事が少なかった Rethink Robotics は事業を停止しており、必要条件でも十分条件ではない。","key":false,"src":"DAY296"},{"id":"r048","category":"principles","sub":"動きと体験の設計","type":"term","front":"運動主体感","back":"自分の意志で体を動かしている感覚。操作した結果が思ったとおりに返ると強まり、ずれたり遅れたりすると弱まる。遠隔操作のAI補助はこの感覚を削らない範囲にとどめ、「AIは操縦者より先には動かない」を基準にする。","key":false,"src":"DAY322"},{"id":"r049","category":"kinematics","sub":"座標系と関節の名前","type":"term","front":"mechArm の6軸（j0〜j5）","back":"j0=ベース回転、j1=肩、j2=肘、j3=腕の捻り、j4=手首の曲げ（ピッチ）、j5=グリッパーの捻り。捻り（j3・j5）と曲げ（j1・j2・j4）は別種の軸で、捻りは側面図には出ない。","key":false,"src":"arm_kinematics"},{"id":"r050","category":"kinematics","sub":"座標系と関節の名前","type":"point","front":"座標系はロボット＝マット＝Unityで統一し、原点はアームベースの真下。上カメラから見て Unity X+ は画面左、Z+ は手前、Y+ は上。mm×0.001 で m に変換する。","back":"当初は mechArm の座標（X=前後・Y=左右・Z=高さ）と Unity 座標・人の直感が食い違い、Unity 座標を正に統一した。mechArm ネイティブは Z が上なので、上方向オフセットはどの座標系のコードか必ず確認する。","key":true,"src":"DAY149・DAY158・DAY160・DAY164・arm_kinematics"},{"id":"r051","category":"kinematics","sub":"座標系と関節の名前","type":"point","front":"ROS（右手系）と Unity（左手系）は座標系が違う。URDF の値を Unity へ移すときは Unity.x=ROS.x、Unity.y=ROS.z、Unity.z=ROS.y と軸を入れ替える。","back":"","key":false,"src":"DAY133"},{"id":"r052","category":"kinematics","sub":"座標系と関節の名前","type":"qa","front":"lookup の距離は0.7mmなのに、アームがブロックと逆方向へ動いた原因は？","back":"ホモグラフィ（画像→平面座標の変換）校正の Y 軸の符号が最初から逆だった。コードは正しく見えたが、実機で j0 を−30°動かし手先の向きを見て分かり、1行の符号修正で直った。Unity と実機で j0 の回転方向が逆なこともこのとき判明した。","key":false,"src":"DAY154"},{"id":"r053","category":"kinematics","sub":"座標系と関節の名前","type":"qa","front":"カメラの座標とロボット座標を、1点で求めたオフセット式で繋ぐとどうなる？","back":"原点も向きも違うので、1点で合わせた式は別の位置で崩れる（X約38mm・Y約50mmずれた）。ホモグラフィの対応点にロボット座標の実測値を入れ、画素→ロボット座標を直接出す方式に変えた。","key":false,"src":"DAY144"},{"id":"r054","category":"kinematics","sub":"座標系と関節の名前","type":"qa","front":"スマホで手先の位置と向き（6自由度）を指示する方式を SO-101 に使うと何が問題？","back":"SO-101 は5関節＋グリッパーなので、指示した向きを全部は再現できない。Phone2Act の論文はその扱いを書いていない。","key":false,"src":"研究メモ:Phone2Act（スマホ遠隔操作）"},{"id":"r055","category":"kinematics","sub":"手先（EE）の定義","type":"qa","front":"EE（エンドエフェクタ＝手先の基準点）はどこに定義すべきか？","back":"手首フランジ（link6）ではなく、左右の爪先（Brep）の中点をルート相対で記録する。手首基準では白箱中心への最近傍が69mm、爪先中点基準では0.43mmになった。中点なら指が閉じても奥にずれるだけで、掴む直前の入口位置として意味がある。","key":true,"src":"DAY157・DAY168・DAY169"},{"id":"r056","category":"kinematics","sub":"手先（EE）の定義","type":"qa","front":"手首と爪のずれを、固定オフセットの補正で直せないのはなぜ？","back":"爪は手首から約90mm先にあり、ずれの出る方向は j0（ベース回転）の向きで変わる。j0=48°で測った補正値は j0=60°では合わない。EE の定義を爪先に変えて FK テーブルを作り直すしかない。","key":false,"src":"DAY162"},{"id":"r057","category":"kinematics","sub":"IKをやめてFKテーブルへ","type":"term","front":"CCD IK","back":"Cyclic Coordinate Descent。手先に近い関節から1つずつ、手先が目標へ向くよう回す反復型の逆運動学（手先位置から関節角を求める計算）。6軸＋関節制限では局所解に陥りやすく、mechArm では5日間試しても収束せず（最高でも11/273＝4%）、捨てた。","key":false,"src":"DAY149・DAY150"},{"id":"r058","category":"kinematics","sub":"IKをやめてFKテーブルへ","type":"qa","front":"ikpy による解析的 IK を採用しなかった理由は？","back":"1,066点すべてが「成功」と出たが、実機で確認済みの角度と全関節で大きくずれていた。約26%の点で j1 が上限120°に張り付いてもいた。計算上の成功と実機で正しい角度は別物。","key":false,"src":"DAY150"},{"id":"r059","category":"kinematics","sub":"IKをやめてFKテーブルへ","type":"point","front":"IK を解く代わりに、確認済みの姿勢から関節角を少しずつずらして FK（順運動学：関節角→手先位置）で記録すれば「角度→位置」の対応表（FK テーブル）ができる。IK は逆問題で失敗しうるが、FK は順問題で失敗しない。","back":"","key":true,"src":"DAY150"},{"id":"r060","category":"kinematics","sub":"IKをやめてFKテーブルへ","type":"point","front":"PICK/PLACE 用の FK テーブルは j1 が20.17〜125°で、HOME（j1=0）付近を含まない。別スキャンで測った HOME の爪先は高さ232.4mm・人側267.1mmで、真上ではなく垂直から約49°前傾していた。","back":"","key":false,"src":"DAY289・DAY297"},{"id":"r061","category":"kinematics","sub":"IKをやめてFKテーブルへ","type":"qa","front":"FK テーブルの「範囲を広げる」と「密度を上げる」では、計算時間の増え方がどう違う？","back":"時間は総点数にほぼ比例する（約25ms/点、20体並列で10万点約42分）。範囲拡張は基準姿勢の数に線形で増える。密度は6軸格子の掛け算で、各軸の刻みを半分にすると最悪 2^6=64倍（約45時間）。だから全域を作り直さず、穴の領域だけ差分で足す。","key":false,"src":"DAY225"},{"id":"r062","category":"kinematics","sub":"FKテーブルの引き方","type":"qa","front":"XZ 距離だけで最近傍を選ぶ lookup が、間違った姿勢を返したのはなぜ？","back":"6軸アームには冗長解があり、同じ先端座標で姿勢が大きく違う点がテーブルに複数ある。XZ だけでは高さも姿勢も違う点を拾い、3Dで32mmずれる例もあった。確定 PICK 姿勢の j2〜j5 に近い候補と目標の高さ範囲で絞ってから最近傍を選ぶ。","key":true,"src":"DAY170・DAY177"},{"id":"r063","category":"kinematics","sub":"FKテーブルの引き方","type":"qa","front":"最近傍の合否を3D距離だけで決めると何が起きる？","back":"高さが大きく下振れした点が通ってしまう。3D距離40.2mm（閾値内）なのに高さ80mm（目標120mm）を引いた。テーブルの密度は場所で違い（最近傍距離4.1〜54.6mm）、肘・手首が捻れた別の腕の形も選ばれる。高さの下振れ制限（APPROACH 30mm・降下15mm）を足し、送信前に止めた。","key":false,"src":"DAY213・DAY215・DAY217"},{"id":"r064","category":"kinematics","sub":"FKテーブルの引き方","type":"point","front":"位置 (X,Y,Z) で最近傍を引くと、位置に効かない爪の回転 j5 は偶然の値になる（0°が返り、HOME の-30°から30°回りかけた）。位置で決まらない関節は HOME 値に固定して送る。","back":"","key":false,"src":"DAY210"},{"id":"r065","category":"kinematics","sub":"FKテーブルの引き方","type":"qa","front":"x-z 座標の最近傍だけで6関節の姿勢を選ぶと何が起きた？","back":"下げるだけでよいのに j3（腕の捻り）が-32°、次に j5（グリッパーの捻り）が30°ずれた姿勢が選ばれ、爪が箱に当たった。補正は x-z しか動かさないので直らない。j3・j5 に±5°の帯フィルタを足すと捻りは消えたが、今度は曲げの関節が極端な深さに振れた。","key":false,"src":"DAY263"},{"id":"r066","category":"kinematics","sub":"FKテーブルの引き方","type":"qa","front":"昨日まで掴めたブロックに爪先が7cmずれて降りた。接近姿勢の何が問題だった？","back":"真下に下ろすには接近と降下の j0（ベース回転）が同じでなければならない。接近は円弧 lookup（j0=-17）、降下は FK 最近傍（j0=-26）で9°食い違い、下ろしながら横に振っていた。接近も FK lookup に揃え、降下の j0 を接近の±3°に拘束すると、PICK→PLACE を3連続で通し、最良で爪先のずれは2.3mmになった。","key":true,"src":"DAY275"},{"id":"r067","category":"kinematics","sub":"FKテーブルの引き方","type":"qa","front":"PLACE 降下で、接近姿勢とかけ離れた深い姿勢が選ばれる問題をどう解いた？","back":"接近から全軸±15°以内で降りられる実在点を格子ごとに数えると195セル全部が空で、選び方ではなくデータの欠損だった。9つの基準姿勢を Unity でスキャンして151,263点を追加し、lookup に参照姿勢と許容関節差15°を渡すと、最大関節移動は27.84°→14.66°になった。","key":false,"src":"DAY263・DAY265"},{"id":"r068","category":"kinematics","sub":"FKテーブルの引き方","type":"qa","front":"PLACE 補正が毎回安全側に破棄された真因は？","back":"テーブルには j4 に余裕のある姿勢が351点あったが、接近の基準姿勢が手首を限界 j4=-89.38° に張り付かせていた。PLACE は接近から全軸±15°の範囲でしか動けず、良い姿勢に乗り換えられない。上流の姿勢が悪いと下流も悪いまま。j1 と j4 の基準値は、組がテーブルに実在するよう対で変える。","key":false,"src":"DAY279"},{"id":"r069","category":"kinematics","sub":"FKテーブルの引き方","type":"qa","front":"FK テーブルに67,228点を足しても PLACE の Z 残差（約15mm）が動かなかった。届く姿勢を消していたのは？","back":"lookup の候補フィルタ。①高さ許容±5mmが到達候補を門前払い ②スコア式が m 単位の距離と度単位の関節差を混ぜ、j1 の1°が300mm相当になって基準姿勢と同じ点しか選ばれない ③最良点は j4=-101 で安全範囲により正当に除外。①②を直し、追加スキャンの点と合わせて初めて残差は14.7mm→7.9mm。③は物理保護なので変えない。","key":false,"src":"DAY281"},{"id":"r070","category":"kinematics","sub":"テーブルの穴と被覆","type":"qa","front":"狙いの近くに1万点以上あるのに、欲しい高さの姿勢が最近傍に選ばれなかったのはなぜ？","back":"点が無いのではなく、密な低い点（ee_y≈0.08m）に高い点（2割）が埋もれていた。元の基準姿勢やグリッドの j0 範囲が片側に偏っていたのが原因。その領域の高さ分布を検算し、高い点を出す実在姿勢を基に±15°格子で再スキャンする。勘で姿勢を作らない。","key":false,"src":"DAY222・DAY253・arm_kinematics"},{"id":"r071","category":"kinematics","sub":"テーブルの穴と被覆","type":"qa","front":"FK テーブルの「穴」が1軸ずつのヒストグラムで見えないのはなぜ？","back":"降下姿勢の j1≈90° も床近くの高さも、1軸ごとに見れば最も濃い帯だった。掴むのに要るのは「関節の組み合わせ×床近くの高さ」という多次元の条件で、穴はその交差にしか現れない。1軸ごとの集計では有無を判断できない。","key":false,"src":"DAY251"},{"id":"r072","category":"kinematics","sub":"テーブルの穴と被覆","type":"point","front":"代表姿勢の近傍だけで被覆を語ると偽の穴が出る。PLACE 姿勢±10°には0点でも、白箱の床近くには別姿勢で31,422点あった。穴は場所ではなく姿勢の選び方にある。","back":"","key":false,"src":"DAY251"},{"id":"r073","category":"kinematics","sub":"テーブルの穴と被覆","type":"point","front":"1つの姿勢で j0 だけを振ると、爪先は面ではなく細い弧を描く（置く姿勢なら半径約280mmで奥〜横の半周、手前には届かない）。全点の雲が面に見えるのは、別姿勢の弧が重なった錯覚。","back":"","key":false,"src":"DAY251・DAY254"},{"id":"r074","category":"kinematics","sub":"テーブルの穴と被覆","type":"qa","front":"1本の弧しかない姿勢を「面」にするには何が要る？","back":"j1〜j5 を固定して j0 だけ振る限り1基準姿勢＝1弧で、奥行き135〜320mmに散るブロックのほぼ一点しか通らない。j1（肩）と j2（肘）で到達半径の違う基準姿勢を複数持ち、それぞれで j0 を振れば弧が入れ子になり面になる。lookup 側にも奥行きで弧を選ぶ段が要る。","key":false,"src":"DAY252"},{"id":"r075","category":"kinematics","sub":"関節の効き（感度）","type":"point","front":"可動域は1関節の角度範囲ではなく、6関節が補い合う姿勢空間で決まる。肩を単独で深く曲げると爪がマットに当たるが、手首のピッチも合わせて曲げると肩は70°以上まで届いた。","back":"","key":false,"src":"DAY173"},{"id":"r076","category":"kinematics","sub":"関節の効き（感度）","type":"point","front":"ベース回転 j0 は爪先を左右（X）に約-6.5mm/° 動かすが、奥行き（Z）にはほぼ効かない（約0.55mm/°）。X の追従は j0 で行い、Z には別の関節群が要る。","back":"","key":false,"src":"DAY180・DAY185"},{"id":"r077","category":"kinematics","sub":"関節の効き（感度）","type":"qa","front":"接近・PICK・PLACE と高さを変えても、箱を向く j0 が同じ+4.5°だったのはなぜ？","back":"j0 は基部の回転で、方位だけを変える軸だから。高さを変えると爪先の弧の半径は変わる（0.35m／0.31m／0.30m）が、向きは変わらない。","key":false,"src":"DAY232"},{"id":"r078","category":"kinematics","sub":"関節の効き（感度）","type":"qa","front":"Z 方向の追従が縮まらず振動し続けた本当の原因は？","back":"「j1+, j2+, j4- で Z+ に動く」と幾何学的に推論していたが、実測では逆に Z- へ動いた（-12.64mm）。毎フレーム逆向きの指令が出て振動していた。4ケースの実測で3関節の符号を反転し、さらにSSH送信をPi常駐デーモンに置き換えて、1.7秒で2D距離2.9mmに収束した。","key":true,"src":"DAY186・DAY189"},{"id":"r079","category":"kinematics","sub":"関節の効き（感度）","type":"point","front":"関節を動かしたときの爪先の動きは、姿勢で効き方も向きも変わる。連動3関節の Z 係数は領域で18%違い、j2 を浅くすると-24°付近を境に爪先が下がるから上がるに転じた。関節値の符号と直感も食い違うので、向きは実機で確かめる。","back":"","key":false,"src":"DAY186・DAY189・DAY191・DAY199・DAY200・DAY204"},{"id":"r080","category":"kinematics","sub":"関節の効き（感度）","type":"qa","front":"高さ（Y）の補正に j2 ではなく j4 を使うのはなぜ？","back":"3姿勢で測ると、各姿勢で j2 と j4 の Y への効き（6〜10px/°）は同程度だが、奥行き Z への干渉は j2 が-1.6〜-2.0mm/°、j4 は±0.3mm/°以下だった。j4 は j2 より5〜13倍 Y 専用に近い。机上で考えた「j2 と j4 を逆向きに連動させて干渉を打ち消す」設計は不要になった。","key":false,"src":"DAY204"},{"id":"r081","category":"kinematics","sub":"関節の効き（感度）","type":"point","front":"j4 の Y 感度は高い姿勢+10→中+8.2→低+6px/° とほぼ線形に下がるので、j2 の値で線形補間して使う（誤差最大2.5%）。固定値だと低い姿勢で補正が過剰になり振動する。","back":"","key":false,"src":"DAY204"},{"id":"r082","category":"kinematics","sub":"関節の効き（感度）","type":"point","front":"降下後（肘が寝た姿勢）で爪先の奥行き Z を動かせるのは実質 j2 だけで、感度は0.7〜1.1mm/°。しかも X も動く。33mm の差を詰めるには約44°要り、姿勢が壊れる。","back":"","key":false,"src":"DAY248"},{"id":"r083","category":"kinematics","sub":"関節の効き（感度）","type":"qa","front":"爪先をブロックへ降ろすのに、なぜ j4（手首）単独の回転が効いたのか？","back":"手首を軸に j4 を回すと爪先は円弧を描いて降り、腕全体の姿勢を作り替えずに済む。円弧なので XZ もずれるため、毎ステップ j0 で X、j1+j2 で Z を補正し、1回の send_angles にまとめた。回転の符号はコードと実機で逆だった。","key":false,"src":"DAY200"},{"id":"r084","category":"kinematics","sub":"関節の効き（感度）","type":"qa","front":"j1 を据え置き j2 を増やして爪を降ろそうとしたら何が起きた？","back":"到達はしたが、爪は降りずに16mm前へ伸びただけだった。その姿勢領域では「降りる」より「前に伸びる」が勝つ。真上のカメラでは高さが分からず、横カメラで初めて箱の縁よりずっと上だと分かった。","key":false,"src":"DAY232"},{"id":"r085","category":"kinematics","sub":"関節の効き（感度）","type":"term","front":"平行スライド","back":"グリッパを水平・同じ高さに保ったまま、爪先の x・z だけを動かす動き。j1+j2+j4 を同方向に動かすリーチ伸縮とは別物で、姿勢を拘束した運動学が要る。リーチ伸縮で測った係数は使えない。","key":false,"src":"DAY191・DAY192"},{"id":"r086","category":"kinematics","sub":"関節の効き（感度）","type":"qa","front":"平行スライドを解く方法に、lookup 逆引きを選んだのはなぜ？","back":"解析的 IK は正確な DH パラメータ（リンク寸法の定式化）が要り、ヤコビアン疑似逆の数値解は反復が重い。lookup は実機で検証してきた FK テーブルを「目標高さ・水平姿勢」で絞って最近傍を選ぶだけ。表に姿勢列が無いので、グリッパのピッチは肩・肘・手首のピッチ角の和で事後計算する（要検証の仮説）。","key":false,"src":"DAY192"},{"id":"r087","category":"kinematics","sub":"経路と干渉","type":"qa","front":"HOME から任意の位置へ動かすとき、なぜ2段階（ベースだけ回す→全関節を展開）にしたのか？","back":"HOME から直接送ると関節空間で補間され、手先が途中で想定外に下がりうる。腕を畳んだまま j0 だけ回して向きを揃え、それから腕を伸ばす。復路も逆順の2段階にする。","key":false,"src":"DAY215"},{"id":"r088","category":"kinematics","sub":"経路と干渉","type":"point","front":"FK が指す爪先位置が正しくても、手前のリンクが対象にぶつかることがある（白箱上空75mmで接触）。到達点だけでなく、アーム全体が占める体積を考える。","back":"","key":false,"src":"DAY209"},{"id":"r089","category":"kinematics","sub":"経路と干渉","type":"qa","front":"始点と終点が安全な姿勢なら、その間の移動も安全と言えるか？","back":"言えない。関節補間で動くアームは、途中で爪・肘・手首が一時的に人側へ膨らむことがある。中間姿勢を FK テーブルから選び、全リンクが通過する空間（スウェプトボリューム）を Unity で確認し、人なし実機→ダミー手→補助者同席の順で確かめる。","key":false,"src":"DAY288"},{"id":"r090","category":"kinematics","sub":"経路と干渉","type":"qa","front":"弧より手前（ベース寄り）のブロックを掴もうとして、本当に壊れたのはどこだった？","back":"掴み精度ではなく持ち上げ。ベースに寄せるほど深く折りたたんだ窮屈な姿勢で掴むことになり、そこから上空へ戻る LIFT で手首が20〜28°未到達のまま止まった。弧をもう一本足せば済む話ではなかった。","key":false,"src":"DAY244"},{"id":"r091","category":"hardware","sub":"機体の構成","type":"qa","front":"同じメーカー・同価格帯の myCobot 280 ではなく mechArm 270 を選んだのはなぜ？","back":"どちらも pymycobot で動くが構造が違う。myCobot は UR 型（協働ロボット型）で可動域は広いが、モーターで姿勢を保つ分だけ安定性が劣る。mechArm は中心対称構造（産業用ロボットに近い形）で、Pick&Place のような産業動作に合う。","key":false,"src":"DAY102"},{"id":"r092","category":"hardware","sub":"機体の構成","type":"point","front":"mechArm 270 のペイロード（持ち上げられる重さ）は250gで、グリッパー込みの実効値はさらに下がる。コーヒーカップは重すぎる。","back":"","key":false,"src":"DAY102・DAY127"},{"id":"r093","category":"hardware","sub":"機体の構成","type":"qa","front":"カップを掴むのに、吸着パッドではなく Adaptive Gripper を選んだのはなぜ？","back":"真空吸着は円筒の側面に吸い付けず、口の開いたカップは上面からも不安定。2本指の Adaptive Gripper は形に合わせて掴め、シミュの把持に最も近い。","key":false,"src":"DAY102"},{"id":"r094","category":"hardware","sub":"機体の構成","type":"qa","front":"mechArm 270 Pi で実時間のモーター制御を担っているのはどこか？","back":"Raspberry Pi 4B ではない。Pi は pymycobot で指令を送る上位層で、シリアル（1Mbps）の先の M5Stack Atom（ESP32 系マイコン）が指令を解釈してサーボを駆動し、各スマートサーボが位置保持を内部で回していると見られる（未確定）。だから Mac/Pi 側の視覚サーボは監督ループで、カメラのレートで回ってよい。","key":false,"src":"DAY260"},{"id":"r095","category":"hardware","sub":"機体の構成","type":"point","front":"純正の Camera Flange 2.0 はアーム先端の取付口に差す部品で、グリッパーと同時には付けられない。仕様書の「eye in hand」だけでなく、物理的に一緒に装着できるかを確かめる。","back":"","key":false,"src":"DAY159"},{"id":"r096","category":"hardware","sub":"機体の構成","type":"qa","front":"3D CAD のソリッドと、画像から3Dを作る生成 AI のメッシュはどう違う？","back":"ソリッドは「四角を5mm押し出した」という手順が残り、寸法を変えると形が追従する。メッシュは三角形で表面だけを表し、寸法変更や穴の追加は実質できない。大きさを確かめる模型ならメッシュで足り、相手部品に合わせる金具はソリッドで作る。","key":false,"src":"DAY311"},{"id":"r097","category":"hardware","sub":"機体の構成","type":"point","front":"FDM（溶かした樹脂を積む方式）の3Dプリントは設計値ちょうどだと嵌まらない。片側0.1mmでぴったり、0.2mmで手で入る、0.3mmで緩い（10mmのダボなら穴は10.4mm）。実値はテストピースで確かめる。","back":"","key":false,"src":"DAY311"},{"id":"r098","category":"hardware","sub":"通信とデーモン","type":"point","front":"mechArm 270-Pi の内部シリアルは /dev/ttyAMA0・通信速度1000000（pymycobot の PI_PORT/PI_BAUD と同じ）。テストツールの「関節7と通信不可」はグリッパー未装着のためで異常ではない。","back":"","key":false,"src":"DAY120"},{"id":"r099","category":"hardware","sub":"通信とデーモン","type":"point","front":"SSH には Mac を Pi のホットスポットへ、スマホカメラ（Iriun）には家庭 WiFi への接続が要り、無線1本では両立しない。Pi と Mac を有線 Ethernet で直結し、有線（SSH）と無線（カメラ）を分けた。","back":"","key":false,"src":"DAY129・DAY130・DAY131"},{"id":"r100","category":"hardware","sub":"通信とデーモン","type":"qa","front":"シミュが出した全フレームの CSV を、そのまま実機に流さないのはなぜ？","back":"シリアル通信の速度限界で詰まり危険だから。GRASP や LIFT など5点程度のキーフレーム（要所の姿勢）を抜き出すスクリプトを、実機到着前に用意する計画にした。シミュと実機のゼロ点（全関節0°の姿勢）が一致しているかも最重要の確認項目で、ずれていると CSV の角度が別の位置を指す。","key":false,"src":"DAY102"},{"id":"r101","category":"hardware","sub":"通信とデーモン","type":"qa","front":"別スレッドで50msごとに get_angles() を呼んだら、記録が0行だったのはなぜ？","back":"メインスレッドの send_angles() がシリアルポートを占有している間、別スレッドの読み取りがすべて失敗し、例外を黙って捨てていた。スレッドをやめ、各ステップの待機後にメインスレッドで1回だけ取得する方式にしたら取れた。","key":false,"src":"DAY132"},{"id":"r102","category":"hardware","sub":"通信とデーモン","type":"qa","front":"SSH で1コマンドずつ Pi の Python を起動する構造が、追従を止めたのはなぜ？","back":"毎回 SSH 接続・python3 起動・import・シリアルを開く処理が走り、1コマンド500〜1000msかかった。捌けない命令はプロセスとして溜まり、同じシリアルポートを奪い合った。Pi 側に接続を保持し続ける常駐デーモンを置き、Mac から TCP ソケットで JSON 命令を送る構造に変えて、追従が初めて収束した。","key":true,"src":"DAY186・DAY189"},{"id":"r103","category":"hardware","sub":"通信とデーモン","type":"qa","front":"デーモン通信のタイムアウトはどう設計すべきだったか？","back":"一律5秒では、待ち4秒の命令にシリアルのジッタが乗ると超える。命令の待ち時間に応じて「wait+3秒」にする。タイムアウト時はソケットを強制的に閉じて次回再接続する。閉じないと遅れて届いた応答が残り、別コマンドの応答として誤読される。","key":false,"src":"DAY190"},{"id":"r104","category":"hardware","sub":"通信とデーモン","type":"qa","front":"カメラ付きのスキャンでアームが動かなかった原因を、どう切り分けたか？","back":"pymycobot 直叩き→動く、デーモン経由→動く、カメラなし→動く、と1つずつ確かめた。カメラとデーモンを組み合わせたときだけ止まり、cv2.VideoCapture 実行中にデーモンとの TCP 接続が切れていると確定した。正しい部品同士でも組み合わせで壊れるので、共存を設計する。","key":false,"src":"DAY197"},{"id":"r105","category":"hardware","sub":"通信とデーモン","type":"qa","front":"デーモンが居るかを pgrep -f で確認してはいけないのはなぜ？","back":"-f はコマンドライン全体に一致するため、確認コマンド自身の SSH プロセスを拾って「居る」と誤検出し、pkill -f では親シェルを殺すこともある。ss -ltn で5555番を listen しているかで判定する。SSH 越しに nohup で起動するときは <\/dev/null で入力を切らないと SSH が返らない。","key":false,"src":"DAY191・DAY294・DAY297"},{"id":"r106","category":"hardware","sub":"通信とデーモン","type":"point","front":"Pi 側デーモンは1クライアントしか受けないので、本線の接続中は別プロセスが関節の実測値を取れない。そこで本線の送角指令値を UDP で流す。mechArm は指令→待ちの離散運動なので指令値の列が軌跡になる。","back":"","key":false,"src":"DAY287"},{"id":"r107","category":"hardware","sub":"送信命令の性質","type":"qa","front":"send_angles と send_coords はどう違うか？","back":"send_angles は6関節の角度を直接指定する。send_coords は先端の位置と向き（x, y, z, rx, ry, rz）を指定し、mechArm 内蔵の逆運動学が関節角に変換する。ただし実機では send_coords は信頼できず、使用を禁止した。","key":false,"src":"DAY180・arm_kinematics"},{"id":"r108","category":"hardware","sub":"送信命令の性質","type":"qa","front":"なぜ send_coords を永久禁止し、send_angles だけにしたのか？","back":"手先の向き RX/RY/RZ は位置で大きく変わり（RZ は167°〜−140°）、固定値を渡すと内蔵 IK が別の解を選んで全く違う場所へ動いた。直線補間モードでホームから下ろすと横滑りしてブロックを押すこともあった。以後 send_angles のみとし、失敗時の自動 HOME リトライも禁止した。","key":true,"src":"DAY142・DAY146・DAY154・arm_kinematics"},{"id":"r109","category":"hardware","sub":"送信命令の性質","type":"qa","front":"視覚サーボで新しい目標を送り続けても、アームが追従しなかったのはなぜ？","back":"pymycobot は既定で、動作中に来た新指令をキューに積んで順番待ちにする。1.5秒周期で目標を投げると詰まり、最新の指令が反映されない。ノンブロッキングの send_angles と set_fresh_mode(1)（新指令で未完了の動作を破棄して即実行）に切り替え、終了時は0に戻す。","key":true,"src":"DAY180・DAY185・DAY208"},{"id":"r110","category":"hardware","sub":"送信命令の性質","type":"point","front":"「送れる速さ」と「動ける速さ」は別物。命令送信は91Hz出ても、アームの物理応答は振幅10°で約500ms（2Hz）かかり、差は約45倍。ループ周期は物理側で決まり、1ループの移動量を小さく制御する設計が要る。","back":"","key":true,"src":"DAY183・DAY185"},{"id":"r111","category":"hardware","sub":"送信命令の性質","type":"qa","front":"届かない姿勢を sync_send_angles（到達まで待つ送信）で送ると何が起きた？","back":"タイムアウト後に get_angles() が空リスト、is_moving() が-1を返し、シリアル通信が壊れた状態になった。非同期の send_angles で送って待つと、実際には届く範囲まで動いていた。届かない姿勢を同期送信で待たない。","key":false,"src":"DAY173"},{"id":"r112","category":"hardware","sub":"送信命令の性質","type":"point","front":"デーモンの send_angles の wait 引数は Pi 側で無視されていた（sleep していない）。到達を待つには、Mac 側で明示的に待つか、実測角で到達を確認する。","back":"","key":false,"src":"DAY204・DAY210"},{"id":"r113","category":"hardware","sub":"送信命令の性質","type":"qa","front":"lookup は成功しているのに、アームが低い位置を横滑りしてブロックを弾いたのはなぜ？","back":"Mac 側で計算した補間の起点が「HOME 移動前の中途半端な実機姿勢」だった。Pi 側はまず HOME へ動き、そこから補間の1点目へジャンプしたため低空で横移動した。補間の起点を HOME に固定して直った。","key":false,"src":"DAY168・DAY177"},{"id":"r114","category":"hardware","sub":"送信命令の性質","type":"qa","front":"グリッパー直後の単発 send_angles が無視されたとき、何が効いたか？","back":"待ち延長・3回再送・0.1秒間隔の連打はどれも効かず、単体テストでは各要素とも動いた。完走実績のある再生（0.1秒周期で補間姿勢を流すストリーミング）の送信文脈をそのまま写し、入力だけ差し替えたら通った。動く前例があればまずその文脈に乗り、差分は1つずつ試す。","key":false,"src":"DAY228"},{"id":"r115","category":"hardware","sub":"読み取りと到達確認","type":"qa","front":"get_angles() にはどんな落とし穴があり、どう対処するか？","back":"空リスト・直前の古い値・180°のような異常値を返すことがあり、移動中やシリアル初期化直後（約1.2秒）に起きやすい。読みが数秒沈黙することもある。リトライ（例：200ms×12回）で待ち、可動域を大きく外れた値は捨て、読めなくても動作の本流を止めない構造にする。","key":false,"src":"DAY123・DAY176・DAY183・DAY189・DAY190・DAY197・DAY210・DAY228"},{"id":"r116","category":"hardware","sub":"読み取りと到達確認","type":"qa","front":"送信の戻り値 OK や is_moving=0（停止）で「到達した」とみなしてはいけないのはなぜ？","back":"指令は低い確率で黙って無視され、通信異常でも停止状態になるから。get_angles の実測と目標の差が許容内かで判定し、None・-1・タイムアウトは未到達とする。未到達なら同じ目標を再送し（約5回に1回の無視は再送で通る）、それでも届かなければ止める。降下やストール疑いでは再送を控える。","key":true,"src":"DAY216・DAY217・DAY231・DAY288"},{"id":"r117","category":"hardware","sub":"読み取りと到達確認","type":"point","front":"送信角と到達角のずれの実測では、j1 が約1.02°、j4 が約0.88°の着き不足で、他の関節は0.4°以下だった。","back":"","key":false,"src":"DAY190"},{"id":"r118","category":"hardware","sub":"読み取りと到達確認","type":"term","front":"サーボの不感帯（デッドバンド）","back":"小さすぎる指令にサーボが反応しない範囲。mechArm 270 Pi では±1°の指令で実機が動かなかった（3回再現）。「細かく制御すれば精度が上がる」前提でループを組むと振動する。","key":false,"src":"DAY204"},{"id":"r119","category":"hardware","sub":"読み取りと到達確認","type":"qa","front":"動かしていない関節まで厳しい許容差で到達確認すると、なぜ中断が量産されたのか？","back":"j1 は87.74°付近で重力負荷を強く受け、保持力が負けて+1.11°ドリフトした。測りたい関節は止まっているのに、測らない関節が止まりきれずに中断していた。動かす関節と動かさない関節で許容差を分けた（1.5°/2.0°）。","key":false,"src":"DAY204"},{"id":"r120","category":"hardware","sub":"読み取りと到達確認","type":"point","front":"デーモン経由でグリッパーを閉じた後、send_angles がアーム側コントローラで全く反応しなくなることがある。再送・時間経過・デーモン再起動では解けず、アームの電源リセットでのみ解除された。","back":"","key":false,"src":"DAY230"},{"id":"r121","category":"hardware","sub":"関節の上限とガード","type":"point","front":"MechArm270 の SDK 関節リミットは j0±160°、j1 -75〜+120°、j2 -175〜+65°、j3±155°、j4±115°、j5±180°（pymycobot の定義）。座標リミットは xyz±272mm。","back":"","key":false,"src":"DAY253"},{"id":"r122","category":"hardware","sub":"関節の上限とガード","type":"qa","front":"肩関節 j1 の指令が約90°を超えるとどうなるか？","back":"SDK の定義は+120°だが、実機では j1=90.0°までは届き、90.5°以上を1つでも含む send_angles はエラーも返さず丸ごと無視される（他の関節も動かない）。手で曲げれば90.7°まで行くので、教示角をそのまま送ると黙って止まる。FK テーブル（j1 は125°まで）の候補は j1≤88° の運用上限で絞る。","key":true,"src":"DAY173・DAY213・DAY216・DAY231・DAY244・DAY246・DAY257・DAY253"},{"id":"r123","category":"hardware","sub":"関節の上限とガード","type":"qa","front":"可動域の仮置き値で再生が弾かれたとき、どう直したか？","back":"実機はその姿勢を現に取れていたので、全関節を脱力して6軸を手で可動端まで動かし、記録の最小・最大を集計した（1662サンプル）。端ぎりぎりは届かず落ちやすいので、実測から2°内側を可動域に採った。安全装置は残したまま窓を実態に合わせた。","key":false,"src":"DAY226"},{"id":"r124","category":"hardware","sub":"関節の上限とガード","type":"qa","front":"j0 だけを振るスイープで手首が抜けたとき、「重力が逆に効く」説が誤りだったのはなぜ？","back":"j0 は鉛直軸まわりの回転なので、回しても静的な重力トルクは変わらない。見るべきは配線・摩擦・ガタ・加減速の方向依存で、主因は手首が-89°付近で保持の余裕が小さいこと。対策は速度を下げる、範囲を実用域に絞る、手首を保持しやすい角度にすること。","key":false,"src":"DAY235"},{"id":"r125","category":"hardware","sub":"関節の上限とガード","type":"point","front":"送角後の待ちは1.0秒から短くしない。0.3秒に削ると j4（手首）の未到達が7回中2回→6回中5回に増え、同じ値で止まる物理的ストール（動ききらない現象）が出た。j4 の安全範囲は-90〜+60°。","back":"","key":false,"src":"DAY268・arm_kinematics"},{"id":"r126","category":"hardware","sub":"関節の上限とガード","type":"qa","front":"降下の高さ下振れ許容を5mm→6mmに緩めるとき、外部レビューは何を警告したか？","back":"テーブル上の高さは下限より0.47mm上だが、旧接触高さから約4.5mmしか余裕がない。その姿勢付近では j1 が5°違うと高さが約21mm動くので、1°の到達ずれでも余裕を食う。FK の高さチェックだけで安全とは言えず、初回は目視を条件にした。","key":false,"src":"DAY224"},{"id":"r127","category":"hardware","sub":"関節の上限とガード","type":"qa","front":"関節差分10°超で送角を止めるガードが、正常な動きまで止めたのはなぜ？","back":"閾値を机上の定義値で決めたが、実機の正常な移動量は LIFT で18〜21°、PLACE 降下で12〜13°、戻りで44〜46°あった。未到達の13°は正常な大移動に埋もれ、差分の量では切り分けられない。「直前の降下が未到達だったか」で止める方式に変えた。未到達のまま理論姿勢から大きく送ると、ずれたまま大移動が走る。","key":false,"src":"DAY266・DAY268"},{"id":"r128","category":"hardware","sub":"関節の上限とガード","type":"qa","front":"同じ「送信前ガードで止まる」でも、ホワイトリスト漏れと残差超過では直す場所がどう違う？","back":"名前がホワイトリストに無いだけで撥ねるのはコードの欠陥なので、リストに足して直す。FK テーブル最近傍への残差（21.9mm＞閾値20mm）で止まるのはガード本来の仕事で、直すのはデータ側（穴を埋める）。PLACE の穴を埋めて最近傍は18.62mm→1.53mmになった。","key":false,"src":"DAY274"},{"id":"r129","category":"hardware","sub":"関節の上限とガード","type":"point","front":"戻り値の形を確かめてから安全判定に使う。検出関数は低スコアでも None ではなく辞書＋フラグを返し、モード有効化は失敗時に例外ではなく False を返した。None チェックだけでは誤検出が素通りする。","back":"","key":false,"src":"DAY215"},{"id":"r130","category":"hardware","sub":"関節の上限とガード","type":"point","front":"安全範囲は JSON から読まずコードに固定し、JSON は一致検証だけにする。NaN が入ると比較が全部 False になりガードをすり抜ける。Ctrl-C（KeyboardInterrupt）は Exception ではないので、例外側の後始末が通らない。","back":"","key":false,"src":"DAY297"},{"id":"r131","category":"hardware","sub":"関節の上限とガード","type":"qa","front":"試行中の Ctrl-C でアームを自動で HOME へ戻すとき、どんな制約を置いたか？","back":"グリッパーには触らない（開けば落とす）、HOME 定数への単発送角のみ、デーモン無応答なら送らない、2度目の Ctrl-C も握って記録を必ず残す。実機では生存確認がタイムアウトし、安全側に止まったが HOME へは運べなかった。","key":false,"src":"DAY283"},{"id":"r132","category":"hardware","sub":"グリッパー","type":"point","front":"Adaptive Gripper を付けると全関節0°でグリッパーが傾く。J6=-30°が水平になるホーム位置（send_angles([0,0,0,0,0,-30],20)）。","back":"","key":false,"src":"DAY123"},{"id":"r133","category":"hardware","sub":"グリッパー","type":"point","front":"pymycobot のグリッパー制御は set_gripper_state（開閉。0=開・1=閉）・set_gripper_value（0〜100の開度）・set_gripper_protection_current（1〜500）の3系統。保護電流は閉じるときの安全閾値で、握力を保つ指令ではない。","back":"","key":false,"src":"DAY259・arm_kinematics"},{"id":"r134","category":"hardware","sub":"グリッパー","type":"point","front":"グリッパー指令の戻り値 result=-1 は、物理的に開閉したかを表さない（実機では常に-1）。連続送信で2回目が動かないこともあるので2秒以上待ち、送信完了と開閉の観測は別の列に記録する。","back":"","key":false,"src":"DAY175・DAY288・DAY294・arm_kinematics"},{"id":"r135","category":"hardware","sub":"グリッパー","type":"point","front":"get_gripper_value() は0〜100で大きいほど開く（開97・空振りで閉じ切り6・ブロックを挟むと36〜38）。動作中は無効値なので整定後に読む。実開度を記録すれば、空振りと把持を写真なしで見分けられる可能性がある。","back":"当初の pymycobot にはこの関数がなく、掴み判定はカメラに一本化していた。","key":false,"src":"DAY129・DAY259・DAY325"},{"id":"r136","category":"hardware","sub":"グリッパー","type":"qa","front":"PLACE 姿勢でグリッパーが5回に1回しか開かなかったとき、どう解決したか？","back":"開こうとするが力が足りない様子で、特定の姿勢で給電が不安定になっている可能性があった。置く位置の手前の中間姿勢へ少し戻ってから開くと、毎回安定して開いた。","key":false,"src":"DAY129"},{"id":"r137","category":"hardware","sub":"グリッパー","type":"qa","front":"ブロックを掴めているのに、運ぶ途中で落とす原因は何だったか？","back":"set_gripper_state(1) で閉じた爪は「位置で止まる」だけで圧力をかけ続けない。爪のガタの隙間が残り、姿勢を変えて揺さぶるとそこから抜ける。通信の切断や手首の垂れは、測定で原因から外れた。","key":true,"src":"DAY259"},{"id":"r138","category":"hardware","sub":"グリッパー","type":"qa","front":"爪の「押し込み保持」とは何で、どの値で効いたか？","back":"set_gripper_value でブロック厚み相当（開度約36）より小さい目標を渡すと、爪は閉じ切れず押し込み力が残り続ける。力制御ではないが位置サーボの押し込みを保持力に使える。50は浅すぎて掴めず、最も強く掴んだ20を採用し、通しでも落ちなかった。","key":false,"src":"DAY261"},{"id":"r139","category":"hardware","sub":"グリッパー","type":"point","front":"押し込み保持では目標値10が20より緩く、開度値と握り強さは単純な比例ではない（原因は未確定）。押し込み中は開度値が-1で読めないので、成否判定は画像や目視に置く。","back":"","key":false,"src":"DAY261"},{"id":"r140","category":"hardware","sub":"教示と力の制御","type":"term","front":"フリーモード","back":"release_all_servos() でサーボの保持を外し、アームを手で動かせる状態。手で目標位置に合わせて get_angles() などで実測すれば、校正点や姿勢の正解値が取れる。","key":false,"src":"DAY144・DAY146"},{"id":"r141","category":"hardware","sub":"教示と力の制御","type":"qa","front":"ドラッグティーチング（手でアームを動かして教える）で release_all_servos() をどう扱うか？","back":"引数なしは damping mode（抵抗が残り完全には脱力しない）、data=1 は完全脱力。自律動作のスクリプトでは永久禁止、教示専用スクリプトに限り damping のみ許可する。必ず手で支えてから脱力し、try/finally で必ず通電を戻す。","key":false,"src":"DAY226"},{"id":"r142","category":"hardware","sub":"教示と力の制御","type":"qa","front":"教示中に位置も取るため、デーモンに脱力コマンドを足す案を採らなかったのはなぜか？","back":"デーモンは自律パイプライン全体の土台で、脱力の口を開けると全スクリプトから呼べてしまい、自律側の脱力禁止に穴が開く。必要なのは同じ配置での位置1回で、ブロックと箱を動かさなければ教示の前後どちらでも同じ値になる。順序を決めるだけで解けた。","key":false,"src":"DAY227"},{"id":"r143","category":"hardware","sub":"教示と力の制御","type":"qa","front":"PLACE 姿勢を「高さだけ30mm上げる」のに、FK テーブル計算をやめて教示し直したのはなぜか？","back":"PLACE の基準姿勢は手で教えたもので、FK テーブルの密な領域から関節角で19.65°離れていた。高さだけ上げた素直な解が無く、5軸を大きく動かす別解しか出なかった。咥えたブロックの厚み（24mm）が箱の縁に当たらない高さを見ながら教えた。","key":false,"src":"DAY235"},{"id":"r144","category":"hardware","sub":"教示と力の制御","type":"point","front":"mechArm 270 Pi は力覚センサーがなくても、get_servo_status() の電流値（負荷トルクと相関）で「触れた・押された」を間接的に検出できる。get_error_information() のコード16〜19は衝突保護。","back":"","key":false,"src":"DAY205"},{"id":"r145","category":"hardware","sub":"教示と力の制御","type":"term","front":"インピーダンス制御","back":"位置でも力でもなく「押されたらこの硬さで応答する」という位置と力の関係を制御する手法。手先に仮想の質量・ダンパ・バネを設定する。ハードに①手で押すと関節が回る（バックドライバビリティ）②トルク検出③500Hz〜1kHz の制御ループが要る。","key":false,"src":"DAY296"},{"id":"r146","category":"hardware","sub":"教示と力の制御","type":"qa","front":"アームを手で押したときの柔らかさを決めるのは、制御周期か減速比か？","back":"減速比。減速機は駆動方向ではトルクを N 倍にするが、逆方向では慣性を N の二乗倍にする。N=191 なら手先で36,481倍、10:1 なら100倍。力が双方向に通るハードなら制御はモータ側に降り、上位は遅くてよい。SO-101 も高減速比のバスサーボで mechArm と同じ部類。","key":true,"src":"DAY296"},{"id":"r147","category":"hardware","sub":"教示と力の制御","type":"point","front":"mechArm 270 Pi の get_angles() は1回最低20msかかる（ATOM ファームウェア内部の処理）。読み書き両方で40ms超、カメラ込みで実効10〜15Hz で、インピーダンス制御に要る帯域より2桁足りない。","back":"","key":false,"src":"DAY296"},{"id":"r148","category":"sim","sub":"Unityの関節モデル","type":"point","front":"Unity の ArticulationBody（関節付き物理モデル）は Stiffness=20,000／Damping=2,000 を絶対に変えず、コードからは drive.target（関節の目標角）だけを更新する。Motion=Limited は Stiffness が1e+25に化けるので使わない。","back":"","key":true,"src":"arm_kinematics"},{"id":"r149","category":"sim","sub":"Unityの関節モデル","type":"qa","front":"Unity で任意の関節角を取らせて爪先位置を読むとき、なぜ SetJointPositions だけでなく drive.target も書くのか？","back":"SetJointPositions は物理計算を通さず姿勢を瞬時に確定させるが、drive.target が古いままだと物理エンジンが元の姿勢へ戻そうとする。両方を書いて初めて姿勢が固定される。","key":false,"src":"DAY169"},{"id":"r150","category":"sim","sub":"Unityの関節モデル","type":"qa","front":"なぜ ArticulationBody 上で CCD IK が収束しなかったのか？","back":"drive.target を更新しても、関節はばね・減衰で徐々にしか動かない。CCD は更新前の古い手先位置を見て回転を足し続け、間違った方向へ力をかけ続けた。1回の回転を±5°に制限しても成功率は0のままだった。","key":false,"src":"DAY149・DAY150"},{"id":"r151","category":"sim","sub":"Unityの関節モデル","type":"point","front":"Unity は FK（関節角→手先位置）を毎フレーム正確に計算済み。endEffector.transform.position を読めばよく、FK をコードで書き直す必要はない。URDF 行列で自作した FK は軸変換ミスで失敗した。","back":"","key":true,"src":"DAY149"},{"id":"r152","category":"sim","sub":"Unityの関節モデル","type":"point","front":"複数のツインを並べて並列スキャンするときは、手先位置をワールド座標ではなくルートからの相対座標で記録する。2m間隔に並べたら ee_x=27.87m という異常値が出た。","back":"","key":false,"src":"DAY150"},{"id":"r153","category":"sim","sub":"URDF取り込みとグリッパー","type":"qa","front":"グリッパーの URDF を Unity に取り込んだとき、何が問題になった？","back":"URDF Importer は ROS の package:// パスを解決できず、メッシュのパスをファイル名だけに書き換えた。取り込みで付く ArticulationBody と関節スクリプトが勝手に動いてグリッパーが暴走したので全部削除し、開閉は自作スクリプトで6パーツを連動させた（URDF の mimic joint に相当）。","key":false,"src":"DAY134"},{"id":"r154","category":"sim","sub":"URDF取り込みとグリッパー","type":"qa","front":"再生時にグリッパーが約30°傾いたのはなぜ？","back":"link6 の取り付け座標系の違いで、CSV 読込時に J6 へ+30°を足して補正していた（MotionLogPlayer.cs）。新しい再生スクリプトにその加算がなく、また傾いた。同じ CSV を読むスクリプトは角度の定義をそろえる。","key":false,"src":"DAY134・DAY152"},{"id":"r155","category":"sim","sub":"URDF取り込みとグリッパー","type":"point","front":"Unity の爪先 Brep はグリッパ指の子なので開閉に連動して動き、爪先中点は開閉で約14mm移動する。FK スキャン時と実機 PICK 時の開閉状態がずれると、それ自体が誤差になる。","back":"","key":false,"src":"DAY168"},{"id":"r156","category":"sim","sub":"URDF取り込みとグリッパー","type":"qa","front":"Unity のシミュレーションで「掴む」動作はどう作った？","back":"摩擦は使わずコードで代用した。閉じたらブロックを EndEffector の子にし（Rigidbody はキネマティック＝物理演算の影響を受けない状態）、アームと一緒に動かす。開いたら子から外して重力を有効にし、ブロックを箱へ自然に落とす。","key":false,"src":"DAY137"},{"id":"r157","category":"sim","sub":"URDF取り込みとグリッパー","type":"point","front":"Rigidbody（剛体の物理部品）だけではブロックは床を突き抜ける。床・ブロック・箱の壁5枚それぞれに BoxCollider（衝突判定）が要る。","back":"","key":false,"src":"DAY137"},{"id":"r158","category":"sim","sub":"実機とツインの往復","type":"point","front":"Unity と実機をつなぐ橋は関節角6軸だけ。Unity には配置誤差・関節遅れ・指先の3D座標があり、実機には把持状態・カメラ判定・摩擦や個体差がある。両者の「成功」の定義は別物で、翻訳が要る。","back":"","key":false,"src":"DAY131"},{"id":"r159","category":"sim","sub":"実機とツインの往復","type":"point","front":"実機の関節角 CSV を Unity で再生すると、同じ Pick&Place がツイン上で再現できた。Unity→実機と実機→Unity の両方向がつながった。","back":"","key":false,"src":"DAY132・DAY137"},{"id":"r160","category":"sim","sub":"実機とツインの往復","type":"qa","front":"実機ログを実機と同じ時間で Unity 上に再生するには？","back":"固定間隔（1.5秒）だとポーズ間が瞬間移動して速すぎた。CSV のタイムスタンプの差をその区間の所要時間とし、線形補間で角度を移す。実機で49秒の動作が Unity でも49秒で再生された。","key":false,"src":"DAY133"},{"id":"r161","category":"sim","sub":"実機とツインの往復","type":"qa","front":"モーションの補間を、なぜ Unity 側ではなく Mac 側で CSV に展開したのか？","back":"Unity の中で補間しても実機には反映されない。8点の実機記録を Mac で81点の CSV に補間し、Unity と実機（send_angles）の両方に同じデータを渡せば、シミュで確認した動きがそのまま実機に乗る。","key":false,"src":"DAY152"},{"id":"r162","category":"sim","sub":"FKテーブルはツインで作る","type":"qa","front":"なぜ FK テーブルを ikpy などの一般的な運動学ライブラリで作れないのか？","back":"テーブルの爪先座標は、Unity ツイン内でグリッパー先端の形状（Brep）が実際に来た位置だから。ライブラリはグリッパー形状もツインの物理も持たず、同じ関節角でも300mm以上ずれた。点を足すには Unity の FKScanner を再実行するしかない。","key":true,"src":"DAY222・DAY252・DAY281・arm_kinematics"},{"id":"r163","category":"sim","sub":"FKテーブルはツインで作る","type":"qa","front":"白箱まで76mm届かないスキャン結果を「リーチ限界」と判断しなかったのはなぜ？","back":"グリッパー分を含めればもっと遠くに届くから。原因はスキャンで試した姿勢の範囲が狭いことだった。Play モードで関節角を手入力し、j0=55°・j5=0°でグリッパーが白箱の真上に水平に来ることを確かめ、そこをスキャンの起点にした。","key":false,"src":"DAY156"},{"id":"r164","category":"sim","sub":"FKテーブルはツインで作る","type":"qa","front":"FKScanner で22点をスキャンすると、出力が保存されなかったのはなぜ？","back":"保存は20体のロボット全員の完了で走る作り。22点を20体に配ると1体2点で11体しか起動せず、完了数が20に届かない。点数を20の倍数にして解決した。闇雲な再実行では分からず、コードを読んで見えた。","key":false,"src":"DAY254"},{"id":"r165","category":"sim","sub":"ツインと実機のずれ","type":"qa","front":"固定角度では表に出なかった Unity FK と実機のずれが、動的 lookup で初めて露呈したのはなぜ？","back":"固定角度は実機で手調整した値を直接送るので、Unity FK の精度に依存しない。動的 lookup にした瞬間「Unity FK を信じる」段階に入る。目標高さを-40mm下げても実機の爪は下がらなかった。原因候補は URDF のリンク長と実寸の差、関節軸の向き、原点のオフセット。","key":false,"src":"DAY177"},{"id":"r166","category":"sim","sub":"ツインと実機のずれ","type":"qa","front":"FK テーブルから引いた姿勢が、実機で送れないことがあるのはなぜ？","back":"テーブルはツイン上で成立する姿勢の集合で、実機コントローラが受理するかは考慮していない。肩関節が110°や118°の姿勢も出てくる。テーブル上の成立と実機での送信可否は別の層。","key":false,"src":"DAY232"},{"id":"r167","category":"sim","sub":"ツインと実機のずれ","type":"qa","front":"j0 を+1°動かしたときの爪先 x の変化を、実機とツインで比べると？","back":"実機は-6.63mm/°、FK テーブルからは約-4.2mm/°で、符号は一致し大きさは約36%違った。校正した姿勢が違い、ヤコビアン（関節角の変化と先端位置の変化の比）が違うため。ツインは向きは合うが値は一致しない物差し。","key":false,"src":"DAY250"},{"id":"r168","category":"sim","sub":"ツインと実機のずれ","type":"point","front":"ツインは指令どおり誤差なく動くので差分が出ない。実機はたわみ・ガタ・校正のずれで先端がずれ、そのずれこそ現実で動かすのに要る情報。実機データの収集が重視される理由もここにある。","back":"","key":false,"src":"DAY250"},{"id":"r169","category":"sim","sub":"ツインと実機のずれ","type":"qa","front":"Sim-to-Real ギャップと Sim-to-Human ギャップはどう関係する？","back":"前者はシミュと実機の動きの差、後者は実機の動きとそれを見た人が受け取る感覚の差。後者は前者に依存する。シミュで「丁寧な接近」を設計しても実機では重力で軌道が数cm崩れ、その数cmが印象を変える。","key":false,"src":"DAY212"},{"id":"r170","category":"sim","sub":"ROS2とMoveIt","type":"qa","front":"ROS2 はいつ必要になるか？","back":"ROS2 の実態は「複数のプロセスをつなぐ通信基盤」で、制御ソフトそのものではない。順番に処理する設計なら不要。動く物を追いながら掴む・力を感じて止まる・複数ロボットや既製センサーを統合する・業界の人と共同実装するときに要る。双腕では衝突回避と協調制御のため MoveIt2 がほぼ必須。","key":false,"src":"DAY131・DAY205"},{"id":"r171","category":"sim","sub":"ROS2とMoveIt","type":"term","front":"MoveIt","back":"ROS2 上のアーム制御の標準部品。IK・軌道計画・衝突回避・実行制御を自動で行う。手作りしてきた FK テーブル探索・j0 ロック・j4 安全範囲・姿勢選択は、MoveIt では完成部品として存在する領域にあたる。","key":false,"src":"DAY284"},{"id":"r172","category":"sim","sub":"ツインの別の使い方","type":"qa","front":"R2R2R（実演動画1本から学習データを作る手法）はなぜ物理演算を使わない？その代償は？","back":"物体は掴まれている間は手先にぴったり付いて動くものとし、摩擦や衝突は計算しない。シミュレーターは画像を描く道具として使うだけ。そのため押す・倒す・滑らせる操作や柔らかい物は扱えず、生成した動きは障害物も避けない。","key":false,"src":"研究メモ:R2R2R（実演動画1本から学習データ生成）"},{"id":"r173","category":"sim","sub":"ツインの別の使い方","type":"point","front":"R2R2R はデジタルツインを「学習用の画像と関節角のペアを大量に作る工場」として使う。Pixels to Motors の Unity ツインは今のところ FK テーブルを作る用途。","back":"","key":false,"src":"研究メモ:R2R2R（実演動画1本から学習データ生成）"},{"id":"r174","category":"sim","sub":"ツインの別の使い方","type":"qa","front":"病院オペレーションのデジタルツインは何をシミュレーションするか？","back":"機体の物理ではなく、病院を「タスクが発生し、人という資源がそれを消費する系」として扱う。ロボットをもう一種の資源として入れ、肩代わりした搬送の差分を時間・距離・コストに変換して見せる。実データが取れないので、前提をユーザーが置く探索ツールにした。","key":false,"src":"DAY267"},{"id":"r175","category":"vision","sub":"カメラの取り込み","type":"point","front":"カメラは接続順で変わる番号ではなく固有名で同定する。macOSのOpenCVの番号は起動順・接続台数・iPhoneのスリープ復帰で入れ替わる。","back":"当初は爪の色シールの映り方で判定したが、DAY217で表示名から番号を引く共通モジュールに一本化（iPhone=上、Iriun=横、FaceTimeは除外）。Raspberry Piでは /dev/v4l/by-id で引き、挿す前後のデバイス一覧の差分で確定する。","key":true,"src":"DAY196・DAY209・DAY217・DAY295"},{"id":"r176","category":"vision","sub":"カメラの取り込み","type":"qa","front":"iPhoneをOpenCVのカメラにするとき、Iriun WebcamとContinuity Cameraをどう使い分けた？","back":"macOS SonomaではOpenCVからContinuity Cameraを開くと非推奨警告が出て解決しない環境があり、仮想カメラとして見えるIriunを使った。ただしIriun単体では2台のiPhoneを独立に出せないため、2カメラ構成ではContinuity Cameraを併用した。","key":false,"src":"DAY125・DAY192"},{"id":"r177","category":"vision","sub":"カメラの取り込み","type":"point","front":"Iriunは開き直すたびにiPhoneの自動露出が初期化され、暗いフレームのままHSVの明度下限を割って検出に失敗した。暖機を30→120フレームにし、release後0.5秒待つと安定した。","back":"","key":false,"src":"DAY196・DAY197"},{"id":"r178","category":"vision","sub":"カメラの取り込み","type":"point","front":"Iriun経由のiPhoneは指定fpsを無視し、実効fpsはread()の返る速さで決まる（720p/avc1で約27fps）。mp4に書くfpsは当てにならず、フレームごとの取得時刻が正。","back":"p95で約94msの抜けがあるため、学習用のリサンプルは10Hzが安全。","key":false,"src":"DAY287"},{"id":"r179","category":"vision","sub":"色で見分ける","type":"qa","front":"ブロックの有無判定を、輝度ではなく赤色検出にしたのはなぜ？","back":"黒いマットの上ではブロックの有無で輝度差がほぼゼロだった。HSV（色相・彩度・明度）で、ROI（処理対象の領域）内の赤画素の割合を測り、5%以上を「あり」とした。なしは0.0%、ありは17.2%で明確に分かれた。","key":false,"src":"DAY129"},{"id":"r180","category":"vision","sub":"色で見分ける","type":"point","front":"mechArmの赤ブロックはHSVの2範囲 [0,100,100]-[10,255,255] と [160,100,100]-[180,255,255] で検出する。赤は色相の0度をまたぐので2範囲に分ける。","back":"検出ノイズは全項目で標準偏差0.2mm未満（DAY184の実測）。","key":false,"src":"arm_kinematics・DAY184"},{"id":"r181","category":"vision","sub":"色で見分ける","type":"point","front":"HSVが守るのは明るさの変化だけ。照明を明暗させても色相は0.1〜3.5度しか動かないが、光の色（色温度）を変えると赤は4〜6度、青は26度、暗い青の面は155度動いた。","back":"","key":true,"src":"DAY300"},{"id":"r182","category":"vision","sub":"色で見分ける","type":"qa","front":"色相の平均を取るとき、単純平均ではなく円平均を使うのはなぜ？","back":"色相は角度なので、0度と359度を単純平均すると180度（真逆の色）になる。赤は0度付近で画素が両側に散るため単純平均は必ず壊れる。各画素を単位ベクトルにして平均し、角度に戻す。","key":false,"src":"DAY300"},{"id":"r183","category":"vision","sub":"色で見分ける","type":"qa","front":"白色光の基準写真でも、彩度と明度では赤と赤以外を分けられなかったのはなぜ？","back":"同じブロックでも光を強く受ける上面は白っぽく浅い赤、側面は濃い赤で、彩度・明度の幅が大きい。青の上面も明るく彩度が落ちるので両者が重なる。色相だけは赤3.7度・青206度付近できれいに離れていた。","key":false,"src":"DAY301"},{"id":"r184","category":"vision","sub":"色で見分ける","type":"qa","front":"オレンジ寄りの光で青ブロックの色が壊れたとき、早く効く直し方は？","back":"色相の幅を広げるより、彩度に下限を置く。青の面は色相が意味を失う前に彩度が0.512→0.285へ落ちていた。青に耐えるまで色相幅を広げると色相環の大半を飲み込み、見分ける道具として機能しなくなる。","key":false,"src":"DAY300"},{"id":"r185","category":"vision","sub":"色で見分ける","type":"qa","front":"RGBの閾値とHSVの閾値は、光の変化に対してどう違う壊れ方をする？","back":"逆の壊れ方をする。明るさが変わると、HSVの赤検出が色抜けした青の上面をほぼ全画素「赤」と判定した。光がオレンジになると、RGBの赤検出は画面の96.3%を赤とし、HSVは0.8%で耐えた。どちらかを選べば安全という話ではない。","key":false,"src":"DAY301"},{"id":"r186","category":"vision","sub":"色で見分ける","type":"qa","front":"閾値を決めるとき、本番と同じ取得経路のフレームを使うのはなぜ？","back":"経路で画像処理が変わるから。iPhoneのカメラアプリのJPEGでは赤の彩度が落ちて同じ設定で塊が3つに割れたが、OpenCVで読んだフレームでは割れなかった。Continuity Cameraの自動ホワイトバランスは、オレンジ光への切り替えを約1.6秒で89%打ち消していた。","key":true,"src":"DAY302"},{"id":"r187","category":"vision","sub":"色で見分ける","type":"point","front":"人の肌とクリーム色の壁は色相がほぼ重なる（10〜15と16〜20）が、彩度は肌84〜110・壁24〜42と2〜4倍違う。手は色相ではなく彩度で切り分ける。","back":"背景差分は人の影と手が1つの塊になるため単独では使わない。","key":false,"src":"DAY297"},{"id":"r188","category":"vision","sub":"色で見分ける","type":"term","front":"ドメインシフト（分布シフト）","back":"学習時と使用時で画像の性質（照明・カメラ・背景・季節）が違うこと。光の色を変えただけで青の色相が155度動いた現象や、白色光で合わせた赤検出がオレンジ光で画面の96%を拾った現象が実例。学習ベースでも消えず、壊れた理由が見えにくくなる。","key":false,"src":"DAY313"},{"id":"r189","category":"vision","sub":"形と輪郭","type":"term","front":"モルフォロジー処理（open→close）","back":"open（収縮→膨張）で小さなノイズを消し、close（膨張→収縮）で穴を埋める。逆順だとノイズを膨らませてから穴埋めし、誤検出が増える。open後に残るのはカーネル（型紙）がすっぽり収まる場所だけで、結果は近似でなく厳密に予測できる。","key":false,"src":"DAY196・DAY302"},{"id":"r190","category":"vision","sub":"形と輪郭","type":"qa","front":"モルフォロジー演算のカーネルサイズは何を決めている？","back":"精度ではなく距離で、「どれだけ離れた破片まで本体とみなすか」を決める（9画素では届かず11画素で届いた）。だから解像度が変わると同じ数字が別の意味になる。4032幅で決めた値は、画像幅に比例させて引き直す。","key":false,"src":"DAY302"},{"id":"r191","category":"vision","sub":"形と輪郭","type":"qa","front":"閾値処理の失敗はモルフォロジー演算で直せる？","back":"直せない。拾いすぎた領域（雑な閾値で画面の96%が白）も、拾えなかった領域（オレンジ光での青の側面）も、粒や穴ではないので対象外。31×31のカーネルでも0.04ポイントしか動かなかった（オレンジ光のRGB式では0.01ポイント）。直せるのは縁のギザギザ・小さい粒・小さい穴だけ。","key":false,"src":"DAY302"},{"id":"r192","category":"vision","sub":"形と輪郭","type":"qa","front":"マット4隅の検出が0/10から10/10になった変更は？","back":"黒っぽいアームが二値化でマットとつながり、輪郭が内側にえぐれて4頂点に近似できなかった。最大輪郭にconvexHull（凸包）をかけてからapproxPolyDPで近似すると、えぐれが消えてマットの長方形が残った。","key":false,"src":"DAY164"},{"id":"r193","category":"vision","sub":"形と輪郭","type":"qa","front":"青シール3点をY座標の順で手首と爪先に割り当てると何が起きた？","back":"姿勢によって2点のY座標が拮抗し、フレームごとに順序が入れ替わって取り違えた。爪先2点は姿勢に関係なく物理的に近いので、3点のうち最短辺の両端を爪先とする幾何学的な割り当てに変えると、TIP（爪先中点）のばらつきは19.42mm→0.08mmになった。","key":false,"src":"DAY168・DAY184"},{"id":"r194","category":"vision","sub":"形と輪郭","type":"qa","front":"横カメラのTIP（爪先の基準点）を「緑シール2点の中点」に定義し直したのはなぜ？","back":"青（爪上面）と緑の中点では爪の上下中央になり、実際に掴む高さと約30px（Z換算で約5〜8mm）ずれた。緑シールは掴み高さに貼ってある。検出が正しくても、基準点の定義が物理的な掴み位置とずれていれば誤差になる。","key":false,"src":"DAY196"},{"id":"r195","category":"vision","sub":"形と輪郭","type":"term","front":"minAreaRect","back":"回転を許す最小外接矩形（OpenCV）。軸に平行なboundingRectは紙を43度回すと面積が1.75倍（細長い長方形で2.27倍）に膨らむが、minAreaRectは0.3%しか動かない。縦横比を max(w,h)/min(w,h) で取れば、斜めの正方形も1前後で安定する。","key":false,"src":"DAY280・DAY304"},{"id":"r196","category":"vision","sub":"形と輪郭","type":"qa","front":"画素画像で完全な円を測っても円形度が約0.898で頭打ちになるのはなぜ？","back":"周囲長を縦横1・斜め√2の階段で足すため、曲線では約5.5%長く出て、2乗で割る円形度は0.8988に落ち着く。解像度を13倍にしても1.0に近づかない原理的な上限で、円形度は「輪郭が画素の格子に沿っているか」を測っている。","key":false,"src":"DAY304"},{"id":"r197","category":"vision","sub":"形と輪郭","type":"qa","front":"小さい対象で面積が足りなくなる原因は画素の粗さ？","back":"カメラのボケ。生成画像では最小の5.5mm円でも面積が99.6%残ったが、カメラ画像では60.7%だった。レンズのボケが縁を閾値の下へ押し下げる。解像度を上げても直らず、対象を大きく写せば直る。","key":false,"src":"DAY304"},{"id":"r198","category":"vision","sub":"ピクセルからmmへ","type":"term","front":"ホモグラフィ（射影変換）","back":"平面と平面の対応を表す3×3の行列。4組の対応点で決まり（cv2.findHomography）、カメラ画像のピクセルをマット上のmmへ写す。傾いた平面では手前と奥で1mmあたりの画素数が変わるため、単一の換算率（px/mm）では足りない。","key":false,"src":"DAY139・DAY178・DAY310"},{"id":"r199","category":"vision","sub":"ピクセルからmmへ","type":"qa","front":"斜めから撮った台形の紙を長方形に戻すのに、アフィン変換ではなく射影変換が要るのはなぜ？","back":"アフィン変換（2×3行列・対応点3点）は平行線を平行に保つので、遠近で上辺と下辺の長さが違う台形を戻せない。実測では射影変換が全傾きで20/20図形を正しく置いたのに対し、アフィンは20→20→15→5と崩れ、最大傾きで面積誤差42.71%だった。","key":false,"src":"DAY310"},{"id":"r200","category":"vision","sub":"ピクセルからmmへ","type":"qa","front":"ホモグラフィ校正で、カメラを真上に固定したのはなぜ？","back":"ホモグラフィは平面→平面の変換が前提。斜めだと遠近の歪みで奥と手前の誤差の大きさが変わる。真上ならほぼ歪みがなく、全域で誤差が均一になる。","key":false,"src":"DAY139"},{"id":"r201","category":"vision","sub":"ピクセルからmmへ","type":"point","front":"校正の基準点の条件は「実世界座標が既知・等間隔・見やすい」。マットの5mm格子が3つとも満たした。座標の原点はロボットベースに置く（マット左上原点では作業位置が範囲外になった）。","back":"","key":false,"src":"DAY139"},{"id":"r202","category":"vision","sub":"ピクセルからmmへ","type":"qa","front":"マット4隅を毎フレーム検出してホモグラフィを作り直す方式が「半歩の解決」だったのはなぜ？","back":"カメラのぶれには効き、固定行列よりマット目盛りとよく一致した。だが4隅に対応するロボット座標はハードコードのままなので、マットとロボットの位置関係がずれる問題には効かない。ロボットを触ればマットは動く。","key":false,"src":"DAY160・DAY178"},{"id":"r203","category":"vision","sub":"ピクセルからmmへ","type":"qa","front":"座標変換を、検出と表示・爪先とブロックで同じ行列（同じ関数）にそろえるのはなぜ？","back":"別々のホモグラフィを混ぜると、ずれは検出ではなく変換の違いが生む人工物になる。表示マーカーが実物の青シールからずれた件は、2つの行列を合成して入力→出力を1本にすると一致した。爪先とブロックも同じpixel_to_unityで変換すれば、変換誤差が差分の中で相殺される。","key":false,"src":"DAY178・DAY179・DAY243"},{"id":"r204","category":"vision","sub":"ピクセルからmmへ","type":"qa","front":"特徴点マッチングの比率テスト通過数や、RANSAC（外れ値に強い変換推定）のinlier率は、正しさを示す？","back":"示さない。本を退けてマットだけを撮った写真（同じ物が写っていない）とも934件が比率テストを通り、うち92.8%がinlierで、全14組で最高値だった。正しさは手動で打った四隅など、マッチングと無関係の経路で作った正解で測る。","key":true,"src":"DAY309"},{"id":"r205","category":"vision","sub":"ピクセルからmmへ","type":"qa","front":"本を45度傾けたとき、RANSACがほぼ恒等変換を返して破綻したのはなぜ？","back":"画像に、動いていないマット面と動いた表紙面の2つの平面が写っていたから。RANSACは「本らしい方」ではなく合意が最大のモデルを選ぶので、表紙側の対応が減るとマット側の恒等変換が採用された。兆候は推定行列が恒等に近いことに出る。","key":false,"src":"DAY309"},{"id":"r206","category":"vision","sub":"ピクセルからmmへ","type":"qa","front":"傾きを大きくしても面積誤差率が13〜15%で横ばいだったのはなぜ？","back":"主因が傾きではなく測り方にあったから。色で切り分けると印刷の赤の薄い縁が落ち、輪郭が大きさによらず0.41〜0.48mmの一定幅で内側に削れていた。傾きの影響は平均ではなく、削れ幅のばらつき（標準偏差0.169→0.310）として出た。","key":false,"src":"DAY310"},{"id":"r207","category":"vision","sub":"視差・奥行き・カメラ配置","type":"qa","front":"床面基準のホモグラフィで、床から浮いた爪先の位置を測ると何が起きる？","back":"視差で、見かけの位置がカメラから遠い側（外側）にずれる（高度111mmでマット端+0.310mを超える+0.346mと出た）。追従ループはこの値を現在位置として動くので、上カメラだけでは嘘の差分へ向かう。ずれは系統的で工程内では一貫するが、高さの違う工程をまたいで位置を混ぜると事故になる。","key":true,"src":"DAY196・DAY230"},{"id":"r208","category":"vision","sub":"視差・奥行き・カメラ配置","type":"qa","front":"降下後にTIPのXが61.4mmずれて見えたのはなぜ？","back":"上カメラが真上ではなく少し斜めから撮っているため、アームの高さが変わると画面上の位置が視差でずれる。送/着の関節角ずれは1°前後で、アームは命令通り動いていた。当初は運動学のずれと見たが、撮影系の幾何（視差）でずれて見えただけの可能性が高いと見直し、横カメラ導入へ進んだ。","key":false,"src":"DAY190・DAY191"},{"id":"r209","category":"vision","sub":"視差・奥行き・カメラ配置","type":"point","front":"2カメラの分担：上カメラはX（左右）とZ（奥行き）、横カメラはY（高さ）とZ。上カメラには爪がブロック上面に乗る高さのずれが見えない。Zは両方で取り、大きく食い違えばどちらかの校正異常と分かる。","back":"","key":false,"src":"DAY192・DAY266"},{"id":"r210","category":"vision","sub":"視差・奥行き・カメラ配置","type":"qa","front":"横カメラはどこに、どう置くべきか？","back":"マット手前側に、水平な視線で、レンズ高さをマット面付近にして置く。視線をアームの動作平面と平行にしないと視差が乗る。手前からならグリッパが常に最前列に来て肩や肘に隠れず、上カメラの視野にも入らない。","key":false,"src":"DAY192"},{"id":"r211","category":"vision","sub":"視差・奥行き・カメラ配置","type":"qa","front":"横カメラの外部パラメータ（位置・向き）を、チェスボードなしでどう校正するか？","back":"アーム自体を校正装置にする。FKスキャンの既知姿勢へ動かし、各姿勢のTIPの3D位置（既知）と横カメラ上のピクセル位置の対応を数十〜数百点集め、多項式回帰やホモグラフィで変換式を作る。レンズ歪み（内部パラメータ）は精度不足が判明してから取る。","key":false,"src":"DAY192"},{"id":"r212","category":"vision","sub":"視差・奥行き・カメラ配置","type":"qa","front":"横カメラ1台だけでは人の手の高さが出せないのはなぜ？どう補う？","back":"カメラが1点について与えるのは光線1本ぶんで、画像の縦位置は高さと奥行きの両方で動くから。上カメラで手の水平位置を決めて奥行きを確定させれば、横カメラの縦位置が高さに確定する。直交する2視点で足りる。","key":false,"src":"DAY297"},{"id":"r213","category":"vision","sub":"視差・奥行き・カメラ配置","type":"qa","front":"単眼カメラで奥行きを測りにくいのはなぜ？解決策は？","back":"2D画像1枚では奥行きの情報が物理的に足りず、AIが確率的に補うのでぶれる。高速動作や自己遮蔽でさらに悪化する。解決策は深度センサー、複数カメラの三角測量、単眼深度推定モデル（Depth Anything V2など、精度は限定的）の3系統。","key":false,"src":"DAY118"},{"id":"r214","category":"vision","sub":"視差・奥行き・カメラ配置","type":"qa","front":"ロボットが物を掴むのに、相対深度ではなく絶対深度（メトリック深度）が要るのはなぜ？","back":"相対深度は「AはBより手前」という順序しか分からず、指先をどこまで動かすか決められない。絶対深度は「320mm」という長さを返す。単眼推定で絶対深度を信じるには、焦点距離・主点・レンズ歪みを実測するカメラキャリブレーションが要る。","key":false,"src":"DAY313"},{"id":"r215","category":"vision","sub":"視差・奥行き・カメラ配置","type":"term","front":"深度カメラの3方式","back":"ステレオ（2つのカメラの視差）、ToF（赤外線パルスの往復時間）、構造化光（既知パターンを投影して歪みを見る）。RealSense D435はステレオ＋赤外線ドット、iPhoneのLiDARはToF、Face IDは構造化光。","key":false,"src":"DAY166"},{"id":"r216","category":"vision","sub":"視差・奥行き・カメラ配置","type":"qa","front":"上からのカメラだけでは足りなくなる場面と、その構成は？","back":"棚の中・箱の中・物の重なりなど遮蔽があると、上カメラでは原理的に見えない。上カメラで全体を粗く探し、手首のカメラで最後の数十mmを精密に合わせる。業界標準も環境固定のEye-to-handと手首装着のEye-in-handの2台構成。","key":false,"src":"DAY159・DAY166"},{"id":"r217","category":"vision","sub":"視差・奥行き・カメラ配置","type":"point","front":"手首カメラは深度なしの広角RGBが多い。理由は重量・サイズ、近距離で深度精度が落ちること（RealSenseは最短30cm）、配線、視野角。mechArm 270の可搬重量では重い深度カメラは載せにくい。","back":"","key":false,"src":"DAY166"},{"id":"r218","category":"vision","sub":"視差・奥行き・カメラ配置","type":"term","front":"能動視覚（Next-Best-View）","back":"見えないならカメラを動かして見える位置へ行く考え方。次にどこから見ると情報が最も増えるかを計算してアームやカメラを動かす。遮蔽への対策で、画像処理ではなく動きの設計の話。視点を変えてバナナの検出信頼度が0.30→0.62に上がった報告がある。","key":false,"src":"DAY313"},{"id":"r219","category":"vision","sub":"白箱の検出","type":"qa","front":"白箱を色（HSVの白マスク）だけで検出できなかったのはなぜ？","back":"マット外の机もロボットの筐体も白く、色だけでは区別できず、四角形の形フィルタでもロボット本体を拾った。そこでテンプレートマッチングに替え、探索をマット範囲に限定した。横カメラでも白マスクはアームと連結するため、白箱の位置は上カメラに任せた。","key":false,"src":"DAY154・DAY165・DAY209"},{"id":"r220","category":"vision","sub":"白箱の検出","type":"term","front":"テンプレートマッチング","back":"参照画像を入力画像の上で滑らせ、各位置の類似度で最も一致する場所を探す手法（cv2.matchTemplate）。正規化相関係数で、複数スケール（0.7〜1.3倍）を試し、スコアの閾値で採否を決めた。","key":false,"src":"DAY154"},{"id":"r221","category":"vision","sub":"白箱の検出","type":"qa","front":"テンプレートマッチングのスコアが落ちたとき、まず何を疑う？","back":"方式ではなくテンプレートの鮮度。テンプレートは撮影時の照明・カメラ位置・マット位置に依存する。マット移動前の古いテンプレでスコア0.547だったのが、現環境で12枚撮り直すと0.994になった。旧テンプレがアームのリンクを0.735で誤検出した例もある。","key":false,"src":"DAY165・DAY211"},{"id":"r222","category":"vision","sub":"白箱の検出","type":"point","front":"テンプレートマッチングの計算量はチャネル数に比例する。白箱のような無彩色の対象はグレースケールにしても情報損失がほぼなく、評価時間が14.48秒→5.09秒になり、精度も上がった。","back":"","key":false,"src":"DAY211"},{"id":"r223","category":"vision","sub":"白箱の検出","type":"qa","front":"テンプレートがアーム胴体を白箱と誤検出したとき、なぜしきい値を緩めず検出範囲を絞った？","back":"真上からは白箱も胴体も白〜グレーの四角で、同じスコアで拾われるのが問題だったから。緩めれば胴体をますます拾う。胴体が写る画面中央上の矩形を候補から外した。白箱を巻き込んでも送信前に止まる安全側の手当て。","key":false,"src":"DAY224"},{"id":"r224","category":"vision","sub":"白箱の検出","type":"qa","front":"テンプレートマッチングで出した「白箱の中心」が最大41mmずれていたのはなぜ？どう直した？","back":"matchTemplateはマッチ矩形の左上を返し、テンプレ幅・高さの半分を足して箱中心とみなしていただけで、箱の構造を見ていなかった。テンプレのサイズ・回転・スケールで当たり方が系統的にずれる。白マスク＋正方形＋四角＋4頂点で箱の輪郭を取り（斜め置きはminAreaRectで判定）、その中心を使い、テンプレは粗位置と保険に回した。","key":true,"src":"DAY280"},{"id":"r225","category":"vision","sub":"学習ベースと評価指標","type":"qa","front":"画像認識で「分類・検出・セグメンテーション・姿勢推定」を最初に区別するのはなぜ？","back":"モデルより先に、用意すべき正解データの形が変わるから。分類は画像に1ラベル、検出は複数の枠、セグメンテーションは画素単位の塗り、姿勢推定は点。作業量が桁で変わり、決めずに進むと集めたデータが使えないと後で気づく。","key":false,"src":"DAY298"},{"id":"r226","category":"vision","sub":"学習ベースと評価指標","type":"qa","front":"古典的な画像処理（人が手続きを書く）と学習ベースはどう使い分ける？","back":"背景が固定で対象の色が決まっている台の上なら、古典的手法のほうが速く安定し、動作も説明できる。対象が増える・照明が変わる・条件の書き直しが追いつかなくなった時点が、学習ベース（正解付きデータから条件を自動で決める）へ移る理由になる。","key":false,"src":"DAY298"},{"id":"r227","category":"vision","sub":"学習ベースと評価指標","type":"qa","front":"評価指標（IoU・Precision・Recall）を、学習ベースに入る前に学ぶのはなぜ？","back":"物差しなしでモデルを触ると「なんとなく良くなった」という感想になるから。IoU（予測枠と正解枠の重なり率）は古典的手法の出力にも計算できるので、先に物差しを持てば今の手法の性能も数字で言え、学習ベースとの比較が成立する。","key":true,"src":"DAY298"},{"id":"r228","category":"vision","sub":"学習ベースと評価指標","type":"point","front":"生成画像は描いた図形の座標がそのまま正解の枠になるので、アノテーション（正解付け）なしでIoUが出せる。生成画像で理屈を確かめ、自前撮影で現実に何が壊れるかを見る。","back":"","key":false,"src":"DAY298"},{"id":"r229","category":"vision","sub":"学習ベースと評価指標","type":"qa","front":"mAP@50・mAP@75・mAP@50:95はどう違い、何が読める？","back":"枠が正解と半分以上重なれば当たり（@50）、4分の3以上で当たり（@75）、基準を50〜95%まで動かして平均（@50:95）。同じ出力でも基準を厳しくするとGPT-6 Astraは82.1%→59.1%に下がる。落ち幅で「だいたいの場所が分かる」と「枠が正確」を分けて測れる。","key":false,"src":"DAY317"},{"id":"r230","category":"vision","sub":"学習ベースと評価指標","type":"point","front":"言葉で物を切り出すSAM 3は、物の名前（can・bottle）と色（clear）では絞り込めたが、素材（plastic・glass）と状態（crushed）では絞り込めなかった。","back":"透明なガラス瓶とペットボトルは、どちらの言葉でも同じ4本が選ばれた。","key":false,"src":"DAY317"},{"id":"r231","category":"vision","sub":"学習ベースと評価指標","type":"qa","front":"汎用VLM（画像を見て言葉で答えるモデル）は、ロボットのどこに組み込むのが合う？","back":"1枚に8〜30秒かかり課金もされるので、カメラを見ながら少しずつ動かす視覚サーボの繰り返しには入れられない（YOLO26は数ミリ秒）。PICK・PLACEの成否判定のように、1試行に1回だけ呼ぶ位置が合う。","key":false,"src":"DAY317"},{"id":"r232","category":"servo","sub":"PICK/PLACEの基本","type":"qa","front":"画像認識が正しくても、機械が狙った場所に行かないのはなぜ？","back":"難しいのは認識より、ピクセル位置を現実のmmに変えて機械に渡す間の部分だから。キャリブレーションのずれ、単眼で奥行きが分からないこと、検出の1コマごとの揺れ（そのまま渡すと機械が震える）、撮影から動作までの時間差、モーターや歯車のガタ、残りの誤認識が段ごとに積み重なる。","key":true,"src":"DAY315"},{"id":"r233","category":"servo","sub":"PICK/PLACEの基本","type":"point","front":"PICKは「上空で構える→真下へ降りる」。APPROACH_PICKを上空の爪先高さ帯（100〜125mm）でFKテーブルから引き、DESCENDはそのj0の±3°以内に拘束して、j0を変えずに降ろす。","back":"DAY184版は降下後にj0だけ視覚サーボで寄せていた。DAY275では、approachとdescendでj0を引き直して降下中に9度横へ振れていたのを±3°拘束で抑えた（dry-runで全セル|Δj0|≤3°）。あわせて、ブロック未検出のまま収束を偽装していたj0視覚サーボを本線から外した。DAY175でも、構えと掴みでj0・j1・j3をそろえると爪の向きを保ったまま降りると確かめていた。","key":false,"src":"DAY175・DAY184・DAY275"},{"id":"r234","category":"servo","sub":"PICK/PLACEの基本","type":"point","front":"PICK姿勢の正解は「開いた爪先の中点がブロック中心と一致」ではなく「閉じたときに爪がブロックを挟める姿勢」。開→閉で中点が動く分を見込んで、開状態の位置を決める。","back":"","key":false,"src":"DAY169"},{"id":"r235","category":"servo","sub":"PICK/PLACEの基本","type":"qa","front":"send_coordsでカメラ追従して降りても、PICKだけsend_anglesにすると何が起きる？","back":"send_anglesは関節角の直接指定なので常に同じ固定位置へ動き、カメラで得たXYがPICKの瞬間に捨てられる。追従を残すなら指令方式をそろえる（現在はsend_coordsを禁止し、send_anglesに一本化している）。","key":false,"src":"DAY142・DAY144"},{"id":"r236","category":"servo","sub":"PICK/PLACEの基本","type":"point","front":"ブロックを持って降りる高さは爪先基準ではなく、ぶら下がったブロックの下端が箱の縁（43mm）を越える高さで決める。爪先40mm帯では箱の壁に当たり、70〜100mm帯で箱に入った。","back":"","key":false,"src":"DAY263"},{"id":"r237","category":"servo","sub":"PICK/PLACEの基本","type":"qa","front":"PLACEで上カメラだけで水平位置を決めると、何が起きた？","back":"上からは左右は分かるが奥行きを詰めきれず、爪が白箱の手前の縁にかぶった。横カメラは「離してよい高さか」の関所に限り、水平合わせは離す直前の低い高さまで降ろしてから上カメラで行う。高い位置で合わせても降下中に流れるから。","key":false,"src":"DAY217"},{"id":"r238","category":"servo","sub":"PICK/PLACEの基本","type":"point","front":"掴み直しはVLMの判定がnoのときだけ行い、unknown（撮影やAPIの失敗）では行わない。掴めているかもしれないブロックを開いて落とさないため。","back":"","key":false,"src":"DAY238"},{"id":"r239","category":"servo","sub":"lookupの自由度","type":"point","front":"lookup追従：カメラで対象の位置を測り、FKテーブルから最も近い爪先位置の関節角を引いて送る。最近傍までの距離が閾値（100mm）を超えたら固定角度にフォールバック（代替動作）する。","back":"","key":false,"src":"DAY154・DAY168"},{"id":"r240","category":"servo","sub":"lookupの自由度","type":"qa","front":"補正記憶でX方向は縮むのに、Z（奥行き）のズレが縮まなかったのはなぜ？","back":"j0_lookupは採用姿勢のj1〜j5を固定し、j0（ベース回転）だけを振る一軸の方式だったから。j0の回転は主にXを動かし、爪先は円弧上しか動けないので、Δzを渡しても弧上の最寄り点を選び直すだけ。FKテーブルから6関節を引くfk_lookupに替えると、PICKのZのズレは25mm級→10mm級（別セルで-0.4mm）、PLACEのZ残差は36〜84mm→0.02mmになった。","key":false,"src":"DAY252・DAY257・DAY263"},{"id":"r241","category":"servo","sub":"lookupの自由度","type":"qa","front":"白箱を1点に固定すると入ったのに、場所を変えると8cmずれたのはなぜ？","back":"落下点の補正をUnity座標のX・Zに固定値で足していたが、ブロックと爪先の位置関係はj0（基部の回転）と一緒に回る。左奥と右ではj0が70°近く違い、補正が合わなくなった。1点で入ったのは、検出・最近傍・補正の向きのずれが偶然相殺していただけ。","key":true,"src":"DAY224"},{"id":"r242","category":"servo","sub":"視覚サーボの基本","type":"point","front":"FK（順運動学＝関節角から先端位置を求める計算）の誤差は5点の実測で、奥行きZ方向に+50〜70mmの系統的なずれと確定した。そこで爪先とブロックの両方をカメラで測り、差分を直接フィードバックする閉ループに切り替えた。","back":"","key":false,"src":"DAY178・DAY185"},{"id":"r243","category":"servo","sub":"視覚サーボの基本","type":"qa","front":"FK誤差を逆算して目標をずらし、1回だけlookupし直す静的補正に効きムラが出たのはなぜ？","back":"補正後の目標がテーブルの別の領域を指せば大きく効く（107.1mm→13.5mm）が、同じ最近傍点を引く領域では全く効かない（テーブルの疎密）。補正後にマーカーが見えない、マット端で候補が無い場合もある。1回の補正では解消できず、連続ループの視覚サーボへ移った。","key":false,"src":"DAY179"},{"id":"r244","category":"servo","sub":"視覚サーボの基本","type":"term","front":"視覚サーボ（visual servoing）","back":"カメラ映像から目標と爪先（TIP）のずれを測り、「どの関節を何度動かすか」に変えてずれをゼロへ追い込む制御。変換の辞書として、関節を1°動かすと先端が何mm動くか（mm/deg係数）を実測しておく。","key":false,"src":"DAY180"},{"id":"r245","category":"servo","sub":"視覚サーボの基本","type":"qa","front":"視覚サーボの位置合わせは、上空のAPPROACH姿勢と降下後のPICK姿勢のどちらで精度を出すべき？","back":"降下後のPICK姿勢。上空で合わせても、降下で関節が変わるとTIP位置が連鎖的にずれ、上カメラの視差でも見かけがずれる。上空は大まかでよく、把持高さでTIPとブロックを精密に一致させる。","key":false,"src":"DAY184・DAY191"},{"id":"r246","category":"servo","sub":"視覚サーボの基本","type":"qa","front":"j0の更新はX方向の差分だけで行い、収束判定は2D距離で行うのはなぜ？","back":"j0はZ方向にほとんど効かないので、Zの差分でj0を動かしても収束しない。一方、Xだけで判定するとZが大きくずれたまま把持に行く。更新はX、判定はXとZの2D距離という非対称な設計にした。","key":false,"src":"DAY185"},{"id":"r247","category":"servo","sub":"視覚サーボの基本","type":"point","front":"mm/deg係数が動く方向の符号まで含むなら、角度更新は delta = diff / 係数。さらにマイナスを付けると二重否定になり、アームは目標と逆へ逃げる。","back":"","key":false,"src":"DAY185"},{"id":"r248","category":"servo","sub":"視覚サーボの基本","type":"point","front":"視覚サーボの関節の可動制限は、絶対値ではなく初期姿勢を基準にした相対範囲で設計する。絶対値±30°では、初期j0が-45°の位置で始まった瞬間に範囲外で中断した。","back":"","key":false,"src":"DAY180"},{"id":"r249","category":"servo","sub":"視覚サーボの破綻と対策","type":"qa","front":"上カメラのXZ収束だけで「降下完了」と判定できないのはなぜ？","back":"ホモグラフィはマット平面への射影なので、高さ（Y）は最初から取れない。2D距離4.8mmで収束判定が出ても実機は降りていなかった。横カメラの爪先y座標を入力にし、初回値から+30pxで降下完了、5フレームで+10px未満なら進んでいないと判定した。","key":false,"src":"DAY199"},{"id":"r250","category":"servo","sub":"視覚サーボの破綻と対策","type":"qa","front":"係数ベースの補正（j1+j2+j4連動・5.0mm/°）が降下後の微調整で効かなくなったのはなぜ？","back":"係数はAPPROACH姿勢で実測した値で、その姿勢域でしか保証されない。姿勢が大きく変わると3関節の効果が打ち消し合い、合計64°動いても爪先のずれは1mmも縮まなかった。バグではなく物理モデルの前提が変わっていた。","key":false,"src":"DAY200"},{"id":"r251","category":"servo","sub":"視覚サーボの破綻と対策","type":"term","front":"プローブ式制御","back":"係数に頼らず、毎ループ関節を1°動かして実機の応答を見る補正方法。ずれが前回より減れば同方向を続け、増えれば反転する。X・Zの試行方向は独立に持つ。暴走しうるので関節ごとの安全範囲とループ回数上限を置く。","key":false,"src":"DAY200"},{"id":"r252","category":"servo","sub":"視覚サーボの破綻と対策","type":"qa","front":"「XZを合わせてから降りる」という段階分けをなぜやめた？","back":"j4で降ろすとXZも動き、XZを直すと高さYが崩れる相互干渉ループになり、補正量を絞ってもいたちごっこが続いた。上カメラのXZと横カメラのYを同時に見て3軸を同時に追い、3軸が揃った瞬間に爪を閉じる設計に変えた。","key":true,"src":"DAY202"},{"id":"r253","category":"servo","sub":"視覚サーボの破綻と対策","type":"point","front":"補正する軸をX→Z→Yの固定順で選ぶと、Zが関節の限界で縮まないときYへ永遠に進めない。Xが把持可能圏に入ったらYも候補に入れ、ずれ/許容値の比が最大の軸を選ぶ。","back":"","key":false,"src":"DAY208"},{"id":"r254","category":"servo","sub":"視覚サーボの破綻と対策","type":"qa","front":"整列と降下後修正のループが暴走した構造的な原因は？","back":"どちらも目標との差だけを見て関節を回し、爪先が実際に動いたかを見ていなかった。肘が寝た姿勢域では関節を回しても爪先が動かず差が残り続け、j1は93°→326°まで回って16ビット整数の上限を超え通信エラーになった。操作の結果爪先が動いたかを見る形にする。","key":true,"src":"DAY248"},{"id":"r255","category":"servo","sub":"視覚サーボの破綻と対策","type":"point","front":"PICK視覚サーボは全反復でブロック未検出（block_x_mm=None）のまま別の値を縮めて「収束」と記録し、j0を-22→-34へ悪化させていた。検出できない値で収束を偽装する閉ループは本線から外す。","back":"","key":false,"src":"DAY275"},{"id":"r256","category":"servo","sub":"視覚サーボの破綻と対策","type":"point","front":"「動かない」を3回連続検知したら自動でHOMEへ戻すセーフティは過保護だった。キュー待ちなどで一時的に止まり、次の瞬間に動き出すことがある。検証段階では警告にとどめ、止める判断は人が持つ。","back":"","key":false,"src":"DAY208"},{"id":"r257","category":"servo","sub":"補正記憶","type":"term","front":"補正記憶","back":"検出位置(x,z)を20mm格子のセルに分け、セルごとに爪先のズレΔを記憶する仕組み。次に同じセルへ来たら狙いを「ブロック位置−Δ」に補正してlookupへ渡す。実機でPICKの平均誤差は41.2mm→12.3mmに下がった。記憶の更新は当初、残差の指数移動平均（係数0.5）だったが、のちに積分則へ替えた。","key":false,"src":"DAY257・DAY270・DAY275"},{"id":"r258","category":"servo","sub":"補正記憶","type":"term","front":"補正記憶の積分則","back":"試行ごとの残差を補正値に積み足して更新する方式（Δ_new = Δ_old + α·残差）。残差の指数移動平均と違い、落ち着く先（不動点）が「残差ゼロ」になる。ただし1回の更新上限より真の必要補正が大きいと、限界まで巻き上がって発散しうる。","key":false,"src":"DAY275・DAY280"},{"id":"r259","category":"servo","sub":"補正記憶","type":"qa","front":"落下点のずれが毎回同じ方向・数mm幅に揃っていたら、何を意味し、どう打ち消す？","back":"掴んだ位置が爪に対して毎回ほぼ一定だという意味（ばらつきなら方向も大きさも散る）。降りる狙いを逆向きに動かせば打ち消せる。一度に全部詰めず半量から符号と量を確かめ、記録には補正前の生の座標を残す。","key":false,"src":"DAY222"},{"id":"r260","category":"servo","sub":"補正記憶","type":"point","front":"補正記憶のセルキーにphase接頭辞（pick_/place_）を付けて空間を分けた。空の爪の爪先ずれと、保持したブロックの落下点ずれは物理的な意味が違い、混ぜると壊れる。","back":"","key":false,"src":"DAY263"},{"id":"r261","category":"servo","sub":"補正記憶","type":"point","front":"PLACE補正記憶を切ったら着地距離の平均が18mm改善した。降下高さを変える前に学んだ過大補正が有害な在庫になっていた。前提が変わった補正値は破棄する。","back":"","key":false,"src":"DAY273"},{"id":"r262","category":"servo","sub":"補正記憶","type":"qa","front":"PLACEのZ方向の系統ズレ（約28mm）を、補正記憶ではなく置く直前のZサーボで詰めたのはなぜ？","back":"真値28mmが1回あたりの補正上限15mmより大きく、試行をまたぐ補正記憶では限界へ積み上がってJ4_SAFE（手首の安全範囲）を割った。その場の閉ループで1試行内にΔz→0へ詰め、次に持ち越さなければ巻き上がりは起きない。収束判定は、動く狙いではなく開始時に1度だけ確定した箱中心zで測る。","key":false,"src":"DAY280"},{"id":"r263","category":"servo","sub":"動的追従の設計","type":"point","front":"DAY185の動的追従は、止まって観察→動くステップ駆動をやめ、毎フレーム爪先とブロックを再検出して差分で更新する連続制御にした。「動く間は追い、止まった瞬間に掴む」。","back":"だがDAY200では関節連動の係数ベースのZ追従が爪先をほぼ動かせず不成立になった。DAY272の再設計書は、これを「発振」と位置づけ、ずれが閾値を越えた時だけ狙いを引き直す離散リプランとした。","key":false,"src":"DAY185・DAY200・dynamic_tracking_v2_design"},{"id":"r264","category":"servo","sub":"動的追従の設計","type":"qa","front":"なぜ動的追従を連続サーボではなく離散リプランにするのか？","back":"DAY200でj1+j2+j4連動の連続Z追従が発振・不成立になったため。対象位置は常に監視するが、ターゲットを引き直すのはズレが閾値（初期案15mm）を越えた時だけで、毎フレームは反応しない。「追わない勇気」を設計に含める。","key":true,"src":"dynamic_tracking_v2_design"},{"id":"r265","category":"servo","sub":"動的追従の設計","type":"term","front":"非同期 dual-system","back":"遅い知覚（重い検出やVLM）と速い制御（反射的な送角）を別周波数・非同期で回す構成。速い系は遅い系を待たず、共有バッファ（最新の検出位置・時刻・確信度）を読むだけで、古い値（例1.5秒超）は使わない。VLA研究の主流解。mechArmの速い系は軽量なOpenCV＋lookupで計算力は足り、足りないのは両者をつなぐ非同期の橋だけ。","key":false,"src":"dynamic_tracking_v2_design"},{"id":"r266","category":"servo","sub":"動的追従の設計","type":"qa","front":"リプランが必要になったとき、速い系はどう動く？","back":"進行中の送角を現在角で一旦止め、バッファの最新位置でそのフェーズを引き直し、新ターゲットへsend_anglesを1回だけ送る。移動中に軌道を変えず、同一ステージ内のリプラン回数にも上限（初期案2回）を置く。","key":false,"src":"dynamic_tracking_v2_design"},{"id":"r267","category":"servo","sub":"動的追従の設計","type":"point","front":"動的追従は段階導入する：遅延の実測→ほぼ静止区間での白箱監視→移動中はログだけ取る→移動中リプラン。50〜100Hzは目標にせず、実測周期で追える対象だけ追う。","back":"補正記憶は試行間の静的な系統誤差、動的追従は試行内の外乱を受け持つので共存する。","key":false,"src":"dynamic_tracking_v2_design"},{"id":"r268","category":"servo","sub":"受け渡し（ハンドオーバー）","type":"qa","front":"受け渡し（アームが差し出し人が受け取る）の一歩目で、「測定」と「安全」をどう分けた？","back":"測定は開ループ（センサーで確かめず決めた動きを出す）で、N秒で決め打ちして開き、落ちた回数を「何秒待てば受け取れるか」の測定値にする。待機の開始とアームが再び動く瞬間は、人の確認入力を経る2段インターロックにした。この2つを混ぜない。","key":true,"src":"DAY288"},{"id":"r269","category":"servo","sub":"受け渡し（ハンドオーバー）","type":"qa","front":"受け渡しで送角の自動再送を禁止したのはなぜ？","back":"人が「止まった」と認識した数秒後に、遅れて届いた再送でアームが動く危険があるから。置くタスクでは便利だった再送が凶器になるので、各ウェイポイントでsend_anglesは1回だけにした。","key":false,"src":"DAY288"},{"id":"r270","category":"servo","sub":"受け渡し（ハンドオーバー）","type":"point","front":"人の手が可動域にある間はVLMのAPIを呼ばない。撮影はRELEASE直後、判定はアームがHOMEに戻ってから。VLMは参考値なので物理安全の手順より後でよい。","back":"","key":false,"src":"DAY288・DAY293"},{"id":"r271","category":"servo","sub":"受け渡し（ハンドオーバー）","type":"qa","front":"受け渡しでグリッパーが開かなかったとき、止まらずHOMEへ帰るのはなぜ？","back":"人の手のすぐ横で保持姿勢のまま静止し続けると、次に何が起きるか読めない状態が続くから。開け直しはせずブロックを保持したまま、人の確認を経て、正常系と同じ退避関数でHOMEへ戻る。経路・速度・期限が同一であることを関数の共有で保証した。","key":false,"src":"DAY293"},{"id":"r272","category":"servo","sub":"受け渡し（ハンドオーバー）","type":"qa","front":"受け渡しで、アームが人の手の高さに追従しないと決めたのはなぜ？","back":"送角して到達を待つのに1秒以上かかり、その間に手は動くので追っても合わず揺れ続ける。両方が合わせようとすると逃げ合うので、止まる側をロボット、合わせる側を人にする。開く直前に1枚撮って手がまだあるかを確かめる門番の役割は持たせる。","key":false,"src":"DAY297"},{"id":"r273","category":"eval","sub":"ループと評価の考え方","type":"point","front":"「データを取る」と「ループが回る」は別物。フィードバックとは結果が次の動作を変えること。プロセスのログではなく、タスクの結果（物がどこに置かれたか）を測る。","back":"関節角ログは「指令どおり動いたか」の記録でタスク結果ではなく、次の動作の変え方が出てこない。そこで、置いた後の目標位置をiPhoneで真上から撮って判定する設計にした。","key":true,"src":"DAY125"},{"id":"r274","category":"eval","sub":"ループと評価の考え方","type":"point","front":"指令した関節角と実測の関節角は一致しない。PICK姿勢でJ2が約12°、J3が約9.5°ずれた。当初（DAY125）はサーボ内部の制御で指令角に収束すると見ていたが、DAY132の実測で崩れた。","back":"記事では重力・慣性・摩擦・応答遅れの積み重ねと見ている。他はJ1 4.31°、J4 7.9°、J5 6.59°、J6 2.2°。","key":false,"src":"DAY125・DAY132"},{"id":"r275","category":"eval","sub":"ループと評価の考え方","type":"qa","front":"「生成と評価を分ける」考え方は、R2R2Rにどう当てはまる？","back":"生成器＝Unityで軌道を作る、評価器＝実機で実行して計測する、フィードバック＝実世界との誤差、再生成＝軌道の補正。作る側と評価する側が同じだと品質の天井を超えられない。mechArmには力センサーがなく評価器が欠けてループが閉じていなかったので、VLM-as-Rewardで埋めた。","key":false,"src":"DAY128・DAY140"},{"id":"r276","category":"eval","sub":"ループと評価の考え方","type":"point","front":"失敗から学ぶループは①失敗を検知②原因を推定③次の一手を立て直す④実行して①へ、の4つで回る。人が肩代わりする判断は、即時判定・原因の切り分け・構造的な手当ての3層。","back":"","key":false,"src":"DAY225"},{"id":"r277","category":"eval","sub":"ループと評価の考え方","type":"point","front":"ループの良さは介入回数では測らない。指標は「同じ失敗を繰り返さないか」「試行を重ねるごとに良くなるか」。全自律でも同じ失敗を繰り返すなら悪いループ、人が補助しても良くなるなら良いループ。","back":"","key":true,"src":"DAY225"},{"id":"r278","category":"eval","sub":"ループと評価の考え方","type":"point","front":"各モジュールの入力と出力をログに残せば、デモを動かすたびに（入力, 正解出力）のペアが貯まり、将来のEnd-to-End学習（入力から出力まで1つのモデルで学ぶ）のデータになる。","back":"","key":false,"src":"DAY143"},{"id":"r279","category":"eval","sub":"成否判定（VLM-as-Reward）","type":"term","front":"VLM-as-Reward","back":"VLM（画像を理解する言語モデル）に結果画像を見せて「タスクは成功したか」を判定させ、報酬の代わりに使う手法。専用の報酬モデルを学習せず、iPhoneで撮影→APIで成否判定→次の試行へ、という閉ループがGPU追加なしで組める。","key":true,"src":"DAY140・DAY142"},{"id":"r280","category":"eval","sub":"成否判定（VLM-as-Reward）","type":"qa","front":"VLM判定の出力を、True/FalseではなくJSON（result・reason）にしたのはなぜ？","back":"True/Falseだと、ログに成功・失敗の理由が残らない。reasonを1文で返させれば理由が記録され、ログの意味が変わる。応答の前後に余計な文が付くことがあるので、JSON部分だけ抜き出して解析する。","key":false,"src":"DAY142"},{"id":"r281","category":"eval","sub":"成否判定（VLM-as-Reward）","type":"qa","front":"VLMのPICK判定が全部yesなのに、爪に引っかかって浮いただけの試行があった。なぜ見分けられなかった？","back":"プロンプトが「リフト後にブロックが床から浮いているか」しか問うていなかったから。一方、爪先とブロックの距離は掴めた試行6〜11mm・引っかかった試行18〜25mmときれいに分かれていた。問い方が区別したいものを区別できる形かを確かめ、判定対象は具体的に書く。","key":false,"src":"DAY142・DAY279"},{"id":"r282","category":"eval","sub":"成否判定（VLM-as-Reward）","type":"qa","front":"VLMが正しく「掴めた」と判定したのに、グリッパーを開いてブロックを落とした原因は？","back":"爪先とブロックの距離が362.8mmという物理的にありえない破綻値になり、上書き判定が正しいyesをnoに倒した。壊れた物差しが正しい判定を握り潰す構造。直し方は3分岐（30mm以下はVLMを信じる／30〜150mmはno／150mm超は測定破綻とし
