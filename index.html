<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ロボティクス 声の単語帳</title>
<style>
/* 仕事で使っている「台本読み合わせ」ページと同じ見た目：横スワイプのカード＋その下に「押している間だけ聞く」 */
:root{
  --bg:#f2f3f5; --fg:#1d2129; --muted:#6b7280; --panel:#ffffff; --line:#e3e5e9;
  --card:#1a1b1f; --card-fg:#ffffff; --card-sub:#a9adb6; --gold:#f2c14e; --time:#c98a12;
  --miss:#fde2e1; --miss-fg:#b42318; --extra:#dbeafe; --extra-fg:#1e40af; --ok:#15803d;
  --btn:#1a1b1f; --btn-fg:#ffffff; --rec:#b42318;
  --sh:0 8px 16px rgba(0,0,0,.08); --sh-hover:0 16px 32px rgba(0,0,0,.18); --panel-hover:#ffffff;
  --font:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111215; --fg:#e8eaee; --muted:#9aa0aa; --panel:#1c1d22; --line:#2c2e35;
  --card:#000000; --miss:#4a1714; --miss-fg:#ffb4ab; --extra:#13284d; --extra-fg:#bcd3ff; --ok:#4ade80;
  --btn:#e8eaee; --btn-fg:#111215; --sh:0 8px 16px rgba(0,0,0,.45); --sh-hover:0 16px 32px rgba(0,0,0,.8); --panel-hover:#23242a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111215; --fg:#e8eaee; --muted:#9aa0aa; --panel:#1c1d22; --line:#2c2e35;
  --card:#000000; --miss:#4a1714; --miss-fg:#ffb4ab; --extra:#13284d; --extra-fg:#bcd3ff; --ok:#4ade80;
  --btn:#e8eaee; --btn-fg:#111215; --sh:0 8px 16px rgba(0,0,0,.45); --sh-hover:0 16px 32px rgba(0,0,0,.8); --panel-hover:#23242a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.7 var(--font);padding:0 0 calc(24px + env(safe-area-inset-bottom))}
header{background:#1a1b1f;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
header .hl{min-width:0}
header h1{margin:0;font-size:21px}
.crumb{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 0 2px}
.crumb a{color:rgba(255,255,255,.75);text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.35)}
.crumb a:hover{color:#fff;text-decoration-color:#fff}
.crumb span{color:rgba(255,255,255,.5)}
.logo{flex:0 0 auto;display:block;margin-top:6px;opacity:.9}
.logo:hover{opacity:1}
.logo .ptm{display:block;height:17px;width:auto}
@media (max-width:420px){.logo .ptm{height:13px}}
header p{margin:2px 0 0;font-size:14px;color:rgba(255,255,255,.75)}
main{padding:12px 16px 0;max-width:720px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.selwrap{position:relative;display:block;width:100%}
select{-webkit-appearance:none;appearance:none;display:block;width:100%;font:inherit;font-size:16px;font-weight:600;background:var(--btn);color:var(--btn-fg);border:0;border-radius:10px;padding:10px 44px 10px 14px;margin:0}
.selwrap::after{content:"";position:absolute;right:19px;top:50%;width:9px;height:9px;border-right:2.75px solid var(--btn-fg);border-bottom:2.75px solid var(--btn-fg);border-radius:1px;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--fg);font:inherit;font-size:15px;padding:8px 12px}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg)}
.seg.step{display:flex;margin:0 0 8px}.seg.step button{flex:1;font-size:16px;font-weight:600;padding:10px 6px}
.card .w{font-size:27px;line-height:1.5;font-weight:700;margin:8px 0 2px}
.card .w.small{font-size:20px;margin-bottom:0}
.info{font-size:14px;color:var(--muted);margin:0 2px 8px}
.track{display:flex;align-items:flex-start;overflow-x:auto;overflow-y:hidden;transition:height .15s;scroll-snap-type:x mandatory;gap:10px;padding:4px 2px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 88%;scroll-snap-align:center;background:var(--card);color:var(--card-fg);border-radius:14px;padding:16px 16px 12px;min-height:250px;display:flex;flex-direction:column}
.card .sec{font-size:13.5px;color:var(--card-sub)}
.card .lb{font-size:13.5px;font-weight:700;color:var(--gold);margin-top:2px}
.card .q{font-size:15px;color:var(--card-sub);margin-top:6px}
.card .t{font-size:25px;line-height:1.75;font-weight:600;flex:1;margin:8px 0}
.card .t.long{font-size:20px}
.card .t.mid{font-size:22px}
.card .t.hide{color:var(--card-sub)}
.card .b{font-size:14.5px;line-height:1.7;color:var(--card-sub);margin:0 0 8px}
.card .m{font-size:13.5px;color:var(--time);display:flex;justify-content:space-between;gap:8px}
.card .m .done{color:#9be3b2}.card .m .done.low{color:#ffb4ab}.card .m .done small{color:#a9adb6;font-size:12.5px;margin-left:4px}
.pos{font-size:14px;color:var(--muted);text-align:center;margin:0 0 8px;font-variant-numeric:tabular-nums}
.mic{display:block;width:100%;border:0;border-radius:16px;padding:18px 12px;font:inherit;font-size:20px;font-weight:700;background:var(--btn);color:var(--btn-fg);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.mic.on{background:var(--rec);color:#fff}
.mic:disabled{opacity:.45}
.mic small{display:block;font-size:13.5px;font-weight:400;opacity:.8}
.res{background:var(--panel);border-radius:14px;padding:12px 14px;margin:12px 0 0;border:1px solid var(--line)}
.res h2{font-size:15px;margin:0 0 6px;color:var(--muted);font-weight:600}
.res .said{font-size:19px;line-height:1.8;min-height:1.8em;word-break:break-all}
.res .cmp{font-size:19px;line-height:1.8;word-break:break-all}
.res .miss{background:var(--miss);color:var(--miss-fg);border-radius:3px}
.res .kw{display:inline-block;border-radius:6px;padding:0 8px;margin:2px 6px 2px 0;background:var(--extra);color:var(--extra-fg)}
.res .kw.miss{background:var(--miss);color:var(--miss-fg)}
.res .lesson{margin-top:6px}
.res .extra{background:var(--extra);color:var(--extra-fg);border-radius:3px}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px;margin-top:8px;font-variant-numeric:tabular-nums}
.stats b{font-size:20px}
.stats .good{color:var(--ok)}.stats .bad{color:var(--miss-fg)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row #save{background:var(--btn);color:var(--btn-fg);border-color:var(--btn);font-weight:700}
.row button{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-size:15px;border-radius:10px;padding:8px 12px}
.log{margin:18px 0 0}
.log h2{font-size:18px;margin:0 0 8px;padding-left:10px;border-left:4px solid var(--fg)}
.log table{width:100%;border-collapse:collapse;font-size:15px;background:var(--panel);border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums}
.log th,.log td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
.log th:first-child,.log td:first-child{text-align:left}
.log th{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:14px 2px 0}
.warn{background:var(--miss);color:var(--miss-fg);border-radius:10px;padding:10px 12px;font-size:15px;margin:0 0 10px}
button:focus-visible,select:focus-visible{outline:3px solid var(--time);outline-offset:2px}
/* カテゴリの一覧（最初の画面） */
.cats{display:flex;flex-direction:column;gap:10px;margin:4px 0 0}
.cat{display:block;width:100%;text-align:left;border:0;background:var(--panel);color:var(--fg);font:inherit;border-radius:8px;box-shadow:var(--sh);padding:14px 44px 14px 16px;position:relative}
.cat::after{content:"";position:absolute;right:20px;top:50%;width:9px;height:9px;border-right:2.75px solid var(--fg);border-top:2.75px solid var(--fg);border-radius:1px;transform:translateY(-50%) rotate(45deg)}
button,select{cursor:pointer}button:disabled{cursor:default}
@media (hover:hover){.cat{transition:box-shadow .18s,transform .18s,background-color .18s}.cat::after{transition:right .18s}.cat:hover{box-shadow:var(--sh-hover);transform:translateY(-4px);background:var(--panel-hover)}.cat:hover::after{right:14px}.cat:active{transform:translateY(-1px)}}
@media (prefers-reduced-motion:reduce){.cat,.cat::after{transition:none}}
.cat .nm{display:block;font-size:18px;font-weight:700;line-height:1.5}
.cat .ct{display:block;font-size:14px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.cat .ct b{color:var(--fg);font-size:16px}
.cat .ct .weak{color:var(--miss-fg)}
.cat .meter{display:block;height:6px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden}
.cat .meter i{display:block;height:100%;background:var(--fg);border-radius:3px}
.cat.dark{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.cat.dark::after{border-color:var(--btn-fg)}
.cat.dark .ct{color:inherit;opacity:.75}.cat.dark .ct b{color:inherit}
.homeh{font-size:15px;color:var(--muted);font-weight:600;margin:18px 2px 8px}
@media (min-width:560px){.cats{display:grid;grid-template-columns:1fr 1fr;gap:20px}.homeh{grid-column:1/-1;margin:12px 2px -6px}.cat{display:flex;flex-direction:column}.cat .meter{margin-top:auto}.cat .ct+.ct{margin-bottom:10px}main:has(#home:not([hidden])){max-width:960px}}
.ctitle{font-size:22px;font-weight:700;margin:0 0 10px;line-height:1.4}
</style>
</head>

して表される。リンクの長さが、手先がどこまで届くかを決める。","key":false,"src":""},{"id":"w003","category":"kinematics","sub":"","type":"word","front":"自由度（DOF）","back":"ロボットが互いに独立して動かせる、動きの方向の数","detail":"空間で物の位置と向きを自由に決めるには、6自由度が必要になる。アームでは関節の数がそのまま自由度になることが多く、グリッパーの開閉はふつう数えない。mechArm 270 は6軸のアームで、グリッパーは別に扱う。","key":true,"src":"DAY120"},{"id":"w004","category":"kinematics","sub":"","type":"word","front":"回転関節と直動関節","back":"回って角度が変わる関節と、まっすぐ伸び縮みする関節","detail":"回転関節はレボリュート、直動関節はプリズマティックとも呼ぶ。多関節アームは、ほぼ回転関節だけでできている。直動関節は、直交ロボットやリニアレールのように、直線で動かす場所に使われる。","key":false,"src":""},{"id":"w005","category":"kinematics","sub":"","type":"word","front":"エンドエフェクタ（EE）","back":"アームの先端に付けて、作業をする道具の部分","detail":"グリッパー、吸着パッド、溶接トーチなど、作業ごとに付け替える。アームの制御は、エンドエフェクタの位置と向きを狙いどおりにすることが目的になる。mechArm には、手先の座標を直接指定して動かす命令もある。","key":true,"src":"DAY139"},{"id":"w006","category":"kinematics","sub":"","type":"word","front":"ツール中心点（TCP）","back":"ロボットが位置を合わせる基準となる、道具の先端の一点","detail":"グリッパーなら爪の間、溶接なら炎の先などに置く。手首の取り付け面ではなくTCPを基準にすると、道具を替えても狙った点に合わせられる。通信のTCPとは別の言葉なので、文脈で区別する。","key":false,"src":""},{"id":"w007","category":"kinematics","sub":"","type":"word","front":"座標系（フレーム）","back":"位置や向きを数字で表すための、原点と軸の決まり","detail":"台座が原点のベース座標系、作業場全体のワールド座標系、手先のツール座標系などを使い分ける。ソフトによって上向きの軸が違う点に注意する。mechArm のツインでは、URDFのZ軸が上とUnityのY軸が上の変換を誤り、成功率が0になった。","key":true,"src":"DAY149"},{"id":"w008","category":"kinematics","sub":"","type":"word","front":"座標変換","back":"ある座標系での位置や向きを、別の座標系の値に直す計算","detail":"カメラで見た位置をロボットの座標に直す場面で、必ず使う。回転と平行移動をまとめた、同次変換行列で表すのが一般的。mechArm では、ホモグラフィをやめ、2点の実測にもとづくアフィン変換に書き換えた。","key":false,"src":"DAY160"},{"id":"w009","category":"kinematics","sub":"","type":"word","front":"位置姿勢（ポーズ）","back":"物や手先がどこにあり、どちらを向いているかの組み合わせ","detail":"位置の3つの値と、向きの3つの値を合わせて、6つの値で表すことが多い。日本語の姿勢は、向きだけを指す場合と、アーム全体の関節の形を指す場合があり、混同しやすい。","key":false,"src":""},{"id":"w010","category":"kinematics","sub":"","type":"word","front":"オイラー角（ロール・ピッチ・ヨー）","back":"向きを、3つの軸まわりの回転角の組で表す方法","detail":"直感的で読みやすいため、画面表示や指令値によく使われる。ただし回す順番で意味が変わり、特定の向きで軸が重なって自由度が1つ消える、ジンバルロックが起きる。計算ではクォータニオンと使い分ける。","key":false,"src":""},{"id":"w011","category":"kinematics","sub":"","type":"word","front":"クォータニオン（四元数）","back":"向きを4つの数で表す方法で、計算で扱いやすい","detail":"ジンバルロックが起きず、2つの向きのあいだをなめらかにつなぐ補間も安定する。そのため、UnityやROSの内部では向きをクォータニオンで持つ。値を見ても向きが直感で分からないので、表示ではオイラー角に直すことが多い。","key":false,"src":""},{"id":"w012","category":"kinematics","sub":"","type":"word","front":"順運動学（FK）","back":"各関節の角度から、手先の位置と向きを求める計算","detail":"角度が決まれば答えは必ず1つに決まるので、計算は比較的やさしい。逆運動学は、この逆向きの計算になる。mechArm では、実機で校正した512,087点のFKテーブルから目標位置に近い点を探し、関節角を逆に引いて使った。","key":true,"src":"DAY192"},{"id":"w013","category":"kinematics","sub":"","type":"word","front":"逆運動学（IK）","back":"手先の目標位置から、各関節の角度を逆算する計算","detail":"答えが複数ある場合や、届かず答えがない場合があり、順運動学より難しい。式で直接解く解析解と、少しずつ近づける数値解がある。mechArm では、座標指定の命令で手首の回転RZが位置により暴れたため、角度指定だけで動かす方針にした。","key":true,"src":"DAY212"},{"id":"w014","category":"kinematics","sub":"","type":"word","front":"作業空間（ワークスペース）","back":"ロボットの手先が届き、作業できる空間の範囲","detail":"リンクの長さと、関節の可動域で決まる。届くことと、狙った向きで届くことは別で、向きまで自由に決められる範囲はもっと狭い。カタログのリーチは、この範囲の最大の半径を示す数字。","key":false,"src":""},{"id":"w015","category":"kinematics","sub":"","type":"word","front":"関節可動域（ジョイントリミット）","back":"各関節が安全に動ける、角度の上限と下限の範囲","detail":"機構の限界や配線、ぶつかりを避けるために決まっている。指令を送る前に範囲内か確かめるのが、基本の安全策になる。mechArm では、SDKの pymycobot 4.0.5 から関節リミットの定数を読み出して使った。","key":false,"src":"DAY253"},{"id":"w016","category":"kinematics","sub":"","type":"word","front":"特異点（特異姿勢）","back":"手先が特定の方向へ動けなくなる、アームの特殊な姿勢","detail":"腕がまっすぐ伸び切ったときや、2つの関節の軸が一直線にそろったときに起きる。近くでは、手先をわずかに動かすだけで、関節が急に大きく回ろうとする。軌道を作るときは、特異点を避けて通す。","key":false,"src":""},{"id":"w017","category":"kinematics","sub":"","type":"word","front":"ヤコビ行列（ヤコビアン）","back":"関節の速さと、手先の速さの関係を表す行列","detail":"姿勢ごとに中身が変わり、数値で逆運動学を解くときや、力の計算に使う。特異点では、この行列の逆が求められなくなる。mechArm では、ヤコビアンを使う数値解を候補に挙げたが、実時間で回すには重いとして見送った。","key":false,"src":"DAY192"},{"id":"w018","category":"kinematics","sub":"","type":"word","front":"DHパラメータ","back":"リンクの長さやねじれを、関節ごとに4つの数で表す決まり","detail":"デナビット・ハーテンベルグ法の略で、運動学の教科書で標準的に使われる。表を作れば、順運動学の式が機械的に組める。mechArm では、公式値の正確さに不安があり、机上のDHパラメータより実機で校正したFKテーブルを優先した。","key":false,"src":"DAY192"},{"id":"w019","category":"hardware","sub":"","type":"word","front":"アクチュエータ","back":"電気などのエネルギーを、実際の動きに変える装置","detail":"ロボットでは電気モーターが主流で、大きな力が要る機械では油圧や空気圧も使う。センサーが世界を読む側なら、アクチュエータは世界に働きかける側。関節ごとに1つ置くのが、基本の構成になる。","key":false,"src":""},{"id":"w020","category":"hardware","sub":"","type":"word","front":"サーボモーター","back":"指令した角度や位置へ、自分で合わせて止まるモーター","detail":"モーター、回転を測るエンコーダ、制御回路が組になり、ずれを測りながら目標へ寄せる。ホビー機では、これらを一体にしたスマートサーボがよく使われる。mechArm には6個のスマートサーボが入り、角度や温度を個別に読み戻せる。","key":true,"src":"DAY260"},{"id":"w021","category":"hardware","sub":"","type":"word","front":"減速機（ギア）","back":"モーターの速い回転を遅くして、そのぶん力を大きくする部品","detail":"モーター単体は速く回るが力が弱いので、歯車などで回転を落として関節を動かす。減速比が大きいほど力は増えるが速さは落ち、ガタや摩擦も入りやすい。産業用アームでは、根元側にRV減速機、手首側に波動歯車減速機を使う例が多い。","key":false,"src":""},{"id":"w022","category":"hardware","sub":"","type":"word","front":"エンコーダ","back":"モーターや関節が、どれだけ回ったかを測るセンサー","detail":"回転角を数値に変え、制御の側に今の位置を知らせる。電源を入れた瞬間から位置が分かるアブソリュート型と、動いた量を数えるインクリメンタル型がある。mechArm では、サーボが角度を読み戻せることから、各サーボにエンコーダがあると見ている。","key":true,"src":"DAY260"},{"id":"w023","category":"hardware","sub":"","type":"word","front":"トルク","back":"関節や軸を回転させようとする、回す力の強さ","detail":"単位はニュートンメートルで、力に腕の長さをかけたもの。同じ重さでも、腕を伸ばして遠くで持つほど、根元の関節に大きなトルクがかかる。モーターの電流はトルクとほぼ比例するので、電流から負荷を推定できる。","key":true,"src":""},{"id":"w024","category":"hardware","sub":"","type":"word","front":"サーボオンとサーボオフ","back":"モーターに力を入れて姿勢を保つ状態と、力を抜く状態","detail":"サーボオンでは指令の位置を保ち、サーボオフでは手で関節を動かせる。オフにした瞬間、重力でアームが落ちることがあるので、支えてから切る。mechArm では、全関節のトルクを切る命令で、手で動かせる状態にできる。","key":false,"src":"DAY205"},{"id":"w025","category":"hardware","sub":"","type":"word","front":"フィードバック制御（閉ループ制御）","back":"結果を測り、目標とのずれを見ながら指令を直し続ける制御","detail":"測らずに決めた指令を送るだけの、オープンループ制御と対になる言葉。センサーで今の状態を測り、ずれが小さくなる方向へ出力を変える。ロボットの関節制御は、ほぼすべてこの考え方で動いている。","key":true,"src":""},{"id":"w026","category":"hardware","sub":"","type":"word","front":"PID制御","back":"ずれの今の大きさ、たまった量、変化の速さで出力を決める制御","detail":"比例、積分、微分の頭文字で、フィードバック制御で最も広く使われる方式。3つの係数の調整をゲイン調整と呼び、強すぎると振動し、弱すぎると遅れる。mechArm では角度を送るだけで、Pi ではなくマイコンとサーボの側が指令角まで寄せる。","key":false,"src":"DAY260"},{"id":"w027","category":"hardware","sub":"","type":"word","front":"可搬重量（ペイロード）","back":"ロボットが手先で持って動かせる、重さの上限","detail":"グリッパー自体の重さも含めて数えるのがふつうで、腕を伸ばすほど実際に持てる量は減る。カタログの値は最大の条件なので、余裕を持って選ぶ。mechArm 270 の常用ペイロードは250gで、約600gの中身入りコーヒーカップは運べない。","key":true,"src":"DAY205"},{"id":"w028","category":"hardware","sub":"","type":"word","front":"リーチ","back":"台座の中心から、手先が届く一番遠い点までの距離","detail":"アームの大きさを比べるときの基本の数字。ただしこれは最大値で、端のほうでは持てる重さや精度が落ちる。届く範囲の広さと、その中で使える範囲は分けて考える。mechArm 270 のリーチは270mm。","key":false,"src":"DAY205"},{"id":"w029","category":"hardware","sub":"","type":"word","front":"繰り返し精度","back":"同じ場所へ何度も動かしたとき、止まる位置がどれだけそろうか","detail":"カタログで最もよく見る精度の数字で、ばらつきの幅を示す。狙った座標への正確さを示す絶対精度とは別物で、繰り返し精度が良くても絶対精度が悪いことはふつうにある。mechArm 270 の繰り返し精度は±0.5mm。","key":true,"src":"DAY205"},{"id":"w030","category":"hardware","sub":"","type":"word","front":"絶対精度","back":"指令した座標に、実際どれだけ正確に到達できるか","detail":"リンク長の誤差、たわみ、取り付けのずれなどが積み重なって悪くなる。多くのアームでは繰り返し精度よりかなり悪く、カタログに載らないこともある。キャリブレーションで改善を狙うのは、こちらの精度。","key":false,"src":""},{"id":"w031","category":"hardware","sub":"","type":"word","front":"バックラッシ","back":"歯車のかみ合わせのすき間による、動きのガタ","detail":"回る向きを変えたとき、すき間の分だけ出力が遅れて動き出す。行きと帰りで止まる位置がずれる原因になる。mechArm では、関節を動かす向きによって約17%の非対称が出て、バックラッシュかヒステリシスの可能性を考えた。","key":false,"src":"DAY189"},{"id":"w032","category":"hardware","sub":"","type":"word","front":"力覚センサー（力トルクセンサー）","back":"手先にかかる押す力とねじる力を、直接測るセンサー","detail":"手首に付けて、押し付けの強さや接触を測る。6軸タイプは、3方向の力と3軸まわりのトルクを測れる。mechArm には標準では付いておらず、モーターの電流値から、触れたことを間接的に検出できる。","key":false,"src":"DAY205"},{"id":"w033","category":"hardware","sub":"","type":"word","front":"マイコン（MCU）","back":"機械に組み込まれ、決まった処理を素早く回す小さなコンピュータ","detail":"パソコン型のコンピュータが上位の判断を担い、マイコンがモーターなど実時間に近い処理を担う、という分担が多い。mechArm では、Raspberry Pi からの指令をESP32系のマイコンが受けて、サーボを動かしている。","key":false,"src":"DAY260"},{"id":"w034","category":"hardware","sub":"","type":"word","front":"シリアル通信とボーレート","back":"データを1ビットずつ順番に送る通信と、その速さの設定","detail":"マイコンやサーボとのやりとりで、今も広く使われる。送る側と受ける側でボーレートが合っていないと、文字化けや無応答になる。mechArm では、Raspberry Pi とマイコンを1Mbpsのシリアル通信でつないでいる。","key":false,"src":"DAY260"},{"id":"w035","category":"hardware","sub":"","type":"word","front":"制御周期（制御ループ周波数）","back":"測って指令を出す一回りを、1秒に何回くり返せるか","detail":"単位はヘルツで、高いほど素早い変化や接触に反応できる。外から指令を送る周期と、モーター内部の周期は別もので、内部のほうがずっと速い。mechArm では関節角の読み出し1回に約20ミリ秒かかり、読むだけでも約50Hzが上限になる。","key":false,"src":"DAY296"},{"id":"w036","category":"sim","sub":"","type":"word","front":"シミュレーション（シミュレータ）","back":"現実の動きを、コンピュータの中で再現して試すこと","detail":"実機を壊さず、何度でも、何台分でも同時に試せるのが利点。一方で、摩擦や接触などは現実どおりに再現しきれない。その差をどう扱うかが、ロボット開発の大きなテーマになる。","key":true,"src":""},{"id":"w037","category":"sim","sub":"","type":"word","front":"デジタルツイン","back":"実物と同じ形と動きを持つ、コンピュータの中の双子","detail":"単なるシミュレーションと違い、実物のデータで合わせ込み、実物と対応づけて使うのが要点。mechArm では、Unity上のツインでアームを動かし、関節角から爪先の位置を引くFKテーブルを作っている。","key":true,"src":"DAY254"},{"id":"w038","category":"sim","sub":"","type":"word","front":"物理エンジン","back":"重力やぶつかりなど、物の動きを計算で再現するソフトの心臓部","detail":"少しずつ時間を進めながら、力、速度、接触を計算する。ゲーム用とロボット研究用では、速さと正確さの重みが違う。mechArm のツインでは、関節角を瞬時に入れたいとき、物理計算を飛ばして角度を直接セットした。","key":true,"src":"DAY150"},{"id":"w039","category":"sim","sub":"","type":"word","front":"タイムステップ","back":"シミュレーションで、時間を一度に進める刻み幅","detail":"刻みが細かいほど正確だが、計算は重くなる。粗すぎると、速い物がすり抜けたり、関節が振動して発散したりする。実機の制御周期とそろえるかどうかも、sim2realで気にする点になる。","key":false,"src":""},{"id":"w040","category":"sim","sub":"","type":"word","front":"剛性と減衰（スティフネスとダンピング）","back":"関節を目標へ引き戻すばねの強さと、揺れを抑えるブレーキの強さ","detail":"シミュレータで関節を角度指令で動かすとき、ばねとダンパーの組として設定する。剛性が強すぎると暴れ、弱すぎると目標に届かない。mechArm のツインでは、剛性20,000、減衰2,000に固定し、変更禁止にしている。","key":false,"src":"DAY154"},{"id":"w041","category":"sim","sub":"","type":"word","front":"コリジョン形状","back":"ぶつかりの判定に使う、見た目より単純にした形","detail":"見た目用の細かい形状とは分けて持ち、箱や円柱などで近似して計算を軽くする。形を粗くしすぎると、実機では当たるのにシミュレーションでは当たらない、といったずれが出る。","key":false,"src":""},{"id":"w042","category":"sim","sub":"","type":"word","front":"URDF","back":"ロボットのリンクと関節の構成を書き表す、標準のファイル形式","detail":"ROSで生まれたXML形式で、各リンクの形や重さ、関節の種類と可動域を書く。多くのシミュレータが読み込めるので、機種の共通の入り口になる。mechArm では、DAY101まで mechArm 270 M5 のURDFでシミュレーションを組んできた。","key":true,"src":"DAY102"},{"id":"w043","category":"sim","sub":"","type":"word","front":"ROS 2","back":"ロボットのソフトを部品に分けて、つなぎ合わせるための共通基盤","detail":"名前はOSだが、実体は通信の仕組みと、道具や部品の集まり。センサー、計画、制御などを別々のプログラムとして動かし、決まった形式でデータをやりとりする。研究や開発の現場で、広く使われている。","key":true,"src":""},{"id":"w044","category":"sim","sub":"","type":"word","front":"ノードとトピック","back":"ROSで、処理の単位と、そのあいだを流れるデータの通り道","detail":"ノードは、カメラの読み取りや経路計画など、1つの役目を持つプログラム。トピックは名前の付いた通り道で、送る側と受け取る側が互いを知らなくてもデータをやりとりできる。","key":false,"src":""},{"id":"w045","category":"sim","sub":"","type":"word","front":"MoveIt","back":"アームの動作計画をまとめて扱う、ROSの代表的な道具","detail":"逆運動学、ぶつからない経路の計画、軌道の生成を、URDFなどの設定から組み立てられる。自前で書くと大変な部分を肩代わりしてくれる反面、設定項目が多い。ROS 2 版は MoveIt 2 と呼ぶ。","key":false,"src":""},{"id":"w046","category":"sim","sub":"","type":"word","front":"Gazebo","back":"ROSと組み合わせて使われてきた、無料のロボット用シミュレータ","detail":"ロボットとセンサーを仮想空間に置き、ROSのプログラムをそのままつないで試せる。移動ロボットの開発で、特によく使われる。旧版は Gazebo Classic、今の系統は Gazebo と呼び分ける。","key":false,"src":""},{"id":"w047","category":"sim","sub":"","type":"word","front":"Isaac Sim","back":"NVIDIAが提供する、GPUで動く高精細なロボット用シミュレータ","detail":"見た目のリアルさと、大量の並列計算が強み。強化学習用の Isaac Lab と組み合わせて、合成データづくりや学習に使われる。動かすには、NVIDIAのGPUを積んだ性能の高いマシンが要る。","key":false,"src":""},{"id":"w048","category":"sim","sub":"","type":"word","front":"MuJoCo（ムジョコ）","back":"接触の計算が速くて正確な、研究でよく使われる物理シミュレータ","detail":"名前は、接触を伴う多関節の力学という英語の頭文字から。強化学習の研究で、ベンチマーク環境として広く使われてきた。現在は Google DeepMind が、無料のオープンソースとして公開している。","key":false,"src":""},{"id":"w049","category":"sim","sub":"","type":"word","front":"並列シミュレーション","back":"同じ環境を何個も同時に動かして、データを一気に集めること","detail":"実機では1台ずつしか試せないが、シミュレーションなら何十、何千と並べられる。強化学習や、大量のデータ集めで特に効く。mechArm のツインでは、20体のアームを並列で動かし、約2.5時間かけてFKデータを取った。","key":false,"src":"DAY154"},{"id":"w050","category":"sim","sub":"","type":"word","front":"sim2real（シムツーリアル）","back":"シミュレーションで作った動きや学習結果を、実機へ持っていくこと","detail":"Sim-to-Real とも書く。安く大量に試せるシミュレーションの利点を、実機で生かすための考え方。そのまま持っていくと現実との差でうまく動かないことが多く、差を埋める工夫と組で語られる。","key":true,"src":""},{"id":"w051","category":"sim","sub":"","type":"word","front":"リアリティギャップ（sim2realギャップ）","back":"シミュレーションと現実のあいだにある、ずれのこと","detail":"摩擦、重さ、ギアのガタ、センサーの雑音、遅れなどが原因になる。シミュレーションでうまくいった動きが実機で失敗する理由の多くは、ここにある。差を測り、モデルを実機に合わせ込むことが第一歩。","key":false,"src":""},{"id":"w052","category":"sim","sub":"","type":"word","front":"ドメインランダマイゼーション","back":"シミュレーションの条件をわざとばらつかせ、現実のずれに強くする手法","detail":"色、明るさ、摩擦、重さなどを、試行ごとに変えて学習させる。現実を、たくさんの条件のうちの1つとして扱えるようにする考え方。OpenAI がロボットハンドを、シミュレーションだけで学習させて実機へ移した例が有名。","key":false,"src":""},{"id":"w053","category":"sim","sub":"","type":"word","front":"合成データ","back":"シミュレーションや画像生成で作った、学習用のデータ","detail":"実機で集めるより安く、正解のラベルも自動で付けられるのが強み。一方で、見た目や物理が現実とずれると、学習したモデルが実機で効かない。現実のデータと混ぜて使うのが一般的。","key":false,"src":""},{"id":"w054","category":"sim","sub":"","type":"word","front":"real2sim（リアルツーシム）","back":"現実の物や動きを測り取って、シミュレーションの中に再現すること","detail":"sim2real の逆向きで、現実をもとにシミュレーションを作る流れ。写真や動画から物の形を立て直したり、実機の値で物理の設定を合わせたりする。現実に近い仮想環境ほど、リアリティギャップは小さくなる。","key":false,"src":""},{"id":"w055","category":"vision","sub":"","type":"word","front":"画素（ピクセル）","back":"デジタル画像をつくる、色の数値を持った最小の点","detail":"画像は縦と横に並んだ画素の集まりで、各画素が明るさや色の数値を持つ。解像度は画素の縦横の数を指す。画像上の位置は画素の番号で表すため、ロボットを動かすにはmmなど実世界の長さへの変換が必要になる。","key":false,"src":""},{"id":"w056","category":"vision","sub":"","type":"word","front":"色空間（RGB・HSV）","back":"色を数字で表すときの、表し方の決まりごと","detail":"RGBは赤・緑・青の光の混ぜ具合で色を表す。HSVは色相・彩度・明度に分けるので、明るさが変わっても色の種類を保ちやすい。自分の検証では、照明の色を変えると色相が最大155度動き、青いブロックが色を失った。","key":true,"src":"DAY300"},{"id":"w057","category":"vision","sub":"","type":"word","front":"二値化（しきい値処理）","back":"決めた境目の値で、画素を白と黒の二つに分ける処理","detail":"色や明るさが境目より上か下かで画素を選び、白黒のマスク画像を作る。色で物を探す処理の基本になる。境目を固定すると照明の変化に弱く、自分の検証では光が変わると赤の検出が青を拾った。","key":false,"src":"DAY301"},{"id":"w058","category":"vision","sub":"","type":"word","front":"モルフォロジー演算","back":"白黒画像の小さな粒や穴を、形の大きさで整える処理","detail":"膨張と収縮を組み合わせ、決めた大きさより小さい白い粒を消したり、物の中の黒い穴を埋めたりする。消すのがオープニング、埋めるのがクロージング。しきい値処理の後始末に使うが、しきい値で取りこぼした部分までは直せない。","key":false,"src":""},{"id":"w059","category":"vision","sub":"","type":"word","front":"輪郭抽出（コンター）","back":"白黒画像から、物の外側のふちを線としてたどる処理","detail":"輪郭が取れると、面積・重心・外接する四角形などの形の情報を計算できる。物の位置や大きさを測る土台になる。ただし傾きに弱い量もあり、自分の検証では紙を43度回すと外接する四角形が1.75倍に膨らんだ。","key":false,"src":"DAY304"},{"id":"w060","category":"vision","sub":"","type":"word","front":"ROI（関心領域）","back":"画像の中で、処理の対象にする範囲だけを切り出した部分","detail":"見る範囲を絞ると計算が軽くなり、関係ない物の誤検出も減る。検出が不安定なときは、しきい値をいじる前に範囲を見直すと効く場合がある。mechArmでは、アームの胴体を白箱と誤検出したため、胴体の範囲を除外した。","key":false,"src":"DAY224"},{"id":"w061","category":"vision","sub":"","type":"word","front":"テンプレートマッチング","back":"見本の画像を少しずつずらし、似ている場所を探す方法","detail":"探したい物の見本画像を用意し、画像全体と重ねて一致度を計算する。手軽だが、大きさや向き、照明が見本と違うと弱い。mechArmでは白箱の見本を12枚撮り直し、一致度が0.547から0.994に上がった。","key":false,"src":"DAY165"},{"id":"w062","category":"vision","sub":"","type":"word","front":"特徴点マッチング","back":"二枚の画像から、同じ場所を指す特徴的な点を結びつける方法","detail":"角や模様の目立つ点を見つけ、その周りの様子を数値にして二枚の間で照合する。ORBやSIFTが代表的で、パノラマ合成や立体の復元に使う。自分の検証では、別の物を撮った写真どうしでも同じと判定される場合があった。","key":false,"src":"DAY309"},{"id":"w063","category":"vision","sub":"","type":"word","front":"物体検出（オブジェクトディテクション）","back":"画像の中の物を見つけ、四角い枠と名前と確からしさで返す処理","detail":"一枚に複数の物があっても、それぞれの位置と種類を出す。YOLOなどの学習済みモデルが代表例。画像全体に一つのラベルを付ける画像分類とは違い、どこに写っているかまで答える。自分の物を探させるには学習用データが要る。","key":true,"src":""},{"id":"w064","category":"vision","sub":"","type":"word","front":"バウンディングボックス（BBox）","back":"検出した物を囲むように描く、画像上の四角い枠","detail":"左上と右下の座標、または中心と幅と高さで表す。物体検出の標準的な出力形式。画面の縦横にそろえた枠が一般的で、斜めに置かれた物では余白が大きくなる。向きまで表す回転付きの枠もある。","key":false,"src":""},{"id":"w065","category":"vision","sub":"","type":"word","front":"IoU","back":"二つの枠がどれだけ重なっているかを、0から1で表す指標","detail":"重なった面積を、二つを合わせた面積で割って求める。1なら完全一致、0なら重なりなし。物体検出では、予測の枠と正解の枠のIoUが基準値以上なら当たりと数える。精度指標のmAPもこの判定の上に成り立つ。","key":false,"src":""},{"id":"w066","category":"vision","sub":"","type":"word","front":"セグメンテーション","back":"画像の画素ごとに、どの物に属するかを塗り分ける処理","detail":"四角い枠ではなく、物の形どおりの輪郭まで分かるので、掴む位置や向きを決めたいときに役立つ。最近は言葉で対象を指定できるモデルもある。自分の検証では、SAM 3が透明なガラス瓶とペットボトルを同じ物として切り出した。","key":false,"src":"DAY317"},{"id":"w067","category":"vision","sub":"","type":"word","front":"カメラ校正（キャリブレーション）","back":"カメラの特性や置き場所を、数値として求めておく作業","detail":"チェスボードなど寸法が分かった模様を何枚も撮って計算するのが一般的。求めた値を使うと、画像のゆがみを直したり、画像上の位置を実世界の位置へ変換したりできる。内部パラメータと外部パラメータの二つに分けて考える。","key":true,"src":""},{"id":"w068","category":"vision","sub":"","type":"word","front":"内部パラメータ","back":"焦点距離やレンズのゆがみなど、カメラ自体が持つ性質の値","detail":"画像の中心位置、焦点距離、レンズの歪み係数などを指す。カメラとレンズが同じなら、置き場所を変えても値は変わらない。mechArmの上カメラでは、ホモグラフィで十分な精度が出ていたため、チェスボードでの校正はやらない判断にした。","key":false,"src":"DAY192"},{"id":"w069","category":"vision","sub":"","type":"word","front":"外部パラメータ","back":"カメラが空間のどこに、どの向きで置かれているかを表す値","detail":"カメラの位置と向きを、ロボットや机の座標系に対する回転と平行移動で表す。カメラを動かしたりぶつけたりすると変わるので、取り直しが必要になる。内部パラメータと組み合わせると、画像の点と空間の点を対応づけられる。","key":false,"src":""},{"id":"w070","category":"vision","sub":"","type":"word","front":"ホモグラフィ","back":"ある平面の見え方を、別の視点から見た平面へ写しかえる変換","detail":"3行3列の行列で表し、斜めから撮った机の面を真上から見た形に直せる。対象が一つの平面上にある場合にだけ正しく成り立つ。mechArmでは、マットの四隅を検出し、ピクセル座標をmmに変換する行列を作った。","key":true,"src":"DAY164"},{"id":"w071","category":"vision","sub":"","type":"word","front":"視差（パララックス）","back":"見る位置が変わると、物の見える位置がずれて見える現象","detail":"二つのカメラの見え方のずれから距離を計算するのが、ステレオカメラの原理。一方で一台のカメラでは、高さの違いが位置のずれとして現れ、誤差の原因になる。mechArmでは、上カメラで見たZ方向のズレが視差だと分かり、横カメラが必要になった。","key":false,"src":"DAY191"},{"id":"w072","category":"vision","sub":"","type":"word","front":"深度カメラ（RGB-Dカメラ）","back":"色の画像と一緒に、各画素までの距離も測れるカメラ","detail":"赤外線の模様を当てる方式、光が返る時間を測る方式、二つのレンズの視差を使う方式がある。普通のカメラでは分からない高さや奥行きが取れる。mechArmでは、真上のカメラ写真だけではブロックが持ち上がったかをAIが判定できなかった。","key":true,"src":"DAY325"},{"id":"w073","category":"vision","sub":"","type":"word","front":"点群（ポイントクラウド）","back":"物の表面を、三次元の位置を持つたくさんの点の集まりで表したデータ","detail":"深度カメラやLiDARで得られ、各点がXYZの位置を持つ。画像と違い、物の立体的な形や距離をそのまま扱える。把持位置の計算や障害物の把握に使う。データ量が大きく、ノイズ除去や間引きなどの前処理が欠かせない。","key":false,"src":""},{"id":"w074","category":"servo","sub":"","type":"word","front":"経由点（ウェイポイント）","back":"動きの途中で通るように指定する、目印となる点","detail":"始点と終点だけでなく途中に経由点を置くと、障害物をよけたり、決まった姿勢を通らせたりできる。経由点の間をどうつなぐかは補間で決める。点を増やすほど動きは決まるが、教える手間も増える。","key":false,"src":""},{"id":"w075","category":"servo","sub":"","type":"word","front":"経路と軌道（パスとトラジェクトリ）","back":"経路は通る道筋、軌道はそこに時間と速さを加えたもの","detail":"経路はどこを通るかという形の情報だけを持つ。軌道は各時刻にどこにいるかまで決めたもので、速度や加速度も含む。実機に送るのは軌道。同じ経路でも速さの付け方で、動きの印象や安全性が大きく変わる。","key":true,"src":""},{"id":"w076","category":"servo","sub":"","type":"word","front":"補間（インターポレーション）","back":"離れた点と点のあいだを、なめらかな値でつないで埋めること","detail":"直線でつなぐ線形補間のほか、始めと終わりをゆっくりにする曲線の補間がある。教えた点が少なくても、補間で細かい動きを作れる。mechArmでは、実機の8点の動きをイーズインアウト補間で81点に広げた。","key":true,"src":"DAY152"},{"id":"w077","category":"servo","sub":"","type":"word","front":"速度プロファイル（加減速）","back":"動き出しから止まるまで、速さをどう変えるかの決め方","detail":"加速、一定速度、減速の三段で表す台形型が代表的。加速度の変化までなめらかにしたS字型は、揺れや衝撃が少ない。急に動き出したり止まったりすると、モーターや物に負担がかかり、見ている人も不安に感じやすい。","key":false,"src":""},{"id":"w078","category":"servo","sub":"","type":"word","front":"関節補間と直線補間","back":"関節の角度でつなぐか、手先の直線でつなぐかという補間の違い","detail":"関節補間は各関節の角度を同時に変えるので計算が軽いが、手先は曲線を描く。直線補間は手先がまっすぐ進むので、差し込みや真下への降下に向く。ただし途中ごとに逆運動学を解く必要があり、特異点の近くでは動けないことがある。","key":false,"src":""},{"id":"w079","category":"servo","sub":"","type":"word","front":"ティーチング（教示）","back":"ロボットに動きや位置を、人が直接教えて記録させること","detail":"操作盤で少しずつ動かして教える方法と、手でアームを動かして教えるダイレクトティーチングがある。教えた動きは何度でも再生できる。mechArmでは、関節の力を抜いて手で動かし、教えた軌道を実機で再生した。","key":true,"src":"DAY226"},{"id":"w080","category":"servo","sub":"","type":"word","front":"把持（グラスプ）","back":"グリッパーやハンドで、物をつかんで保持すること","detail":"どこを、どの向きで、どれくらいの力でつかむかを決める必要がある。つかめても、動かすうちに滑って落ちることがある。mechArmでは、爪を位置で止めるのをやめ、閉じ切らない目標値で押し込むように握ったら落ちなくなった。","key":true,"src":"DAY261"},{"id":"w081","category":"servo","sub":"","type":"word","front":"ピックアンドプレース（Pick&Place）","back":"物をつかんで持ち上げ、別の場所へ運んで置く一連の作業","detail":"産業用ロボットで最も基本的な作業の一つ。認識、接近、把持、搬送、解放がつながって初めて成立し、どこか一つの失敗で全体が止まる。mechArmでは、赤ブロックをつかんで運んで離す一連を、一本のスクリプトで初めて完走させた。","key":true,"src":"DAY176"},{"id":"w082","category":"servo","sub":"","type":"word","front":"アプローチと退避","back":"対象の手前まで近づく動きと、作業後に離れる動きのこと","detail":"いきなり目標へ向かわず、少し上の手前位置で一度止まり、そこからゆっくり近づく。作業後も来た方向へまっすぐ戻る。こうすると周りの物にぶつかりにくく、最後の位置合わせも安定する。","key":false,"src":""},{"id":"w083","category":"servo","sub":"","type":"word","front":"許容誤差（トレランス）","back":"目標に届いたとみなしてよい、ずれの許される範囲","detail":"目標とのずれがこの範囲に入ったら、到達や収束とみなして次の動作に進む。厳しすぎるといつまでも終わらず、緩すぎると作業に失敗する。mechArmの視覚サーボでは、8mmでは詰まり、12mmに緩めたところで爪が閉じた。","key":false,"src":"DAY208"},{"id":"w084","category":"servo","sub":"","type":"word","front":"動作計画（モーションプランニング）","back":"障害物を避けながら、目標までの動きを自動で求めること","detail":"ロボットの形と周りの障害物を考えて、ぶつからない経路を探す。RRTのように空間をランダムに探る方法がよく使われ、ROS2ではMoveItが標準的な道具になっている。見つけた経路は、そのあと速さを付けて軌道にする。","key":false,"src":""},{"id":"w085","category":"servo","sub":"","type":"word","front":"衝突回避","back":"ロボットが周りの物や人、自分の体にぶつからないようにすること","detail":"前もって障害物を避ける経路を計画する方法と、動作中にセンサーで検知して止める方法がある。持っている物の大きさも計算に入れる必要がある。mechArmでは、置くときにブロックの底が箱の縁に当たり、ブロックを持った状態で姿勢を教え直した。","key":false,"src":"DAY235"},{"id":"w086","category":"servo","sub":"","type":"word","front":"視覚サーボ（ビジュアルサーボ）","back":"カメラで見たずれを使い、目標に合うまで動きを直し続ける制御","detail":"見る、ずれを計算する、少し動く、をくり返して目標に近づける閉ループ制御。カメラや機体の誤差を、動きながら打ち消せる。mechArmでは、視覚サーボだけでブロックをつかむまでに21回のループを回した。","key":true,"src":"DAY208"},{"id":"w087","category":"servo","sub":"","type":"word","front":"アイインハンドとアイトゥハンド","back":"カメラを手先に付けるか、外に固定するかという二つの配置","detail":"手先に付けると対象に近づいて見られるが、動くたびに視点が変わる。外に固定すると全体を安定して見られるが、隠れた場所は見えない。mechArmは上の固定カメラを使い、手先用の部品はグリッパーと同時に付けられないと分かった。","key":false,"src":"DAY159"},{"id":"w088","category":"servo","sub":"","type":"word","front":"ハンドアイ校正（ハンドアイキャリブレーション）","back":"カメラとロボットの、位置と向きの関係を求める作業","detail":"ロボットをいくつかの姿勢に動かしながら目印を撮り、座標の変換を計算する。手先にカメラを付けるなら手先との関係、外に固定するなら土台との関係を求める。これがないと、カメラで見つけた物へ手先を正しく動かせない。","key":false,"src":""},{"id":"w089","category":"servo","sub":"","type":"word","front":"受け渡し（ハンドオーバー）","back":"ロボットと人のあいだで、物を手渡したり受け取ったりする動作","detail":"差し出す位置と高さ、離すタイミング、人が受け取ったかの判定が要になる。人の手が動作範囲に入るため、置く作業より安全への配慮が増える。mechArmでは、アームが差し出し人が受け取る設計を、外部レビュー4回を経て固めた。","key":false,"src":"DAY288"},{"id":"w090","category":"servo","sub":"","type":"word","front":"コンプライアンス（柔らかさ）","back":"外から力を受けたとき、ロボットが逆らわずに少したわむ性質","detail":"ばねのような柔らかい部品で作る機械的な方法と、力の検出と制御で作る方法がある。穴への差し込みや人との接触で、位置のずれや衝撃を吸収できる。位置を硬く守る位置制御とは、考え方が逆になる。","key":false,"src":""},{"id":"w091","category":"servo","sub":"","type":"word","front":"インピーダンス制御","back":"ばねとダンパーのような柔らかさを、制御でロボットに持たせる方法","detail":"目標位置からのずれと押し返す力の関係を、ばねの硬さと揺れの抑えで決める。力センサーやモーターの電流を使って実現し、押し付け作業や人との協働で使われる。力そのものを目標にする力制御とは区別される。","key":false,"src":""},{"id":"w092","category":"learning","sub":"","type":"word","front":"学習（トレーニング）","back":"データを使って、モデルの中の数値を少しずつ調整すること","detail":"予測と正解のずれを損失として計算し、それが小さくなる方向へパラメータを更新する。これを大量のデータでくり返す。計算が重く、GPUが必要になることが多い。学習が終わったモデルを使う段階は推論と呼んで区別する。","key":false,"src":""},{"id":"w093","category":"learning","sub":"","type":"word","front":"推論（インファレンス）","back":"学習済みのモデルに入力を渡し、答えを出させること","detail":"ロボットでは、画像や関節の状態を入力して次の動きを出させる。学習より計算は軽いが、動きを止めない速さが求められる。借りたクラウドのGPU（A40）でπ0.5を動かすと、一回の計算は平均97ミリ秒だった。","key":false,"src":"DAY326"},{"id":"w094","category":"learning","sub":"","type":"word","front":"観測と行動（オブザベーションとアクション）","back":"ロボットが受け取る情報と、それをもとに出す動きの指令","detail":"観測はカメラ画像や関節角など、行動は次の関節角や手先の移動量などを指す。ロボット学習のデータは、この二つを時刻でそろえた組の連続になる。時刻がずれると、どの観測からどの行動が出たのか読めなくなる。","key":false,"src":""},{"id":"w095","category":"learning","sub":"","type":"word","front":"方策（ポリシー）","back":"観測を受け取り、次にどう動くかを決める仕組み","detail":"強化学習でも模倣学習でも、学習で最終的に得るのはこの方策。ルールで書いた方策もあるが、ロボット学習ではニューラルネットワークで表すことが多い。モデルとほぼ同じ意味で使われるが、方策は観測から行動を決める役割を指す言葉。","key":true,"src":""},{"id":"w096","category":"learning","sub":"","type":"word","front":"エピソード","back":"タスクの開始から終了までの、ひと区切りの試行","detail":"強化学習や模倣学習のデータは、エピソード単位で集めて数える。一つのエピソードは、観測と行動の組が時間順に並んだもので、成功か失敗かもエピソードごとに記録する。AGIBOTの約100万エピソードに対し、mechArmは10エピソードから始めると考えた。","key":false,"src":"DAY140"},{"id":"w097","category":"learning","sub":"","type":"word","front":"デモンストレーション（実演データ）","back":"人がお手本として操作して見せた、動きの記録","detail":"人が遠隔操作や手で動かして作業をこなし、その観測と行動を記録する。模倣学習の材料になる。本数だけでなく、置き場所や手順のばらつき方が質を左右する。SO-101では、リーダーアームで実演を50本集める案を立てた。","key":false,"src":"DAY323"},{"id":"w098","category":"learning","sub":"","type":"word","front":"テレオペレーション（遠隔操作）","back":"人が離れた場所から、ロボットをリアルタイムに操作すること","detail":"コントローラーやVR、同じ形の操作用アームなどで動かす。操作用アームをリーダー、動く側をフォロワーと呼ぶ構成が、ロボット学習のデータ集めで広く使われる。人の判断が入るので、自律では難しい作業の実演も集められる。","key":true,"src":""},{"id":"w099","category":"learning","sub":"","type":"word","front":"模倣学習","back":"人の実演データをお手本に、ロボットに動きを覚えさせる学習","detail":"報酬を設計しなくても、見本があれば学べるのが利点。少ないデータで始めやすい反面、見本にない状況には弱い。強化学習と組み合わせることもある。mechArmでは、模倣学習に使える形で、試行の映像と関節データを同期して残し始めた。","key":true,"src":"DAY287"},{"id":"w100","category":"learning","sub":"","type":"word","front":"行動クローニング（BC）","back":"観測と行動の組を、そのまま真似るように学ぶ最も単純な模倣学習","detail":"実演データを、観測から行動を当てる問題として普通に学習する。手軽だが、少しずれると見本にない状態に入り、誤差が積み重なりやすい。人の実演はやり方がばらつくため、単純に平均を学ばせると動きが崩れる場合がある。","key":false,"src":""},{"id":"w101","category":"learning","sub":"","type":"word","front":"強化学習（RL）","back":"試行錯誤の結果に点数を付け、点数が高くなる動きを学ぶ方法","detail":"ロボットが動き、成功や失敗に応じた報酬を受け取り、報酬の合計が大きくなるように方策を更新する。お手本がなくても学べるが、膨大な試行が必要になる。そのため実機ではなく、シミュレーションで学習させることが多い。","key":true,"src":""},{"id":"w102","category":"learning","sub":"","type":"word","front":"報酬（リワード）","back":"行動の結果がどれだけ良かったかを示す、強化学習の点数","detail":"何に点を与えるかで、学習される動きが大きく変わる。設計が甘いと、意図しない近道で点だけ稼ぐ報酬ハッキングが起きる。mechArmでは、真上のカメラ写真を画像の読めるAIに渡し、掴めたか置けたかを判定させている。","key":true,"src":"DAY325"},{"id":"w103","category":"learning","sub":"","type":"word","front":"汎化","back":"学習で見たことのない状況でも、うまく動けること","detail":"物の置き場所、照明、背景、物の種類が変わっても成功するかで測る。データの多様さが汎化を左右する。学習時と同じ条件だけで成功率を測ると、実力を高く見積もってしまう。ロボット学習の最大の課題の一つ。","key":false,"src":""},{"id":"w104","category":"learning","sub":"","type":"word","front":"過学習（オーバーフィッティング）","back":"学習データを覚えすぎて、新しいデータに弱くなる状態","detail":"学習用データでは高い成績なのに、初めて見るデータで成績が落ちる。これを見分けるため、データを学習用・検証用・テスト用に分けて評価する。データを増やす、条件を散らすといった工夫で防ぐ。汎化と裏表の関係にある。","key":false,"src":""},{"id":"w105","category":"learning","sub":"","type":"word","front":"基盤モデル（ファウンデーションモデル）","back":"大量のデータで事前に学習され、多くの用途に転用できる大きなモデル","detail":"言語や画像の分野で広がり、ロボット向けの基盤モデルも登場している。一から学習するより、少ないデータで新しい作業に対応しやすい。ただしモデルが大きく、動かすには高性能なGPUが必要になることが多い。","key":false,"src":""},{"id":"w106","category":"learning","sub":"","type":"word","front":"事前学習（プレトレーニング）","back":"特定の作業の前に、大量の一般的なデータで学ばせておく段階","detail":"物の見え方や動きの一般的なパターンを先に身につけさせる。基盤モデルを作る段階にあたり、膨大な計算資源が必要で、主に大手が担う。個人や小さなチームは、公開された事前学習済みのモデルを使って始めることが多い。","key":false,"src":""},{"id":"w107","category":"learning","sub":"","type":"word","front":"ファインチューニング","back":"事前学習済みのモデルを、自分のデータで追加学習して合わせること","detail":"自分の機体、カメラの配置、作業内容に合わせるために行う。一から学習するより、少ないデータと計算で済む。ただし元のモデルの入力の形や関節の数に合わせる必要があり、データが少なすぎると過学習しやすい。","key":false,"src":""},{"id":"w108","category":"learning","sub":"","type":"word","front":"VLM（視覚言語モデル）","back":"画像と言葉を一緒に理解し、言葉で答えるAIモデル","detail":"画像について質問すると文章で答えられる。ロボットでは状況の説明、作業の計画、成功したかの判定などに使う。動きの指令そのものは出さない点がVLAとの違い。mechArmでは、掴みと置きの成否をVLMに判定させ、人の目を介さずに返している。","key":false,"src":"DAY235"},{"id":"w109","category":"learning","sub":"","type":"word","front":"VLA（視覚言語行動モデル）","back":"画像と言葉の指示から、ロボットの動きを直接出力するモデル","detail":"VLMに行動の出力を加えたもので、ロボット向け基盤モデルの主流になりつつある。π0やSmolVLAなどが公開されている。借りたクラウドのGPUでπ0.5を動かし、画像と指示を送って動きの数値を受け取るところまで通した。","key":true,"src":"DAY326"},{"id":"w110","category":"eval","sub":"","type":"word","front":"試行（トライアル）","back":"同じ条件で、ロボットに動作を1回やらせること","detail":"評価の最小単位。1回の結果は偶然に左右されるので、同じ条件で何回も試行して傾向を見る。置き場所や照明など、試行ごとの条件と結果を記録しておかないと、あとで比べたり原因を探したりできない。","key":true,"src":""},{"id":"w111","category":"eval","sub":"","type":"word","front":"成功率（サクセスレート）","back":"試行した回数のうち、成功した回数が占める割合","detail":"ロボット学習で最もよく使う評価の数字。パーセントだけでなく、何回中何回かを必ず添えて言う。回数が少ないと数字が大きくぶれる。mechArm では1日の63試行のうち、PICK の成功は41回だった。","key":true,"src":"DAY266"},{"id":"w112","category":"eval","sub":"","type":"word","front":"成功条件","back":"何をもって成功とするかを、試行の前に決めた基準","detail":"どこに置けば成功か、何秒以内なら成功か、などを試行の前に決めておく。基準があいまいだと、人や日によって判定が変わり、成功率を比べられなくなる。途中で基準を変えたら、それ以前の数字とは別に扱う。","key":false,"src":""},{"id":"w113","category":"eval","sub":"","type":"word","front":"ロギング（ログ）","back":"動作中の状態や結果を、あとで見返せるよう記録すること","detail":"指令値、実際に届いた値、時刻、成否などを残す。記録がなければ失敗の原因は推測でしか語れない。mechArm では通し動作1回ごとに、成否を台帳へ1行残す決まりにしている。","key":true,"src":"DAY249"},{"id":"w114","category":"eval","sub":"","type":"word","front":"データセット","back":"学習や評価に使うために集めて整理したデータのまとまり","detail":"画像、関節角、動作の記録などを、決まった形式でそろえたもの。学習用と評価用は分けておくのが基本。学習に使ったデータで評価すると、本当の実力より良い数字が出てしまう。","key":true,"src":""},{"id":"w115","category":"eval","sub":"","type":"word","front":"失敗モード","back":"失敗を、その起き方や原因ごとに分けた種類","detail":"成功率だけでは何を直せばよいか分からない。掴めなかったのか、置けなかったのかを分けて数えると、打ち手が見える。mechArm でも PICK 失敗と PLACE 失敗を分けて記録する設計にした。","key":false,"src":"DAY130"},{"id":"w116","category":"eval","sub":"","type":"word","front":"ベースライン","back":"改善の効果を比べるための、基準となる結果","detail":"何かを変える前の成績や、単純な方法での成績を基準として置く。基準がないと、良くなったのか分からない。mechArm では PLACE の接近が1回成立した状態を基準にして、次の改善に進もうとした。","key":true,"src":"DAY210"},{"id":"w117","category":"eval","sub":"","type":"word","front":"再現性","back":"同じ手順と条件で、同じ結果がもう一度得られること","detail":"1回うまくいっただけでは、偶然かもしれない。条件を記録し、繰り返して同じ結果が出るかを確かめる。mechArm でも、1回の成功だけでは閾値12mmで常に抜けられるとは言えず、再現テストが必要とした。","key":true,"src":"DAY208"},{"id":"w118","category":"eval","sub":"","type":"word","front":"誤差","back":"測った値や到達した位置と、本当の値とのずれ","detail":"ロボットではカメラの測定、関節の到達、計算モデルなど、あちこちで誤差が出る。誤差は大きく、いつも同じ向きにずれる系統誤差と、毎回ばらつく偶然誤差に分けて考える。","key":false,"src":""},{"id":"w119","category":"eval","sub":"","type":"word","front":"系統誤差","back":"原因が決まっていて、いつも同じ向きにずれる誤差","detail":"原因が決まっているので、見つけて補正しやすい。平均をとっても消えないのが特徴。mechArm では、計算上の手先と実機の爪先の間に、マット上の奥行き方向で約58mmの系統的なずれがあると、5点の実測で確かめた。","key":false,"src":"DAY178"},{"id":"w120","category":"eval","sub":"","type":"word","front":"偶然誤差（ばらつき）","back":"毎回ランダムに上下する、向きの決まらない誤差","detail":"回数を重ねて平均をとると小さくできる。どれくらいばらつくかは標準偏差で表す。mechArm の同じ測定では、左右方向のずれは向きが決まらず、プラスマイナス20mm程度のばらつきだった。","key":false,"src":"DAY178"},{"id":"w121","category":"eval","sub":"","type":"word","front":"正確さと精密さ","back":"狙いに近いのが正確さ、毎回そろうのが精密さ","detail":"的当てで言えば、中心に近いのが正確さ、矢がまとまっているのが精密さ。毎回同じ所にずれて当たるロボットは、精密だが正確ではない。どちらが足りないかで直し方が変わる。","key":false,"src":""},{"id":"w122","category":"eval","sub":"","type":"word","front":"外れ値","back":"他のデータから大きく離れた、例外的な値のこと","detail":"測定の失敗や一時的なノイズで出ることが多い。そのまま平均に入れると結果がゆがむ。ただし外れ値が本当の問題を示すこともあるので、黙って捨てず理由を残す。mechArm のマット四隅検出では、外れ値を除いてから平均した。","key":false,"src":"DAY164"},{"id":"w123","category":"eval","sub":"","type":"word","front":"アノテーション","back":"画像やデータに、人が正解の情報を書き込む作業","detail":"物体を枠で囲む、輪郭をなぞる、点を打つ、などの種類がある。学習用データ作りで最も時間がかかる工程といわれる。付ける人によって基準がぶれないよう、先に手順と判断のルールを決めておく。","key":false,"src":""},{"id":"w124","category":"eval","sub":"","type":"word","front":"正解データ（グラウンドトゥルース）","back":"評価の基準にする、本当の値とみなすデータ","detail":"評価する仕組みとは別の方法で作るのが原則。同じ仕組みで正解を作ると、間違いに気づけない。画像認識シリーズでは、表紙の四隅の真値を手動のアノテーションで作り、評価対象と分けた。","key":false,"src":"DAY309"},{"id":"w125","category":"eval","sub":"","type":"word","front":"評価指標（メトリクス）","back":"性能を数字で表すために使う、決まった物差し","detail":"成功率、位置の誤差、作業にかかる時間などがある。何を指標にするかで、改善の向かう方向そのものが変わる。一つの数字だけを追いかけると、安全性や動きの質など、他の大事な性質を見落としやすい。","key":false,"src":""},{"id":"w126","category":"eval","sub":"","type":"word","front":"ベンチマーク","back":"性能を比べるための、共通の課題と評価のやり方","detail":"同じ課題、同じ手順、同じ指標で測るので、違う手法どうしを公平に比べられる。研究の進み具合を示す共通の物差しになる。ただし、ベンチマークで高得点でも、自分の現場で同じように通用するとは限らない。","key":false,"src":""},{"id":"w127","category":"eval","sub":"","type":"word","front":"統計的なぶれ（信頼区間）","back":"試行回数が少ないと、成功率が偶然だけで動く幅","detail":"回数が少ないほど、たまたまの結果に引っ張られる。小さな差を手法の差と言うには、十分な回数が要る。成功率50%前後で30回だと、95%の範囲で上下に約18ポイントぶれると記事で見積もった。","key":false,"src":"DAY323"},{"id":"w128","category":"eval","sub":"","type":"word","front":"分布外（OOD）","back":"学習のときに見たことのない、新しい条件やデータ","detail":"照明、置き場所、物の形や色などが学習時と違うと、性能が大きく落ちやすい。評価では、学習と同じ条件だけでなく、あえて分布外の条件でも試して、汎化の力がどこまであるかを確かめる。","key":false,"src":""},{"id":"w129","category":"eval","sub":"","type":"word","front":"アブレーション","back":"部品を一つずつ外して、それぞれの効き目を確かめる実験","detail":"手法のどの要素が成績に効いているかを切り分けるために行う。全部入りの結果だけでは、何が効いたのか分からない。研究論文ではほぼ必ず載っている比較のやり方で、読むときの大事な手がかりになる。","key":false,"src":""},{"id":"w130","category":"principles","sub":"","type":"word","front":"反復開発（イテレーション）","back":"小さく作って試し、直す流れを何度も回す進め方","detail":"最初から完成形を狙わず、動く最小のものを作って試し、その結果から次の一手を決める。ロボットは実機で試して初めて分かることが多いので、特にこの進め方が合う。1回の周期を短くするほど、学びが速くなる。","key":true,"src":""},{"id":"w131","category":"principles","sub":"","type":"word","front":"仮説検証","back":"原因の予想を立て、実験でそれが正しいか確かめること","detail":"予想は一度に一つずつ確かめる。外れた仮説も、原因の候補を減らす成果になる。mechArm で関節が届かない問題では、待ち時間を短くしても6回とも届き、待ち時間は主因でないと分かった。","key":false,"src":"DAY273"},{"id":"w132","category":"principles","sub":"","type":"word","front":"切り分け","back":"問題の範囲を少しずつ狭めて、原因の場所を特定すること","detail":"全体をまとめて疑うのではなく、部品ごとに分けて単独で動かし、どこで壊れるかを探す。mechArm では動かない739行のスクリプトを、6つの単体スクリプトに分けて調べた。","key":false,"src":"DAY211"},{"id":"w133","category":"principles","sub":"","type":"word","front":"ボトルネック","back":"全体の速さや性能を、いちばん強く制限している部分","detail":"瓶の首のように、そこが詰まると全体が詰まる。他を速くしても全体は速くならないので、まず測って場所を見つける。mechArm の画像検出では、グレースケール化で14.48秒が5.09秒に縮んだ。","key":true,"src":"DAY211"},{"id":"w134","category":"principles","sub":"","type":"word","front":"根本原因分析（RCA）","back":"表に出た症状ではなく、問題を生んだ大もとを突き止めること","detail":"症状だけを直すと、形を変えて再発する。なぜを繰り返して大もとまでたどる。mechArm では、補正値をいじっても爪が合わない原因が、手首と爪先の位置の違いにあると分かった。","key":true,"src":"DAY162"},{"id":"w135","category":"principles","sub":"","type":"word","front":"段階的検証","back":"小さな単位から順に確かめ、少しずつ範囲を広げる検証","detail":"部品単体、部品をつないだ状態、実機での通し動作、の順に進める。いきなり全体を動かすと、失敗しても原因がどこにあるか分からず、ロボットや周りの物を壊す危険もある。前の段階が通ってから次へ進む。","key":true,"src":""},{"id":"w136","category":"principles","sub":"","type":"word","front":"ドライラン（dry-run）","back":"実際には動かさず、計画や処理の流れだけを試すこと","detail":"ロボットに指令を送らずに、計算結果や動作の予定を確認できる。危険な動作の前の安全確認として使う。mechArm では、dry-run で計画を確かめてから本番の PICK から PLACE を通す順番を決めた。","key":false,"src":"DAY256"},{"id":"w137","category":"principles","sub":"","type":"word","front":"フェイルセーフ","back":"故障や異常が起きても、安全な側に倒れるようにする設計","detail":"信号が途切れたら止まる、電源が落ちたらブレーキがかかる、などが代表例。ただし止まること自体が危険な場合もあるので、その機械にとって何が安全な状態なのかを、設計の最初に決めておく必要がある。","key":true,"src":""},{"id":"w138","category":"principles","sub":"","type":"word","front":"フォールバック","back":"主な方法が使えないときに切り替える、代わりの手段","detail":"便利な反面、気づかないうちに代わりの道で動き続ける危険がある。mechArm では、記録先の外付けドライブがないときに別の場所へ書かず、そこで止める設計にした。","key":false,"src":"DAY244"},{"id":"w139","category":"principles","sub":"","type":"word","front":"非常停止（E-stop）","back":"異常時に、人がすぐロボットを止めるための仕組み","detail":"押しボタンなどで、すぐ確実に止められることが求められる。電源を切るだけでは、関節の保持力が抜けて腕が落ちることがある。mechArm の受け渡し設計でも、電源断は非常停止とは言えないと指摘された。","key":false,"src":"DAY288"},{"id":"w140","category":"principles","sub":"","type":"word","front":"インターロック","back":"条件がそろわない限り、動作できないようにする仕組み","detail":"安全柵の扉が開いたらロボットが動かない、などが代表例。人の注意や記憶に頼らず、仕組みで危険な組み合わせを起こさせない。ソフトウェアで、条件がそろわないと次の処理に進まないようにするのも同じ考え方。","key":false,"src":""},{"id":"w141","category":"principles","sub":"","type":"word","front":"安全マージン","back":"限界ぎりぎりではなく、余裕を残して決める設定の幅","detail":"関節の可動範囲や速度、力の上限を、仕様の限界よりも内側に設定する。誤差やばらつきが出ても、危険な状態に入らないようにするため。余裕を取りすぎると、今度はできる動きが狭くなるので、実測で決める。","key":false,"src":""},{"id":"w142","category":"principles","sub":"","type":"word","front":"最小構成（MVP）","back":"目的を確かめるのに必要な、いちばん小さな形","detail":"機能を足す前に、核になる部分だけで目的が成り立つかを確かめる。早く試せて、無駄な作り込みを防げる。足りないものは試したあとで実測して分かるが、余計なものは作ったあとでは気づきにくい。","key":false,"src":""},{"id":"w143","category":"principles","sub":"","type":"word","front":"技術的負債","back":"その場しのぎの実装が、あとで修正の手間として返ってくること","detail":"急いで書いたコードや、場当たりの補正値が典型。動いているうちは問題に見えないが、あとから直すほど手間が増え、別の変更の足を引っぱる。借金と同じで、気づいたら早めに返すほうが安くつく。","key":false,"src":""},{"id":"w144","category":"principles","sub":"","type":"word","front":"コードレビュー","back":"書いたコードを、別の人や別の目で確認すること","detail":"書いた本人は同じ思い込みを持つので、自分では見落としに気づきにくい。mechArm でも、関節制御で繰り返し止まる問題は、自分の仮説だけで進めず外部のレビューに通した。","key":false,"src":"DAY235"},{"id":"w145","category":"principles","sub":"","type":"word","front":"HRI（ヒューマンロボットインタラクション）","back":"人とロボットのやり取りや関わり方を扱う分野","detail":"安全だけでなく、分かりやすさ、安心感、信頼などを扱う。研究分野であると同時に、設計の実務でもある。mechArm では、アームが差し出したブロックを人が受け取る動作を設計した。","key":true,"src":"DAY288"},{"id":"w146","category":"principles","sub":"","type":"word","front":"動きの分かりやすさ（レジビリティ）","back":"動きを見ただけで、ロボットの狙いが人に伝わる性質","detail":"どの物を取りに行くのかが、途中の動きから早めに分かると、人は安心して横で作業できる。最短で効率のよい動きが、人にとって一番分かりやすい動きとは限らない。HRI の研究でよく扱われる性質。","key":false,"src":""},{"id":"w147","category":"principles","sub":"","type":"word","front":"ヒューマンインザループ","back":"判断や修正の流れの中に、人を組み込んだ仕組み","detail":"ロボットに全部を任せず、迷った場面や失敗しかけた場面で人が判断したり手を貸したりする。学習の場面では、人が途中で修正した内容をそのままデータとして使い、学習を早める方法もある。","key":false,"src":""},{"id":"w148","category":"society","sub":"","type":"word","front":"産業用ロボット","back":"工場で溶接や組立、搬送などを自動で行うロボット","detail":"主に安全柵の中で、決まった動きを高速かつ正確に繰り返す。自動車や電子部品の工場が代表的な現場。人と同じ空間で働く協働ロボットとは、安全の考え方や求められる性能の優先順位が違う。","key":true,"src":""},{"id":"w149","category":"society","sub":"","type":"word","front":"協働ロボット（コボット）","back":"柵なしで、人のそばで一緒に働けるよう作られたロボット","detail":"力の制限や接触の検知などで、人と同じ空間で使えるよう作られている。速度や力は産業用ロボットより抑えめ。ただし協働ロボットを使えば自動的に安全、ではない。使い方ごとにリスクアセスメントが必要になる。","key":true,"src":""},{"id":"w150","category":"society","sub":"","type":"word","front":"サービスロボット","back":"工場の外で、人の生活や仕事を手伝うロボット","detail":"配膳、清掃、警備、案内、介護などの分野で使われる。工場と違って、環境が整えられていない場所で、しかも一般の人のそばで動く。そのため想定外の出来事が多く、安全と使いやすさの設計が難しい。","key":false,"src":""},{"id":"w151","category":"society","sub":"","type":"word","front":"AGV（無人搬送車）","back":"床の線や印に沿って、決まった経路で荷物を運ぶ車","detail":"磁気テープや床の印などで経路を決め、その上を走る。動きが決まっているので安定して使える反面、経路を変えるには設備の工事が要る。地図を持って自分で道を選ぶ AMR との違いが、よく比べられる。","key":false,"src":""},{"id":"w152","category":"society","sub":"","type":"word","front":"AMR（自律移動ロボット）","back":"地図とセンサで、自分で道を選んで移動するロボット","detail":"センサで周りを見ながら、障害物を避けて経路をその場で決め直せる。倉庫や工場の搬送でよく使われる。床に線を引く必要がないので、棚の配置を変えるなどのレイアウト変更にも強い。","key":false,"src":""},{"id":"w153","category":"society","sub":"","type":"word","front":"ヒューマノイド","back":"人に近い体の形をした、二足歩行などのロボット","detail":"人向けに作られた建物や道具を、そのまま使える可能性があるとして注目されている。一方で、機構が複雑で値段が高く、転倒などの安全面の課題もある。現場で安定して働かせるのは、まだ難しい段階にある。","key":false,"src":""},{"id":"w154","category":"society","sub":"","type":"word","front":"省人化","back":"作業に必要な人の数を、機械化や自動化で減らすこと","detail":"人手不足への対策として、日本の製造や物流の現場でよく使われる言葉。人を完全になくす無人化とは違い、判断や例外対応など人が担う部分を残しながら、人の数や負担を減らしていく考え方。","key":false,"src":""},{"id":"w155","category":"society","sub":"","type":"word","front":"タクトタイム","back":"製品1個を作るのに許される、生産上の目標時間","detail":"生産したい数と使える時間から決まる時間で、ロボットの動作はこの中に収まる必要がある。実際に1個の作業にかかる時間であるサイクルタイムとは別の言葉なので、混同しないよう注意する。","key":false,"src":""},{"id":"w156","category":"society","sub":"","type":"word","front":"SIer（システムインテグレータ）","back":"ロボットを現場に合わせて組み込み、仕組みとして納める会社","detail":"ロボット本体だけでは仕事にならず、ハンドや周辺機器、プログラムを組み合わせて初めて現場で動く。日本のロボット導入の多くは、この SIer が支えている。人手が足りず、導入の待ちが生まれることもある。","key":true,"src":""},{"id":"w157","category":"society","sub":"","type":"word","front":"PoC（概念実証）","back":"本格導入の前に、小さく試して効果を確かめること","detail":"現場の一部で小さく試し、技術的にできるか、効果が出るかを確かめる。本格導入の前に失敗の芽を見つけられる。一方で、試すだけで本番に進まないPoC止まりが、業界の課題としてよく語られる。","key":false,"src":""},{"id":"w158","category":"society","sub":"","type":"word","front":"ROI（投資対効果）","back":"かけたお金に対して、どれだけの効果が返ってくるかの指標","detail":"ロボット導入では、本体の値段だけでなく、組み込み、保守、教育にかかる費用も含めて考える。何年で元が取れるかという回収期間とあわせて、導入するかどうかを決める主な判断材料になる。","key":true,"src":""},{"id":"w159","category":"society","sub":"","type":"word","front":"安全柵","back":"ロボットの動く範囲に、人が入れないよう囲う柵","detail":"産業用ロボットの基本的な安全対策。扉が開くと止まるインターロックと組み合わせて使う。柵が要らない使い方をするには、リスクアセスメントで安全を確かめる必要がある。","key":false,"src":""},{"id":"w160","category":"society","sub":"","type":"word","front":"リスクアセスメント","back":"危険を洗い出し、その大きさを見積もって対策を決める手順","detail":"どんな危険があるか、起きたらどれくらい重いかを評価する。対策は、まず設計で危険を減らし、次に保護装置、最後に注意表示や教育の順で考える。ロボットの安全の出発点になる手順。","key":true,"src":""},{"id":"w161","category":"society","sub":"","type":"word","front":"安全規格（ISO 10218）","back":"産業用ロボットの安全について定めた国際規格","detail":"ロボット本体の作り方と、現場への組み込み方の両方について安全の要求を定めている。日本ではこれに対応したJIS規格がある。2025年の改訂で、協働の使い方を定めた技術仕様 ISO/TS 15066 の内容も取り込まれた。","key":false,"src":""},{"id":"w162","category":"society","sub":"","type":"word","front":"機能安全","back":"制御の仕組みが壊れても、安全を保てるようにする考え方","detail":"センサやプログラムが故障することを前提に、安全を担う機能の信頼性を決めて作る考え方。ふつうの機能とは別に、安全のための機能を設計し、どれだけ確実に働くかを評価する。機械や車でも使われる。","key":false,"src":""},{"id":"w163","category":"society","sub":"","type":"word","front":"RaaS（ロボットアズアサービス）","back":"ロボットを買わずに、月額などの利用料で使う仕組み","detail":"ロボットを買い取らずに使えるので、初期費用を抑えられる。保守や更新も提供する側がまとめて受け持つ。導入のハードルを下げる売り方として、物流や清掃などのサービス分野で広がっている。","key":false,"src":""},{"id":"w164","category":"society","sub":"","type":"word","front":"フィジカルAI（Physical AI）","back":"現実の世界を認識し、体を動かして働くAI","detail":"画面の中で文章や画像を作るAIと違い、ロボットなどの体を通して、現実の物に働きかける。カメラの映像や言葉の指示から動作を決めるモデルが発展したことで、業界の注目が一気に集まっている。","key":true,"src":""},{"id":"k001","category":"kinematics","sub":"","type":"lesson","front":"人の感覚・ロボットのコード・シミュで「X」の向きが違い、指示がすれ違う。どうする？","back":"座標系を1つに決めて、全部をそこにそろえる","detail":"mechArm では、人の直感（マット上で X=左右）、ロボット座標（X=前後・Y=左右・Z=高さ）、Unity（X=左右・Y=高さ・Z=前方）で X の意味が3通りに分かれ、会話が何度も噛み合わなかった。Unity 座標系に全部統一すると、Claude Code への指示も一貫した用語で書けるようになった。","key":true,"src":"DAY149・DAY158・DAY160","kw":[["座標系","座標","ざひょう"],["1つ","ひとつ","一つ","統一"],["そろえる","揃える","合わせる","あわせる"]]},{"id":"k002","category":"kinematics","sub":"","type":"lesson","front":"あるツールで作ったロボットの寸法や座標を、別のツールへ移したい。値を写す前に最初に何を確かめる？","back":"ツールをまたぐときは、右手系か左手系か・どの軸が上かを確かめる","detail":"ROS は右手系、Unity は左手系で、上を向く軸も違う。URDF の値を Unity へ移すときは Unity.x=ROS.x、Unity.y=ROS.z、Unity.z=ROS.y と軸を入れ替える必要があった。","key":false,"src":"DAY133","kw":[["右手系","みぎてけい","右手"],["左手系","ひだりてけい","左手"],["上","うえ","どの軸","軸"]]},{"id":"k003","category":"kinematics","sub":"","type":"lesson","front":"カメラから目標への変換の誤差は小さいのに、アームが目標と逆方向へ動いた。まず何を疑う？","back":"逆に動いたら、まず変換の符号を疑う","detail":"lookup の距離は0.7mmなのに、アームがブロックと逆へ動いた。画像→平面座標の校正の Y 軸の符号が最初から逆だった。実機で j0 を−30°動かして手先の向きを見て分かり、1行の符号修正で直った。","key":false,"src":"DAY154","kw":[["逆","ぎゃく","反対"],["符号","ふごう","プラスマイナス","向き"],["疑う","うたがう","確かめる"]]},{"id":"k004","category":"kinematics","sub":"","type":"lesson","front":"カメラ座標とロボット座標を1点で合わせたら、その点は合うのに別の場所で大きくずれる。どうする？","back":"座標の対応は1点でなく、複数の実測点で結ぶ","detail":"原点も向きも違うので、1点で合わせたオフセット式は別の位置で X 約38mm・Y 約50mm ずれた。ホモグラフィの対応点にロボット座標の実測値を入れ、画素→ロボット座標を直接出す方式に変えた。","key":false,"src":"DAY144","kw":[["1点","いってん","一点"],["複数","ふくすう","たくさん"],["実測","じっそく","測った","はかった"]]},{"id":"k005","category":"kinematics","sub":"","type":"lesson","front":"計算上の手先の位置は目標に合っているはずなのに、実際に掴む位置がずれる。まず何を見直す？","back":"手先の基準点は、作業が起きる場所に置く","detail":"FK表を手首（link6）の位置で作っていたため、白箱中心への最近傍が69mm離れていた。基準を左右の爪先の中点に変えてスキャンし直すと0.43mmになった。","key":false,"src":"DAY157","kw":[["基準点","きじゅんてん","基準"],["作業","さぎょう","掴む","つかむ"],["場所","ばしょ","位置","ところ"]]},{"id":"k006","category":"kinematics","sub":"","type":"lesson","front":"カメラを見ながら追従させる制御が目標に収束せず、行ったり来たりの振動を続ける。まず何を疑う？","back":"関節の効く向きは推論せず、その姿勢で実測する","detail":"「j1+, j2+, j4- で Z+ に動く」と幾何で推論していたが、実測では逆に Z- へ動いた（-12.64mm）。毎フレーム逆向きの指令が出ていた。4ケースの実測で3関節の符号を反転し、常駐デーモン化と合わせて1.7秒で2.9mmに収束した。","key":true,"src":"DAY186・DAY189","kw":[["効く向き","効き","きき","向き"],["推論","すいろん","頭で","机上"],["実測","じっそく","測る","はかる"]]},{"id":"k007","category":"kinematics","sub":"","type":"lesson","front":"アームを動かす始点と終点は、どちらも人や物に当たらない安全な姿勢。その間の移動も安全と言える？","back":"始点と終点が安全でも、途中の通り道を確かめる","detail":"外部レビューで「関節補間中の爪・肘・手首が一時的に人側へ膨らまない保証はない」と指摘された。mechArm の受け渡し設計では、中間姿勢を FK 表から選び、全リンクが通る空間を Unity で確認してから、人なし実機→ダミー手→補助者同席の順で試す計画にした。","key":false,"src":"DAY288","kw":[["始点","してん","スタート"],["終点","しゅうてん","ゴール"],["途中","とちゅう","通り道","経路","けいろ"]]},{"id":"k008","category":"kinematics","sub":"","type":"lesson","front":"手先の目標位置から関節角を求める計算が、収束しなかったり実機とずれたりする。どうする？","back":"逆に解くより、確かめた姿勢から順方向の表を作る","detail":"CCD IK は5日試しても収束せず（途中で試した勾配降下の数値 IK も最高4%）、ikpy の解析的 IK は1,066点すべて「成功」と出たが、実機確認済みの角度と全関節で大きくずれた。確認済み姿勢から関節角をずらして FK で記録する表に切り替えた。","key":true,"src":"DAY149・DAY150","kw":[["逆","ぎゃく","逆問題","逆運動学"],["確かめた","確認した","たしかめた","確認済み","かくにんずみ"],["順方向","順","じゅん","順運動学"],["表","ひょう","テーブル","対応表"]]},{"id":"k009","category":"kinematics","sub":"","type":"lesson","front":"姿勢の表から目標位置に一番近い点を選んだのに、高さも腕の形も全然違う姿勢になった。どうする？","back":"位置だけで選ばず、姿勢と高さも条件に入れる","detail":"6軸アームには同じ先端座標で姿勢が大きく違う点が複数あり、XZ 距離だけの最近傍は3Dで32mmずれた点を拾った。確定 PICK 姿勢の j2〜j5 に近い候補と目標の高さ範囲で絞ってから選ぶようにした。","key":true,"src":"DAY170・DAY177","kw":[["位置だけ","いちだけ","位置"],["姿勢","しせい","腕の形"],["高さ","たかさ"],["条件","じょうけん","絞る","しぼる"]]},{"id":"k010","category":"kinematics","sub":"","type":"lesson","front":"昨日まで掴めていた物に、手先が数cmずれて降りた。上空への接近と降下の姿勢で、何を確かめる？","back":"つながる動作は、前の姿勢から外れない範囲で選ぶ","detail":"接近は円弧 lookup（j0=-17）、降下は FK 最近傍（j0=-26）で9°食い違い、下ろしながら横に振っていた。接近も上空の FK 表引きにそろえ、降下の j0 を接近の±3°に拘束すると、PICK→P エラー）","back":"1回ごとの小さなずれが、次の判断に持ち越されて積み重なること","detail":"模倣学習の方策は自分の動いた結果を次の入力にするため、小さなずれが重なると、お手本にない状態へ外れていく。一歩ずつは見えないほど小さくても、合計では大きくなる。記事では、ブロックを持って肩を上げる指令が毎回約2°足りず、0.5秒ずつ動かした回は合計41.2°の指令に対し11.1°しか上がらなかった。","key":false,"src":"LOG361"},{"id":"w177","category":"learning","sub":"","type":"word","front":"π0.5（パイレイテンゴ）","back":"画像と言葉の指示からロボットの動きを出す公開モデル","detail":"米国の Physical Intelligence 社が重みを公開している視覚言語行動モデル。自分の機体のお手本で追加学習できる。記事では、上から見た画像と6つの関節角を受け取り、次の1秒ぶんの関節角を返すモデルとして使った。","key":false,"src":"DAY337・LOG341・LOG396・LOG401"},{"id":"w178","category":"learning","sub":"","type":"word","front":"ACT（アクト）","back":"動きをまとめて予測する小さな模倣学習モデル","detail":"Action Chunking with Transformers の略で、人のお手本から行動のまとまりを予測する軽い模倣学習の手法。学習が安く、比べる基準にしやすい。記事では、公開モデルの実機比較で人が安全のために止めた回が一度もなかったため、π0.5 と並べる物差しの候補にした。","key":false,"src":"LOG396"},{"id":"w179","category":"learning","sub":"","type":"word","front":"損失（ロス・loss）","back":"正解とモデルの答えのずれを数字にしたもの","detail":"学習ではこの値が小さくなるように重みを直していく。小さいほどお手本に近いが、下がっても実機で良くなるとは限らない。記事では、続きからの学習で 0.0075 から 0.0028 に下がったが、実機では人の直しが残った。","key":true,"src":"LOG341・LOG348・LOG417・LOG422"},{"id":"w180","category":"learning","sub":"","type":"word","front":"学習率（ラーニングレート）","back":"1回の学習でモデルをどれだけ大きく直すかの強さ","detail":"大きすぎると学習が暴れ、小さすぎると進まない。最初に少しずつ上げる立ち上がりと、終わりに下げる仕組みを組み合わせることが多い。記事では、続きからの学習なので最大を 2.5e-5 に弱め、立ち上がり100ステップ、1,500ステップで下げきる形にした。","key":false,"src":"LOG417"},{"id":"w181","category":"learning","sub":"","type":"word","front":"チェックポイント","back":"学習の途中や終わりに保存したモデルの重み","detail":"ここから推論したり、続きから学習を再開したりできる。どの時点の重みかを名前で残すと、結果をたどり直せる。記事では、4,000ステップ目の重みを出発点に、人の直しを足して続きから学習した。","key":false,"src":"LOG345・LOG348・LOG417"},{"id":"w182","category":"learning","sub":"","type":"word","front":"オープンウェイト（重み公開モデル）","back":"学習済みの重みが公開され手元で動かせるモデル","detail":"重みを手元に固定できるので、同じ条件で他の人が結果を再現しやすい。クラウドのAPIだけのモデルは裏で更新されることがある。記事では、重みが公開されていて追加学習できることを、π0.5 を選ぶ理由に挙げた。","key":false,"src":"LOG396"},{"id":"w183","category":"hardware","sub":"","type":"word","front":"GPUメモリ（VRAM）","back":"GPUがモデルやデータを載せておく作業場所","detail":"足りなければ学習は遅くなるのではなく始まらない。速さや値段を比べる前に、まず必要な量に届くかで候補が決まる。記事では、LoRA学習の目安が22.5GB超で、最初に計画した16GBのGPUは届かなかった。","key":true,"src":"LOG368"},{"id":"w184","category":"hardware","sub":"","type":"word","front":"クラウドGPU（GPUの時間貸し）","back":"GPU付きの計算機を時間単位で借りる仕組み","detail":"買わずに必要なときだけ大きなGPUを使える。置いておくだけの時間も課金され、使い終わったら削除までしないと料金が続く。記事では、約75万円のPCを買わずに借りて、7回の学習と実機テストのGPU代は記録のある分で4,677円だった。","key":false,"src":"LOG341・LOG345・LOG355・LOG368・LOG401"},{"id":"w185","category":"society","sub":"","type":"word","front":"損益分岐点（ブレークイーブン）","back":"買うと借りるの費用が逆転する使用量","detail":"これより多く使うなら買う方が、少ないなら借りる方が安くなる境目。使う時間や置いておく割合など、前提を変えると動く。記事の計算機の初期値では、買う方が安くなるのは月約178時間からだった。","key":false,"src":"LOG368"},{"id":"w186","category":"hardware","sub":"","type":"word","front":"ジョグ運転（jog）","back":"押している間だけ一定の速さで動き続ける命令","detail":"目標角度を何度も送り直す代わりに、動き始めと止めの命令だけで連続して動かす方式。止める命令や通信切れで止める見張りが要る。記事では、送り直し方式ではなめらかにならず、ジョグ命令に応えるかを測る試しを用意した。","key":false,"src":"LOG436"},{"id":"w187","category":"principles","sub":"","type":"word","front":"敵対的検証（レッドチーミング）","back":"粗を探す前提で別の目に読ませ、誤りを洗い出すこと","detail":"同じ書き手が確かめると同じ所を見落とすため、別の人やAIにあえて弱点を突かせる。記事では、判断用のページを別のAIに読ませ、誤り2件・誤解を招く12件・改善4件の合計18件を直した。","key":false,"src":"LOG368"},{"id":"w188","category":"sim","sub":"","type":"word","front":"離散イベントシミュレーション（DES）","back":"出来事が起きた瞬間だけを追って時間を進める計算","detail":"客が来る、料理ができる、誰かが運ぶといった出来事を時刻順に並べ、数に限りのある人や設備の取り合いで生まれる待ちを数える方法。物の位置や動きは扱わない。記事では飲食店のピーク2時間を再現し、店・人数・台数・使い方の7,665条件を回した。","key":true,"src":"LOG351"},{"id":"w189","category":"sim","sub":"","type":"word","front":"SimPy（シムパイ）","back":"Pythonで離散イベントシミュレーションを組む道具","detail":"時計にあたる環境、1組の客の流れにあたるプロセス、卓やスタッフのように数に限りのあるリソースの3つの部品で組む。記事ではピークの2時間を1回あたり1秒もかからずに進め、配膳のほか病院搬送や夜間清掃など5つの現場の試算にも使った。","key":false,"src":"LOG351・LOG356"},{"id":"w190","category":"sim","sub":"","type":"word","front":"待ち行列（キュー）","back":"手が空くまで順番を待つ列と、その長さや待ち時間の考え方","detail":"窓口の数、来る間隔、さばく時間で、待ちがどれだけたまるかが決まる。記事の5現場の試算は、ロボットの仕事と、ロボットに呼ばれる人の順番待ちの2段で組んだ。","key":false,"src":"LOG356"},{"id":"w191","category":"sim","sub":"","type":"word","front":"ポアソン到着（ランダムな来客）","back":"来る間隔がばらばらで、平均の頻度だけが決まった来方","detail":"来る間隔が指数分布に従うと、一定時間に来る数はポアソン分布になる。客や注文の来方を表す定番の置き方。記事の試算では、来客の間隔を指数分布で決め、1日の件数もポアソンでばらつかせた。","key":false,"src":"LOG356・LOG359"},{"id":"w192","category":"service","sub":"","type":"word","front":"稼働率（利用率）","back":"人や設備が、時間のうち手がふさがっている割合","detail":"稼働率が100%に近づくと、小さな揺れでも待ちが急に伸びる。記事では、試算のピークでスタッフの手が95%ふさがっていて、1組にかかる時間の1割に満たない差でも人手が足りなくなった。ロボット2台を入れると82%から76%に下がる例もあった。","key":true,"src":"LOG366・LOG379・LOG397"},{"id":"w193","category":"sim","sub":"","type":"word","front":"ウォームアップ期間（慣らし期間）","back":"空の状態から始めた直後を、数えずに捨てる時間","detail":"シミュレーションは空の店や空の工場から始まるので、ふだんの状態に落ち着くまでの最初の時間を集計から外す。記事では最初の60分を数えずに回すと、多くの条件で待ちが伸び続け、慣らしを120分にしただけで待ちが倍近くになった。","key":false,"src":"LOG359"},{"id":"w194","category":"eval","sub":"","type":"word","front":"感度分析","back":"仮の値を1つずつ動かし、結論がどれだけ変わるかを見ること","detail":"どの前提が結果を大きく動かすかを知り、測る優先順位を決めるために使う。記事では仮の値4つを振り、止まる割合は0%から90%まで動かしても7秒しか変わらず、止まる長さ・動けなくなる割合・走る速さの3つが効くと分かった。","key":true,"src":"LOG357"},{"id":"w195","category":"sim","sub":"","type":"word","front":"NavMesh（ナビメッシュ）","back":"床の形から自動で作る、歩ける範囲の地図","detail":"ゲームエンジンが人やキャラクターの道探しに使う、通れる床を多角形で表した地図。記事では80cmに詰めた通路の店で、前に計算した古い床が消えずに新しい床と重なって残り、人が21卓に入れなかった。","key":false,"src":"LOG357・LOG362・LOG370"},{"id":"w196","category":"sim","sub":"","type":"word","front":"占有格子地図（グリッドマップ）","back":"床を細かいマス目に分け、通れるかどうかを塗った地図","detail":"移動ロボットの道探しで広く使う地図の形。マス目の粗さで、狭い通路が通れないように見えることがある。記事では10cmのマス目を2cmにしただけで届く卓が32卓から49卓全部に変わり、のちに2.5cm刻みの地図をロボットに渡した。","key":false,"src":"LOG360・LOG374"},{"id":"w197","category":"sim","sub":"","type":"word","front":"経路探索（パスファインディング）","back":"地図の上で、いる所から行き先までの道を自分で引くこと","detail":"A*（エースター）などの方法で、障害物を避けた道をその都度計算する。ふさがれたら道を引き直す。記事では、決まった線をたどる作りから地図の上で道を引き3秒で回り込む作りに変え、行き止まりも直すと、60秒以上の止まりが57回から20回に減った。","key":false,"src":"LOG370・LOG374"},{"id":"w198","category":"eval","sub":"","type":"word","front":"乱数シード（種）","back":"乱数の出方を決める最初の数。同じなら同じ乱数が出る","detail":"シードを固定すると同じ条件を出し直せ、変えるとばらつきを見られる。記事では、同じ条件でもシードによって入店待ちが最大11倍違い、1条件のシードを3つから10個に増やした。","key":false,"src":"LOG370・LOG383・LOG393・LOG423"},{"id":"w199","category":"eval","sub":"","type":"word","front":"中央値（メディアン）","back":"値を小さい順に並べたとき、真ん中にくる値","detail":"少数の極端な値に引っぱられにくく、ばらつきの大きい結果の代表値に向く。記事では、同じシードでも結果が少し揺れるため、シード10個の中央値で比べることにした。","key":false,"src":"LOG383・LOG384・LOG393・LOG397"},{"id":"w200","category":"sim","sub":"","type":"word","front":"ヘッドレス実行（画面なし実行）","back":"画面を出さずに、シミュレーションを裏で回すこと","detail":"描画を省くので速く、何本も同時に回したり夜のあいだ自動で回したりできる。記事では画面なしの実行ファイルを作り、4本同時なら70回が約85分で終わる見込みになった。","key":false,"src":"LOG383・LOG384"},{"id":"w201","category":"service","sub":"","type":"word","front":"下げ膳（下膳）","back":"食べ終わった皿を卓から下げ、洗い場へ運ぶ仕事","detail":"飲食店では片付けと卓拭きが終わるまで次の客を通せないので、入店待ちに直結する。記事で公開事例を調べると、配膳ロボットの使い方は料理を運ぶだけ、下げ膳が中心、客が皿を載せる、ロボットが自分で下げるの4つの型に分かれ、どの型でも皿をロボットに載せるのは人だった。","key":false,"src":"LOG351・LOG391・LOG440"},{"id":"w202","category":"service","sub":"","type":"word","front":"デッドロック（立ち往生・お見合い）","back":"互いに相手がどくのを待ち、どちらも動けなくなること","detail":"複数の主体がそれぞれ相手の持つ場所や資源を待ち続け、全体が止まる状態。実店舗の動画では、1台分の幅の通路で2台が向かい合って止まり、店員が来るまで41秒以上かかった。3Dの店では同じ向かい合いが9分続いた。","key":true,"src":"LOG364・LOG370・LOG391・LOG434"},{"id":"w203","category":"service","sub":"","type":"word","front":"ライブロック（揺れ続け）","back":"動き続けているのに、少しも前へ進まない状態","detail":"止まってはいないが、よけ合いや迷いを繰り返して仕事が進まない状態。デッドロックと違い、止まりとして数えにくい。3Dの店では、ロボットが1.4cmの幅を行ったり来たりし続け、止まりと数えられず助けも呼ばない詰まりが残った。","key":false,"src":"LOG435・LOG440"},{"id":"w204","category":"service","sub":"","type":"word","front":"スタック検知（進み具合の見張り）","back":"決めた時間に決めた距離を進めたかで、行き詰まりを見つける仕組み","detail":"移動ロボットが目的地へ向かって本当に進めているかを、ロボット自身が見張る仕組み。ROS 2 の Nav2 の標準部品は、既定で10秒に0.5m動けなければ進めていないと判断する。3Dの店にも10秒で0.5mの見張りを入れ、揺れ続けは180回で0回になった。","key":false,"src":"LOG440"},{"id":"w205","category":"service","sub":"","type":"word","front":"フリート管理（群管理・管制）","back":"複数台のロボットの通る道や順番をまとめて決める仕組み","detail":"倉庫や店で何台ものロボットを動かすとき、行き先の割り当てや、狭い所を通る順番を上から調整する仕組み。配膳ロボットのどちらが譲るかの決まりは、どのメーカーも公式には公開していなかった。日本の管制の仕組みと規格では、狭い区間を予約制にし、一度に一方向だけ通す形だった。","key":false,"src":"LOG434"},{"id":"w206","category":"sim","sub":"","type":"word","front":"決定論的シミュレーション（再現できる実行）","back":"同じ条件と同じ種なら、毎回まったく同じ結果が出るシミュレーション","detail":"実行の順番や時間の刻みに左右されず、入力が同じなら出力も同じになるように作ったシミュレーション。前は同じ種で2回回しても、動けなくなったロボットが12回と0回に分かれた。同じ結果にする作りにすると、12組とも記録が1行も違わず、1回の計算も3〜4分から1.2〜1.5分に縮んだ。","key":false,"src":"LOG435"},{"id":"w207","category":"eval","sub":"","type":"word","front":"共通乱数法（対応のある比較）","back":"比べる条件どうしで同じ乱数を使い、差だけを取る比べ方","detail":"シミュレーションで2つの条件を比べるとき、同じ種を使って偶然の部分をそろえ、差のぶれを小さくする方法。3Dの店では、同じ種でのずれは種を変えたときの差の約10分の1だった。同じ種どうしで差を取ると、はっきり言える組が76組中3組から37組に増えた。","key":false,"src":"LOG423"},{"id":"w208","category":"service","sub":"","type":"word","front":"タイムスタディ（時間観測）","back":"作業を区切ってストップウォッチで時間を測る調べ方","detail":"現場の作業を小さな単位に分け、1回ずつの所要時間を測って標準の時間を決める方法。配膳ロボットの試算は会計1回90秒・片付け40秒などの仮の値で動いている。店の人がスマホで作業ごとの時間を測る観察シートを作り、前提を確かめられるようにした。","key":false,"src":"LOG414・LOG415"},{"id":"w209","category":"eval","sub":"","type":"word","front":"回帰テスト（リグレッションテスト）","back":"直したあと、前と同じ結果が変わっていないかを確かめるテスト","detail":"変更で、前は正しく動いていた所が壊れていないかを確かめる試験。試算の前提109個をプログラムの外の表に移したとき、数字は変えずに600条件を回し直し、前の版と全部の数字が同じになることを確かめた。","key":false,"src":"LOG415"},{"id":"w210","category":"vision","sub":"","type":"word","front":"異常検知（アノマリー検知）","back":"普段のデータだけを覚え、いつもと違うものを見つける方法","detail":"失敗の例が少なく形もばらばらなときに、正常な例だけで学習して外れを見つける手法。工場の検査で良品だけを覚えさせて傷を見つけるのに使われる。3Dの店の録画で、配膳ロボットの30秒以上の止まりを見つける試しに使った。","key":true,"src":"LOG418"},{"id":"w211","category":"vision","sub":"","type":"word","front":"PatchCore（パッチコア）","back":"画像を小区画に分け、覚えた普段の区画との距離で異常を測る方法","detail":"学習済みの画像モデルで区画ごとの特徴を取り出し、普段の画像の特徴の代表を覚えておき、新しい区画が一番近い代表からどれだけ遠いかを点数にする。新しく学習させる部分がないので、クラウドの CPU 2コアでも1通り約15分で回った。予備実験では誤報5%で長い止まりの82%を拾えた。","key":false,"src":"LOG418"},{"id":"w212","category":"vision","sub":"","type":"word","front":"再現率（リコール・検出率）","back":"見つけるべきもののうち、実際に見つけられた割合","detail":"取りこぼしの少なさを表す指標で、誤報の割合と組で見る。配膳ロボットの止まりを画像で拾う試しでは、画面の道の線を消すと再現率は72%から28%に落ちた。","key":false,"src":"LOG418"},{"id":"w213","category":"vision","sub":"","type":"word","front":"ショートカット学習（近道学習）","back":"本来の手がかりでなく、たまたま効く別の手がかりで当ててしまうこと","detail":"モデルが課題の本質ではなく、データにだけある目印や背景で答えを出してしまう現象。本番では目印がないので性能が落ちる。3Dの店の録画では、モデルが画面に描かれたロボットの道の線の交わる所を手がかりにしていて、線を消すとロボットどうしの詰まりは47件中4件しか拾えなかった。","key":false,"src":"LOG418"},{"id":"w214","category":"learning","sub":"","type":"word","front":"世界モデル（ワールドモデル）","back":"ロボットが動いた後の場面を、動かす前に予測するAI","detail":"今の場面とロボットの動きを入れると、その動きをしたあとの場面を予測する。方策が次に何をするかを出すのに対し、世界モデルはそれをしたらどうなるかを出す。物理シミュレータのように人が形や摩擦を作り込まず、映像とロボットのデータから学ぶ。記事では、奥行きつきのカメラ5台が前提の手法を調べ、今の手元の環境では得が小さいと判断した。","key":true,"src":"LOG396・LOG438"},{"id":"w215","category":"learning","sub":"","type":"word","front":"DAgger（ダガー）","back":"ロボットにやらせ、間違えた所を人が直してお手本に足す学習","detail":"お手本だけで学んだロボットは、お手本にないずれた場面から戻れない。実際に動かして間違えた所で人が手を出し、その直しを学習データに足していくことで、その穴を埋める。記事の動画では、枠の改良とデータ追加と DAgger で計260本にし、もう片方のタスクの物に手を出す割合が73%から0%になった。","key":false,"src":"LOG403・LOG417・LOG443"},{"id":"w216","category":"learning","sub":"","type":"word","front":"残差強化学習","back":"元のモデルの動きに、小さな部品が補正を足して学ぶ方法","detail":"大きなモデルは凍結し、その出した動きに小さなネットワークが補正を足す。学ぶのは補正の部分だけなので軽く、元のモデルの範囲の外にも出られる。記事の調査では、報酬は成功1・失敗0だけで、人型ロボットの成功率が約15分の練習で14%から64%に上がった例があった。","key":false,"src":"LOG392"},{"id":"w217","category":"learning","sub":"","type":"word","front":"報酬整形（リワードシェーピング）","back":"最後の成否に加え、途中の進み具合にも点を与える工夫","detail":"成否だけの報酬では学習が進みにくいときに、近づいた・向きが合ったなどの途中の進み具合にも点を与えて学習を導く。ただし点の付け方を誤ると、点を稼ぐ動きに引きずられる。記事の組立の研究では、進捗の報酬を足すと共通の1本のポリシーの成功率が98.2%から17.8%まで落ちた。","key":false,"src":"DAY336"},{"id":"w218","category":"learning","sub":"","type":"word","front":"蒸留（ディスティレーション）","back":"大きなAIの答え方を小さなAIに学ばせ、速く安く動かす方法","detail":"賢さを少し落とす代わりに、反応を速くし、計算の費用を下げる。速くなるのは大きなモデルそのものではなく、小さくした版のほうになる。記事では、ロボット用の学習した動きのモデルの1回の判断が約0.05秒、汎用AIは11〜19秒で、そのままでは動く物に使えないと整理した。","key":false,"src":"LOG424"},{"id":"w219","category":"learning","sub":"","type":"word","front":"エンドツーエンド（端から端まで）","back":"途中の手順を人が決めず、1つのモデルが入力から操作まで出す作り方","detail":"認識・判断・操作を別々の部品に分けず、カメラ映像などの入力から直接動きを出す。途中の決まりを人が書かずに済む代わりに、なぜその動きになったかは見えにくい。記事では、カメラだけで走る車が8個のカメラの映像から直接運転操作まで出している例が出てきた。","key":false,"src":"LOG412"},{"id":"w220","category":"vision","sub":"","type":"word","front":"YOLO（ヨロ）","back":"画像の何がどこにあるかを四角い枠で返す、速い物体検出モデル","detail":"1回の処理で画像全体から物の種類と位置の枠を出すので速く、小さな GPU でも動く。記事の動画では、一番小さい版で目標に枠を描き、その画像を π0.5 に渡すと、関係ない物に手を出す問題がほぼ解決した。物を見分ける役は検出器、言葉と物を結ぶ役は LoRA と分けて使っていた。","key":false,"src":"LOG443"},{"id":"w221","category":"vision","sub":"","type":"word","front":"センサーフュージョン","back":"得意の違う複数のセンサーの値を合わせ、1つより確かな値にすること","detail":"レーダーは距離に強く、カメラは横の位置に強いように、センサーには得意と不得意がある。重ねるとあいまいさが交わった部分まで縮み、片方だけの範囲ではあいまいなまま残る。記事の講義では、測定と予測の差を見張ることで、センサーの故障の予兆が取れると学んだ。","key":false,"src":"LOG439"},{"id":"w222","category":"service","sub":"","type":"word","front":"自己位置推定（ローカライゼーション）","back":"ロボットが地図の上で自分がどこにいるかを割り出すこと","detail":"動くと位置の不確かさが広がり、センサーで周りを測ると締まる、を繰り返して位置を絞る。地図に頼る方法はどんな環境にも使える主流だが、中の認識がずれると自信満々に外す。記事では、配膳ロボットが店で自分の位置を見失う迷子を、この段で崩れた止まり方として分けた。","key":true,"src":"LOG439"},{"id":"w223","category":"service","sub":"","type":"word","front":"SLAM（スラム）","back":"地図を作りながら、同時にその地図の上で自分の位置を割り出すこと","detail":"知らない場所でも、走りながら周りを測って地図を広げ、その地図で自分の位置を推定する。地図作りと位置推定を同時に解くのが難しさの中心になる。記事では、配膳・清掃ロボットが今まさに使っている古典的な仕組みとして、スタンフォードの講義の中で出てきた。","key":false,"src":"LOG370・LOG439"},{"id":"w224","category":"service","sub":"","type":"word","front":"差動二輪","back":"左右の車輪を別々の速さで回して曲がる車輪の付け方","detail":"後ろの2輪を左右別々に回し、前はキャスターで支える形が多い。逆に回せばその場で回れるが、真横には動けない。記事では、配膳ロボットが前をふさがれると、その場で向きを変えても道が開かず止まる理由として整理した。","key":false,"src":"LOG439"},{"id":"w225","category":"service","sub":"","type":"word","front":"カルマンフィルタ","back":"予測と測定を合わせ、位置の候補を山1つの形で絞る方法","detail":"動いたら候補を広げ、測ったら合わない候補を下げる、というベイズフィルタの考え方を、候補を山1つのガウス分布で持つことで計算できるようにしたもの。候補を多数の点で持つのがパーティクルフィルタ。記事では、位置のずれは動きで崩れたか、測って直し損ねたかの2択で切り分けられると学んだ。","key":false,"src":"LOG439"},{"id":"w226","category":"eval","sub":"","type":"word","front":"動作設計領域（ODD）","back":"システムが動いてよい条件の範囲を先に決め、外では動かさない考え方","detail":"自動運転で使われる考え方で、場所・天候・時間帯・明るさなどの許容範囲を決め、範囲の外を検知したら止めるか人に渡す。記事では、少量のお手本で学んだピッキングが部屋を変えて崩れた件を、この範囲を決めずに会場を変えたことが問題だと整理した。","key":true,"src":"LOG412"},{"id":"w227","category":"hardware","sub":"","type":"word","front":"バックドライバブル（外から押すと動く関節）","back":"手で押すと関節が回り、ぶつかると力が逃げる作り","detail":"減速機の減速比を小さくして、外から押すと関節が回るようにする。ぶつかっても力が逃げるので人のそばで使いやすく、モーターの電流から当たった力も推定できる。記事では、精度より壊れにくさと安さを取る研究用の安いアームの方向として出てきた。","key":false,"src":"LOG412"},{"id":"w228","category":"hardware","sub":"","type":"word","front":"視触覚センサー（カメラ式の触覚センサー）","back":"指先のゴムの膜を裏からカメラで撮り、触った様子を測るセンサー","detail":"膜のへこみ方から、押し付けた形や滑り始めが画像として取れるので、学習モデルにもそのまま入れられる。記事では、手首カメラは接触の瞬間を見て確かめるだけで、力の強さや滑りまでは見えず、そこを補う研究として紹介された。","key":false,"src":"LOG412"},{"id":"w229","category":"society","sub":"","type":"word","front":"産業用ロボットの特別教育","back":"ロボットに動きを教えたり動かしたまま点検する人に、事業者が受けさせる教育","detail":"動く範囲の中で動きを教える作業や、動かしたままの点検・調整をする従業員に、使う事業者が受けさせる決まり。記事では、対象はモーターの出力が80Wを超えるロボットで、受講は学科2日と実技1日の3日間、費用は3万〜5万円と整理した。納入する側は、従業員に操作させるならこの教育が要ると伝える。","key":true,"src":"LOG375"},{"id":"w230","category":"society","sub":"","type":"word","front":"製造物責任法（PL法）","back":"製品の欠陥で被害が出たとき、作った者が負う責任を定めた法律","detail":"業として作った人、輸入した人、自社製と表示した人が負う。記事では、ソフト単体は対象外でも、機械に組み込まれたソフトの不具合は機械の欠陥になりうること、責任は引き渡しから10年であることを確かめた。メーカーの製品の中身を書き換えると、改造した人が作り手の側に回る。","key":false,"src":"LOG375・LOG406"},{"id":"k105","category":"principles","sub":"","type":"lesson","front":"プログラムが動いているかの確認スクリプトはOKと出るのに、実際につなぐと拒否される。何を疑う？","back":"生存確認は、実際につないで確かめる","detail":"プロセスを名前で探す確認が、検索を実行したシェル自身のコマンド文字列に一致し、デーモンが止まっていても毎回OKと返していた。確認するたびに番号が変わっていたのもこのためだった。後日には、古いプロセスを止めてから起動する1行のコマンドが、起動部分を実行する前に自分自身を止めていた。","key":false,"src":"DAY337・LOG341","kw":[["実際につなぐ","つなぐ","接続","つないで","せつぞく"],["生存確認","確認","かくにん","チェック"]]},{"id":"k106","category":"eval","sub":"","type":"lesson","front":"成功のたびに少しずつ自分で直す補正を入れたら、成功を重ねるほど動きがおかしくなり、ついに安全チェックで止まった。何を疑う？","back":"補正が一方向に動き続けたら、元の測定を疑う","detail":"置く高さの補正が成功のたびに5mmずつ上がり、29mmになったところで手首の角度が安全範囲の外に出た。箱は固定してあるのに、置いたあとの画像で箱が約20cm動いたと測り違え、箱に当たったと受け取っていた。お手本を集めている間は補正を読むだけにして、書き換えないようにした。","key":false,"src":"LOG341","kw":[["補正","ほせい"],["一方向","いっぽうこう","上がり続ける","動き続ける"],["測定","そくてい","測り違い","計測"]]},{"id":"k107","category":"principles","sub":"","type":"l る"]]},{"id":"k121","category":"learning","sub":"","type":"lesson","front":"失敗した回の関節角の記録を、正しい値に書き換えた。これをそのまま学習データに足してよい？","back":"画像と行動の組を、実機で直しながら撮る","detail":"学習データは写真と関節角の組で、写真には直す前の動きが写っている。数字だけ直しても組が合わない。そこで、カメラに手が写らない所のキーで実機を直し、直している間と再開後を1秒10コマで撮る形にした。","key":true,"src":"LOG403","kw":[["画像","写真","カメラ"],["組","ペア","セット"],["実機","じっき","本物"]]},{"id":"k122","category":"servo","sub":"","type":"lesson","front":"AIに動かさせていたら、つかむ位置が少しずれ始めた。止めて最初からやり直すか、人が全部操作して運ぶか迷う。どうする？","back":"ずれた関節だけ直し、続きはAIに返す","detail":"巻き戻しのキーで始めの姿勢に戻し、根元の向きを21回直してAIに戻すと、AIはその姿勢から続きを組み立ててブロックをつかんだ。別の回では、つかんだあと人が肩で腕を持ち上げてからAIに戻し、箱に入れて成功で終えた。持ち上げを数分続けた回では、爪がゆるんでブロックが落ちた。","key":false,"src":"LOG407","kw":[["一部","ずれた関節","部分"],["返す","戻す","任せる"]]},{"id":"k123","category":"learning","sub":"","type":"lesson","front":"人が途中で関節を直すとうまくいった。次の回はAIが同じ直しを覚えていると考えてよい？","back":"その場の補正は残らない。学習させて初めて覚える","detail":"キーでの補正は学習した重みを変えず、その回の続きと記録にだけ効く。1回目も2回目も、つかむ前に根元を約3°直していて、1回目の直しを覚えていたわけではなかった。直した記録を学習データにして学び直す依頼を出した。","key":false,"src":"LOG417","kw":[["学習","学び直し","再学習"],["残らない","のこらない","反映されない"]]},{"id":"k124","category":"eval","sub":"","type":"lesson","front":"成功した回を並べると、人が毎回同じ関節を同じ向きに同じくらい直していた。これは何を意味する？","back":"決まったずれは、学習で直せる手がかり","detail":"成功5回はどれも、つかむ前に根元を +2〜4°、つかんだあとにひじを 15〜31° 持ち上げる向きに直していた。直したあとの根元の角度は 12.8〜13.7° にそろい、お手本でつかんだ瞬間の 13.2° とほぼ同じだった。","key":false,"src":"LOG417","kw":[["決まった","同じ向き","一定","系統"],["ずれ","偏り","くせ"],["学習","学び直し"]]},{"id":"k125","category":"eval","sub":"","type":"lesson","front":"実機の記録を学習データに変えたら、ロボットが1コマで大きく飛ぶ不自然な動きになった。何を疑う？","back":"記録の抜けを確かめ、指令の道すじで補う","detail":"アームの常駐プログラムは指令を送ると約1.6秒ほかの読み取りを受け付けず、動いている間の関節角が1.5〜3.6秒ずつ抜けていた。そのまま使うと1コマで最大28°飛ぶ。送った指令の道すじから角度を作り直し、止まっている時間を詰めてから学習させた。","key":false,"src":"LOG417","kw":[["抜け","欠け","欠損"],["指令","コマンド","しれい"]]},{"id":"k126","category":"learning","sub":"","type":"lesson","front":"少しの直しデータを足して学び直し、損失も下がった。本当に人の直しが減ったかをどう確かめる？","back":"補正なしで任せる回を入れ、数字で比べる","detail":"直した5本をお手本19本に足して続きから1,500ステップ学習したが、成功6回はすべて補正つきだった。補正なしの1回は、爪を閉じたときの根元が 11     if (navigator.canShare && navigator.canShare({files: [f]})) { await navigator.share({files: [f]}); doneSaving('保存しました'); return true; }
    return false;
  }
  $('save').addEventListener('click', async () => {
    if (attempts.length <= savedIdx) { $('save').textContent = attempts.length ? '保存済みです' : 'まだ記録がありません'; setTimeout(saveLabel, 1800); return; }
    if (IOS) { // iPhone：記録をコピーして、ショートカット「ロボ見直しを保存」に渡す（練習記録フォルダに直接入る）
      try { await navigator.clipboard.writeText(report()); doneSaving('ショートカットで保存中'); location.href = 'shortcuts://run-shortcut?name=' + encodeURIComponent(SHORTCUT) + '&input=clipboard'; return; } catch (_) {}
      try { if (await shareSave()) return; } catch (e) { if (e && e.name === 'AbortError') return; } return download();
    }
    if (!CAN_DIR) return download();
    try {
      let h = await getDir();
      if (h && (await h.queryPermission({mode: 'readwrite'})) !== 'granted' && (await h.requestPermission({mode: 'readwrite'})) !== 'granted') h = null;
      if (!h) { showWarn('保存先のフォルダを選んでください：iCloud Drive → PixelstoMotors → ロボティクス復習 → 練習記録（最初の1回だけ）'); h = await pickDir(); }
      const w = await (await h.getFileHandle(fileName(), {create: true})).createWritable(); await w.write(report()); await w.close();
      doneSaving(`${h.name}に保存しました`);
    } catch (e) {
      if (e && e.name === 'AbortError') { $('warn').hidden = true; return; }
      showWarn('練習記録に書き込めなかったので、ダウンロードに保存しました。'); download();
    }
  });
  $('copy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(report(true)); $('copy').textContent = 'コピーしました'; } catch (_) { $('copy').textContent = 'コピーできませんでした'; } setTimeout(() => $('copy').textContent = '結果をコピー', 1800); });
  if (CAN_DIR) { $('dirRow').hidden = false; $('redir').addEventListener('click', () => pickDir().catch(() => {})); getDir().then(showDirName); }
  if (IOS) { const b = document.createElement('button'); b.type = 'button'; b.id = 'share'; b.textContent = '共有から保存';
    b.addEventListener('click', async () => { if (attempts.length <= savedIdx) return; try { if (!(await shareSave())) download(); } catch (e) { if (!(e && e.name === 'AbortError')) download(); } });
    $('clear').before(b); }
  $('saveNote').textContent = IOS ? '' : CAN_DIR ? '' : '保存はダウンロードに入ります。練習記録に直接入れたいときはChromeで開いてください';
  window.addEventListener('beforeunload', e => { if (unsaved) { e.preventDefault(); e.returnValue = ''; } });
  // 前に開いていた段階・カテゴリ・言い方から始める（この端末の中だけ）
  // 最初はカテゴリの一覧。URL に #カテゴリ があればそこから（読み込み直しても同じ場所に戻る）
  try { const v = JSON.parse(localStorage.getItem(PREF) || 'null'); if (v) { step = v.step || 1; if (v.mode === 'hide') { mode = 'hide'; $('mHide').setAttribute('aria-pressed', true); $('mSee').setAttribute('aria-pressed', false); } } } catch (_) {}
  const h0 = (location.hash || '').slice(1);
  showView(validCat(h0) ? h0 : null);
})();
