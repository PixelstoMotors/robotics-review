<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ロボティクスの見直し</title>
<style>
/* GIG の「台本読み合わせ」と同じ見た目：横スワイプのカード＋その下に「押している間だけ聞く」 */
:root{
  --bg:#f2f3f5; --fg:#1d2129; --muted:#6b7280; --panel:#ffffff; --line:#e3e5e9;
  --card:#1a1b1f; --card-fg:#ffffff; --card-sub:#a9adb6; --gold:#f2c14e; --time:#c98a12;
  --miss:#fde2e1; --miss-fg:#b42318; --extra:#dbeafe; --extra-fg:#1e40af; --ok:#15803d;
  --btn:#1a1b1f; --btn-fg:#ffffff; --rec:#b42318;
  --font:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111215; --fg:#e8eaee; --muted:#9aa0aa; --panel:#1c1d22; --line:#2c2e35;
  --card:#000000; --miss:#4a1714; --miss-fg:#ffb4ab; --extra:#13284d; --extra-fg:#bcd3ff; --ok:#4ade80;
  --btn:#e8eaee; --btn-fg:#111215; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111215; --fg:#e8eaee; --muted:#9aa0aa; --panel:#1c1d22; --line:#2c2e35;
  --card:#000000; --miss:#4a1714; --miss-fg:#ffb4ab; --extra:#13284d; --extra-fg:#bcd3ff; --ok:#4ade80;
  --btn:#e8eaee; --btn-fg:#111215; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.7 var(--font);padding:0 0 calc(24px + env(safe-area-inset-bottom))}
header{background:#1a1b1f;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
header h1{margin:0;font-size:21px}
header p{margin:2px 0 0;font-size:14px;color:rgba(255,255,255,.75)}
main{padding:12px 16px 0;max-width:720px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.selwrap{position:relative;display:block;width:100%}
select{-webkit-appearance:none;appearance:none;display:block;width:100%;font:inherit;font-size:16px;font-weight:600;background:var(--btn);color:var(--btn-fg);border:0;border-radius:10px;padding:10px 44px 10px 14px;margin:0}
.selwrap::after{content:"";position:absolute;right:19px;top:50%;width:9px;height:9px;border-right:2.75px solid var(--btn-fg);border-bottom:2.75px solid var(--btn-fg);border-radius:1px;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--fg);font:inherit;font-size:15px;padding:8px 12px}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg)}
.seg.step{display:flex;margin:0 0 8px}.seg.step button{flex:1;font-size:16px;font-weight:600;padding:10px 6px}
.card .w{font-size:27px;line-height:1.5;font-weight:700;margin:8px 0 2px}
.card .w.small{font-size:20px;margin-bottom:0}
.info{font-size:14px;color:var(--muted);margin:0 2px 8px}
.track{display:flex;align-items:flex-start;overflow-x:auto;overflow-y:hidden;transition:height .15s;scroll-snap-type:x mandatory;gap:10px;padding:4px 2px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 88%;scroll-snap-align:center;background:var(--card);color:var(--card-fg);border-radius:14px;padding:16px 16px 12px;min-height:250px;display:flex;flex-direction:column}
.card .sec{font-size:13.5px;color:var(--card-sub)}
.card .lb{font-size:13.5px;font-weight:700;color:var(--gold);margin-top:2px}
.card .q{font-size:15px;color:var(--card-sub);margin-top:6px}
.card .t{font-size:25px;line-height:1.75;font-weight:600;flex:1;margin:8px 0}
.card .t.long{font-size:20px}
.card .t.mid{font-size:22px}
.card .t.hide{color:var(--card-sub)}
.card .b{font-size:14.5px;line-height:1.7;color:var(--card-sub);margin:0 0 8px}
.card .m{font-size:13.5px;color:var(--time);display:flex;justify-content:space-between;gap:8px}
.card .m .done{color:#9be3b2}.card .m .done.low{color:#ffb4ab}.card .m .done small{color:#a9adb6;font-size:12.5px;margin-left:4px}
.pos{font-size:14px;color:var(--muted);text-align:center;margin:0 0 8px;font-variant-numeric:tabular-nums}
.mic{display:block;width:100%;border:0;border-radius:16px;padding:18px 12px;font:inherit;font-size:20px;font-weight:700;background:var(--btn);color:var(--btn-fg);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.mic.on{background:var(--rec);color:#fff}
.mic:disabled{opacity:.45}
.mic small{display:block;font-size:13.5px;font-weight:400;opacity:.8}
.res{background:var(--panel);border-radius:14px;padding:12px 14px;margin:12px 0 0;border:1px solid var(--line)}
.res h2{font-size:15px;margin:0 0 6px;color:var(--muted);font-weight:600}
.res .said{font-size:19px;line-height:1.8;min-height:1.8em;word-break:break-all}
.res .cmp{font-size:19px;line-height:1.8;word-break:break-all}
.res .miss{background:var(--miss);color:var(--miss-fg);border-radius:3px}
.res .kw{display:inline-block;border-radius:6px;padding:0 8px;margin:2px 6px 2px 0;background:var(--extra);color:var(--extra-fg)}
.res .kw.miss{background:var(--miss);color:var(--miss-fg)}
.res .lesson{margin-top:6px}
.res .extra{background:var(--extra);color:var(--extra-fg);border-radius:3px}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px;margin-top:8px;font-variant-numeric:tabular-nums}
.stats b{font-size:20px}
.stats .good{color:var(--ok)}.stats .bad{color:var(--miss-fg)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row #save{background:var(--btn);color:var(--btn-fg);border-color:var(--btn);font-weight:700}
.row button{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-size:15px;border-radius:10px;padding:8px 12px}
.log{margin:18px 0 0}
.log h2{font-size:18px;margin:0 0 8px;padding-left:10px;border-left:4px solid var(--fg)}
.log table{width:100%;border-collapse:collapse;font-size:15px;background:var(--panel);border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums}
.log th,.log td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
.log th:first-child,.log td:first-child{text-align:left}
.log th{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:14px 2px 0}
.warn{background:var(--miss);color:var(--miss-fg);border-radius:10px;padding:10px 12px;font-size:15px;margin:0 0 10px}
button:focus-visible,select:focus-visible{outline:3px solid var(--time);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>ロボティクスの見直し</h1>
  <p id="sub"></p>
</header>
<main>
  <div class="seg step" role="group" aria-label="段階">
    <button id="s1" type="button" aria-pressed="true">1 単語</button>
    <button id="s2" type="button" aria-pressed="false">2 説明</button>
    <button id="s3" type="button" aria-pressed="false">3 判断の型</button>
  </div>
  <div class="bar">
    <span class="selwrap"><select id="cat" aria-label="カテゴリ"></select></span>
    <div class="seg" role="group" aria-label="言い方">
      <button id="mSee" type="button" aria-pressed="true">見て言う</button>
      <button id="mHide" type="button" aria-pressed="false">見ないで言う</button>
    </div>
    <div class="seg" role="group" aria-label="出す範囲">
      <button id="fAll" type="button" aria-pressed="true">全部</button>
      <button id="fWeak" type="button" aria-pressed="false">苦手だけ</button>
    </div>
  </div>
  <div id="warn" class="warn" hidden></div>
  <p class="info" id="info"></p>
  <div class="track" id="track" aria-live="off"></div>
  <p class="pos" id="pos"></p>
  <button id="mic" class="mic" type="button">押している間だけ聞く<small>カードを見て話して、指を離す</small></button>
  <section class="res" id="res" aria-live="polite">
    <h2>話した言葉</h2>
    <div class="said" id="said">ここに出ます</div>
    <h2 style="margin-top:10px" id="cmpH">違い（赤＝言わなかった・青＝余分）</h2>
    <div class="cmp" id="cmp">—</div>
    <div class="stats" id="stats"></div>
  </section>
  <section class="log">
    <h2>今回の練習</h2>
    <table><thead><tr><th>文</th><th>一致</th><th>前回</th></tr></thead><tbody id="log"><tr><td colspan="3">まだありません</td></tr></tbody></table>
    <div class="row"><button id="save" type="button">結果を保存</button><button id="copy" type="button">結果をコピー</button><button id="clear" type="button">今回の結果を消す</button></div>
    <div class="row" id="dirRow" hidden><button id="redir" type="button">保存先を選び直す</button><span id="dirName" class="note" style="margin:0;align-self:center"></span></div>
    <p class="note" id="saveNote" style="margin-top:6px"></p>
  </section>
  <p class="note" id="ver"></p>
</main>
<script>
(() => {
  const DATA = {"updated":"2026-10-11","categories":[{"key":"kinematics","label":"運動学・座標系"},{"key":"hardware","label":"実機・サーボ制御"},{"key":"sim","label":"シミュレーション・デジタルツイン"},{"key":"vision","label":"画像認識・カメラ"},{"key":"servo","label":"視覚サーボ・Pick&Place・受け渡し"},{"key":"learning","label":"ロボット学習"},{"key":"eval","label":"評価・データ管理"},{"key":"principles","label":"設計原則・進め方"},{"key":"society","label":"社会実装・現場"}],"items":[{"id":"w001","category":"kinematics","sub":"","type":"word","front":"関節（ジョイント）","back":"ロボットの部品と部品をつなぎ、動きを生む継ぎ目","detail":"モーターで角度や位置が変わる部分で、人の腕なら肩やひじにあたる。関節の数と種類で、ロボットがどう動けるかが決まる。制御では各関節の角度を関節角と呼び、アームの形はこの角度の組で決まる。","key":true,"src":""},{"id":"w002","category":"kinematics","sub":"","type":"word","front":"リンク","back":"関節と関節の間をつなぐ、硬い骨組みの部分","detail":"人の腕なら上腕や前腕にあたり、それ自体は曲がらない部品として扱う。ロボットは、リンクと関節が交互につながった鎖として表される。リンクの長さが、手先がどこまで届くかを決める。","key":false,"src":""},{"id":"w003","category":"kinematics","sub":"","type":"word","front":"自由度（DOF）","back":"ロボットが互いに独立して動かせる、動きの方向の数","detail":"空間で物の位置と向きを自由に決めるには、6自由度が必要になる。アームでは関節の数がそのまま自由度になることが多く、グリッパーの開閉はふつう数えない。mechArm 270 は6軸のアームで、グリッパーは別に扱う。","key":true,"src":"DAY120"},{"id":"w004","category":"kinematics","sub":"","type":"word","front":"回転関節と直動関節","back":"回って角度が変わる関節と、まっすぐ伸び縮みする関節","detail":"回転関節はレボリュート、直動関節はプリズマティックとも呼ぶ。多関節アームは、ほぼ回転関節だけでできている。直動関節は、直交ロボットやリニアレールのように、直線で動かす場所に使われる。","key":false,"src":""},{"id":"w005","category":"kinematics","sub":"","type":"word","front":"エンドエフェクタ（EE）","back":"アームの先端に付けて、作業をする道具の部分","detail":"グリッパー、吸着パッド、溶接トーチなど、作業ごとに付け替える。アームの制御は、エンドエフェクタの位置と向きを狙いどおりにすることが目的になる。mechArm には、手先の座標を直接指定して動かす命令もある。","key":true,"src":"DAY139"},{"id":"w006","category":"kinematics","sub":"","type":"word","front":"ツール中心点（TCP）","back":"ロボットが位置を合わせる基準となる、道具の先端の一点","detail":"グリッパーなら爪の間、溶接なら炎の先などに置く。手首の取り付け面ではなくTCPを基準にすると、道具を替えても狙った点に合わせられる。通信のTCPとは別の言葉なので、文脈で区別する。","key":false,"src":""},{"id":"w007","category":"kinematics","sub":"","type":"word","front":"座標系（フレーム）","back":"位置や向きを数字で表すための、原点と軸の決まり","detail":"台座が原点のベース座標系、作業場全体のワールド座標系、手先のツール座標系などを使い分ける。ソフトによって上向きの軸が違う点に注意する。mechArm のツインでは、URDFのZ軸が上とUnityのY軸が上の変換を誤り、成功率が0になった。","key":true,"src":"DAY149"},{"id":"w008","category":"kinematics","sub":"","type":"word","front":"座標変換","back":"ある座標系での位置や向きを、別の座標系の値に直す計算","detail":"カメラで見た位置をロボットの座標に直す場面で、必ず使う。回転と平行移動をまとめた、同次変換行列で表すのが一般的。mechArm では、ホモグラフィをやめ、2点の実測にもとづくアフィン変換に書き換えた。","key":false,"src":"DAY160"},{"id":"w009","category":"kinematics","sub":"","type":"word","front":"位置姿勢（ポーズ）","back":"物や手先がどこにあり、どちらを向いているかの組み合わせ","detail":"位置の3つの値と、向きの3つの値を合わせて、6つの値で表すことが多い。日本語の姿勢は、向きだけを指す場合と、アーム全体の関節の形を指す場合があり、混同しやすい。","key":false,"src":""},{"id":"w010","category":"kinematics","sub":"","type":"word","front":"オイラー角（ロール・ピッチ・ヨー）","back":"向きを、3つの軸まわりの回転角の組で表す方法","detail":"直感的で読みやすいため、画面表示や指令値によく使われる。ただし回す順番で意味が変わり、特定の向きで軸が重なって自由度が1つ消える、ジンバルロックが起きる。計算ではクォータニオンと使い分ける。","key":false,"src":""},{"id":"w011","category":"kinematics","sub":"","type":"word","front":"クォータニオン（四元数）","back":"向きを4つの数で表す方法で、計算で扱いやすい","detail":"ジンバルロックが起きず、2つの向きのあいだをなめらかにつなぐ補間も安定する。そのため、UnityやROSの内部では向きをクォータニオンで持つ。値を見ても向きが直感で分からないので、表示ではオイラー角に直すことが多い。","key":false,"src":""},{"id":"w012","category":"kinematics","sub":"","type":"word","front":"順運動学（FK）","back":"各関節の角度から、手先の位置と向きを求める計算","detail":"角度が決まれば答えは必ず1つに決まるので、計算は比較的やさしい。逆運動学は、この逆向きの計算になる。mechArm では、実機で校正した512,087点のFKテーブルから目標位置に近い点を探し、関節角を逆に引いて使った。","key":true,"src":"DAY192"},{"id":"w013","category":"kinematics","sub":"","type":"word","front":"逆運動学（IK）","back":"手先の目標位置から、各関節の角度を逆算する計算","detail":"答えが複数ある場合や、届かず答えがない場合があり、順運動学より難しい。式で直接解く解析解と、少しずつ近づける数値解がある。mechArm では、座標指定の命令で手首の回転RZが位置により暴れたため、角度指定だけで動かす方針にした。","key":true,"src":"DAY212"},{"id":"w014","category":"kinematics","sub":"","type":"word","front":"作業空間（ワークスペース）","back":"ロボットの手先が届き、作業できる空間の範囲","detail":"リンクの長さと、関節の可動域で決まる。届くことと、狙った向きで届くことは別で、向きまで自由に決められる範囲はもっと狭い。カタログのリーチは、この範囲の最大の半径を示す数字。","key":false,"src":""},{"id":"w015","category":"kinematics","sub":"","type":"word","front":"関節可動域（ジョイントリミット）","back":"各関節が安全に動ける、角度の上限と下限の範囲","detail":"機構の限界や配線、ぶつかりを避けるために決まっている。指令を送る前に範囲内か確かめるのが、基本の安全策になる。mechArm では、SDKの pymycobot 4.0.5 から関節リミットの定数を読み出して使った。","key":false,"src":"DAY253"},{"id":"w016","category":"kinematics","sub":"","type":"word","front":"特異点（特異姿勢）","back":"手先が特定の方向へ動けなくなる、アームの特殊な姿勢","detail":"腕がまっすぐ伸び切ったときや、2つの関節の軸が一直線にそろったときに起きる。近くでは、手先をわずかに動かすだけで、関節が急に大きく回ろうとする。軌道を作るときは、特異点を避けて通す。","key":false,"src":""},{"id":"w017","category":"kinematics","sub":"","type":"word","front":"ヤコビ行列（ヤコビアン）","back":"関節の速さと、手先の速さの関係を表す行列","detail":"姿勢ごとに中身が変わり、数値で逆運動学を解くときや、力の計算に使う。特異点では、この行列の逆が求められなくなる。mechArm では、ヤコビアンを使う数値解を候補に挙げたが、実時間で回すには重いとして見送った。","key":false,"src":"DAY192"},{"id":"w018","category":"kinematics","sub":"","type":"word","front":"DHパラメータ","back":"リンクの長さやねじれを、関節ごとに4つの数で表す決まり","detail":"デナビット・ハーテンベルグ法の略で、運動学の教科書で標準的に使われる。表を作れば、順運動学の式が機械的に組める。mechArm では、公式値の正確さに不安があり、机上のDHパラメータより実機で校正したFKテーブルを優先した。","key":false,"src":"DAY192"},{"id":"w019","category":"hardware","sub":"","type":"word","front":"アクチュエータ","back":"電気などのエネルギーを、実際の動きに変える装置","detail":"ロボットでは電気モーターが主流で、大きな力が要る機械では油圧や空気圧も使う。センサーが世界を読む側なら、アクチュエータは世界に働きかける側。関節ごとに1つ置くのが、基本の構成になる。","key":false,"src":""},{"id":"w020","category":"hardware","sub":"","type":"word","front":"サーボモーター","back":"指令した角度や位置へ、自分で合わせて止まるモーター","detail":"モーター、回転を測るエンコーダ、制御回路が組になり、ずれを測りながら目標へ寄せる。ホビー機では、これらを一体にしたスマートサーボがよく使われる。mechArm には6個のスマートサーボが入り、角度や温度を個別に読み戻せる。","key":true,"src":"DAY260"},{"id":"w021","category":"hardware","sub":"","type":"word","front":"減速機（ギア）","back":"モーターの速い回転を遅くして、そのぶん力を大きくする部品","detail":"モーター単体は速く回るが力が弱いので、歯車などで回転を落として関節を動かす。減速比が大きいほど力は増えるが速さは落ち、ガタや摩擦も入りやすい。産業用アームでは、根元側にRV減速機、手首側に波動歯車減速機を使う例が多い。","key":false,"src":""},{"id":"w022","category":"hardware","sub":"","type":"word","front":"エンコーダ","back":"モーターや関節が、どれだけ回ったかを測るセンサー","detail":"回転角を数値に変え、制御の側に今の位置を知らせる。電源を入れた瞬間から位置が分かるアブソリュート型と、動いた量を数えるインクリメンタル型がある。mechArm では、サーボが角度を読み戻せることから、各サーボにエンコーダがあると見ている。","key":true,"src":"DAY260"},{"id":"w023","category":"hardware","sub":"","type":"word","front":"トルク","back":"関節や軸を回転させようとする、回す力の強さ","detail":"単位はニュートンメートルで、力に腕の長さをかけたもの。同じ重さでも、腕を伸ばして遠くで持つほど、根元の関節に大きなトルクがかかる。モーターの電流はトルクとほぼ比例するので、電流から負荷を推定できる。","key":true,"src":""},{"id":"w024","category":"hardware","sub":"","type":"word","front":"サーボオンとサーボオフ","back":"モーターに力を入れて姿勢を保つ状態と、力を抜く状態","detail":"サーボオンでは指令の位置を保ち、サーボオフでは手で関節を動かせる。オフにした瞬間、重力でアームが落ちることがあるので、支えてから切る。mechArm では、全関節のトルクを切る命令で、手で動かせる状態にできる。","key":false,"src":"DAY205"},{"id":"w025","category":"hardware","sub":"","type":"word","front":"フィードバック制御（閉ループ制御）","back":"結果を測り、目標とのずれを見ながら指令を直し続ける制御","detail":"測らずに決めた指令を送るだけの、オープンループ制御と対になる言葉。センサーで今の状態を測り、ずれが小さくなる方向へ出力を変える。ロボットの関節制御は、ほぼすべてこの考え方で動いている。","key":true,"src":""},{"id":"w026","category":"hardware","sub":"","type":"word","front":"PID制御","back":"ずれの今の大きさ、たまった量、変化の速さで出力を決める制御","detail":"比例、積分、微分の頭文字で、フィードバック制御で最も広く使われる方式。3つの係数の調整をゲイン調整と呼び、強すぎると振動し、弱すぎると遅れる。mechArm では角度を送るだけで、Pi ではなくマイコンとサーボの側が指令角まで寄せる。","key":false,"src":"DAY260"},{"id":"w027","category":"hardware","sub":"","type":"word","front":"可搬重量（ペイロード）","back":"ロボットが手先で持って動かせる、重さの上限","detail":"グリッパー自体の重さも含めて数えるのがふつうで、腕を伸ばすほど実際に持てる量は減る。カタログの値は最大の条件なので、余裕を持って選ぶ。mechArm 270 の常用ペイロードは250gで、約600gの中身入りコーヒーカップは運べない。","key":true,"src":"DAY205"},{"id":"w028","category":"hardware","sub":"","type":"word","front":"リーチ","back":"台座の中心から、手先が届く一番遠い点までの距離","detail":"アームの大きさを比べるときの基本の数字。ただしこれは最大値で、端のほうでは持てる重さや精度が落ちる。届く範囲の広さと、その中で使える範囲は分けて考える。mechArm 270 のリーチは270mm。","key":false,"src":"DAY205"},{"id":"w029","category":"hardware","sub":"","type":"word","front":"繰り返し精度","back":"同じ場所へ何度も動かしたとき、止まる位置がどれだけそろうか","detail":"カタログで最もよく見る精度の数字で、ばらつきの幅を示す。狙った座標への正確さを示す絶対精度とは別物で、繰り返し精度が良くても絶対精度が悪いことはふつうにある。mechArm 270 の繰り返し精度は±0.5mm。","key":true,"src":"DAY205"},{"id":"w030","category":"hardware","sub":"","type":"word","front":"絶対精度","back":"指令した座標に、実際どれだけ正確に到達できるか","detail":"リンク長の誤差、たわみ、取り付けのずれなどが積み重なって悪くなる。多くのアームでは繰り返し精度よりかなり悪く、カタログに載らないこともある。キャリブレーションで改善を狙うのは、こちらの精度。","key":false,"src":""},{"id":"w031","category":"hardware","sub":"","type":"word","front":"バックラッシ","back":"歯車のかみ合わせのすき間による、動きのガタ","detail":"回る向きを変えたとき、すき間の分だけ出力が遅れて動き出す。行きと帰りで止まる位置がずれる原因になる。mechArm では、関節を動かす向きによって約17%の非対称が出て、バックラッシュかヒステリシスの可能性を考えた。","key":false,"src":"DAY189"},{"id":"w032","category":"hardware","sub":"","type":"word","front":"力覚センサー（力トルクセンサー）","back":"手先にかかる押す力とねじる力を、直接測るセンサー","detail":"手首に付けて、押し付けの強さや接触を測る。6軸タイプは、3方向の力と3軸まわりのトルクを測れる。mechArm には標準では付いておらず、モーターの電流値から、触れたことを間接的に検出できる。","key":false,"src":"DAY205"},{"id":"w033","category":"hardware","sub":"","type":"word","front":"マイコン（MCU）","back":"機械に組み込まれ、決まった処理を素早く回す小さなコンピュータ","detail":"パソコン型のコンピュータが上位の判断を担い、マイコンがモーターなど実時間に近い処理を担う、という分担が多い。mechArm では、Raspberry Pi からの指令をESP32系のマイコンが受けて、サーボを動かしている。","key":false,"src":"DAY260"},{"id":"w034","category":"hardware","sub":"","type":"word","front":"シリアル通信とボーレート","back":"データを1ビットずつ順番に送る通信と、その速さの設定","detail":"マイコンやサーボとのやりとりで、今も広く使われる。送る側と受ける側でボーレートが合っていないと、文字化けや無応答になる。mechArm では、Raspberry Pi とマイコンを1Mbpsのシリアル通信でつないでいる。","key":false,"src":"DAY260"},{"id":"w035","category":"hardware","sub":"","type":"word","front":"制御周期（制御ループ周波数）","back":"測って指令を出す一回りを、1秒に何回くり返せるか","detail":"単位はヘルツで、高いほど素早い変化や接触に反応できる。外から指令を送る周期と、モーター内部の周期は別もので、内部のほうがずっと速い。mechArm では関節角の読み出し1回に約20ミリ秒かかり、読むだけでも約50Hzが上限になる。","key":false,"src":"DAY296"},{"id":"w036","category":"sim","sub":"","type":"word","front":"シミュレーション（シミュレータ）","back":"現実の動きを、コンピュータの中で再現して試すこと","detail":"実機を壊さず、何度でも、何台分でも同時に試せるのが利点。一方で、摩擦や接触などは現実どおりに再現しきれない。その差をどう扱うかが、ロボット開発の大きなテーマになる。","key":true,"src":""},{"id":"w037","category":"sim","sub":"","type":"word","front":"デジタルツイン","back":"実物と同じ形と動きを持つ、コンピュータの中の双子","detail":"単なるシミュレーションと違い、実物のデータで合わせ込み、実物と対応づけて使うのが要点。mechArm では、Unity上のツインでアームを動かし、関節角から爪先の位置を引くFKテーブルを作っている。","key":true,"src":"DAY254"},{"id":"w038","category":"sim","sub":"","type":"word","front":"物理エンジン","back":"重力やぶつかりなど、物の動きを計算で再現するソフトの心臓部","detail":"少しずつ時間を進めながら、力、速度、接触を計算する。ゲーム用とロボット研究用では、速さと正確さの重みが違う。mechArm のツインでは、関節角を瞬時に入れたいとき、物理計算を飛ばして角度を直接セットした。","key":true,"src":"DAY150"},{"id":"w039","category":"sim","sub":"","type":"word","front":"タイムステップ","back":"シミュレーションで、時間を一度に進める刻み幅","detail":"刻みが細かいほど正確だが、計算は重くなる。粗すぎると、速い物がすり抜けたり、関節が振動して発散したりする。実機の制御周期とそろえるかどうかも、sim2realで気にする点になる。","key":false,"src":""},{"id":"w040","category":"sim","sub":"","type":"word","front":"剛性と減衰（スティフネスとダンピング）","back":"関節を目標へ引き戻すばねの強さと、揺れを抑えるブレーキの強さ","detail":"シミュレータで関節を角度指令で動かすとき、ばねとダンパーの組として設定する。剛性が強すぎると暴れ、弱すぎると目標に届かない。mechArm のツインでは、剛性20,000、減衰2,000に固定し、変更禁止にしている。","key":false,"src":"DAY154"},{"id":"w041","category":"sim","sub":"","type":"word","front":"コリジョン形状","back":"ぶつかりの判定に使う、見た目より単純にした形","detail":"見た目用の細かい形状とは分けて持ち、箱や円柱などで近似して計算を軽くする。形を粗くしすぎると、実機では当たるのにシミュレーションでは当たらない、といったずれが出る。","key":false,"src":""},{"id":"w042","category":"sim","sub":"","type":"word","front":"URDF","back":"ロボットのリンクと関節の構成を書き表す、標準のファイル形式","detail":"ROSで生まれたXML形式で、各リンクの形や重さ、関節の種類と可動域を書く。多くのシミュレータが読み込めるので、機種の共通の入り口になる。mechArm では、DAY101まで mechArm 270 M5 のURDFでシミュレーションを組んできた。","key":true,"src":"DAY102"},{"id":"w043","category":"sim","sub":"","type":"word","front":"ROS 2","back":"ロボットのソフトを部品に分けて、つなぎ合わせるための共通基盤","detail":"名前はOSだが、実体は通信の仕組みと、道具や部品の集まり。センサー、計画、制御などを別々のプログラムとして動かし、決まった形式でデータをやりとりする。研究や開発の現場で、広く使われている。","key":true,"src":""},{"id":"w044","category":"sim","sub":"","type":"word","front":"ノードとトピック","back":"ROSで、処理の単位と、そのあいだを流れるデータの通り道","detail":"ノードは、カメラの読み取りや経路計画など、1つの役目を持つプログラム。トピックは名前の付いた通り道で、送る側と受け取る側が互いを知らなくてもデータをやりとりできる。","key":false,"src":""},{"id":"w045","category":"sim","sub":"","type":"word","front":"MoveIt","back":"アームの動作計画をまとめて扱う、ROSの代表的な道具","detail":"逆運動学、ぶつからない経路の計画、軌道の生成を、URDFなどの設定から組み立てられる。自前で書くと大変な部分を肩代わりしてくれる反面、設定項目が多い。ROS 2 版は MoveIt 2 と呼ぶ。","key":false,"src":""},{"id":"w046","category":"sim","sub":"","type":"word","front":"Gazebo","back":"ROSと組み合わせて使われてきた、無料のロボット用シミュレータ","detail":"ロボットとセンサーを仮想空間に置き、ROSのプログラムをそのままつないで試せる。移動ロボットの開発で、特によく使われる。旧版は Gazebo Classic、今の系統は Gazebo と呼び分ける。","key":false,"src":""},{"id":"w047","category":"sim","sub":"","type":"word","front":"Isaac Sim","back":"NVIDIAが提供する、GPUで動く高精細なロボット用シミュレータ","detail":"見た目のリアルさと、大量の並列計算が強み。強化学習用の Isaac Lab と組み合わせて、合成データづくりや学習に使われる。動かすには、NVIDIAのGPUを積んだ性能の高いマシンが要る。","key":false,"src":""},{"id":"w048","category":"sim","sub":"","type":"word","front":"MuJoCo（ムジョコ）","back":"接触の計算が速くて正確な、研究でよく使われる物理シミュレータ","detail":"名前は、接触を伴う多関節の力学という英語の頭文字から。強化学習の研究で、ベンチマーク環境として広く使われてきた。現在は Google DeepMind が、無料のオープンソースとして公開している。","key":false,"src":""},{"id":"w049","category":"sim","sub":"","type":"word","front":"並列シミュレーション","back":"同じ環境を何個も同時に動かして、データを一気に集めること","detail":"実機では1台ずつしか試せないが、シミュレーションなら何十、何千と並べられる。強化学習や、大量のデータ集めで特に効く。mechArm のツインでは、20体のアームを並列で動かし、約2.5時間かけてFKデータを取った。","key":false,"src":"DAY154"},{"id":"w050","category":"sim","sub":"","type":"word","front":"sim2real（シムツーリアル）","back":"シミュレーションで作った動きや学習結果を、実機へ持っていくこと","detail":"Sim-to-Real とも書く。安く大量に試せるシミュレーションの利点を、実機で生かすための考え方。そのまま持っていくと現実との差でうまく動かないことが多く、差を埋める工夫と組で語られる。","key":true,"src":""},{"id":"w051","category":"sim","sub":"","type":"word","front":"リアリティギャップ（sim2realギャップ）","back":"シミュレーションと現実のあいだにある、ずれのこと","detail":"摩擦、重さ、ギアのガタ、センサーの雑音、遅れなどが原因になる。シミュレーションでうまくいった動きが実機で失敗する理由の多くは、ここにある。差を測り、モデルを実機に合わせ込むことが第一歩。","key":false,"src":""},{"id":"w052","category":"sim","sub":"","type":"word","front":"ドメインランダマイゼーション","back":"シミュレーションの条件をわざとばらつかせ、現実のずれに強くする手法","detail":"色、明るさ、摩擦、重さなどを、試行ごとに変えて学習させる。現実を、たくさんの条件のうちの1つとして扱えるようにする考え方。OpenAI がロボットハンドを、シミュレーションだけで学習させて実機へ移した例が有名。","key":false,"src":""},{"id":"w053","category":"sim","sub":"","type":"word","front":"合成データ","back":"シミュレーションや画像生成で作った、学習用のデータ","detail":"実機で集めるより安く、正解のラベルも自動で付けられるのが強み。一方で、見た目や物理が現実とずれると、学習したモデルが実機で効かない。現実のデータと混ぜて使うのが一般的。","key":false,"src":""},{"id":"w054","category":"sim","sub":"","type":"word","front":"real2sim（リアルツーシム）","back":"現実の物や動きを測り取って、シミュレーションの中に再現すること","detail":"sim2real の逆向きで、現実をもとにシミュレーションを作る流れ。写真や動画から物の形を立て直したり、実機の値で物理の設定を合わせたりする。現実に近い仮想環境ほど、リアリティギャップは小さくなる。","key":false,"src":""},{"id":"w055","category":"vision","sub":"","type":"word","front":"画素（ピクセル）","back":"デジタル画像をつくる、色の数値を持った最小の点","detail":"画像は縦と横に並んだ画素の集まりで、各画素が明るさや色の数値を持つ。解像度は画素の縦横の数を指す。画像上の位置は画素の番号で表すため、ロボットを動かすにはmmなど実世界の長さへの変換が必要になる。","key":false,"src":""},{"id":"w056","category":"vision","sub":"","type":"word","front":"色空間（RGB・HSV）","back":"色を数字で表すときの、表し方の決まりごと","detail":"RGBは赤・緑・青の光の混ぜ具合で色を表す。HSVは色相・彩度・明度に分けるので、明るさが変わっても色の種類を保ちやすい。自分の検証では、照明の色を変えると色相が最大155度動き、青いブロックが色を失った。","key":true,"src":"DAY300"},{"id":"w057","category":"vision","sub":"","type":"word","front":"二値化（しきい値処理）","back":"決めた境目の値で、画素を白と黒の二つに分ける処理","detail":"色や明るさが境目より上か下かで画素を選び、白黒のマスク画像を作る。色で物を探す処理の基本になる。境目を固定すると照明の変化に弱く、自分の検証では光が変わると赤の検出が青を拾った。","key":false,"src":"DAY301"},{"id":"w058","category":"vision","sub":"","type":"word","front":"モルフォロジー演算","back":"白黒画像の小さな粒や穴を、形の大きさで整える処理","detail":"膨張と収縮を組み合わせ、決めた大きさより小さい白い粒を消したり、物の中の黒い穴を埋めたりする。消すのがオープニング、埋めるのがクロージング。しきい値処理の後始末に使うが、しきい値で取りこぼした部分までは直せない。","key":false,"src":""},{"id":"w059","category":"vision","sub":"","type":"word","front":"輪郭抽出（コンター）","back":"白黒画像から、物の外側のふちを線としてたどる処理","detail":"輪郭が取れると、面積・重心・外接する四角形などの形の情報を計算できる。物の位置や大きさを測る土台になる。ただし傾きに弱い量もあり、自分の検証では紙を43度回すと外接する四角形が1.75倍に膨らんだ。","key":false,"src":"DAY304"},{"id":"w060","category":"vision","sub":"","type":"word","front":"ROI（関心領域）","back":"画像の中で、処理の対象にする範囲だけを切り出した部分","detail":"見る範囲を絞ると計算が軽くなり、関係ない物の誤検出も減る。検出が不安定なときは、しきい値をいじる前に範囲を見直すと効く場合がある。mechArmでは、アームの胴体を白箱と誤検出したため、胴体の範囲を除外した。","key":false,"src":"DAY224"},{"id":"w061","category":"vision","sub":"","type":"word","front":"テンプレートマッチング","back":"見本の画像を少しずつずらし、似ている場所を探す方法","detail":"探したい物の見本画像を用意し、画像全体と重ねて一致度を計算する。手軽だが、大きさや向き、照明が見本と違うと弱い。mechArmでは白箱の見本を12枚撮り直し、一致度が0.547から0.994に上がった。","key":false,"src":"DAY165"},{"id":"w062","category":"vision","sub":"","type":"word","front":"特徴点マッチング","back":"二枚の画像から、同じ場所を指す特徴的な点を結びつける方法","detail":"角や模様の目立つ点を見つけ、その周りの様子を数値にして二枚の間で照合する。ORBやSIFTが代表的で、パノラマ合成や立体の復元に使う。自分の検証では、別の物を撮った写真どうしでも同じと判定される場合があった。","key":false,"src":"DAY309"},{"id":"w063","category":"vision","sub":"","type":"word","front":"物体検出（オブジェクトディテクション）","back":"画像の中の物を見つけ、四角い枠と名前と確からしさで返す処理","detail":"一枚に複数の物があっても、それぞれの位置と種類を出す。YOLOなどの学習済みモデルが代表例。画像全体に一つのラベルを付ける画像分類とは違い、どこに写っているかまで答える。自分の物を探させるには学習用データが要る。","key":true,"src":""},{"id":"w064","category":"vision","sub":"","type":"word","front":"バウンディングボックス（BBox）","back":"検出した物を囲むように描く、画像上の四角い枠","detail":"左上と右下の座標、または中心と幅と高さで表す。物体検出の標準的な出力形式。画面の縦横にそろえた枠が一般的で、斜めに置かれた物では余白が大きくなる。向きまで表す回転付きの枠もある。","key":false,"src":""},{"id":"w065","category":"vision","sub":"","type":"word","front":"IoU","back":"二つの枠がどれだけ重なっているかを、0から1で表す指標","detail":"重なった面積を、二つを合わせた面積で割って求める。1なら完全一致、0なら重なりなし。物体検出では、予測の枠と正解の枠のIoUが基準値以上なら当たりと数える。精度指標のmAPもこの判定の上に成り立つ。","key":false,"src":""},{"id":"w066","category":"vision","sub":"","type":"word","front":"セグメンテーション","back":"画像の画素ごとに、どの物に属するかを塗り分ける処理","detail":"四角い枠ではなく、物の形どおりの輪郭まで分かるので、掴む位置や向きを決めたいときに役立つ。最近は言葉で対象を指定できるモデルもある。自分の検証では、SAM 3が透明なガラス瓶とペットボトルを同じ物として切り出した。","key":false,"src":"DAY317"},{"id":"w067","category":"vision","sub":"","type":"word","front":"カメラ校正（キャリブレーション）","back":"カメラの特性や置き場所を、数値として求めておく作業","detail":"チェスボードなど寸法が分かった模様を何枚も撮って計算するのが一般的。求めた値を使うと、画像のゆがみを直したり、画像上の位置を実世界の位置へ変換したりできる。内部パラメータと外部パラメータの二つに分けて考える。","key":true,"src":""},{"id":"w068","category":"vision","sub":"","type":"word","front":"内部パラメータ","back":"焦点距離やレンズのゆがみなど、カメラ自体が持つ性質の値","detail":"画像の中心位置、焦点距離、レンズの歪み係数などを指す。カメラとレンズが同じなら、置き場所を変えても値は変わらない。mechArmの上カメラでは、ホモグラフィで十分な精度が出ていたため、チェスボードでの校正はやらない判断にした。","key":false,"src":"DAY192"},{"id":"w069","category":"vision","sub":"","type":"word","front":"外部パラメータ","back":"カメラが空間のどこに、どの向きで置かれているかを表す値","detail":"カメラの位置と向きを、ロボットや机の座標系に対する回転と平行移動で表す。カメラを動かしたりぶつけたりすると変わるので、取り直しが必要になる。内部パラメータと組み合わせると、画像の点と空間の点を対応づけられる。","key":false,"src":""},{"id":"w070","category":"vision","sub":"","type":"word","front":"ホモグラフィ","back":"ある平面の見え方を、別の視点から見た平面へ写しかえる変換","detail":"3行3列の行列で表し、斜めから撮った机の面を真上から見た形に直せる。対象が一つの平面上にある場合にだけ正しく成り立つ。mechArmでは、マットの四隅を検出し、ピクセル座標をmmに変換する行列を作った。","key":true,"src":"DAY164"},{"id":"w071","category":"vision","sub":"","type":"word","front":"視差（パララックス）","back":"見る位置が変わると、物の見える位置がずれて見える現象","detail":"二つのカメラの見え方のずれから距離を計算するのが、ステレオカメラの原理。一方で一台のカメラでは、高さの違いが位置のずれとして現れ、誤差の原因になる。mechArmでは、上カメラで見たZ方向のズレが視差だと分かり、横カメラが必要になった。","key":false,"src":"DAY191"},{"id":"w072","category":"vision","sub":"","type":"word","front":"深度カメラ（RGB-Dカメラ）","back":"色の画像と一緒に、各画素までの距離も測れるカメラ","detail":"赤外線の模様を当てる方式、光が返る時間を測る方式、二つのレンズの視差を使う方式がある。普通のカメラでは分からない高さや奥行きが取れる。mechArmでは、真上のカメラ写真だけではブロックが持ち上がったかをAIが判定できなかった。","key":true,"src":"DAY325"},{"id":"w073","category":"vision","sub":"","type":"word","front":"点群（ポイントクラウド）","back":"物の表面を、三次元の位置を持つたくさんの点の集まりで表したデータ","detail":"深度カメラやLiDARで得られ、各点がXYZの位置を持つ。画像と違い、物の立体的な形や距離をそのまま扱える。把持位置の計算や障害物の把握に使う。データ量が大きく、ノイズ除去や間引きなどの前処理が欠かせない。","key":false,"src":""},{"id":"w074","category":"servo","sub":"","type":"word","front":"経由点（ウェイポイント）","back":"動きの途中で通るように指定する、目印となる点","detail":"始点と終点だけでなく途中に経由点を置くと、障害物をよけたり、決まった姿勢を通らせたりできる。経由点の間をどうつなぐかは補間で決める。点を増やすほど動きは決まるが、教える手間も増える。","key":false,"src":""},{"id":"w075","category":"servo","sub":"","type":"word","front":"経路と軌道（パスとトラジェクトリ）","back":"経路は通る道筋、軌道はそこに時間と速さを加えたもの","detail":"経路はどこを通るかという形の情報だけを持つ。軌道は各時刻にどこにいるかまで決めたもので、速度や加速度も含む。実機に送るのは軌道。同じ経路でも速さの付け方で、動きの印象や安全性が大きく変わる。","key":true,"src":""},{"id":"w076","category":"servo","sub":"","type":"word","front":"補間（インターポレーション）","back":"離れた点と点のあいだを、なめらかな値でつないで埋めること","detail":"直線でつなぐ線形補間のほか、始めと終わりをゆっくりにする曲線の補間がある。教えた点が少なくても、補間で細かい動きを作れる。mechArmでは、実機の8点の動きをイーズインアウト補間で81点に広げた。","key":true,"src":"DAY152"},{"id":"w077","category":"servo","sub":"","type":"word","front":"速度プロファイル（加減速）","back":"動き出しから止まるまで、速さをどう変えるかの決め方","detail":"加速、一定速度、減速の三段で表す台形型が代表的。加速度の変化までなめらかにしたS字型は、揺れや衝撃が少ない。急に動き出したり止まったりすると、モーターや物に負担がかかり、見ている人も不安に感じやすい。","key":false,"src":""},{"id":"w078","category":"servo","sub":"","type":"word","front":"関節補間と直線補間","back":"関節の角度でつなぐか、手先の直線でつなぐかという補間の違い","detail":"関節補間は各関節の角度を同時に変えるので計算が軽いが、手先は曲線を描く。直線補間は手先がまっすぐ進むので、差し込みや真下への降下に向く。ただし途中ごとに逆運動学を解く必要があり、特異点の近くでは動けないことがある。","key":false,"src":""},{"id":"w079","category":"servo","sub":"","type":"word","front":"ティーチング（教示）","back":"ロボットに動きや位置を、人が直接教えて記録させること","detail":"操作盤で少しずつ動かして教える方法と、手でアームを動かして教えるダイレクトティーチングがある。教えた動きは何度でも再生できる。mechArmでは、関節の力を抜いて手で動かし、教えた軌道を実機で再生した。","key":true,"src":"DAY226"},{"id":"w080","category":"servo","sub":"","type":"word","front":"把持（グラスプ）","back":"グリッパーやハンドで、物をつかんで保持すること","detail":"どこを、どの向きで、どれくらいの力でつかむかを決める必要がある。つかめても、動かすうちに滑って落ちることがある。mechArmでは、爪を位置で止めるのをやめ、閉じ切らない目標値で押し込むように握ったら落ちなくなった。","key":true,"src":"DAY261"},{"id":"w081","category":"servo","sub":"","type":"word","front":"ピックアンドプレース（Pick&Place）","back":"物をつかんで持ち上げ、別の場所へ運んで置く一連の作業","detail":"産業用ロボットで最も基本的な作業の一つ。認識、接近、把持、搬送、解放がつながって初めて成立し、どこか一つの失敗で全体が止まる。mechArmでは、赤ブロックをつかんで運んで離す一連を、一本のスクリプトで初めて完走させた。","key":true,"src":"DAY176"},{"id":"w082","category":"servo","sub":"","type":"word","front":"アプローチと退避","back":"対象の手前まで近づく動きと、作業後に離れる動きのこと","detail":"いきなり目標へ向かわず、少し上の手前位置で一度止まり、そこからゆっくり近づく。作業後も来た方向へまっすぐ戻る。こうすると周りの物にぶつかりにくく、最後の位置合わせも安定する。","key":false,"src":""},{"id":"w083","category":"servo","sub":"","type":"word","front":"許容誤差（トレランス）","back":"目標に届いたとみなしてよい、ずれの許される範囲","detail":"目標とのずれがこの範囲に入ったら、到達や収束とみなして次の動作に進む。厳しすぎるといつまでも終わらず、緩すぎると作業に失敗する。mechArmの視覚サーボでは、8mmでは詰まり、12mmに緩めたところで爪が閉じた。","key":false,"src":"DAY208"},{"id":"w084","category":"servo","sub":"","type":"word","front":"動作計画（モーションプランニング）","back":"障害物を避けながら、目標までの動きを自動で求めること","detail":"ロボットの形と周りの障害物を考えて、ぶつからない経路を探す。RRTのように空間をランダムに探る方法がよく使われ、ROS2ではMoveItが標準的な道具になっている。見つけた経路は、そのあと速さを付けて軌道にする。","key":false,"src":""},{"id":"w085","category":"servo","sub":"","type":"word","front":"衝突回避","back":"ロボットが周りの物や人、自分の体にぶつからないようにすること","detail":"前もって障害物を避ける経路を計画する方法と、動作中にセンサーで検知して止める方法がある。持っている物の大きさも計算に入れる必要がある。mechArmでは、置くときにブロックの底が箱の縁に当たり、ブロックを持った状態で姿勢を教え直した。","key":false,"src":"DAY235"},{"id":"w086","category":"servo","sub":"","type":"word","front":"視覚サーボ（ビジュアルサーボ）","back":"カメラで見たずれを使い、目標に合うまで動きを直し続ける制御","detail":"見る、ずれを計算する、少し動く、をくり返して目標に近づける閉ループ制御。カメラや機体の誤差を、動きながら打ち消せる。mechArmでは、視覚サーボだけでブロックをつかむまでに21回のループを回した。","key":true,"src":"DAY208"},{"id":"w087","category":"servo","sub":"","type":"word","front":"アイインハンドとアイトゥハンド","back":"カメラを手先に付けるか、外に固定するかという二つの配置","detail":"手先に付けると対象に近づいて見られるが、動くたびに視点が変わる。外に固定すると全体を安定して見られるが、隠れた場所は見えない。mechArmは上の固定カメラを使い、手先用の部品はグリッパーと同時に付けられないと分かった。","key":false,"src":"DAY159"},{"id":"w088","category":"servo","sub":"","type":"word","front":"ハンドアイ校正（ハンドアイキャリブレーション）","back":"カメラとロボットの、位置と向きの関係を求める作業","detail":"ロボットをいくつかの姿勢に動かしながら目印を撮り、座標の変換を計算する。手先にカメラを付けるなら手先との関係、外に固定するなら土台との関係を求める。これがないと、カメラで見つけた物へ手先を正しく動かせない。","key":false,"src":""},{"id":"w089","category":"servo","sub":"","type":"word","front":"受け渡し（ハンドオーバー）","back":"ロボットと人のあいだで、物を手渡したり受け取ったりする動作","detail":"差し出す位置と高さ、離すタイミング、人が受け取ったかの判定が要になる。人の手が動作範囲に入るため、置く作業より安全への配慮が増える。mechArmでは、アームが差し出し人が受け取る設計を、外部レビュー4回を経て固めた。","key":false,"src":"DAY288"},{"id":"w090","category":"servo","sub":"","type":"word","front":"コンプライアンス（柔らかさ）","back":"外から力を受けたとき、ロボットが逆らわずに少したわむ性質","detail":"ばねのような柔らかい部品で作る機械的な方法と、力の検出と制御で作る方法がある。穴への差し込みや人との接触で、位置のずれや衝撃を吸収できる。位置を硬く守る位置制御とは、考え方が逆になる。","key":false,"src":""},{"id":"w091","category":"servo","sub":"","type":"word","front":"インピーダンス制御","back":"ばねとダンパーのような柔らかさを、制御でロボットに持たせる方法","detail":"目標位置からのずれと押し返す力の関係を、ばねの硬さと揺れの抑えで決める。力センサーやモーターの電流を使って実現し、押し付け作業や人との協働で使われる。力そのものを目標にする力制御とは区別される。","key":false,"src":""},{"id":"w092","category":"learning","sub":"","type":"word","front":"学習（トレーニング）","back":"データを使って、モデルの中の数値を少しずつ調整すること","detail":"予測と正解のずれを損失として計算し、それが小さくなる方向へパラメータを更新する。これを大量のデータでくり返す。計算が重く、GPUが必要になることが多い。学習が終わったモデルを使う段階は推論と呼んで区別する。","key":false,"src":""},{"id":"w093","category":"learning","sub":"","type":"word","front":"推論（インファレンス）","back":"学習済みのモデルに入力を渡し、答えを出させること","detail":"ロボットでは、画像や関節の状態を入力して次の動きを出させる。学習より計算は軽いが、動きを止めない速さが求められる。借りたクラウドのGPU（A40）でπ0.5を動かすと、一回の計算は平均97ミリ秒だった。","key":false,"src":"DAY326"},{"id":"w094","category":"learning","sub":"","type":"word","front":"観測と行動（オブザベーションとアクション）","back":"ロボットが受け取る情報と、それをもとに出す動きの指令","detail":"観測はカメラ画像や関節角など、行動は次の関節角や手先の移動量などを指す。ロボット学習のデータは、この二つを時刻でそろえた組の連続になる。時刻がずれると、どの観測からどの行動が出たのか読めなくなる。","key":false,"src":""},{"id":"w095","category":"learning","sub":"","type":"word","front":"方策（ポリシー）","back":"観測を受け取り、次にどう動くかを決める仕組み","detail":"強化学習でも模倣学習でも、学習で最終的に得るのはこの方策。ルールで書いた方策もあるが、ロボット学習ではニューラルネットワークで表すことが多い。モデルとほぼ同じ意味で使われるが、方策は観測から行動を決める役割を指す言葉。","key":true,"src":""},{"id":"w096","category":"learning","sub":"","type":"word","front":"エピソード","back":"タスクの開始から終了までの、ひと区切りの試行","detail":"強化学習や模倣学習のデータは、エピソード単位で集めて数える。一つのエピソードは、観測と行動の組が時間順に並んだもので、成功か失敗かもエピソードごとに記録する。AGIBOTの約100万エピソードに対し、mechArmは10エピソードから始めると考えた。","key":false,"src":"DAY140"},{"id":"w097","category":"learning","sub":"","type":"word","front":"デモンストレーション（実演データ）","back":"人がお手本として操作して見せた、動きの記録","detail":"人が遠隔操作や手で動かして作業をこなし、その観測と行動を記録する。模倣学習の材料になる。本数だけでなく、置き場所や手順のばらつき方が質を左右する。SO-101では、リーダーアームで実演を50本集める案を立てた。","key":false,"src":"DAY323"},{"id":"w098","category":"learning","sub":"","type":"word","front":"テレオペレーション（遠隔操作）","back":"人が離れた場所から、ロボットをリアルタイムに操作すること","detail":"コントローラーやVR、同じ形の操作用アームなどで動かす。操作用アームをリーダー、動く側をフォロワーと呼ぶ構成が、ロボット学習のデータ集めで広く使われる。人の判断が入るので、自律では難しい作業の実演も集められる。","key":true,"src":""},{"id":"w099","category":"learning","sub":"","type":"word","front":"模倣学習","back":"人の実演データをお手本に、ロボットに動きを覚えさせる学習","detail":"報酬を設計しなくても、見本があれば学べるのが利点。少ないデータで始めやすい反面、見本にない状況には弱い。強化学習と組み合わせることもある。mechArmでは、模倣学習に使える形で、試行の映像と関節データを同期して残し始めた。","key":true,"src":"DAY287"},{"id":"w100","category":"learning","sub":"","type":"word","front":"行動クローニング（BC）","back":"観測と行動の組を、そのまま真似るように学ぶ最も単純な模倣学習","detail":"実演データを、観測から行動を当てる問題として普通に学習する。手軽だが、少しずれると見本にない状態に入り、誤差が積み重なりやすい。人の実演はやり方がばらつくため、単純に平均を学ばせると動きが崩れる場合がある。","key":false,"src":""},{"id":"w101","category":"learning","sub":"","type":"word","front":"強化学習（RL）","back":"試行錯誤の結果に点数を付け、点数が高くなる動きを学ぶ方法","detail":"ロボットが動き、成功や失敗に応じた報酬を受け取り、報酬の合計が大きくなるように方策を更新する。お手本がなくても学べるが、膨大な試行が必要になる。そのため実機ではなく、シミュレーションで学習させることが多い。","key":true,"src":""},{"id":"w102","category":"learning","sub":"","type":"word","front":"報酬（リワード）","back":"行動の結果がどれだけ良かったかを示す、強化学習の点数","detail":"何に点を与えるかで、学習される動きが大きく変わる。設計が甘いと、意図しない近道で点だけ稼ぐ報酬ハッキングが起きる。mechArmでは、真上のカメラ写真を画像の読めるAIに渡し、掴めたか置けたかを判定させている。","key":true,"src":"DAY325"},{"id":"w103","category":"learning","sub":"","type":"word","front":"汎化","back":"学習で見たことのない状況でも、うまく動けること","detail":"物の置き場所、照明、背景、物の種類が変わっても成功するかで測る。データの多様さが汎化を左右する。学習時と同じ条件だけで成功率を測ると、実力を高く見積もってしまう。ロボット学習の最大の課題の一つ。","key":false,"src":""},{"id":"w104","category":"learning","sub":"","type":"word","front":"過学習（オーバーフィッティング）","back":"学習データを覚えすぎて、新しいデータに弱くなる状態","detail":"学習用データでは高い成績なのに、初めて見るデータで成績が落ちる。これを見分けるため、データを学習用・検証用・テスト用に分けて評価する。データを増やす、条件を散らすといった工夫で防ぐ。汎化と裏表の関係にある。","key":false,"src":""},{"id":"w105","category":"learning","sub":"","type":"word","front":"基盤モデル（ファウンデーションモデル）","back":"大量のデータで事前に学習され、多くの用途に転用できる大きなモデル","detail":"言語や画像の分野で広がり、ロボット向けの基盤モデルも登場している。一から学習するより、少ないデータで新しい作業に対応しやすい。ただしモデルが大きく、動かすには高性能なGPUが必要になることが多い。","key":false,"src":""},{"id":"w106","category":"learning","sub":"","type":"word","front":"事前学習（プレトレーニング）","back":"特定の作業の前に、大量の一般的なデータで学ばせておく段階","detail":"物の見え方や動きの一般的なパターンを先に身につけさせる。基盤モデルを作る段階にあたり、膨大な計算資源が必要で、主に大手が担う。個人や小さなチームは、公開された事前学習済みのモデルを使って始めることが多い。","key":false,"src":""},{"id":"w107","category":"learning","sub":"","type":"word","front":"ファインチューニング","back":"事前学習済みのモデルを、自分のデータで追加学習して合わせること","detail":"自分の機体、カメラの配置、作業内容に合わせるために行う。一から学習するより、少ないデータと計算で済む。ただし元のモデルの入力の形や関節の数に合わせる必要があり、データが少なすぎると過学習しやすい。","key":false,"src":""},{"id":"w108","category":"learning","sub":"","type":"word","front":"VLM（視覚言語モデル）","back":"画像と言葉を一緒に理解し、言葉で答えるAIモデル","detail":"画像について質問すると文章で答えられる。ロボットでは状況の説明、作業の計画、成功したかの判定などに使う。動きの指令そのものは出さない点がVLAとの違い。mechArmでは、掴みと置きの成否をVLMに判定させ、人の目を介さずに返している。","key":false,"src":"DAY235"},{"id":"w109","category":"learning","sub":"","type":"word","front":"VLA（視覚言語行動モデル）","back":"画像と言葉の指示から、ロボットの動きを直接出力するモデル","detail":"VLMに行動の出力を加えたもので、ロボット向け基盤モデルの主流になりつつある。π0やSmolVLAなどが公開されている。借りたクラウドのGPUでπ0.5を動かし、画像と指示を送って動きの数値を受け取るところまで通した。","key":true,"src":"DAY326"},{"id":"w110","category":"eval","sub":"","type":"word","front":"試行（トライアル）","back":"同じ条件で、ロボットに動作を1回やらせること","detail":"評価の最小単位。1回の結果は偶然に左右されるので、同じ条件で何回も試行して傾向を見る。置き場所や照明など、試行ごとの条件と結果を記録しておかないと、あとで比べたり原因を探したりできない。","key":true,"src":""},{"id":"w111","category":"eval","sub":"","type":"word","front":"成功率（サクセスレート）","back":"試行した回数のうち、成功した回数が占める割合","detail":"ロボット学習で最もよく使う評価の数字。パーセントだけでなく、何回中何回かを必ず添えて言う。回数が少ないと数字が大きくぶれる。mechArm では1日の63試行のうち、PICK の成功は41回だった。","key":true,"src":"DAY266"},{"id":"w112","category":"eval","sub":"","type":"word","front":"成功条件","back":"何をもって成功とするかを、試行の前に決めた基準","detail":"どこに置けば成功か、何秒以内なら成功か、などを試行の前に決めておく。基準があいまいだと、人や日によって判定が変わり、成功率を比べられなくなる。途中で基準を変えたら、それ以前の数字とは別に扱う。","key":false,"src":""},{"id":"w113","category":"eval","sub":"","type":"word","front":"ロギング（ログ）","back":"動作中の状態や結果を、あとで見返せるよう記録すること","detail":"指令値、実際に届いた値、時刻、成否などを残す。記録がなければ失敗の原因は推測でしか語れない。mechArm では通し動作1回ごとに、成否を台帳へ1行残す決まりにしている。","key":true,"src":"DAY249"},{"id":"w114","category":"eval","sub":"","type":"word","front":"データセット","back":"学習や評価に使うために集めて整理したデータのまとまり","detail":"画像、関節角、動作の記録などを、決まった形式でそろえたもの。学習用と評価用は分けておくのが基本。学習に使ったデータで評価すると、本当の実力より良い数字が出てしまう。","key":true,"src":""},{"id":"w115","category":"eval","sub":"","type":"word","front":"失敗モード","back":"失敗を、その起き方や原因ごとに分けた種類","detail":"成功率だけでは何を直せばよいか分からない。掴めなかったのか、置けなかったのかを分けて数えると、打ち手が見える。mechArm でも PICK 失敗と PLACE 失敗を分けて記録する設計にした。","key":false,"src":"DAY130"},{"id":"w116","category":"eval","sub":"","type":"word","front":"ベースライン","back":"改善の効果を比べるための、基準となる結果","detail":"何かを変える前の成績や、単純な方法での成績を基準として置く。基準がないと、良くなったのか分からない。mechArm では PLACE の接近が1回成立した状態を基準にして、次の改善に進もうとした。","key":true,"src":"DAY210"},{"id":"w117","category":"eval","sub":"","type":"word","front":"再現性","back":"同じ手順と条件で、同じ結果がもう一度得られること","detail":"1回うまくいっただけでは、偶然かもしれない。条件を記録し、繰り返して同じ結果が出るかを確かめる。mechArm でも、1回の成功だけでは閾値12mmで常に抜けられるとは言えず、再現テストが必要とした。","key":true,"src":"DAY208"},{"id":"w118","category":"eval","sub":"","type":"word","front":"誤差","back":"測った値や到達した位置と、本当の値とのずれ","detail":"ロボットではカメラの測定、関節の到達、計算モデルなど、あちこちで誤差が出る。誤差は大きく、いつも同じ向きにずれる系統誤差と、毎回ばらつく偶然誤差に分けて考える。","key":false,"src":""},{"id":"w119","category":"eval","sub":"","type":"word","front":"系統誤差","back":"原因が決まっていて、いつも同じ向きにずれる誤差","detail":"原因が決まっているので、見つけて補正しやすい。平均をとっても消えないのが特徴。mechArm では、計算上の手先と実機の爪先の間に、マット上の奥行き方向で約58mmの系統的なずれがあると、5点の実測で確かめた。","key":false,"src":"DAY178"},{"id":"w120","category":"eval","sub":"","type":"word","front":"偶然誤差（ばらつき）","back":"毎回ランダムに上下する、向きの決まらない誤差","detail":"回数を重ねて平均をとると小さくできる。どれくらいばらつくかは標準偏差で表す。mechArm の同じ測定では、左右方向のずれは向きが決まらず、プラスマイナス20mm程度のばらつきだった。","key":false,"src":"DAY178"},{"id":"w121","category":"eval","sub":"","type":"word","front":"正確さと精密さ","back":"狙いに近いのが正確さ、毎回そろうのが精密さ","detail":"的当てで言えば、中心に近いのが正確さ、矢がまとまっているのが精密さ。毎回同じ所にずれて当たるロボットは、精密だが正確ではない。どちらが足りないかで直し方が変わる。","key":false,"src":""},{"id":"w122","category":"eval","sub":"","type":"word","front":"外れ値","back":"他のデータから大きく離れた、例外的な値のこと","detail":"測定の失敗や一時的なノイズで出ることが多い。そのまま平均に入れると結果がゆがむ。ただし外れ値が本当の問題を示すこともあるので、黙って捨てず理由を残す。mechArm のマット四隅検出では、外れ値を除いてから平均した。","key":false,"src":"DAY164"},{"id":"w123","category":"eval","sub":"","type":"word","front":"アノテーション","back":"画像やデータに、人が正解の情報を書き込む作業","detail":"物体を枠で囲む、輪郭をなぞる、点を打つ、などの種類がある。学習用データ作りで最も時間がかかる工程といわれる。付ける人によって基準がぶれないよう、先に手順と判断のルールを決めておく。","key":false,"src":""},{"id":"w124","category":"eval","sub":"","type":"word","front":"正解データ（グラウンドトゥルース）","back":"評価の基準にする、本当の値とみなすデータ","detail":"評価する仕組みとは別の方法で作るのが原則。同じ仕組みで正解を作ると、間違いに気づけない。画像認識シリーズでは、表紙の四隅の真値を手動のアノテーションで作り、評価対象と分けた。","key":false,"src":"DAY309"},{"id":"w125","category":"eval","sub":"","type":"word","front":"評価指標（メトリクス）","back":"性能を数字で表すために使う、決まった物差し","detail":"成功率、位置の誤差、作業にかかる時間などがある。何を指標にするかで、改善の向かう方向そのものが変わる。一つの数字だけを追いかけると、安全性や動きの質など、他の大事な性質を見落としやすい。","key":false,"src":""},{"id":"w126","category":"eval","sub":"","type":"word","front":"ベンチマーク","back":"性能を比べるための、共通の課題と評価のやり方","detail":"同じ課題、同じ手順、同じ指標で測るので、違う手法どうしを公平に比べられる。研究の進み具合を示す共通の物差しになる。ただし、ベンチマークで高得点でも、自分の現場で同じように通用するとは限らない。","key":false,"src":""},{"id":"w127","category":"eval","sub":"","type":"word","front":"統計的なぶれ（信頼区間）","back":"試行回数が少ないと、成功率が偶然だけで動く幅","detail":"回数が少ないほど、たまたまの結果に引っ張られる。小さな差を手法の差と言うには、十分な回数が要る。成功率50%前後で30回だと、95%の範囲で上下に約18ポイントぶれると記事で見積もった。","key":false,"src":"DAY323"},{"id":"w128","category":"eval","sub":"","type":"word","front":"分布外（OOD）","back":"学習のときに見たことのない、新しい条件やデータ","detail":"照明、置き場所、物の形や色などが学習時と違うと、性能が大きく落ちやすい。評価では、学習と同じ条件だけでなく、あえて分布外の条件でも試して、汎化の力がどこまであるかを確かめる。","key":false,"src":""},{"id":"w129","category":"eval","sub":"","type":"word","front":"アブレーション","back":"部品を一つずつ外して、それぞれの効き目を確かめる実験","detail":"手法のどの要素が成績に効いているかを切り分けるために行う。全部入りの結果だけでは、何が効いたのか分からない。研究論文ではほぼ必ず載っている比較のやり方で、読むときの大事な手がかりになる。","key":false,"src":""},{"id":"w130","category":"principles","sub":"","type":"word","front":"反復開発（イテレーション）","back":"小さく作って試し、直す流れを何度も回す進め方","detail":"最初から完成形を狙わず、動く最小のものを作って試し、その結果から次の一手を決める。ロボットは実機で試して初めて分かることが多いので、特にこの進め方が合う。1回の周期を短くするほど、学びが速くなる。","key":true,"src":""},{"id":"w131","category":"principles","sub":"","type":"word","front":"仮説検証","back":"原因の予想を立て、実験でそれが正しいか確かめること","detail":"予想は一度に一つずつ確かめる。外れた仮説も、原因の候補を減らす成果になる。mechArm で関節が届かない問題では、待ち時間を短くしても6回とも届き、待ち時間は主因でないと分かった。","key":false,"src":"DAY273"},{"id":"w132","category":"principles","sub":"","type":"word","front":"切り分け","back":"問題の範囲を少しずつ狭めて、原因の場所を特定すること","detail":"全体をまとめて疑うのではなく、部品ごとに分けて単独で動かし、どこで壊れるかを探す。mechArm では動かない739行のスクリプトを、6つの単体スクリプトに分けて調べた。","key":false,"src":"DAY211"},{"id":"w133","category":"principles","sub":"","type":"word","front":"ボトルネック","back":"全体の速さや性能を、いちばん強く制限している部分","detail":"瓶の首のように、そこが詰まると全体が詰まる。他を速くしても全体は速くならないので、まず測って場所を見つける。mechArm の画像検出では、グレースケール化で14.48秒が5.09秒に縮んだ。","key":true,"src":"DAY211"},{"id":"w134","category":"principles","sub":"","type":"word","front":"根本原因分析（RCA）","back":"表に出た症状ではなく、問題を生んだ大もとを突き止めること","detail":"症状だけを直すと、形を変えて再発する。なぜを繰り返して大もとまでたどる。mechArm では、補正値をいじっても爪が合わない原因が、手首と爪先の位置の違いにあると分かった。","key":true,"src":"DAY162"},{"id":"w135","category":"principles","sub":"","type":"word","front":"段階的検証","back":"小さな単位から順に確かめ、少しずつ範囲を広げる検証","detail":"部品単体、部品をつないだ状態、実機での通し動作、の順に進める。いきなり全体を動かすと、失敗しても原因がどこにあるか分からず、ロボットや周りの物を壊す危険もある。前の段階が通ってから次へ進む。","key":true,"src":""},{"id":"w136","category":"principles","sub":"","type":"word","front":"ドライラン（dry-run）","back":"実際には動かさず、計画や処理の流れだけを試すこと","detail":"ロボットに指令を送らずに、計算結果や動作の予定を確認できる。危険な動作の前の安全確認として使う。mechArm では、dry-run で計画を確かめてから本番の PICK から PLACE を通す順番を決めた。","key":false,"src":"DAY256"},{"id":"w137","category":"principles","sub":"","type":"word","front":"フェイルセーフ","back":"故障や異常が起きても、安全な側に倒れるようにする設計","detail":"信号が途切れたら止まる、電源が落ちたらブレーキがかかる、などが代表例。ただし止まること自体が危険な場合もあるので、その機械にとって何が安全な状態なのかを、設計の最初に決めておく必要がある。","key":true,"src":""},{"id":"w138","category":"principles","sub":"","type":"word","front":"フォールバック","back":"主な方法が使えないときに切り替える、代わりの手段","detail":"便利な反面、気づかないうちに代わりの道で動き続ける危険がある。mechArm では、記録先の外付けドライブがないときに別の場所へ書かず、そこで止める設計にした。","key":false,"src":"DAY244"},{"id":"w139","category":"principles","sub":"","type":"word","front":"非常停止（E-stop）","back":"異常時に、人がすぐロボットを止めるための仕組み","detail":"押しボタンなどで、すぐ確実に止められることが求められる。電源を切るだけでは、関節の保持力が抜けて腕が落ちることがある。mechArm の受け渡し設計でも、電源断は非常停止とは言えないと指摘された。","key":false,"src":"DAY288"},{"id":"w140","category":"principles","sub":"","type":"word","front":"インターロック","back":"条件がそろわない限り、動作できないようにする仕組み","detail":"安全柵の扉が開いたらロボットが動かない、などが代表例。人の注意や記憶に頼らず、仕組みで危険な組み合わせを起こさせない。ソフトウェアで、条件がそろわないと次の処理に進まないようにするのも同じ考え方。","key":false,"src":""},{"id":"w141","category":"principles","sub":"","type":"word","front":"安全マージン","back":"限界ぎりぎりではなく、余裕を残して決める設定の幅","detail":"関節の可動範囲や速度、力の上限を、仕様の限界よりも内側に設定する。誤差やばらつきが出ても、危険な状態に入らないようにするため。余裕を取りすぎると、今度はできる動きが狭くなるので、実測で決める。","key":false,"src":""},{"id":"w142","category":"principles","sub":"","type":"word","front":"最小構成（MVP）","back":"目的を確かめるのに必要な、いちばん小さな形","detail":"機能を足す前に、核になる部分だけで目的が成り立つかを確かめる。早く試せて、無駄な作り込みを防げる。足りないものは試したあとで実測して分かるが、余計なものは作ったあとでは気づきにくい。","key":false,"src":""},{"id":"w143","category":"principles","sub":"","type":"word","front":"技術的負債","back":"その場しのぎの実装が、あとで修正の手間として返ってくること","detail":"急いで書いたコードや、場当たりの補正値が典型。動いているうちは問題に見えないが、あとから直すほど手間が増え、別の変更の足を引っぱる。借金と同じで、気づいたら早めに返すほうが安くつく。","key":false,"src":""},{"id":"w144","category":"principles","sub":"","type":"word","front":"コードレビュー","back":"書いたコードを、別の人や別の目で確認すること","detail":"書いた本人は同じ思い込みを持つので、自分では見落としに気づきにくい。mechArm でも、関節制御で繰り返し止まる問題は、自分の仮説だけで進めず外部のレビューに通した。","key":false,"src":"DAY235"},{"id":"w145","category":"principles","sub":"","type":"word","front":"HRI（ヒューマンロボットインタラクション）","back":"人とロボットのやり取りや関わり方を扱う分野","detail":"安全だけでなく、分かりやすさ、安心感、信頼などを扱う。研究分野であると同時に、設計の実務でもある。mechArm では、アームが差し出したブロックを人が受け取る動作を設計した。","key":true,"src":"DAY288"},{"id":"w146","category":"principles","sub":"","type":"word","front":"動きの分かりやすさ（レジビリティ）","back":"動きを見ただけで、ロボットの狙いが人に伝わる性質","detail":"どの物を取りに行くのかが、途中の動きから早めに分かると、人は安心して横で作業できる。最短で効率のよい動きが、人にとって一番分かりやすい動きとは限らない。HRI の研究でよく扱われる性質。","key":false,"src":""},{"id":"w147","category":"principles","sub":"","type":"word","front":"ヒューマンインザループ","back":"判断や修正の流れの中に、人を組み込んだ仕組み","detail":"ロボットに全部を任せず、迷った場面や失敗しかけた場面で人が判断したり手を貸したりする。学習の場面では、人が途中で修正した内容をそのままデータとして使い、学習を早める方法もある。","key":false,"src":""},{"id":"w148","category":"society","sub":"","type":"word","front":"産業用ロボット","back":"工場で溶接や組立、搬送などを自動で行うロボット","detail":"主に安全柵の中で、決まった動きを高速かつ正確に繰り返す。自動車や電子部品の工場が代表的な現場。人と同じ空間で働く協働ロボットとは、安全の考え方や求められる性能の優先順位が違う。","key":true,"src":""},{"id":"w149","category":"society","sub":"","type":"word","front":"協働ロボット（コボット）","back":"柵なしで、人のそばで一緒に働けるよう作られたロボット","detail":"力の制限や接触の検知などで、人と同じ空間で使えるよう作られている。速度や力は産業用ロボットより抑えめ。ただし協働ロボットを使えば自動的に安全、ではない。使い方ごとにリスクアセスメントが必要になる。","key":true,"src":""},{"id":"w150","category":"society","sub":"","type":"word","front":"サービスロボット","back":"工場の外で、人の生活や仕事を手伝うロボット","detail":"配膳、清掃、警備、案内、介護などの分野で使われる。工場と違って、環境が整えられていない場所で、しかも一般の人のそばで動く。そのため想定外の出来事が多く、安全と使いやすさの設計が難しい。","key":false,"src":""},{"id":"w151","category":"society","sub":"","type":"word","front":"AGV（無人搬送車）","back":"床の線や印に沿って、決まった経路で荷物を運ぶ車","detail":"磁気テープや床の印などで経路を決め、その上を走る。動きが決まっているので安定して使える反面、経路を変えるには設備の工事が要る。地図を持って自分で道を選ぶ AMR との違いが、よく比べられる。","key":false,"src":""},{"id":"w152","category":"society","sub":"","type":"word","front":"AMR（自律移動ロボット）","back":"地図とセンサで、自分で道を選んで移動するロボット","detail":"センサで周りを見ながら、障害物を避けて経路をその場で決め直せる。倉庫や工場の搬送でよく使われる。床に線を引く必要がないので、棚の配置を変えるなどのレイアウト変更にも強い。","key":false,"src":""},{"id":"w153","category":"society","sub":"","type":"word","front":"ヒューマノイド","back":"人に近い体の形をした、二足歩行などのロボット","detail":"人向けに作られた建物や道具を、そのまま使える可能性があるとして注目されている。一方で、機構が複雑で値段が高く、転倒などの安全面の課題もある。現場で安定して働かせるのは、まだ難しい段階にある。","key":false,"src":""},{"id":"w154","category":"society","sub":"","type":"word","front":"省人化","back":"作業に必要な人の数を、機械化や自動化で減らすこと","detail":"人手不足への対策として、日本の製造や物流の現場でよく使われる言葉。人を完全になくす無人化とは違い、判断や例外対応など人が担う部分を残しながら、人の数や負担を減らしていく考え方。","key":false,"src":""},{"id":"w155","category":"society","sub":"","type":"word","front":"タクトタイム","back":"製品1個を作るのに許される、生産上の目標時間","detail":"生産したい数と使える時間から決まる時間で、ロボットの動作はこの中に収まる必要がある。実際に1個の作業にかかる時間であるサイクルタイムとは別の言葉なので、混同しないよう注意する。","key":false,"src":""},{"id":"w156","category":"society","sub":"","type":"word","front":"SIer（システムインテグレータ）","back":"ロボットを現場に合わせて組み込み、仕組みとして納める会社","detail":"ロボット本体だけでは仕事にならず、ハンドや周辺機器、プログラムを組み合わせて初めて現場で動く。日本のロボット導入の多くは、この SIer が支えている。人手が足りず、導入の待ちが生まれることもある。","key":true,"src":""},{"id":"w157","category":"society","sub":"","type":"word","front":"PoC（概念実証）","back":"本格導入の前に、小さく試して効果を確かめること","detail":"現場の一部で小さく試し、技術的にできるか、効果が出るかを確かめる。本格導入の前に失敗の芽を見つけられる。一方で、試すだけで本番に進まないPoC止まりが、業界の課題としてよく語られる。","key":false,"src":""},{"id":"w158","category":"society","sub":"","type":"word","front":"ROI（投資対効果）","back":"かけたお金に対して、どれだけの効果が返ってくるかの指標","detail":"ロボット導入では、本体の値段だけでなく、組み込み、保守、教育にかかる費用も含めて考える。何年で元が取れるかという回収期間とあわせて、導入するかどうかを決める主な判断材料になる。","key":true,"src":""},{"id":"w159","category":"society","sub":"","type":"word","front":"安全柵","back":"ロボットの動く範囲に、人が入れないよう囲う柵","detail":"産業用ロボットの基本的な安全対策。扉が開くと止まるインターロックと組み合わせて使う。柵が要らない使い方をするには、リスクアセスメントで安全を確かめる必要がある。","key":false,"src":""},{"id":"w160","category":"society","sub":"","type":"word","front":"リスクアセスメント","back":"危険を洗い出し、その大きさを見積もって対策を決める手順","detail":"どんな危険があるか、起きたらどれくらい重いかを評価する。対策は、まず設計で危険を減らし、次に保護装置、最後に注意表示や教育の順で考える。ロボットの安全の出発点になる手順。","key":true,"src":""},{"id":"w161","category":"society","sub":"","type":"word","front":"安全規格（ISO 10218）","back":"産業用ロボットの安全について定めた国際規格","detail":"ロボット本体の作り方と、現場への組み込み方の両方について安全の要求を定めている。日本ではこれに対応したJIS規格がある。2025年の改訂で、協働の使い方を定めた技術仕様 ISO/TS 15066 の内容も取り込まれた。","key":false,"src":""},{"id":"w162","category":"society","sub":"","type":"word","front":"機能安全","back":"制御の仕組みが壊れても、安全を保てるようにする考え方","detail":"センサやプログラムが故障することを前提に、安全を担う機能の信頼性を決めて作る考え方。ふつうの機能とは別に、安全のための機能を設計し、どれだけ確実に働くかを評価する。機械や車でも使われる。","key":false,"src":""},{"id":"w163","category":"society","sub":"","type":"word","front":"RaaS（ロボットアズアサービス）","back":"ロボットを買わずに、月額などの利用料で使う仕組み","detail":"ロボットを買い取らずに使えるので、初期費用を抑えられる。保守や更新も提供する側がまとめて受け持つ。導入のハードルを下げる売り方として、物流や清掃などのサービス分野で広がっている。","key":false,"src":""},{"id":"w164","category":"society","sub":"","type":"word","front":"フィジカルAI（Physical AI）","back":"現実の世界を認識し、体を動かして働くAI","detail":"画面の中で文章や画像を作るAIと違い、ロボットなどの体を通して、現実の物に働きかける。カメラの映像や言葉の指示から動作を決めるモデルが発展したことで、業界の注目が一気に集まっている。","key":true,"src":""},{"id":"k001","category":"kinematics","sub":"","type":"lesson","front":"人の感覚・ロボットのコード・シミュで「X」の向きが違い、指示がすれ違う。どうする？","back":"座標系を1つに決めて、全部をそこにそろえる","detail":"mechArm では、人の直感（マット上で X=左右）、ロボット座標（X=前後・Y=左右・Z=高さ）、Unity（X=左右・Y=高さ・Z=前方）で X の意味が3通りに分かれ、会話が何度も噛み合わなかった。Unity 座標系に全部統一すると、Claude Code への指示も一貫した用語で書けるようになった。","key":true,"src":"DAY149・DAY158・DAY160","kw":[["座標系","座標","ざひょう"],["1つ","ひとつ","一つ","統一"],["そろえる","揃える","合わせる","あわせる"]]},{"id":"k002","category":"kinematics","sub":"","type":"lesson","front":"あるツールで作ったロボットの寸法や座標を、別のツールへ移したい。値を写す前に最初に何を確かめる？","back":"ツールをまたぐときは、右手系か左手系か・どの軸が上かを確かめる","detail":"ROS は右手系、Unity は左手系で、上を向く軸も違う。URDF の値を Unity へ移すときは Unity.x=ROS.x、Unity.y=ROS.z、Unity.z=ROS.y と軸を入れ替える必要があった。","key":false,"src":"DAY133","kw":[["右手系","みぎてけい","右手"],["左手系","ひだりてけい","左手"],["上","うえ","どの軸","軸"]]},{"id":"k003","category":"kinematics","sub":"","type":"lesson","front":"カメラから目標への変換の誤差は小さいのに、アームが目標と逆方向へ動いた。まず何を疑う？","back":"逆に動いたら、まず変換の符号を疑う","detail":"lookup の距離は0.7mmなのに、アームがブロックと逆へ動いた。画像→平面座標の校正の Y 軸の符号が最初から逆だった。実機で j0 を−30°動かして手先の向きを見て分かり、1行の符号修正で直った。","key":false,"src":"DAY154","kw":[["逆","ぎゃく","反対"],["符号","ふごう","プラスマイナス","向き"],["疑う","うたがう","確かめる"]]},{"id":"k004","category":"kinematics","sub":"","type":"lesson","front":"カメラ座標とロボット座標を1点で合わせたら、その点は合うのに別の場所で大きくずれる。どうする？","back":"座標の対応は1点でなく、複数の実測点で結ぶ","detail":"原点も向きも違うので、1点で合わせたオフセット式は別の位置で X 約38mm・Y 約50mm ずれた。ホモグラフィの対応点にロボット座標の実測値を入れ、画素→ロボット座標を直接出す方式に変えた。","key":false,"src":"DAY144","kw":[["1点","いってん","一点"],["複数","ふくすう","たくさん"],["実測","じっそく","測った","はかった"]]},{"id":"k005","category":"kinematics","sub":"","type":"lesson","front":"計算上の手先の位置は目標に合っているはずなのに、実際に掴む位置がずれる。まず何を見直す？","back":"手先の基準点は、作業が起きる場所に置く","detail":"FK表を手首（link6）の位置で作っていたため、白箱中心への最近傍が69mm離れていた。基準を左右の爪先の中点に変えてスキャンし直すと0.43mmになった。","key":false,"src":"DAY157","kw":[["基準点","きじゅんてん","基準"],["作業","さぎょう","掴む","つかむ"],["場所","ばしょ","位置","ところ"]]},{"id":"k006","category":"kinematics","sub":"","type":"lesson","front":"カメラを見ながら追従させる制御が目標に収束せず、行ったり来たりの振動を続ける。まず何を疑う？","back":"関節の効く向きは推論せず、その姿勢で実測する","detail":"「j1+, j2+, j4- で Z+ に動く」と幾何で推論していたが、実測では逆に Z- へ動いた（-12.64mm）。毎フレーム逆向きの指令が出ていた。4ケースの実測で3関節の符号を反転し、常駐デーモン化と合わせて1.7秒で2.9mmに収束した。","key":true,"src":"DAY186・DAY189","kw":[["効く向き","効き","きき","向き"],["推論","すいろん","頭で","机上"],["実測","じっそく","測る","はかる"]]},{"id":"k007","category":"kinematics","sub":"","type":"lesson","front":"アームを動かす始点と終点は、どちらも人や物に当たらない安全な姿勢。その間の移動も安全と言える？","back":"始点と終点が安全でも、途中の通り道を確かめる","detail":"外部レビューで「関節補間中の爪・肘・手首が一時的に人側へ膨らまない保証はない」と指摘された。mechArm の受け渡し設計では、中間姿勢を FK 表から選び、全リンクが通る空間を Unity で確認してから、人なし実機→ダミー手→補助者同席の順で試す計画にした。","key":false,"src":"DAY288","kw":[["始点","してん","スタート"],["終点","しゅうてん","ゴール"],["途中","とちゅう","通り道","経路","けいろ"]]},{"id":"k008","category":"kinematics","sub":"","type":"lesson","front":"手先の目標位置から関節角を求める計算が、収束しなかったり実機とずれたりする。どうする？","back":"逆に解くより、確かめた姿勢から順方向の表を作る","detail":"CCD IK は5日試しても収束せず（途中で試した勾配降下の数値 IK も最高4%）、ikpy の解析的 IK は1,066点すべて「成功」と出たが、実機確認済みの角度と全関節で大きくずれた。確認済み姿勢から関節角をずらして FK で記録す     const x = cards[cur];
    const r = x ? results[rk(x)] : null;
    if (!r) { $('cmpH').textContent = x && x.type === 'lesson' ? 'キーワード（赤＝言えなかった）' : '違い（赤＝言わなかった・青＝余分）'; $('said').textContent = 'ここに出ます'; $('cmp').textContent = '—'; $('stats').innerHTML = ''; return; }
    $('said').textContent = r.raw || '（聞き取れませんでした）';
    $('cmpH').textContent = r.kws ? 'キーワード（赤＝言えなかった）' : '違い（赤＝言わなかった・青＝余分）';
    $('cmp').innerHTML = r.kws ? r.kws.map(k => `<span class="kw${k.hit ? '' : ' miss'}">${esc(k.w)}</span>`).join('') + `<div class="lesson">${esc(x.back)}</div>` : opsHtml(r.ops);
    const p = saved[rk(x)] && saved[rk(x)].prev;
    $('stats').innerHTML = `<span>${r.n}回目</span><span>一致 <b class="${r.score >= GOOD ? 'good' : 'bad'}">${r.score}%</b>${p != null ? `（前回 ${p}%）` : ''}</span>`;
  }

  function renderLog() {
    const done = Object.entries(results);
    const STEP = {1: '単語', 2: '説明', 3: '型'};
    $('log').innerHTML = done.length ? done.map(([k, r]) => { const p = saved[k] && saved[k].prev; const s = r.x.type === 'lesson' ? r.x.back : r.x.front;
      return `<tr><td>${STEP[r.st]}｜${esc(s.slice(0, 14))}${s.length > 14 ? '…' : ''}</td><td>${r.score}%${r.n > 1 ? `<br><small>${r.n}回目</small>` : ''}</td><td>${p != null ? p + '%' : '—'}</td></tr>`; }).join('')
      : '<tr><td colspan="3">まだありません</td></tr>';
  }


  // 音声認識（押している間だけ）
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let rec = null, listening = false, finalText = '', interim = '', t0 = 0, target = null, restarts = 0;
  if (!SR) { micBtn.disabled = true; showWarn('このブラウザでは声を文字にできません。iPhoneはSafari、PCはChromeかSafariで開いてください。'); }
  function makeRec() {
    const r = new SR(); r.lang = 'ja-JP'; r.continuous = true; r.interimResults = true;
    r.onresult = e => { if (r !== rec) return; interim = ''; for (let i = e.resultIndex; i < e.results.length; i++) { const tx = e.results[i][0].transcript; if (e.results[i].isFinal) finalText += tx; else interim += tx; } $('said').textContent = (finalText + interim) || '…'; };
    r.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') showWarn('マイクが許可されていません。ブラウザの設定でマイクを許可してください。'); };
    r.onend = () => {
      if (r !== rec) return;
      if (listening && restarts < 3) { restarts++; finalText += interim; interim = ''; rec = makeRec(); try { rec.start(); } catch (_) {} }
      else finish();
    };
    return r;
  }
  // PC：iPhoneと同じ「始まり」「終わり」の音を鳴らす
  let actx = null;
  function beep(up) {
    if (IOS) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const t = actx.currentTime + 0.01;
      (up ? [660, 990] : [990, 660]).forEach((f, k) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t + k * 0.09); g.gain.exponentialRampToValueAtTime(0.25, t + k * 0.09 + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + k * 0.09 + 0.08);
        o.connect(g).connect(actx.destination); o.start(t + k * 0.09); o.stop(t + k * 0.09 + 0.09);
      });
    } catch (_) {}
  }
  const PRE = IOS ? 0 : 200;
  function start(ev) {
    if (micBtn.disabled || listening || !SR) return;
    ev.preventDefault();
    target = cards[cur]; if (!target) return;
    finalText = ''; interim = ''; listening = true; t0 = performance.now(); restarts = 0;
    micBtn.classList.add('on'); micBtn.firstChild.textContent = '聞いています…';
    $('said').textContent = '…'; $('cmp').textContent = '—'; $('stats').innerHTML = '';
    beep(true);
    try { if (rec) rec.abort(); } catch (_) {}
    rec = makeRec();
    const go = () => { if (!listening) return; try { rec.start(); } catch (_) {} };
    PRE ? setTimeout(go, PRE) : go();
  }
  function stop(ev) {
    if (!listening) return;
    if (ev) ev.preventDefault();
    listening = false; target.sec = (performance.now() - t0) / 1000;
    micBtn.classList.remove('on'); micBtn.firstChild.textContent = '押している間だけ聞く';
    setTimeout(() => { try { rec.stop(); } catch (_) { finish(); } beep(false); }, 250); // 言い終わりを取りこぼさない
  }
  function finish() {
    if (!target) return;
    const x = target; target = null;
    const raw = (finalText + interim).trim();
    if (!raw || x.sec < 0.6) { $('said').textContent = !raw ? '聞き取れませんでした。押したまま話して、言い終わってから離してください' : '押す時間が短すぎました'; return; }
    // 1 単語は「用語＋意味」を一続きで言う。用語はカッコの前後どちらで言ってもよく、「は」は無くてもよい（いちばん合う言い方で比べる）
    let best = null;
    if (x.type === 'lesson') { // 教訓はキーワードが言えたかで見る（言い方は自由）
      const s = norm(raw);
      const kws = x.kw.map(g => ({w: g[0], hit: g.some(v => s.includes(norm(v)))}));
      best = {say: x.back, kws, ops: null, score: Math.round(kws.filter(k => k.hit).length / kws.length * 100)};
    } else targets(x).forEach(t => { const a = prep(t), b = prep(align(t, raw)); const d = diff(a, b); const sc = a.length ? Math.round(d.same / Math.max(a.length, b.length) * 100) : 0; if (!best || sc > best.score) best = {say: t, ops: d.ops, score: sc}; });
    const {say, ops, score, kws} = best;
    const key = rk(x);
    (tries[key] = tries[key] || []).push(score);
    const at = stamp();
    results[key] = {raw, ops, kws, score, n: tries[key].length, x, st: step};
    if (tries[key].length === 1) saved[key] = {s: score, prev: saved[key] ? saved[key].s : null, at};
    else saved[key] = {s: score, prev: saved[key] ? saved[key].prev : null, at};
    persist();
    attempts.push({id: x.id, step, word: x.type === 'lesson' ? x.back : x.front, card: say, said: raw, score, sec: Math.round(x.sec * 10) / 10, at, ...(kws ? {miss: kws.filter(k => !k.hit).map(k => k.w)} : {})});
    unsaved++; saveLabel();
    const keep = track.scrollLeft; draw(); track.scrollLeft = keep; updatePos(); showResult(); renderLog();
  }
  micBtn.addEventListener('touchstart', start, {passive: false});
  micBtn.addEventListener('touchend', stop, {passive: false});
  micBtn.addEventListener('touchcancel', stop, {passive: false});
  micBtn.addEventListener('mousedown', start);
  window.addEventListener('mouseup', () => stop());
  micBtn.addEventListener('contextmenu', e => e.preventDefault());
  // PC：スペースを押している間だけ聞く／←→でカードを移動
  const typing = e => /INPUT|TEXTAREA|SELECT/.test((e.target || {}).tagName || '');
  window.addEventListener('keydown', e => {
    if (typing(e)) return;
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) start(e); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault(); const el = track.children[0]; if (!el || listening) return;
      const w = el.getBoundingClientRect().width + 10;
      track.scrollTo({left: Math.round(track.scrollLeft / w + (e.key === 'ArrowRight' ? 1 : -1)) * w, behavior: 'smooth'});
    }
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space' && !typing(e)) { e.preventDefault(); stop(e); if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); } });
  window.addEventListener('blur', () => stop());
  if (!IOS) micBtn.querySelector('small').textContent = 'スペースキーでも同じ。←→でカードを移動';

  function showWarn(t) { const w = $('warn'); w.textContent = t; w.hidden = false; }

  const press = (on, off, set) => { $(on).setAttribute('aria-pressed', true); $(off).setAttribute('aria-pressed', false); set(); render(); };
  $('mSee').addEventListener('click', () => { press('mSee', 'mHide', () => mode = 'see'); keepView(); });
  $('mHide').addEventListener('click', () => { press('mHide', 'mSee', () => mode = 'hide'); keepView(); });
  $('fAll').addEventListener('click', () => press('fAll', 'fWeak', () => filter = 'all'));
  $('fWeak').addEventListener('click', () => press('fWeak', 'fAll', () => filter = 'weak'));
  const PREF = 'robotics-review-view';
  const keepView = () => { try { localStorage.setItem(PREF, JSON.stringify({step, cat, mode})); } catch (_) {} };
  const setStep = n => { step = n; [1, 2, 3].forEach(k => $('s' + k).setAttribute('aria-pressed', k === n)); fillCats(); render(); keepView(); };
  [1, 2, 3].forEach(k => $('s' + k).addEventListener('click', () => setStep(k)));
  $('cat').addEventListener('change', e => { cat = e.target.value; render(); keepView(); e.target.blur(); });
  $('clear').addEventListener('click', () => { results = {}; tries = {}; attempts = []; unsaved = 0; saveLabel(); draw(); showResult(); renderLog(); });

  // ===== 記録の保存（GIG の読み合わせと同じ流れ。保存先は iCloud の ロボティクス復習/練習記録） =====
  function stamp() { const d = new Date(), z = n => String(n).padStart(2, '0'); const o = -d.getTimezoneOffset(); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}${o >= 0 ? '+' : '-'}${z(Math.floor(Math.abs(o) / 60))}:${z(Math.abs(o) % 60)}`; }
  let unsaved = 0;
  const saveLabel = () => { $('save').textContent = unsaved ? `結果を保存（未保存 ${unsaved}回）` : '結果を保存'; };
  const STEPNAME = {1: '1 単語', 2: '2 説明', 3: '3 判断の型'};
  function report() {
    const d = new Date(); const ts = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    let s = `# ロボティクス見直しの記録（${ts}）\n\n${attempts.length}回・データ ${DATA.updated}\n\n`;
    attempts.forEach(a => { s += `## ${STEPNAME[a.step]}｜${a.word}\n- カード：${a.card}\n- 話した：${a.said}\n- 一致 ${a.score}%／${a.sec}秒\n\n`; });
    s += '<!-- 集計用（_tools/practice_review.py が読む） -->\n```json\n' + JSON.stringify({page: 'robotics-review', data: DATA.updated, at: stamp(), tries: attempts}) + '\n```\n';
    return s;
  }
  const fileName = () => { const d = new Date(), z = n => String(n).padStart(2, '0'); return `ロボ見直し_${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}.md`; };
  const doneSaving = msg => { unsaved = 0; $('save').textContent = msg; setTimeout(saveLabel, 2500); };
  function download() {
    const b = new Blob([report()], {type: 'application/octet-stream'}); const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = fileName(); document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    doneSaving('保存しました（ダウンロード）');
  }
  // PC（Chrome・Edge）：一度選んだ「練習記録」フォルダへ直接書き込む（選んだフォルダはこのブラウザの中だけに覚える）
  const CAN_DIR = !IOS && 'showDirectoryPicker' in window;
  const idb = (mode, fn) => new Promise((ok, ng) => { try { const q = indexedDB.open('robotics-review', 1); q.onupgradeneeded = () => q.result.createObjectStore('kv'); q.onerror = () => ng(q.error);
    q.onsuccess = () => { try { const t = q.result.transaction('kv', mode); const r = fn(t.objectStore('kv')); t.oncomplete = () => ok(r && r.result); t.onerror = () => ng(t.error); } catch (e) { ng(e); } }; } catch (e) { ng(e); } });
  const getDir = () => idb('readonly', st => st.get('dir')).catch(() => null);
  const putDir = h => idb('readwrite', st => st.put(h, 'dir')).catch(() => null);
  const showDirName = h => { $('dirName').textContent = h ? `保存先：${h.name}` : '保存先：まだ選んでいません'; };
  async function pickDir() {
    const h = await window.showDirectoryPicker({id: 'robo-renshu', mode: 'readwrite'});
    if (h.name !== '練習記録') showWarn(`選んだのは「${h.name}」です。iCloud Drive → PixelstoMotors → ロボティクス復習 → 練習記録 を選んでください。`); else $('warn').hidden = true;
    await putDir(h); showDirName(h); return h;
  }
  // iPhone：共有の画面から「"ファイル"に保存」→ ロボティクス復習 → 練習記録（2回目からは同じ場所が出る）
  async function shareSave() {
    const f = new File([report()], fileName(), {type: 'text/markdown'});
    if (navigator.canShare && navigator.canShare({files: [f]})) { await navigator.share({files: [f]}); doneSaving('保存しました'); return true; }
    return false;
  }
  $('save').addEventListener('click', async () => {
    if (!attempts.length) { $('save').textContent = 'まだ記録がありません'; setTimeout(saveLabel, 1800); return; }
    if (IOS) { try { if (await shareSave()) return; } catch (e) { if (e && e.name === 'AbortError') return; } return download(); }
    if (!CAN_DIR) return download();
    try {
      let h = await getDir();
      if (h && (await h.queryPermission({mode: 'readwrite'})) !== 'granted' && (await h.requestPermission({mode: 'readwrite'})) !== 'granted') h = null;
      if (!h) { showWarn('保存先のフォルダを選んでください：iCloud Drive → PixelstoMotors → ロボティクス復習 → 練習記録（最初の1回だけ）'); h = await pickDir(); }
      const w = await (await h.getFileHandle(fileName(), {create: true})).createWritable(); await w.write(report()); await w.close();
      doneSaving(`${h.name}に保存しました`);
    } catch (e) {
      if (e && e.name === 'AbortError') { $('warn').hidden = true; return; }
      showWarn('練習記録に書き込めなかったので、ダウンロードに保存しました。'); download();
    }
  });
  $('copy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(report()); $('copy').textContent = 'コピーしました'; } catch (_) { $('copy').textContent = 'コピーできませんでした'; } setTimeout(() => $('copy').textContent = '結果をコピー', 1800); });
  if (CAN_DIR) { $('dirRow').hidden = false; $('redir').addEventListener('click', () => pickDir().catch(() => {})); getDir().then(showDirName); }
  $('saveNote').textContent = IOS ? '保存先：「"ファイル"に保存」→ ロボティクス復習 → 練習記録' : CAN_DIR ? '' : '保存はダウンロードに入ります。練習記録に直接入れたいときはChromeで開いてください';
  window.addEventListener('beforeunload', e => { if (unsaved) { e.preventDefault(); e.returnValue = ''; } });
  // 前に開いていた段階・カテゴリ・言い方から始める（この端末の中だけ）
  try { const v = JSON.parse(localStorage.getItem(PREF) || 'null'); if (v) { cat = v.cat || 'all'; if (v.mode === 'hide') { mode = 'hide'; $('mHide').setAttribute('aria-pressed', true); $('mSee').setAttribute('aria-pressed', false); } setStep(v.step || 1); } else setStep(1); } catch (_) { setStep(1); }
})();
</script>
</body>
</html>
